y, which tempts the choice that the statements together are not sufficient.","opts":["Statement (1) ALONE is sufficient, but statement (2) alone is not sufficient.","Statement (2) ALONE is sufficient, but statement (1) alone is not sufficient.","BOTH statements TOGETHER are sufficient, but NEITHER statement ALONE is sufficient.","EACH statement ALONE is sufficient.","Statements (1) and (2) TOGETHER are NOT sufficient."],"stem":"<p>Each of the 90 analysts at a firm holds certification A, certification B, both certifications or neither. Do more of the analysts hold both certifications than hold neither?</p><div class=\"ds\"><div><span>(1)</span> Exactly 52 of the analysts hold certification A.</div><div><span>(2)</span> The number of analysts who hold certification A but not certification B is 11 greater than the number who hold certification B but not certification A.</div></div>"},{"sec":"D","type":"mc","kind":"Data Sufficiency","topic":"Data Sufficiency","id":"DH05","sub":"Primes and factoring","b":1.8,"ans":4,"expl":"From the first statement, (<i>p</i> − <i>q</i>)(<i>p</i> + <i>q</i>) = 72 with both factors even, so the factor pairs are 2 and 36, 4 and 18, or 6 and 12. These give 19 and 17, 11 and 7, or 9 and 3, and only the first two are pairs of primes, so the sum is 36 or 18. The second statement alone fits countless pairs, and it does not separate the two remaining cases, because their differences are 2 and 4. Even together the statements leave two possible sums.","opts":["Statement (1) ALONE is sufficient, but statement (2) alone is not sufficient.","Statement (2) ALONE is sufficient, but statement (1) alone is not sufficient.","BOTH statements TOGETHER are sufficient, but NEITHER statement ALONE is sufficient.","EACH statement ALONE is sufficient.","Statements (1) and (2) TOGETHER are NOT sufficient."],"stem":"<p>If <i>p</i> and <i>q</i> are prime numbers, what is the value of <i>p</i> + <i>q</i>?</p><div class=\"ds\"><div><span>(1)</span> <i>p</i><sup>2</sup> − <i>q</i><sup>2</sup> = 72</div><div><span>(2)</span> <i>p</i> − <i>q</i> &lt; 6</div></div>"},{"sec":"D","type":"mc","kind":"Data Sufficiency","topic":"Data Sufficiency","id":"DH06","sub":"Tournament logic","b":1.7,"ans":0,"expl":"The Bears, the Comets and the Dynamos played three games among themselves, and each of those games was won by one of the three, so together they have at least three wins. If none of them won more than once, each won exactly one of those games and none of them beat the Arrows, so the Arrows won all three games: the first statement is sufficient. The second statement is silent on the game between the Arrows and the Dynamos, since the one loss it gives the Dynamos could have come against the Bears or the Comets: not sufficient.","opts":["Statement (1) ALONE is sufficient, but statement (2) alone is not sufficient.","Statement (2) ALONE is sufficient, but statement (1) alone is not sufficient.","BOTH statements TOGETHER are sufficient, but NEITHER statement ALONE is sufficient.","EACH statement ALONE is sufficient.","Statements (1) and (2) TOGETHER are NOT sufficient."],"stem":"<p>Four teams, the Arrows, the Bears, the Comets and the Dynamos, played a tournament in which each team played each of the other three teams exactly once and no game ended in a tie. Did the Arrows win all three of their games?</p><div class=\"ds\"><div><span>(1)</span> None of the other three teams won more than one of its games.</div><div><span>(2)</span> The Arrows won their games against the Bears and the Comets, and the Dynamos lost at least one of their games.</div></div>"},{"id":"NF01","sec":"Q","type":"mc","kind":"Problem Solving","topic":"Fractions/Ratios/Decimals","sub":"Part to part ratio, total","b":-1.3,"pattern":"A part-to-part ratio and the size of one part are given, and the whole is asked for.","stem":"At a certain consulting firm, the ratio of the number of managers to the number of analysts is 2 to 9. If the firm has 63 analysts and every employee is either a manager or an analyst, how many employees does the firm have?","opts":["14","49","70","72","77"],"ans":4,"expl":"Nine parts correspond to 63 analysts, so one part is 7 and there are 2 × 7 = 14 managers. The total is 63 + 14 = 77. The value 14 is only the number of managers, and 72 comes from adding 9 rather than 14 to the number of analysts."},{"id":"NF02","sec":"Q","type":"mc","kind":"Problem Solving","topic":"Fractions/Ratios/Decimals","sub":"Fraction, decimal, percent conversion","b":-0.9,"pattern":"A fractional percent must be converted to a decimal, keeping track of the two extra decimal places that the word percent adds.","stem":"Which of the following decimals is equal to 3/8 percent?","opts":["0.000375","0.00375","0.0375","0.375","3.75"],"ans":1,"expl":"The fraction 3/8 equals 0.375, so 3/8 percent is 0.375 percent. Dividing by 100 moves the decimal point two places to the left, giving 0.00375. The value 0.375 is the fraction 3/8 itself, not 3/8 of one percent."},{"id":"NF03","sec":"Q","type":"mc","kind":"Problem Solving","topic":"Arithmetic","sub":"Order of operations with fractions and decimals","b":-1,"pattern":"A mixed expression of fractions and decimals is evaluated, with division and multiplication done before addition and subtraction.","stem":"1/2 + 0.75 ÷ (3/8) − 0.2 × 5 =","opts":["1.5","2.5","3.5","7.5","11.5"],"ans":0,"expl":"Division and multiplication come first: 0.75 ÷ (3/8) = (3/4) × (8/3) = 2, and 0.2 × 5 = 1. The expression becomes 0.5 + 2 − 1 = 1.5. Subtracting before multiplying, as in (2.5 − 0.2) × 5, gives the trap 11.5."},{"id":"NF04","sec":"Q","type":"mc","kind":"Problem Solving","topic":"Fractions/Ratios/Decimals","sub":"Fraction of a remaining quantity","b":-0.2,"pattern":"Successive fractions are each taken of what remains, and a difference between two of the parts fixes the original whole.","stem":"A laboratory spent 2/5 of a research grant on equipment, 1/3 of the remainder on travel, and 3/4 of what then remained on salaries. If the amount spent on salaries was $18,000 more than the amount spent on travel, what was the amount of the grant?","opts":["$60,000","$72,000","$120,000","$180,000","$360,000"],"ans":3,"expl":"After equipment, 3/5 of the grant remains. Travel takes 1/3 of 3/5, which is 1/5 of the grant, leaving 2/5; salaries take 3/4 of 2/5, which is 3/10 of the grant. The difference 3/10 − 1/5 = 1/10 of the grant equals $18,000, so the grant was $180,000. Taking 3/4 of the 3/5 instead of the 2/5 gives the trap $72,000."},{"id":"NF05","sec":"Q","type":"mc","kind":"Problem Solving","topic":"Fractions/Ratios/Decimals","sub":"Comparing fractions","b":0.2,"pattern":"A fraction lying between two given close fractions must be identified by cross-multiplication or by adding numerators and denominators.","stem":"Which of the following fractions is greater than 3/7 and less than 4/9?","opts":["2/5","5/12","7/16","9/20","5/11"],"ans":2,"expl":"Adding the numerators and the denominators of 3/7 and 4/9 gives 7/16, which always lies between the two. Checking by cross-multiplication: 3 × 16 = 48 is less than 7 × 7 = 49, and 7 × 9 = 63 is less than 4 × 16 = 64. Both 2/5 and 5/12 are less than 3/7, while 9/20 and 5/11 are greater than 4/9."},{"id":"NF06","sec":"Q","type":"mc","kind":"Problem Solving","topic":"Fractions/Ratios/Decimals","sub":"Changing a ratio","b":0.1,"pattern":"Both terms of a ratio change by different amounts, and the new ratio fixes the multiplier, with a later quantity asked for.","stem":"A plant nursery stocked ferns and orchids in the ratio 5 to 2. After the nursery sold 30 of the ferns and received a delivery of 12 additional orchids, the ratio of ferns to orchids was 3 to 2. How many orchids did the nursery have after the delivery?","opts":["48","60","84","90","120"],"ans":1,"expl":"Let the original numbers be 5<i>k</i> ferns and 2<i>k</i> orchids. Then (5<i>k</i> − 30)/(2<i>k</i> + 12) = 3/2, so 10<i>k</i> − 60 = 6<i>k</i> + 36 and <i>k</i> = 24. The nursery then has 2(24) + 12 = 60 orchids and 90 ferns. The value 48 is the number of orchids before the delivery."},{"id":"NF07","sec":"Q","type":"mc","kind":"Problem Solving","topic":"Arithmetic","sub":"Place value and rounding","b":-0.3,"pattern":"The same decimal is rounded to two different places, each time from the original number, and the two results are compared.","stem":"If <i>n</i> = 6.0749, <i>r</i> is the decimal obtained by rounding <i>n</i> to the nearest hundredth, and <i>t</i> is the decimal obtained by rounding <i>n</i> to the nearest tenth, what is the value of <i>t</i> − <i>r</i>?","opts":["0.003","0.01","0.02","0.03","0.07"],"ans":3,"expl":"The thousandths digit of <i>n</i> is 4, so <i>r</i> = 6.07. The hundredths digit is 7, so <i>t</i> = 6.1. The difference is 6.10 − 6.07 = 0.03. Rounding in a chain, 6.0749 to 6.075 to 6.08, wrongly gives <i>r</i> = 6.08 and the trap 0.02."},{"id":"NF08","sec":"Q","type":"mc","kind":"Problem Solving","topic":"Arithmetic","sub":"Estimation and approximation","b":-0.1,"pattern":"A quotient of products of awkward decimals is approximated by rounding each factor to a convenient value while tracking decimal places.","stem":"Of the following, which is closest to (1,203 × 0.0498)/(0.61 × 19.7)?","opts":["0.5","2","5","20","50"],"ans":2,"expl":"Round each factor: 1,203 is about 1,200, 0.0498 is about 0.05, 0.61 is about 0.6 and 19.7 is about 20. The numerator is about 1,200 × 0.05 = 60 and the denominator is about 0.6 × 20 = 12, so the value is about 5. Misplacing one decimal point produces the traps 0.5 and 50."},{"id":"NF09","sec":"Q","type":"mc","kind":"Problem Solving","topic":"Fractions/Ratios/Decimals","sub":"Combining ratios","b":0.6,"pattern":"A part-to-part ratio for one portion of a group and a fraction for the rest are combined into a single part-to-part ratio for the whole group.","stem":"A committee has reviewed 3/8 of the applications for a certain grant. Among the applications reviewed so far, the ratio of the number approved to the number rejected is 1 to 5. If 3/10 of the remaining applications are approved and the rest are rejected, what will be the ratio of the number of applications approved to the number rejected for all of the applications?","opts":["1 to 4","1 to 3","7 to 15","1 to 2","8 to 15"],"ans":1,"expl":"Suppose there are 48 applications. Then 18 have been reviewed, of which 1/6, or 3, were approved. Of the 30 remaining, 3/10, or 9, are approved, so 12 are approved and 36 are rejected in all, a ratio of 1 to 3. The ratio 1 to 4 compares the approved applications with the total, and 7/15 comes from adding 1/6 and 3/10 directly."},{"id":"NF10","sec":"Q","type":"mc","kind":"Problem Solving","topic":"Fractions/Ratios/Decimals","sub":"Fractions of different capacities","b":0.9,"pattern":"Fractions of two containers with different capacities are converted to a common unit, and the total content is compared with the total capacity.","stem":"Tank P is 3/4 full of water, and tank Q, which has 3/2 the capacity of tank P, is 1/3 full of water. Water is pumped from tank P into tank Q until the two tanks are filled to the same fraction of their respective capacities. To what fraction of its capacity is each tank then filled?","opts":["1/2","13/24","7/12","5/8","3/4"],"ans":0,"expl":"Let the capacity of P be 4 units, so the capacity of Q is 6 units. P holds 3 units and Q holds 2 units, for 5 units of water in a combined capacity of 10 units. If both tanks are filled to the same fraction, that fraction must equal 5/10 = 1/2. Averaging 3/4 and 1/3 gives the trap 13/24, which ignores the different capacities, and 5/8 results from giving the tanks equal volumes."},{"id":"NF11","sec":"Q","type":"mc","kind":"Problem Solving","topic":"Fractions/Ratios/Decimals","sub":"Variables in the answer choices","b":0.7,"pattern":"A ratio of group sizes and a ratio of per-member amounts are multiplied to split a total that is given as a variable.","stem":"The sales staff of a certain company consists of junior and senior representatives, and the number of junior representatives is 2/5 of the number of senior representatives. Last month each junior representative sold the same number of units, and each senior representative sold 3 times as many units as each junior representative. If the sales staff sold a total of <i>T</i> units last month, how many units, in terms of <i>T</i>, were sold by the junior representatives?","opts":["2<i>T</i>/17","2<i>T</i>/15","2<i>T</i>/7","2<i>T</i>/5","6<i>T</i>/11"],"ans":0,"expl":"Take 2 junior and 5 senior representatives, and let each junior sell 1 unit and each senior sell 3 units. The juniors sell 2 units and the seniors sell 15 units, so the juniors account for 2/17 of the total, or 2<i>T</i>/17. The expression 2<i>T</i>/15 compares the junior sales with the senior sales, and 2<i>T</i>/7 ignores the difference in units sold per person."},{"id":"NF12","sec":"Q","type":"mc","kind":"Problem Solving","topic":"Fractions/Ratios/Decimals","sub":"Comparing fractions close to 1","b":1.1,"pattern":"Fractions that are all slightly less than 1 are ordered by comparing how far each falls short of 1 rather than by computing decimals.","stem":"If <i>x</i> = 37/40, <i>y</i> = 49/53 and <i>z</i> = 61/66, which of the following is true?","opts":["<i>x</i> &lt; <i>y</i> &lt; <i>z</i>","<i>x</i> &lt; <i>z</i> &lt; <i>y</i>","<i>y</i> &lt; <i>x</i> &lt; <i>z</i>","<i>y</i> &lt; <i>z</i> &lt; <i>x</i>","<i>z</i> &lt; <i>y</i> &lt; <i>x</i>"],"ans":4,"expl":"Each fraction falls short of 1 by a small amount: 3/40, 4/53 and 5/66. Dividing top and bottom by the numerator, these gaps are 1 over 13 1/3, 1 over 13 1/4 and 1 over 13 1/5, so the gap is smallest for <i>x</i> and largest for <i>z</i>. The larger the gap, the smaller the fraction, so <i>z</i> &lt; <i>y</i> &lt; <i>x</i>. Assuming that larger numerators and denominators mean a value closer to 1 reverses the order."},{"id":"NF13","sec":"Q","type":"mc","kind":"Problem Solving","topic":"Fractions/Ratios/Decimals","sub":"Two ratios on the same total","b":1.2,"pattern":"Two different ratios that split the same group are scaled to a common total so that a ratio between two sub-groups can be found.","stem":"At a certain company, the ratio of the number of men to the number of women is 3 to 2, and the ratio of the number of full-time employees to the number of part-time employees is 7 to 3. If the ratio of full-time men to part-time men is 5 to 1, what is the ratio of the number of full-time women to the number of part-time men?","opts":["1 to 2","1 to 1","3 to 2","2 to 1","3 to 1"],"ans":3,"expl":"The total must split into 5 parts and into 10 parts, and the men into 6 parts, so take 30 employees. There are 18 men and 12 women, and 21 full-time and 9 part-time employees. The men split into 15 full-time and 3 part-time, so there are 21 − 15 = 6 full-time women, and the required ratio is 6 to 3, or 2 to 1. The ratio 1 to 1 compares full-time women with part-time women."},{"id":"NF14","sec":"Q","type":"mc","kind":"Problem Solving","topic":"Fractions/Ratios/Decimals","sub":"Unknown fraction in terms of a variable","b":1.5,"pattern":"An unknown fraction of a whole is found in terms of a parameter from a comparison between an actual total and a hypothetical total.","stem":"A contractor completed a job in two phases and was paid a fixed rate for each unit of work. The rate per unit for phase 2 was <i>k</i> times the rate per unit for phase 1, where <i>k</i> &gt; 5/3. If the entire job had been paid at the phase 1 rate, the total payment would have been 3/5 of the amount the contractor was actually paid. In terms of <i>k</i>, what fraction of the units of work in the job were completed in phase 1?","opts":["2/(3(<i>k</i> − 1))","(3<i>k</i> − 5)/(3<i>k</i>)","(5<i>k</i> − 3)/(5(<i>k</i> − 1))","(3<i>k</i> − 5)/(3(<i>k</i> + 1))","(3<i>k</i> − 5)/(3(<i>k</i> − 1))"],"ans":4,"expl":"Let the job be 1 unit of work paid at 1 dollar per unit in phase 1, and let <i>x</i> be the fraction done in phase 1. The hypothetical payment is 1, so the actual payment is 5/3, which gives <i>x</i> + <i>k</i>(1 − <i>x</i>) = 5/3. Then <i>x</i>(<i>k</i> − 1) = <i>k</i> − 5/3, so <i>x</i> = (3<i>k</i> − 5)/(3(<i>k</i> − 1)). The expression 2/(3(<i>k</i> − 1)) is the fraction done in phase 2; a check with <i>k</i> = 2 gives 1/3 for phase 1 and 2/3 for phase 2."},{"id":"NF15","sec":"Q","type":"mc","kind":"Problem Solving","topic":"Fractions/Ratios/Decimals","sub":"Changing a ratio with a fixed total","b":1.4,"pattern":"A swap that keeps the total fixed changes a ratio, so the total must be a common multiple of both ratio sums, which restricts the possible size of the swap.","stem":"A jar contains only red marbles and blue marbles, in the ratio 7 to 4. Some of the red marbles are removed and replaced by an equal number of blue marbles, after which the ratio of red marbles to blue marbles in the jar is 2 to 3. Which of the following could be the number of red marbles that were removed?","opts":["12","20","26","33","55"],"ans":2,"expl":"The total number of marbles does not change, and it must be a multiple of both 11 and 5, so it is 55<i>n</i> for some positive integer <i>n</i>. The red marbles go from 7/11 of the total, 35<i>n</i>, to 2/5 of the total, 22<i>n</i>, so 13<i>n</i> red marbles are removed. Of the values listed, only 26 is a multiple of 13. The value 55 is the smallest possible total, not a possible number removed."},{"id":"NF16","sec":"Q","type":"mc","kind":"Problem Solving","topic":"Arithmetic","sub":"Rounding and truncating, bounds","b":1.7,"pattern":"A difference between two rounding rules reveals how many numbers have a large decimal part, which bounds the total of all the decimal parts.","stem":"A program records each of 50 positive numbers in two ways: rounded to the nearest integer, with a decimal part of exactly 0.5 rounded up, and truncated, that is, with the decimal part simply dropped. The sum of the 50 rounded values is 18 greater than the sum of the 50 truncated values. If the sum of the 50 original numbers is <i>D</i> greater than the sum of the 50 truncated values, which of the following could be the value of <i>D</i>?<div class=\"roman\">I. 8<br>II. 20<br>III. 34</div>","opts":["I only","II only","III only","I and II only","II and III only"],"ans":1,"expl":"The rounded value exceeds the truncated value by 1 when the decimal part is 0.5 or more and by 0 otherwise, so exactly 18 numbers have a decimal part of at least 0.5 and 32 have a decimal part below 0.5. <i>D</i> is the sum of all 50 decimal parts. It is at least 18 × 0.5 = 9, and it is less than 18 × 1 + 32 × 0.5 = 34 because no decimal part reaches 1 and the 32 small ones do not reach 0.5. So 20 is possible, while 8 is too small and 34 cannot quite be reached."},{"sec":"Q","type":"mc","kind":"Problem Solving","topic":"Percents","id":"NP01","sub":"Percent of a percent","b":-1,"pattern":"A known count is a percent of a percent of the whole, and the whole must be recovered by dividing by the product of the two percents.","stem":"In the catalog of a regional library, 40 percent of the items are audio recordings, and 15 percent of the audio recordings are in a language other than English. If 90 audio recordings in the catalog are in a language other than English, how many items are in the catalog?","opts":["225","600","1,350","1,500","2,250"],"ans":3,"expl":"The non-English audio recordings are 15 percent of 40 percent, which is 6 percent, of the catalog. So 0.06 of the total is 90 and the total is 90/0.06 = 1,500. Dividing 90 by 0.15 alone gives 600, which is only the number of audio recordings."},{"sec":"Q","type":"mc","kind":"Problem Solving","topic":"Percents","id":"NP02","sub":"Percent less than","b":-0.9,"pattern":"A \"what percent less than\" comparison in which the base is the larger quantity named after \"than\", not the smaller one.","stem":"A clinic handled 480 appointments in March and 600 appointments in April. The number of appointments handled in March was what percent less than the number handled in April?","opts":["12%","20%","25%","80%","120%"],"ans":1,"expl":"The difference is 600 − 480 = 120, and the comparison is to April, so the base is 600. 120/600 = 20 percent. Using March as the base gives 25 percent, which answers a different question."},{"sec":"Q","type":"mc","kind":"Problem Solving","topic":"Percents","id":"NP03","sub":"Markup then discount","b":-0.7,"pattern":"A markup on cost followed by a discount on the marked price, with the dollar profit asked for.","stem":"A bookstore buys an atlas for $45 and marks it at a price 60 percent above its cost. In a clearance sale the atlas is sold at 25 percent off the marked price. What is the bookstore's profit on the atlas?","opts":["$9.00","$11.25","$15.75","$18.00","$27.00"],"ans":0,"expl":"The marked price is 1.6 × 45 = $72. A 25 percent discount leaves 0.75 × 72 = $54, so the profit is 54 − 45 = $9. Subtracting the percents to get 35 percent of $45 gives $15.75, which ignores that the discount is taken on the higher marked price."},{"sec":"Q","type":"mc","kind":"Problem Solving","topic":"Percents","id":"NP04","sub":"Reverse percent","b":-0.3,"pattern":"The price after a percent reduction is given, and the dollar amount of the reduction must be found by first recovering the original price.","stem":"During a sale, the price of a jacket was reduced by 35 percent to $78. By how many dollars was the price of the jacket reduced?","opts":["$27.30","$35.00","$42.00","$50.70","$120.00"],"ans":2,"expl":"The sale price is 65 percent of the original, so the original price is 78/0.65 = $120. The reduction is 120 − 78 = $42. Taking 35 percent of $78 gives $27.30, which applies the percent to the wrong base."},{"sec":"Q","type":"mc","kind":"Problem Solving","topic":"Percents","id":"NP05","sub":"Changing the base","b":0,"pattern":"Two percents of the same whole are given, and the answer needs one group expressed as a percent of the other group rather than of the whole.","stem":"At a consulting firm, 45 percent of the employees work remotely, and 27 percent of the employees both work remotely and are engineers. What percent of the employees who work remotely are <b>not</b> engineers?","opts":["40%","45%","55%","60%","73%"],"ans":0,"expl":"Take 100 employees: 45 work remotely and 27 of those are engineers, so 18 remote employees are not engineers. As a share of the remote group, 18/45 = 40 percent. The value 60 percent is the share of remote employees who are engineers."},{"sec":"Q","type":"mc","kind":"Problem Solving","topic":"Percents","id":"NP06","sub":"Chained comparisons","b":-0.1,"pattern":"Two \"percent higher or lower than\" statements are chained through a middle quantity to compare the two outer quantities.","stem":"On a certification exam, Tariq's score was 20 percent higher than Lena's score, and Lena's score was 25 percent lower than Omar's score. Tariq's score was what percent lower than Omar's score?","opts":["5%","10%","15%","45%","90%"],"ans":1,"expl":"Let Omar score 100. Lena scores 75 and Tariq scores 1.2 × 75 = 90, which is 10 percent lower than 100. Combining 20 and 25 by subtraction gives 5 percent, but the two percents are taken on different bases."},{"sec":"Q","type":"mc","kind":"Problem Solving","topic":"Percents","id":"NP07","sub":"Variables in options","b":0.3,"pattern":"Profit is stated as a percent of an unknown cost, and the cost must be written in terms of the selling price and the percent.","stem":"A retailer sold a printer for <i>s</i> dollars, making a profit equal to <i>p</i> percent of the printer's cost. In terms of <i>s</i> and <i>p</i>, what was the cost of the printer, in dollars?","opts":["<i>s</i>(100 − <i>p</i>)/100","<i>sp</i>/100","100<i>s</i>/<i>p</i>","<i>s</i>(100 + <i>p</i>)/100","100<i>s</i>/(100 + <i>p</i>)"],"ans":4,"expl":"If the cost is c, then s = c(1 + p/100) = c(100 + p)/100, so c = 100s/(100 + p). A check with s = 120 and p = 20 gives a cost of 100. Reducing s by p percent, s(100 − p)/100, gives 96 in that case, because it takes the percent of the selling price instead of the cost."},{"sec":"Q","type":"mc","kind":"Problem Solving","topic":"Percents","id":"NP08","sub":"Successive percent change","b":-0.4,"pattern":"A decrease followed by an increase on the new base, with the single equivalent percent change asked for.","stem":"A company's annual revenue decreased by 20 percent from 2021 to 2022 and then increased by 35 percent from 2022 to 2023. The company's revenue in 2023 was what percent greater than its revenue in 2021?","opts":["5%","7%","8%","15%","55%"],"ans":2,"expl":"The two changes multiply: 0.80 × 1.35 = 1.08. Revenue in 2023 was therefore 8 percent greater than in 2021. Adding −20 and 35 gives 15 percent, which ignores that the 35 percent is taken on the smaller 2022 figure."},{"sec":"Q","type":"mc","kind":"Problem Solving","topic":"Percents","id":"NP09","sub":"Markup, discount and profit","b":0.7,"pattern":"A discount is a percent of list price while the profit is a percent of cost, and the list price must be related directly to cost.","stem":"A merchant wants to set the list price of a lamp so that, after giving a discount of 20 percent off the list price, she still earns a profit equal to 40 percent of the lamp's cost. The list price must be what percent greater than the cost?","opts":["12%","50%","60%","68%","75%"],"ans":4,"expl":"The selling price is 0.8 of the list price and also 1.4 times the cost. So list price = 1.4/0.8 = 1.75 times the cost, which is 75 percent greater. Adding 40 and 20 gives 60 percent, and multiplying 1.4 by 1.2 gives 68 percent; both treat the discount as if it were a percent of cost."},{"sec":"Q","type":"mc","kind":"Problem Solving","topic":"Percents","id":"NP10","sub":"Share of a changing total","b":0.8,"pattern":"Two parts of a whole change by different percents, and one part must be found as a percent of the new whole.","stem":"In the first quarter, online sales accounted for 20 percent of a retailer's total revenue and in-store sales accounted for the rest. In the second quarter, the retailer's online sales were 60 percent greater and its in-store sales were 40 percent less than in the first quarter. Online sales accounted for what percent of the retailer's total revenue in the second quarter?","opts":["20%","32%","36%","40%","60%"],"ans":3,"expl":"Take first-quarter revenue as 100: online 20, in-store 80. In the second quarter online is 32 and in-store is 48, for a total of 80. The online share is 32/80 = 40 percent. The value 32 percent compares the new online sales with the old total."},{"sec":"Q","type":"mc","kind":"Problem Solving","topic":"Percents","id":"NP11","sub":"Percent change in a rate","b":1.1,"pattern":"The percents of a job done and of the time used are given, and the required percent increase in rate for the remainder must be found.","stem":"Working at a constant rate, a machine completed 64 percent of a production order in 80 percent of the time allotted for the order. If the order is to be finished exactly at the end of the allotted time, the machine's rate for the remainder of the order must be what percent greater than its rate so far?","opts":["25%","56%","80%","125%","225%"],"ans":3,"expl":"So far the rate is 64/80 = 0.8 percent of the order per percent of the time. The remaining 36 percent of the order must be done in 20 percent of the time, a rate of 1.8. Since 1.8/0.8 = 2.25, the new rate is 125 percent greater. The value 225 percent confuses \"percent of\" with \"percent greater than\"."},{"sec":"Q","type":"mc","kind":"Problem Solving","topic":"Percents","id":"NP12","sub":"Percent change in a product","b":0.6,"pattern":"A product of two quantities changes by a known percent and one factor changes by a known percent, and the change in the other factor is asked for.","stem":"A streaming service reduced the monthly price of its subscription by 20 percent. In the following month, its total subscription revenue was 10 percent greater than before the reduction. The number of subscribers was what percent greater than before the reduction?","opts":["12%","27.5%","30%","32%","37.5%"],"ans":4,"expl":"Revenue equals price times subscribers, so 1.10 = 0.80 × (subscriber factor). The factor is 1.10/0.80 = 1.375, an increase of 37.5 percent. Adding 10 and 20 gives 30 percent and multiplying 1.1 by 1.2 gives 32 percent, neither of which undoes the price cut correctly."},{"sec":"Q","type":"mc","kind":"Problem Solving","topic":"Percents","id":"NP13","sub":"Rates within groups","b":0.9,"pattern":"The make-up of a population and the relative rates of an outcome in two groups are given, and the make-up of those with the outcome is asked for.","stem":"Of the applicants to a graduate program last year, 40 percent were international and the rest were domestic. The percent of international applicants who were admitted was half the percent of domestic applicants who were admitted. What percent of the admitted applicants were international?","opts":["20%","25%","30%","33 1/3%","40%"],"ans":1,"expl":"Take 100 applicants, 40 international and 60 domestic, and suppose 10 percent of international and 20 percent of domestic applicants were admitted. That is 4 and 12 admitted, so international applicants are 4/16 = 25 percent of those admitted. Halving 40 percent to get 20 percent ignores that the two groups have different sizes."},{"sec":"Q","type":"mc","kind":"Problem Solving","topic":"Percents","id":"NP14","sub":"Variables in options","b":1.2,"pattern":"A ratio of two quantities whose numerator and denominator change by different symbolic percents, with the percent change of the ratio asked for.","stem":"From last year to this year, the number of employees at a company increased by <i>a</i> percent and the company's total payroll decreased by <i>b</i> percent, where <i>a</i> and <i>b</i> are positive. In terms of <i>a</i> and <i>b</i>, the average (arithmetic mean) pay per employee, total payroll divided by number of employees, decreased by what percent?","opts":["100(<i>a</i> + <i>b</i>)/(100 + <i>a</i>)","100(<i>a</i> + <i>b</i>)/(100 − <i>b</i>)","(<i>a</i> + <i>b</i>)/(100 + <i>a</i>)","<i>a</i> + <i>b</i>","100(<i>b</i> − <i>a</i>)/(100 + <i>a</i>)"],"ans":0,"expl":"The new average is (100 − b)/(100 + a) of the old one, so the fractional decrease is 1 − (100 − b)/(100 + a) = (a + b)/(100 + a), and as a percent it is 100(a + b)/(100 + a). With a = 25 and b = 10 the average falls to 0.9/1.25 = 0.72 of its old value, a 28 percent decrease, which matches. Simply adding a and b gives 35 in that case and ignores the larger number of employees in the denominator."},{"sec":"Q","type":"mc","kind":"Problem Solving","topic":"Percents","id":"NP15","sub":"Discount and profit on different bases","b":1.2,"pattern":"Two selling prices are each described by a profit as a percent of cost, and the percent discount from one to the other must be found without knowing cost or list price.","stem":"When a retailer sells a certain blender at 10 percent off its list price, the retailer's profit is 26 percent of the blender's cost. During a promotion, the retailer takes a further discount off the already discounted price, and its profit on the blender is then 5 percent of the cost. The further discount is what percent of the already discounted price?","opts":["16 2/3%","20%","21%","25%","31%"],"ans":0,"expl":"The already discounted price is 1.26 times the cost and the promotional price is 1.05 times the cost. Their ratio is 1.05/1.26 = 5/6, so the further discount is 1/6, or 16 2/3 percent, of the already discounted price. The list price and the 10 percent are not needed. Subtracting 5 from 26 gives 21 percent, but that is a percent of cost, not of the discounted price."},{"sec":"Q","type":"mc","kind":"Problem Solving","topic":"Percents","id":"NP16","sub":"Identifying the base","b":1.9,"pattern":"Successive changes of unknown direction are each stated as a percent of a specified base, and the extreme possible starting value must be found by working backward.","stem":"The price of a commodity in February differed from its price in January by 20 percent of the January price. Its price in March differed from its price in February by 25 percent of the March price. If the price in March was $60, what is the greatest possible price of the commodity in January?","opts":["$75.00","$90.00","$93.75","$96.00","$100.00"],"ans":2,"expl":"The February price differs from $60 by 25 percent of $60, which is $15, so it was $45 or $75. February is either 0.8 or 1.2 times January, so January is the February price divided by 0.8 or by 1.2. The greatest value is 75/0.8 = $93.75. Treating the 25 percent as a percent of the February price gives a February price of $80 and the incorrect $100."},{"sec":"Q","type":"mc","kind":"Problem Solving","topic":"Number Properties","id":"NN01","sub":"Odd and even","b":-1.1,"pattern":"Decide which algebraic expression has a fixed parity for every integer, using the fact that a product of two consecutive integers is even.","stem":"If <i>k</i> is an integer, which of the following must be an odd integer?","opts":["<i>k</i> + 3","3<i>k</i>","<i>k</i><sup>2</sup> + 1","2<i>k</i> + 4","<i>k</i>(<i>k</i> + 1) + 7"],"ans":4,"expl":"One of the consecutive integers k and k + 1 is even, so k(k + 1) is always even, and adding 7 gives an odd integer. The expressions k + 3, 3k and k<sup>2</sup> + 1 change parity with k, and 2k + 4 is always even."},{"sec":"Q","type":"mc","kind":"Problem Solving","topic":"Number Properties","id":"NN02","sub":"Positive and negative","b":-0.9,"pattern":"Chain two sign facts about products to fix the relative signs of three numbers, then find the expression whose sign is forced.","stem":"If <i>xy</i> &gt; 0 and <i>yz</i> &lt; 0, which of the following must be negative?","opts":["<i>xz</i>","<i>xyz</i>","<i>x</i> + <i>z</i>","<i>y</i> − <i>z</i>","<i>x</i><sup>2</sup><i>z</i>"],"ans":0,"expl":"Since xy is positive, x and y have the same sign, and since yz is negative, z has the opposite sign to y. So x and z have opposite signs and xz is negative. Each other expression is positive in one of the two cases (x, y positive with z negative, or x, y negative with z positive)."},{"sec":"Q","type":"mc","kind":"Problem Solving","topic":"Number Properties","id":"NN03","sub":"Units digits","b":-0.7,"pattern":"Use the repeating cycle of units digits of powers to find the units digit of a sum of two large powers.","stem":"What is the units digit of 7<sup>23</sup> + 4<sup>15</sup>?","opts":["1","3","5","7","9"],"ans":3,"expl":"Units digits of powers of 7 repeat as 7, 9, 3, 1, and 23 leaves remainder 3 when divided by 4, so 7<sup>23</sup> ends in 3. Powers of 4 end in 4 for odd exponents and 6 for even exponents, so 4<sup>15</sup> ends in 4. The sum ends in 3 + 4 = 7."},{"sec":"Q","type":"mc","kind":"Problem Solving","topic":"Number Properties","id":"NN04","sub":"Prime numbers","b":-0.3,"pattern":"An odd sum or difference of two primes forces one of them to be 2, the only even prime.","stem":"If <i>p</i> and <i>q</i> are prime numbers and <i>p</i> − <i>q</i> = 41, what is the value of <i>p</i> + <i>q</i>?","opts":["43","45","47","49","51"],"ans":1,"expl":"The difference 41 is odd, so one of the primes is even and the other is odd. The only even prime is 2, and it must be the smaller number, so q = 2 and p = 43, which is prime. Therefore p + q = 45."},{"sec":"Q","type":"mc","kind":"Problem Solving","topic":"Number Properties","id":"NN05","sub":"Consecutive integers","b":0.2,"pattern":"Test must-be-true claims about three consecutive integers, including cases that contain zero or negative integers.","stem":"If <i>a</i>, <i>b</i> and <i>c</i> are consecutive integers such that <i>a</i> &lt; <i>b</i> &lt; <i>c</i>, which of the following must be true?<div class=\"roman\">I. <i>a</i> + <i>b</i> + <i>c</i> is divisible by 3.<br>II. <i>abc</i> is divisible by 6.<br>III. <i>abc</i> is greater than <i>a</i> + <i>b</i> + <i>c</i>.</div>","opts":["I only","II only","I and II only","I and III only","I, II and III"],"ans":2,"expl":"The sum equals 3b, so it is always divisible by 3. Any three consecutive integers include a multiple of 2 and a multiple of 3, so the product is divisible by 6 (a product of 0 also counts, since 0 is divisible by every nonzero integer). The third statement fails for 1, 2, 3, where the product and the sum are both 6, and for −1, 0, 1."},{"sec":"Q","type":"mc","kind":"Problem Solving","topic":"Number Properties","id":"NN06","sub":"Properties of zero and one","b":0.3,"pattern":"Integers whose product is 1 can only be 1 or −1, with an even number of −1 factors, which restricts the possible sums.","stem":"If the product of four integers is 1, which of the following could be the sum of the four integers?<div class=\"roman\">I. −2<br>II. 0<br>III. 4</div>","opts":["II only","III only","I and II only","II and III only","I, II and III"],"ans":3,"expl":"Each of the four integers must be 1 or −1, and the number of −1 factors must be even for the product to be positive. With zero, two or four factors of −1 the sums are 4, 0 and −4. A sum of −2 would need three factors of −1, which makes the product −1."},{"sec":"Q","type":"mc","kind":"Problem Solving","topic":"Number Properties","id":"NN07","sub":"Digits and place value","b":-0.1,"pattern":"Appending a digit to the right of an integer multiplies it by 10 and adds the digit, which turns a digit statement into a one-step equation.","stem":"When the digit 5 is written to the right of the units digit of a certain two-digit positive integer <i>n</i>, the resulting three-digit integer is 437 greater than <i>n</i>. What is the value of <i>n</i>?","opts":["48","52","54","57","62"],"ans":0,"expl":"Writing 5 to the right of n produces 10n + 5. Then 10n + 5 − n = 437, so 9n = 432 and n = 48. Check: 485 − 48 = 437."},{"sec":"Q","type":"mc","kind":"Problem Solving","topic":"Number Properties","id":"NN08","sub":"Integer constraints","b":0.4,"pattern":"A single equation in two unknowns has a unique solution once both unknowns must be positive integers; find it by testing multiples.","stem":"A training coordinator spent exactly $100 on notebooks that cost $7 each and binders that cost $11 each, buying at least one of each. How many items did the coordinator buy in total?","opts":["10","11","12","13","14"],"ans":2,"expl":"If b binders were bought, 100 − 11b must be a positive multiple of 7. Testing b = 1 through 9 gives 89, 78, 67, 56, 45, 34, 23, 12 and 1, and only 56 is a multiple of 7. So there were 4 binders and 8 notebooks, 12 items in total."},{"sec":"Q","type":"mc","kind":"Problem Solving","topic":"Number Properties","id":"NN09","sub":"Odd and even","b":0.6,"pattern":"Factor a sum of products so that an odd result fixes the parity of each factor, then track the parity of three variables at once.","stem":"If <i>a</i>, <i>b</i> and <i>c</i> are integers and <i>ab</i> + <i>bc</i> is odd, which of the following must be even?","opts":["<i>a</i> + <i>b</i>","<i>a</i> + <i>b</i> + <i>c</i>","<i>b</i> + <i>c</i>","<i>ac</i> + <i>b</i>","<i>a</i><sup>2</sup> + <i>c</i><sup>2</sup>"],"ans":1,"expl":"ab + bc = b(a + c), and a product is odd only when both factors are odd. So b is odd and a + c is odd, which makes a + b + c the sum of two odd integers and therefore even. Exactly one of a and c is even, so ac + b and a<sup>2</sup> + c<sup>2</sup> are odd, while a + b and b + c depend on which of a and c is the even one."},{"sec":"Q","type":"mc","kind":"Problem Solving","topic":"Number Properties","id":"NN10","sub":"Positive and negative","b":0.8,"pattern":"Strip even powers out of signed products, since they are always positive for nonzero numbers, to reduce each inequality to a sign fact about a pair.","stem":"If <i>a</i>, <i>b</i> and <i>c</i> are nonzero numbers such that <i>ab</i><sup>2</sup><i>c</i><sup>3</sup> &lt; 0 and <i>a</i><sup>3</sup><i>bc</i><sup>2</sup> &gt; 0, which of the following must be true?","opts":["<i>a</i> &gt; 0","<i>ac</i> &gt; 0","<i>abc</i> &lt; 0","<i>b</i><sup>2</sup><i>c</i> &gt; 0","<i>bc</i> &lt; 0"],"ans":4,"expl":"Because b<sup>2</sup> and c<sup>2</sup> are positive, the first condition has the sign of ac, so a and c have opposite signs. Because a<sup>2</sup> and c<sup>2</sup> are positive, the second condition has the sign of ab, so a and b have the same sign. Hence b and c have opposite signs and bc is negative. The numbers could be positive, positive, negative or negative, negative, positive, so nothing about an individual sign or about abc is forced."},{"sec":"Q","type":"mc","kind":"Problem Solving","topic":"Number Properties","id":"NN11","sub":"Units digits","b":0.3,"pattern":"Compare two units-digit cycles of the same length position by position to see for which exponents their sum ends in a given digit.","stem":"For how many integers <i>n</i> from 1 to 20, inclusive, is the units digit of 3<sup><i>n</i></sup> + 7<sup><i>n</i></sup> equal to 0?","opts":["4","5","10","15","20"],"ans":2,"expl":"Units digits of powers of 3 repeat as 3, 9, 7, 1 and those of powers of 7 repeat as 7, 9, 3, 1. Adding position by position gives units digits 0, 8, 0, 2, so the sum ends in 0 exactly when n is odd. There are 10 odd integers from 1 to 20. Counting only one exponent per cycle of four gives the trap answer 5."},{"sec":"Q","type":"mc","kind":"Problem Solving","topic":"Number Properties","id":"NN12","sub":"Consecutive integers","b":0.7,"pattern":"In a run of consecutive integers that crosses zero, the negatives cancel their opposites, so only the unmatched terms contribute to the sum; zero still counts as a term.","stem":"The sum of the consecutive integers from −12 to <i>m</i>, inclusive, is 27. How many integers are in this list?","opts":["14","25","26","27","28"],"ans":3,"expl":"The integers from −12 to 12 sum to 0, so the terms beyond 12 must sum to 27, and 13 + 14 = 27 gives m = 14. From −12 to 14 there are 12 negative integers, zero, and 14 positive integers, which is 27 integers. Forgetting to count zero gives 26, and 14 is the value of m, not the number of terms."},{"sec":"Q","type":"mc","kind":"Problem Solving","topic":"Number Properties","id":"NN13","sub":"Digits and place value","b":1.1,"pattern":"Express a two-digit integer and its reversal with place values so that a stated relation collapses to a simple link between the two digits.","stem":"A two-digit positive integer <i>n</i> exceeds the two-digit integer formed by reversing its digits by exactly 3 times the sum of its digits. What is the least possible value of <i>n</i>?","opts":["12","21","24","42","63"],"ans":1,"expl":"With tens digit t and units digit u, n minus its reversal is (10t + u) − (10u + t) = 9(t − u). Setting 9(t − u) = 3(t + u) gives 6t = 12u, so t = 2u. The possible values are 21, 42, 63 and 84, and the least is 21 (check: 21 − 12 = 9 = 3 × 3). The value 12 has the digits in the wrong order, because it is less than its reversal."},{"sec":"Q","type":"mc","kind":"Problem Solving","topic":"Number Properties","id":"NN14","sub":"Prime numbers","b":1.1,"pattern":"A prime greater than 3 is odd and not a multiple of 3; use those two facts about its neighbours to decide divisibility and primality claims.","stem":"If <i>p</i> is a prime number greater than 3, which of the following must be true?<div class=\"roman\">I. <i>p</i><sup>2</sup> − 1 is divisible by 24.<br>II. <i>p</i> + 2 is a prime number.<br>III. <i>p</i><sup>2</sup> + 2 is not a prime number.</div>","opts":["I only","III only","I and II only","I and III only","I, II and III"],"ans":3,"expl":"p<sup>2</sup> − 1 = (p − 1)(p + 1). Since p is odd, p − 1 and p + 1 are consecutive even integers, so one is a multiple of 4 and their product is a multiple of 8; since p is not a multiple of 3, one of p − 1 and p + 1 is, so the product is divisible by 24. Then p<sup>2</sup> + 2 = (p<sup>2</sup> − 1) + 3 is a multiple of 3 greater than 3, so it is not prime. The second statement fails for p = 7, since 9 is not prime."},{"sec":"Q","type":"mc","kind":"Problem Solving","topic":"Number Properties","id":"NN15","sub":"Prime numbers","b":1.2,"pattern":"When one prime is the sum of two others, parity forces the smallest to be 2, which turns the other two into odd numbers that differ by 2.","stem":"If <i>p</i>, <i>q</i> and <i>r</i> are prime numbers such that <i>p</i> &lt; <i>q</i> and <i>p</i> + <i>q</i> = <i>r</i>, which of the following must be true?","opts":["<i>q</i> + <i>r</i> is divisible by 4.","<i>q</i> + <i>r</i> is divisible by 3.","<i>qr</i> + 1 is divisible by 3.","<i>q</i> − <i>p</i> is a prime number.","<i>p</i> + <i>r</i> is a prime number."],"ans":0,"expl":"If p and q were both odd, r would be an even number greater than 2 and not prime, so p = 2 and r = q + 2 with q odd. Then q + r = 2q + 2 = 2(q + 1), and q + 1 is even, so q + r is divisible by 4. The smallest case, 2 + 3 = 5, defeats divisibility of q + r or of qr + 1 by 3 and gives q − p = 1, which is not prime; the case 2 + 5 = 7 gives p + r = 9, which is not prime."},{"sec":"Q","type":"mc","kind":"Problem Solving","topic":"Number Properties","id":"NN16","sub":"Integer constraints","b":1.9,"pattern":"A small product spread over many different integers forces the use of 1, −1 and other opposite pairs; the sign of the product then decides which factor is left unpaired.","stem":"The product of five different integers is 12. What is the sum of the five integers?","opts":["−7","−3","−1","0","3"],"ans":4,"expl":"Five different integers with a product as small as 12 must be the ones closest to zero: 1, −1, 2 and −2 have product 4, which leaves a fifth factor of 3. Any set that omits one of those four needs factors whose product is larger than 12 in size, so 1, −1, 2, −2, 3 is the only possibility and the sum is 3. Using −3 as the fifth integer gives a sum of −3 but a product of −12."},{"id":"ND01","sec":"Q","type":"mc","kind":"Problem Solving","topic":"Divisibility/Multiples/Factors","sub":"LCM word problem","b":-1.1,"pattern":"Events that repeat at different fixed intervals coincide again after the least common multiple of the intervals.","stem":"At a bottling plant, the filling line is inspected every 12 days, the labeling line every 18 days and the packing line every 30 days. If all three lines are inspected today, in how many days will all three next be inspected on the same day?","opts":["60","90","180","360","540"],"ans":2,"expl":"The lines coincide after the least common multiple of 12, 18 and 30. Since 12 = 2<sup>2</sup> × 3, 18 = 2 × 3<sup>2</sup> and 30 = 2 × 3 × 5, the least common multiple is 2<sup>2</sup> × 3<sup>2</sup> × 5 = 180. Both 60 and 90 fail because 18 does not divide 60 and 12 does not divide 90."},{"id":"ND02","sec":"Q","type":"mc","kind":"Problem Solving","topic":"Divisibility/Multiples/Factors","sub":"Divisibility rules","b":-1,"pattern":"Use the digit-sum rule for 9 to find a missing digit of a multiple of 9.","stem":"In the five-digit integer 47<i>d</i>56, <i>d</i> represents the hundreds digit. If the integer is divisible by 9, what is the value of <i>d</i>?","opts":["1","2","3","4","5"],"ans":4,"expl":"An integer is divisible by 9 exactly when the sum of its digits is divisible by 9. The known digits sum to 4 + 7 + 5 + 6 = 22, so 22 + <i>d</i> must be a multiple of 9. The only digit that works is 5, which gives a digit sum of 27."},{"id":"ND03","sec":"Q","type":"mc","kind":"Problem Solving","topic":"Divisibility/Multiples/Factors","sub":"Powers of a prime in a factorial","b":0.2,"pattern":"Greatest power of a composite base dividing a factorial, limited by the scarcer of its prime powers.","stem":"What is the greatest integer <i>k</i> for which 12<sup><i>k</i></sup> is a factor of 20! ?","opts":["6","8","9","10","18"],"ans":1,"expl":"Each 12 needs two 2s and one 3. In 20! the number of 2s is 10 + 5 + 2 + 1 = 18, enough for nine 12s, but the number of 3s is 6 + 2 = 8. The 3s run out first, so the greatest value of <i>k</i> is 8."},{"id":"ND04","sec":"Q","type":"mc","kind":"Problem Solving","topic":"Divisibility/Multiples/Factors","sub":"Least integer for a divisibility condition","b":0,"pattern":"Least multiplier that supplies the prime factors a number is missing in order to be divisible by a given integer.","stem":"What is the least positive integer <i>k</i> for which 84<i>k</i> is divisible by 360?","opts":["30","60","90","180","360"],"ans":0,"expl":"84 = 2<sup>2</sup> × 3 × 7 and 360 = 2<sup>3</sup> × 3<sup>2</sup> × 5. Compared with 360, the number 84 is short of one 2, one 3 and one 5, so <i>k</i> must supply 2 × 3 × 5 = 30. The 7 in 84 does not help, and taking <i>k</i> = 360 works but is far from the least value."},{"id":"ND05","sec":"Q","type":"mc","kind":"Problem Solving","topic":"Divisibility/Multiples/Factors","sub":"Counting factors","b":0.1,"pattern":"Count the factors of an integer that have a given parity by restricting the exponent of 2.","stem":"How many of the positive factors of 540 are even?","opts":["6","8","12","16","24"],"ans":3,"expl":"540 = 2<sup>2</sup> × 3<sup>3</sup> × 5. An even factor must contain 2 to the power 1 or 2 (2 ways), 3 to a power from 0 to 3 (4 ways) and 5 to the power 0 or 1 (2 ways), giving 2 × 4 × 2 = 16. The value 24 counts all factors and 8 counts only the odd ones."},{"id":"ND06","sec":"Q","type":"mc","kind":"Problem Solving","topic":"Divisibility/Multiples/Factors","sub":"GCD word problem","b":-0.3,"pattern":"Splitting several quantities into the greatest number of identical groups uses the greatest common divisor, with the question asking for the group size rather than the number of groups.","stem":"A florist has 252 roses, 180 lilies and 108 orchids. She will use every flower to make identical bouquets, each containing the same number of roses, the same number of lilies and the same number of orchids. If she makes the greatest possible number of bouquets, how many flowers will each bouquet contain?","opts":["15","18","30","36","45"],"ans":0,"expl":"The number of bouquets must divide 252, 180 and 108, and the greatest such number is their greatest common divisor, 36. Each bouquet then holds 252/36 = 7 roses, 180/36 = 5 lilies and 108/36 = 3 orchids, a total of 15 flowers. The value 36 is the number of bouquets, not the number of flowers in each."},{"id":"ND07","sec":"Q","type":"mc","kind":"Problem Solving","topic":"Divisibility/Multiples/Factors","sub":"LCM and prime factorization","b":1,"pattern":"Extending the range of a least common multiple adds only the new primes and the higher prime powers, not every new integer.","stem":"Let <i>m</i> be the least positive integer that is divisible by every integer from 1 to 12, inclusive, and let <i>n</i> be the least positive integer that is divisible by every integer from 1 to 16, inclusive. What is the value of <i>n</i>/<i>m</i> ?","opts":["13","26","182","2,730","43,680"],"ans":1,"expl":"<i>m</i> already contains 2<sup>3</sup>, 3<sup>2</sup>, 5, 7 and 11. Of the new integers, 14 = 2 × 7 and 15 = 3 × 5 are already covered, 13 is a new prime, and 16 = 2<sup>4</sup> needs one more 2. So <i>n</i> = 13 × 2 × <i>m</i> and the ratio is 26, not the product 13 × 14 × 15 × 16."},{"id":"ND08","sec":"Q","type":"mc","kind":"Problem Solving","topic":"Divisibility/Multiples/Factors","sub":"Divisibility rules","b":0.9,"pattern":"Divisibility by a composite number split into co-prime parts, each tested with its own digit rule, with more than one digit pair to find.","stem":"In the five-digit integer 3<i>x</i>7<i>y</i>6, <i>x</i> represents the thousands digit and <i>y</i> represents the tens digit. If the integer is divisible by 72, what is the greatest possible value of <i>x</i> ?","opts":["2","4","6","8","9"],"ans":3,"expl":"72 = 8 × 9, and 8 and 9 share no common factor, so the integer must be divisible by both. Divisibility by 8 requires the last three digits 7<i>y</i>6 to form a multiple of 8, which happens only for 736 and 776. Divisibility by 9 requires the digit sum 16 + <i>x</i> + <i>y</i> to be a multiple of 9, so <i>x</i> + <i>y</i> = 11, giving <i>x</i> = 8 when <i>y</i> = 3 and <i>x</i> = 4 when <i>y</i> = 7. The greatest value is 8."},{"id":"ND09","sec":"Q","type":"mc","kind":"Problem Solving","topic":"Divisibility/Multiples/Factors","sub":"Counting factors","b":1,"pattern":"An integer with exactly three positive factors is the square of a prime, which fixes the factorization of expressions built from it.","stem":"The odd positive integer <i>n</i> has exactly 3 positive factors. How many positive factors does 8<i>n</i><sup>2</sup> have?","opts":["9","12","15","16","20"],"ans":4,"expl":"Only the square of a prime has exactly 3 factors, so <i>n</i> = <i>p</i><sup>2</sup> for some odd prime <i>p</i>. Then 8<i>n</i><sup>2</sup> = 2<sup>3</sup> × <i>p</i><sup>4</sup>, which has (3 + 1)(4 + 1) = 20 positive factors. Because <i>p</i> is odd, the 2s and the <i>p</i>s never combine into a single prime power."},{"id":"ND10","sec":"Q","type":"mc","kind":"Problem Solving","topic":"Divisibility/Multiples/Factors","sub":"Co-prime numbers","b":0.2,"pattern":"Integers co-prime to a given number are exactly those divisible by none of its prime factors, and 1 is among them.","stem":"How many positive integers less than 30 have no factor in common with 30 other than 1 ?","opts":["6","7","8","10","15"],"ans":2,"expl":"30 = 2 × 3 × 5, so the integers wanted are those divisible by none of 2, 3 and 5. They are 1, 7, 11, 13, 17, 19, 23 and 29, a total of 8. The integer 1 belongs on the list, since its only factor is 1, and leaving it out gives 7."},{"id":"ND11","sec":"Q","type":"mc","kind":"Problem Solving","topic":"Divisibility/Multiples/Factors","sub":"Powers of a prime in a factorial","b":1.5,"pattern":"Rewrite a product of equally spaced multiples as a prime power times a factorial before counting the prime.","stem":"The integer <i>P</i> is the product of all the multiples of 3 from 3 to 90, inclusive. What is the greatest integer <i>k</i> for which 3<sup><i>k</i></sup> is a factor of <i>P</i> ?","opts":["14","30","40","43","44"],"ans":4,"expl":"There are 30 multiples of 3 in the list, and taking one 3 out of each gives <i>P</i> = 3<sup>30</sup> × 30!. The number of 3s in 30! is 10 + 3 + 1 = 14, so <i>k</i> = 30 + 14 = 44. Stopping at 30 ignores the extra 3s in terms such as 9, 27 and 81, and 14 ignores the 3 taken from every term."},{"id":"ND12","sec":"Q","type":"mc","kind":"Problem Solving","topic":"Divisibility/Multiples/Factors","sub":"Counting factors","b":1.8,"pattern":"Use how the number of factors changes when an integer is doubled to pin down the form of its prime factorization.","stem":"The positive integer <i>n</i> has exactly 4 positive factors, and 2<i>n</i> has exactly 6 positive factors. How many positive factors does 8<i>n</i> have?","opts":["10","12","15","16","20"],"ans":0,"expl":"An integer with exactly 4 factors is either the cube of a prime or the product of two different primes. If <i>n</i> is odd, 2<i>n</i> has twice as many factors, 8, and if <i>n</i> = 8, 2<i>n</i> = 16 has 5 factors, so neither case fits. Therefore <i>n</i> = 2<i>q</i> for an odd prime <i>q</i>, and 2<i>n</i> = 2<sup>2</sup> × <i>q</i> has 3 × 2 = 6 factors as required. Then 8<i>n</i> = 2<sup>4</sup> × <i>q</i> has 5 × 2 = 10 factors."},{"id":"ND13","sec":"Q","type":"mc","kind":"Problem Solving","topic":"Remainders","sub":"Basic remainders","b":-0.9,"pattern":"A remainder for a divisor carries over to a remainder for a factor of that divisor.","stem":"When the positive integer <i>n</i> is divided by 12, the remainder is 7. What is the remainder when <i>n</i> is divided by 4 ?","opts":["0","1","2","3","7"],"ans":3,"expl":"<i>n</i> = 12<i>q</i> + 7 for some integer <i>q</i>. Since 12<i>q</i> is a multiple of 4, the remainder comes only from the 7, and 7 = 4 + 3. The remainder is 3; it cannot be 7, because a remainder is always less than the divisor."},{"id":"ND14","sec":"Q","type":"mc","kind":"Problem Solving","topic":"Remainders","sub":"Remainders of products","b":-0.2,"pattern":"The remainder of a product equals the remainder of the product of the individual remainders.","stem":"What is the remainder when the product 83 × 87 × 91 is divided by 9 ?","opts":["0","1","3","6","8"],"ans":2,"expl":"Divided by 9, the integers 83, 87 and 91 leave remainders 2, 6 and 1. The product of the remainders is 12, and 12 divided by 9 leaves 3. No multiplication of the original numbers is needed."},{"id":"ND15","sec":"Q","type":"mc","kind":"Problem Solving","topic":"Remainders","sub":"Two different remainders, word problem","b":0.3,"pattern":"Two remainder conditions and a range identify a single quantity, which is then divided by a third number.","stem":"A warehouse clerk has more than 40 but fewer than 80 cartons to stack. If she stacks them 6 to a pallet, 5 cartons are left over. If she stacks them 7 to a pallet, 3 cartons are left over. How many cartons will be left over if she stacks them 11 to a pallet?","opts":["2","4","5","7","9"],"ans":1,"expl":"Numbers between 40 and 80 that are 3 more than a multiple of 7 are 45, 52, 59, 66 and 73. Of these, only 59 is 5 more than a multiple of 6. Since 59 = 5 × 11 + 4, there are 4 cartons left over."},{"id":"ND16","sec":"Q","type":"mc","kind":"Problem Solving","topic":"Remainders","sub":"Divisor from a known remainder","b":1.1,"pattern":"A known remainder turns the divisor into a factor of dividend minus remainder, restricted to factors greater than the remainder.","stem":"When 150 is divided by the positive integer <i>d</i>, the remainder is 6. How many different values of <i>d</i> are possible?","opts":["10","11","12","14","15"],"ans":0,"expl":"<i>d</i> must divide 150 − 6 = 144, and <i>d</i> must be greater than the remainder 6. Since 144 = 2<sup>4</sup> × 3<sup>2</sup>, it has 5 × 3 = 15 positive factors. Five of them (1, 2, 3, 4 and 6) are not greater than 6, which leaves 10 possible values."},{"id":"ND17","sec":"Q","type":"mc","kind":"Problem Solving","topic":"Remainders","sub":"Quotient, remainder and decimal form","b":0.8,"pattern":"The decimal part of a quotient equals remainder over divisor, combined with a stated link between quotient and remainder.","stem":"When the positive integer <i>x</i> is divided by the positive integer <i>y</i>, the quotient and the remainder are equal. If <i>x</i>/<i>y</i> = 12.75, what is the value of <i>x</i> ?","opts":["153","192","204","216","255"],"ans":2,"expl":"The whole-number part of 12.75 is the quotient, so the quotient is 12 and the remainder is also 12. The decimal part equals remainder divided by divisor, so 12/<i>y</i> = 0.75 and <i>y</i> = 16. Then <i>x</i> = 16 × 12 + 12 = 204."},{"id":"ND18","sec":"Q","type":"mc","kind":"Problem Solving","topic":"Remainders","sub":"Remainders of multiples","b":1.1,"pattern":"Doubling a dividend doubles its remainder up to a multiple of the divisor, which reveals an unknown divisor.","stem":"When the positive integer <i>m</i> is divided by the positive integer <i>n</i>, the remainder is 11. When 2<i>m</i> is divided by <i>n</i>, the remainder is 5. What is the value of <i>n</i> ?","opts":["12","13","16","17","22"],"ans":3,"expl":"Write <i>m</i> = <i>qn</i> + 11, so 2<i>m</i> = 2<i>qn</i> + 22. The remainder of 2<i>m</i> is therefore the remainder of 22, so 22 − 5 = 17 must be a multiple of <i>n</i>. Because the remainder 11 is less than <i>n</i>, the only possibility is <i>n</i> = 17."},{"id":"NW01","sec":"Q","type":"mc","kind":"Problem Solving","topic":"Word Problems","sub":"Ages: sum at a future date","b":-1.1,"pattern":"Two present ages linked by a multiple, plus a sum stated at a future date where the time shift applies to both people.","stem":"Tomas is now 3 times as old as his niece Ines. In 8 years, the sum of their ages will be 60. How old is Tomas now?","opts":["11","33","39","41","45"],"ans":1,"expl":"Let Ines be <i>n</i> now, so Tomas is 3<i>n</i>. In 8 years both are 8 years older, so (<i>n</i> + 8) + (3<i>n</i> + 8) = 60, which gives 4<i>n</i> = 44 and <i>n</i> = 11. Tomas is 33. Adding the 8 years only once gives 39, and 11 is the age of Ines."},{"id":"NW02","sec":"Q","type":"mc","kind":"Problem Solving","topic":"Word Problems","sub":"Two prices, one total","b":-0.9,"pattern":"A count equation and a value equation for two kinds of item sold at two prices.","stem":"For one performance, a theater sold a total of 180 tickets, each either a balcony ticket at $12 or a orchestra ticket at $20. If the revenue from these tickets was $2,960, how many orchestra tickets were sold?","opts":["60","70","80","90","100"],"ans":4,"expl":"Let <i>s</i> be the number of orchestra tickets, so 180 − <i>s</i> balcony tickets were sold. Then 12(180 − <i>s</i>) + 20<i>s</i> = 2,960, so 2,160 + 8<i>s</i> = 2,960 and <i>s</i> = 100. The value 80 is the number of balcony tickets."},{"id":"NW03","sec":"Q","type":"mc","kind":"Problem Solving","topic":"Word Problems","sub":"Fixed fee plus per-unit rate","b":-0.8,"pattern":"Two data points determine a fixed fee and a constant per-unit rate, which are then applied to a third quantity.","stem":"A courier charges a fixed pickup fee plus a constant amount for each kilogram of a parcel. The total charge is $11 for a 4-kilogram parcel and $20 for a 10-kilogram parcel. What is the total charge for a 16-kilogram parcel?","opts":["$24","$26","$29","$31","$44"],"ans":2,"expl":"Let the fee be <i>f</i> and the rate be <i>r</i> per kilogram: <i>f</i> + 4<i>r</i> = 11 and <i>f</i> + 10<i>r</i> = 20. Subtracting gives 6<i>r</i> = 9, so <i>r</i> = 1.50 and <i>f</i> = 5. The charge for 16 kilograms is 5 + 16(1.50) = $29. Scaling $11 by 4 ignores the fixed fee and gives $44."},{"id":"NW04","sec":"Q","type":"mc","kind":"Problem Solving","topic":"Word Problems","sub":"Fewer than, more than, times as many","b":-0.2,"pattern":"Two quantities each described relative to a third (\"fewer than twice\", \"more than half\"), tied together by a total, with the question asking for a quantity other than the base variable.","stem":"Warehouse A holds 40 fewer crates than twice the number of crates in warehouse B. Warehouse C holds 15 more crates than half the number of crates in warehouse B. If the three warehouses hold a total of 500 crates, how many crates does warehouse C hold?","opts":["90","115","150","165","260"],"ans":0,"expl":"Let <i>b</i> be the number of crates in B. Then A holds 2<i>b</i> − 40 and C holds <i>b</i>/2 + 15, so (2<i>b</i> − 40) + <i>b</i> + (<i>b</i>/2 + 15) = 500, which gives 3.5<i>b</i> = 525 and <i>b</i> = 150. Warehouse C holds 75 + 15 = 90 crates. Stopping at 150 gives the count for B, and 260 is the count for A."},{"id":"NW05","sec":"Q","type":"mc","kind":"Problem Solving","topic":"Word Problems","sub":"Variables in the answer choices","b":0.3,"pattern":"Two items whose prices differ by a fixed amount, with total revenue given as a variable; solve the revenue equation for the lower price.","stem":"One morning a café sold <i>m</i> muffins and <i>k</i> cups of coffee, and no other items, for a total of <i>R</i> dollars. If each muffin sold for $1 more than each cup of coffee, what was the price, in dollars, of each cup of coffee?","opts":["<i>R</i>/(<i>m</i> + <i>k</i>) − 1","(<i>R</i> − <i>k</i>)/(<i>m</i> + <i>k</i>)","(<i>R</i> + <i>m</i>)/(<i>m</i> + <i>k</i>)","(<i>R</i> − <i>m</i>)/<i>k</i>","(<i>R</i> − <i>m</i>)/(<i>m</i> + <i>k</i>)"],"ans":4,"expl":"Let a cup of coffee cost <i>p</i> dollars, so a muffin costs <i>p</i> + 1. The revenue equation is <i>m</i>(<i>p</i> + 1) + <i>kp</i> = <i>R</i>, so <i>p</i>(<i>m</i> + <i>k</i>) = <i>R</i> − <i>m</i> and <i>p</i> = (<i>R</i> − <i>m</i>)/(<i>m</i> + <i>k</i>). Attaching the extra dollar to the coffees instead of the muffins produces (<i>R</i> − <i>k</i>)/(<i>m</i> + <i>k</i>)."},{"id":"NW06","sec":"Q","type":"mc","kind":"Problem Solving","topic":"Word Problems","sub":"Exchange between two people","b":0.2,"pattern":"Two hypothetical transfers between two people, where each transfer changes both holdings in opposite directions.","stem":"Priya and Quentin each hold some game tokens. If Priya gave Quentin 12 of her tokens, the two would hold the same number of tokens. If instead Quentin gave Priya 12 of his tokens, Priya would hold 3 times as many tokens as Quentin. How many tokens does Priya hold?","opts":["36","42","48","60","72"],"ans":3,"expl":"A transfer of 12 lowers one holding and raises the other. The first statement gives <i>P</i> − 12 = <i>Q</i> + 12, so <i>P</i> = <i>Q</i> + 24. The second gives <i>P</i> + 12 = 3(<i>Q</i> − 12), so <i>Q</i> + 36 = 3<i>Q</i> − 36 and <i>Q</i> = 36, <i>P</i> = 60. Writing the first statement as <i>P</i> − 12 = <i>Q</i> leads to 42."},{"id":"NW07","sec":"Q","type":"mc","kind":"Problem Solving","topic":"Word Problems","sub":"Digits of a two-digit integer","b":0,"pattern":"Place-value translation of a two-digit integer and its reversal, combined with a condition on the digit sum.","stem":"The sum of the two digits of a certain two-digit positive integer is 11. When the digits are reversed, the resulting integer is 7 more than twice the original integer. What is the original integer?","opts":["38","47","56","65","83"],"ans":0,"expl":"Let the tens digit be <i>t</i> and the units digit be <i>u</i>, so the integer is 10<i>t</i> + <i>u</i> and <i>t</i> + <i>u</i> = 11. The reversal condition is 10<i>u</i> + <i>t</i> = 2(10<i>t</i> + <i>u</i>) + 7, or 8<i>u</i> − 19<i>t</i> = 7. Substituting <i>u</i> = 11 − <i>t</i> gives 88 − 27<i>t</i> = 7, so <i>t</i> = 3 and <i>u</i> = 8. The integer is 38, and 83 is the reversed integer."},{"id":"NW08","sec":"Q","type":"mc","kind":"Problem Solving","topic":"Word Problems","sub":"Cost, revenue and profit","b":-0.3,"pattern":"Profit equals revenue minus fixed and per-unit costs; solve for the number of units, then report the revenue rather than the unit count.","stem":"A pottery workshop has fixed costs of $2,400 per month. Each mug it makes costs an additional $3.50 to produce and is sold for $9.50. In a month in which the workshop sells every mug it makes and earns a profit of $1,800, what is its total revenue from mugs?","opts":["$2,850","$3,800","$4,200","$4,850","$6,650"],"ans":4,"expl":"With <i>n</i> mugs, profit is 9.50<i>n</i> − (2,400 + 3.50<i>n</i>) = 6<i>n</i> − 2,400. Setting this equal to 1,800 gives <i>n</i> = 700, so revenue is 700($9.50) = $6,650. The amount $4,850 is the total cost for the month, and $3,800 is the revenue at the break-even point of 400 mugs."},{"id":"NW09","sec":"Q","type":"mc","kind":"Problem Solving","topic":"Word Problems","sub":"Ages with a variable time shift","b":0.9,"pattern":"Age relations at two different times, both shifted by the same variable number of years, with the answer equal to the constant age gap rather than a present age.","stem":"Exactly <i>k</i> years ago, Marta was 3 times as old as Nilo was then. Exactly <i>k</i> years from now, Marta will be twice as old as Nilo will be then. In terms of <i>k</i>, how old, in years, was Marta when Nilo was born?","opts":["2<i>k</i>","3<i>k</i>","4<i>k</i>","6<i>k</i>","7<i>k</i>"],"ans":2,"expl":"With present ages <i>M</i> and <i>N</i>: <i>M</i> − <i>k</i> = 3(<i>N</i> − <i>k</i>) and <i>M</i> + <i>k</i> = 2(<i>N</i> + <i>k</i>). The first gives <i>M</i> = 3<i>N</i> − 2<i>k</i>; substituting into the second gives 3<i>N</i> − <i>k</i> = 2<i>N</i> + 2<i>k</i>, so <i>N</i> = 3<i>k</i> and <i>M</i> = 7<i>k</i>. Marta was <i>M</i> − <i>N</i> = 4<i>k</i> years old when Nilo was born. The present ages 3<i>k</i> and 7<i>k</i> are the intermediate results."},{"id":"NW10","sec":"Q","type":"mc","kind":"Problem Solving","topic":"Word Problems","sub":"Comparing two pricing plans","b":0.3,"pattern":"A plan with a fixed fee and a per-unit rate above a threshold set equal to a flat per-unit plan, with the question asking for the common cost rather than the usage.","stem":"Under tariff X, a household pays a monthly fee of $18, which covers the first 100 kilowatt-hours used, plus $0.12 for each kilowatt-hour used beyond the first 100. Under tariff Y, a household pays no monthly fee and $0.15 for each kilowatt-hour used. Last month a certain household used more than 100 kilowatt-hours, and its bill would have been the same under either tariff. What was the amount of that bill?","opts":["$24","$30","$42","$72","$90"],"ans":1,"expl":"Let <i>h</i> be the kilowatt-hours used. Tariff X costs 18 + 0.12(<i>h</i> − 100) and tariff Y costs 0.15<i>h</i>. Setting them equal gives 6 + 0.12<i>h</i> = 0.15<i>h</i>, so <i>h</i> = 200 and the bill is 0.15(200) = $30. Charging $0.12 on all kilowatt-hours, as in 18 + 0.12<i>h</i> = 0.15<i>h</i>, gives 600 kilowatt-hours and $90."},{"id":"NW11","sec":"Q","type":"mc","kind":"Problem Solving","topic":"Word Problems","sub":"Coins: two value equations","b":0.7,"pattern":"Two value equations in which the unit values are interchanged; adding and subtracting the equations gives the sum and the difference of the counts.","stem":"A cash drawer contains only 10-cent coins and 25-cent coins, with a total value of $7.80. If every 10-cent coin in the drawer were replaced by a 25-cent coin and every 25-cent coin were replaced by a 10-cent coin, the total value would be $9.00. How many 10-cent coins are in the drawer?","opts":["8","20","24","28","48"],"ans":3,"expl":"Let <i>d</i> and <i>q</i> be the numbers of 10-cent and 25-cent coins. In cents, 10<i>d</i> + 25<i>q</i> = 780 and 25<i>d</i> + 10<i>q</i> = 900. Adding gives 35(<i>d</i> + <i>q</i>) = 1,680, so <i>d</i> + <i>q</i> = 48; subtracting gives 15(<i>d</i> − <i>q</i>) = 120, so <i>d</i> − <i>q</i> = 8. Hence <i>d</i> = 28 and <i>q</i> = 20. The values 48 and 8 are the sum and difference, not the count asked for."},{"id":"NW12","sec":"Q","type":"mc","kind":"Problem Solving","topic":"Word Problems","sub":"Profit with variables in the choices","b":1.1,"pattern":"Profit expressed in variables when some purchased units go unsold and the rest are sold at a fixed markup over unit cost.","stem":"A trader bought <i>n</i> identical crates of fruit for a total of <i>C</i> dollars, where <i>n</i> &gt; 5. Five of the crates spoiled and could not be sold. The trader sold each of the remaining crates for $8 more than the cost of one crate. In terms of <i>n</i> and <i>C</i>, what was the trader's profit, in dollars, on the <i>n</i> crates?","opts":["8(<i>n</i> − 5) − 5<i>C</i>/<i>n</i>","8(<i>n</i> − 5) − <i>C</i>/<i>n</i>","8(<i>n</i> − 5)","8<i>n</i> − 5<i>C</i>/<i>n</i>","8(<i>n</i> − 5) + 5<i>C</i>/<i>n</i>"],"ans":0,"expl":"Each crate cost <i>C</i>/<i>n</i> dollars and each crate sold brought in <i>C</i>/<i>n</i> + 8. Revenue was (<i>n</i> − 5)(<i>C</i>/<i>n</i> + 8) = <i>C</i> − 5<i>C</i>/<i>n</i> + 8(<i>n</i> − 5). Subtracting the full cost <i>C</i> leaves 8(<i>n</i> − 5) − 5<i>C</i>/<i>n</i>. The expression 8(<i>n</i> − 5) counts the markup on the crates sold but forgets that the five spoiled crates were still paid for."},{"id":"NW13","sec":"Q","type":"mc","kind":"Problem Solving","topic":"Word Problems","sub":"Place value: dollars and cents","b":1.2,"pattern":"Place-value translation of a money amount whose dollar and cent figures are interchanged, so that the error is 99 times the difference of the two figures.","stem":"An expense claim was for <i>d</i> dollars and <i>c</i> cents, where <i>d</i> and <i>c</i> are two-digit integers whose sum is 52. By mistake, a clerk paid the claim as <i>c</i> dollars and <i>d</i> cents, which was $17.82 more than the correct amount. What was the correct amount of the claim?","opts":["$16.36","$17.35","$18.34","$26.26","$35.17"],"ans":1,"expl":"In cents, the correct amount is 100<i>d</i> + <i>c</i> and the amount paid is 100<i>c</i> + <i>d</i>. The difference is 99(<i>c</i> − <i>d</i>) = 1,782, so <i>c</i> − <i>d</i> = 18. With <i>c</i> + <i>d</i> = 52, <i>c</i> = 35 and <i>d</i> = 17, so the claim was for $17.35. The amount $35.17 is what the clerk actually paid."},{"id":"NW14","sec":"Q","type":"mc","kind":"Problem Solving","topic":"Word Problems","sub":"Successive transfers, working backward","b":1.5,"pattern":"A chain of transfers in which each giver doubles the holding of the receiver; reverse the steps from the known final state while keeping the total fixed.","stem":"Three stores, F, G and H, each held some units of a product. First, store F sent store G as many units as G already held. Next, store G sent store H as many units as H already held. Finally, store H sent store F as many units as F held at that time. After these three transfers, each store held 48 units. How many units did store F hold before the first transfer?","opts":["36","42","66","72","84"],"ans":2,"expl":"Work backward, noting that each transfer doubles the holding of the store that receives. Before the last transfer F held 24, so H held 48 + 24 = 72 and G held 48. Before the second transfer H held 36, so G held 48 + 36 = 84 and F held 24. Before the first transfer G held 42, so F held 24 + 42 = 66. The values 42 and 36 are the starting holdings of G and H."},{"id":"NW15","sec":"Q","type":"mc","kind":"Problem Solving","topic":"Word Problems","sub":"Relationships after a common change","b":1.3,"pattern":"Deciding which \"times as many\" and \"more than\" relationships survive, and in what altered form, when every quantity undergoes the same linear change.","stem":"Today depot P holds 3 times as many spare parts as depot Q, and depot Q holds 6 more spare parts than depot R. Each depot holds more than 10 spare parts. Next month, the number of spare parts in each depot will be doubled, and then 4 spare parts will be removed from each depot. Which of the following must be true after these changes?<div class=\"roman\">I. Depot Q will hold 6 more spare parts than depot R.<br>II. Depot P will hold 8 more than 3 times as many spare parts as depot Q.<br>III. Depot P will hold 44 more than 3 times as many spare parts as depot R.</div>","opts":["I only","II only","I and II only","II and III only","I, II, and III"],"ans":3,"expl":"Write today's amounts as <i>P</i> = 3<i>Q</i> and <i>Q</i> = <i>R</i> + 6; afterward each amount <i>x</i> becomes 2<i>x</i> − 4. The new gap between Q and R is (2<i>Q</i> − 4) − (2<i>R</i> − 4) = 12, not 6, so statement I fails. The new amount in P is 6<i>Q</i> − 4 = 3(2<i>Q</i> − 4) + 8, so statement II holds. Since <i>P</i> = 3<i>R</i> + 18, the new amount in P is 6<i>R</i> + 32 = 3(2<i>R</i> − 4) + 44, so statement III holds as well."},{"id":"NW16","sec":"Q","type":"mc","kind":"Problem Solving","topic":"Word Problems","sub":"Profit and loss with variables","b":1.8,"pattern":"Two hypothetical selling prices for the same batch, one giving a stated profit and one a stated loss; eliminate the unknown number of units to express the unit cost.","stem":"A wholesaler holds a batch of identical units, each bought at the same cost. If every unit were sold at <i>p</i> dollars, the wholesaler would make a total profit of <i>a</i> dollars on the batch. If every unit were sold at <i>q</i> dollars, the wholesaler would incur a total loss of <i>b</i> dollars on the batch. In terms of <i>a</i>, <i>b</i>, <i>p</i> and <i>q</i>, what is the cost, in dollars, of each unit?","opts":["(<i>p</i> + <i>q</i>)/2","(<i>ap</i> + <i>bq</i>)/(<i>a</i> + <i>b</i>)","(<i>aq</i> + <i>bp</i>)/(<i>a</i> + <i>b</i>)","(<i>bp</i> − <i>aq</i>)/(<i>a</i> + <i>b</i>)","(<i>ap</i> − <i>bq</i>)/(<i>a</i> − <i>b</i>)"],"ans":2,"expl":"Let there be <i>n</i> units, each costing <i>x</i> dollars. Then <i>n</i>(<i>p</i> − <i>x</i>) = <i>a</i> and <i>n</i>(<i>x</i> − <i>q</i>) = <i>b</i>. Dividing the first equation by the second removes <i>n</i>: (<i>p</i> − <i>x</i>)/(<i>x</i> − <i>q</i>) = <i>a</i>/<i>b</i>, so <i>bp</i> − <i>bx</i> = <i>ax</i> − <i>aq</i> and <i>x</i> = (<i>aq</i> + <i>bp</i>)/(<i>a</i> + <i>b</i>). Pairing each price with its own result, as in (<i>ap</i> + <i>bq</i>)/(<i>a</i> + <i>b</i>), puts the cost nearer the wrong price."},{"sec":"Q","type":"mc","kind":"Problem Solving","id":"NR01","topic":"Work/Rate Problems","sub":"Combined rates","b":-1.1,"pattern":"Two machines with different outputs per hour work together; convert each to a rate, add the rates and divide the job by the sum.","stem":"Working alone at its constant rate, packing machine A packs 240 cartons in 3 hours. Working alone at its constant rate, packing machine B packs 240 cartons in 5 hours. If the two machines work simultaneously at these rates, how many hours will they take to pack a total of 640 cartons?","opts":["4","5","6","8","10"],"ans":1,"expl":"Machine A packs 80 cartons per hour and machine B packs 48 cartons per hour, so together they pack 128 cartons per hour. Then 640/128 = 5 hours. Adding the two times to get 8 treats times, not rates, as additive."},{"sec":"Q","type":"mc","kind":"Problem Solving","id":"NR02","topic":"Work/Rate Problems","sub":"Identical machines, one group joining","b":-0.3,"pattern":"Identical machines measured in machine-hours, with extra machines joining part of the way through, and the question asking for the time saved.","stem":"Running at the same constant rate, 6 identical printing presses can complete a certain order in 15 hours. The 6 presses begin the order, and after 5 hours 2 more identical presses join them. How many hours sooner is the order completed than it would have been with only the original 6 presses?","opts":["2.5","3.75","5","7.5","12.5"],"ans":0,"expl":"The order needs 6 × 15 = 90 press-hours. The first 5 hours supply 30, leaving 60 press-hours for 8 presses, which takes 7.5 hours, for a total of 12.5 hours. That is 15 − 12.5 = 2.5 hours sooner. The value 7.5 is the remaining time and 12.5 is the new total, not the saving."},{"sec":"Q","type":"mc","kind":"Problem Solving","id":"NR03","topic":"Work/Rate Problems","sub":"Filling and draining","b":0.1,"pattern":"An inlet and a drain act together, so the rates subtract, and the job is only a fraction of the whole tank.","stem":"An inlet pipe can fill an empty tank in 6 hours, and a drain pipe can empty the full tank in 9 hours, each at a constant rate. If the tank is exactly half full and both pipes are opened at the same time, how many hours will it take for the tank to become full?","opts":["1.8","3","7.5","9","18"],"ans":3,"expl":"The net filling rate is 1/6 − 1/9 = 1/18 of the tank per hour. Half a tank remains, so the time is (1/2)/(1/18) = 9 hours. Using the whole tank gives 18, and adding the rates instead of subtracting gives 1.8."},{"sec":"Q","type":"mc","kind":"Problem Solving","id":"NR04","topic":"Work/Rate Problems","sub":"Rates with variables","b":0.3,"pattern":"Combined work where the rates are algebraic expressions, and the answer must be simplified in terms of the given variable.","stem":"Working alone at its constant rate, one printer prints <i>p</i> pages in <i>m</i> minutes. Working alone at its constant rate, a second printer prints 2<i>p</i> pages in 3<i>m</i> minutes. In terms of <i>m</i>, how many minutes will the two printers, working simultaneously, take to print 10<i>p</i> pages?","opts":["3<i>m</i>/5","4<i>m</i>","6<i>m</i>","40<i>m</i>/3","50<i>m</i>/3"],"ans":2,"expl":"The rates are <i>p</i>/<i>m</i> and 2<i>p</i>/(3<i>m</i>) pages per minute, which sum to 5<i>p</i>/(3<i>m</i>). Then 10<i>p</i> divided by 5<i>p</i>/(3<i>m</i>) is 6<i>m</i> minutes. Treating the pair as printing 3<i>p</i> pages in 4<i>m</i> minutes gives 40<i>m</i>/3, which adds times instead of rates."},{"sec":"Q","type":"mc","kind":"Problem Solving","id":"NR05","topic":"Work/Rate Problems","sub":"One worker joining late","b":0.8,"pattern":"Two workers with unequal working times on one job: the worker present throughout fixes a share, and the remainder determines how long the other worked.","stem":"Working alone at her constant rate, Ana can complete a certain audit in 12 days. Working alone at his constant rate,
