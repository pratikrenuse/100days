<!doctype html>
<html lang="en">
<head>

<title>GMAT Focus Adaptive Mock</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Layout: a test-centre terminal. Fixed top and bottom rails, one scrolling work area, stimulus left and question right. */
:root{
  --bg:#F7F8FA; --panel:#FFFFFF; --ink:#18212F; --ink2:#465166; --line:#D5DAE3; --soft:#EDF0F5;
  --navy:#17406D; --navy-ink:#FFFFFF; --flag:#9A5B00; --flag-bg:#FCEFD3; --ok:#1E6B45; --ok-bg:#DFF1E6; --no:#A3261D; --no-bg:#F9E1DE;
  --s0:#17406D; --s1:#C27A12;
  --ui:'IBM Plex Sans',system-ui,sans-serif; --read:'Source Serif 4',Georgia,serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#10151D; --panel:#18202B; --ink:#E8ECF2; --ink2:#A9B3C3; --line:#313C4C; --soft:#1F2936;
  --navy:#7FB2E8; --navy-ink:#0C1420; --flag:#F0B455; --flag-bg:#3B2D12; --ok:#7AD0A2; --ok-bg:#163526; --no:#F0938A; --no-bg:#3D1A17;
  --s0:#7FB2E8; --s1:#E5A84A; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#10151D; --panel:#18202B; --ink:#E8ECF2; --ink2:#A9B3C3; --line:#313C4C; --soft:#1F2936;
  --navy:#7FB2E8; --navy-ink:#0C1420; --flag:#F0B455; --flag-bg:#3B2D12; --ok:#7AD0A2; --ok-bg:#163526; --no:#F0938A; --no-bg:#3D1A17;
  --s0:#7FB2E8; --s1:#E5A84A; color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.5;margin:0}
#app{min-height:100%;display:flex;flex-direction:column}
body[data-phase="q"] #app, body[data-phase="review"] #app{height:100%}
h1,h2,h3{font-family:var(--read);font-weight:600;line-height:1.2;margin:0;text-wrap:balance}
h1{font-size:clamp(1.9rem,4vw,2.6rem)} h2{font-size:1.3rem} h3{font-size:1.15rem}
p{margin:0}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--s1);outline-offset:2px}
.page{width:100%;max-width:60rem;margin:0 auto;padding-inline:20px;padding-block:48px 72px;display:flex;flex-direction:column;gap:40px}
.page.narrow{max-width:38rem;gap:18px;padding-block:14vh 72px}
.page.inpage{padding-block:32px;gap:18px}
.page.center{align-items:center;text-align:center}
.page section{display:flex;flex-direction:column;gap:16px}
.hero{display:flex;flex-direction:column;gap:12px}
.eyebrow{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--navy);font-weight:600}
.lead{font-family:var(--read);font-size:1.2rem;color:var(--ink2);max-width:40rem}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.facts>div{background:var(--panel);padding:20px;display:flex;flex-direction:column;gap:4px}
.facts span{font-family:var(--mono);font-size:.9rem;color:var(--navy)} .facts small{color:var(--ink2);font-size:.88rem}
.rules{margin:0;padding-left:1.2rem;display:flex;flex-direction:column;gap:8px;max-width:44rem}
.orders{display:grid;grid-template-columns:repeat(auto-fit,minmax(17rem,1fr));gap:8px}
.order{display:flex;gap:10px;align-items:center;padding:12px 14px;border:1px solid var(--line);background:var(--panel);cursor:pointer;min-height:48px}
.order:has(input:checked){border-color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy)}
.order i{color:var(--ink2);font-style:normal}
.note{border-top:1px solid var(--line);padding-top:28px}.note p,.hint{color:var(--ink2);max-width:46rem}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
button{cursor:pointer;border-radius:3px}
.primary{background:var(--navy);color:var(--navy-ink);border:1px solid var(--navy);padding:10px 22px;font-weight:600;min-height:44px}
.primary:disabled{opacity:.4;cursor:not-allowed}
.ghost{background:transparent;border:1px solid var(--line);padding:10px 18px;min-height:44px}
.big{padding:14px 28px;align-self:flex-start}.center .big{align-self:center}
.link{background:none;border:0;color:var(--navy);text-decoration:underline;padding:6px 4px}
/* exam chrome */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 20px;background:var(--panel);flex:none}
.bar.top{border-bottom:2px solid var(--navy);padding-top:calc(10px + env(safe-area-inset-top,0px))}
.bar.bottom{border-top:1px solid var(--line);padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.bl{display:flex;gap:16px;align-items:baseline;flex-wrap:wrap}.br{display:flex;gap:12px;align-items:center}
.qn{color:var(--ink2);font-size:.92rem}
.timer{font-family:var(--mono);font-size:1.2rem;font-variant-numeric:tabular-nums;padding:6px 12px;background:var(--soft);border:0;min-height:40px;min-width:5.2rem}
.ghost.sm{padding:6px 12px;min-height:40px;font-size:.92rem}.ghost[aria-pressed=true]{border-color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy)}
.timer.low{background:var(--no-bg);color:var(--no)}
.bm{display:flex;gap:8px;align-items:center;min-height:44px;cursor:pointer}.bm input{width:18px;height:18px}
.edits{color:var(--ink2);font-size:.9rem}
.main{flex:1;min-height:0;overflow:auto}
.main.split{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);overflow:hidden}
.main.split>*{overflow:auto;min-width:0}
.stim{padding:28px 28px 40px;border-right:1px solid var(--line);background:var(--panel)}
.stim.flat{border:1px solid var(--line);padding:18px;margin-bottom:16px}
.qcol{padding:28px 28px 40px;max-width:46rem;width:100%}
.main:not(.split) .qcol{margin:0 auto}
.passage,.stem,.opt,.grid2 td:last-child,.gitext,.tabbody,.expl p{font-family:var(--read);font-size:1.08rem;line-height:1.6}
.passage p+p,.stem p+p,.tabbody p+p{margin-top:.9em}
.stem{margin-bottom:22px}.stem sup{font-size:.7em}
.roman{margin-top:12px;padding-left:1.5rem}
.ds{margin-top:14px;display:flex;flex-direction:column;gap:8px}.ds>div{display:flex;gap:12px}.ds span{flex:none;color:var(--ink2)}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border:1px solid transparent;cursor:pointer;min-height:44px}
.opt:hover{background:var(--soft)}.opt:has(input:checked){border-color:var(--navy);background:var(--soft)}
.opt input{margin-top:.45em;width:16px;height:16px;flex:none}.let{font-family:var(--ui);font-weight:600;color:var(--ink2);flex:none;font-size:.95rem;margin-top:.12em}
.otxt{flex:1;min-width:0}
.scrollx{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;font-variant-numeric:tabular-nums}
.dt{width:100%;font-size:.95rem}.dt th,.dt td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.dt th{font-weight:600;white-space:normal;vertical-align:bottom;background:var(--soft)}
.dt th:first-child,.dt td:first-child,.dt th:nth-child(2),.dt td:nth-child(2){text-align:left}
.stimhead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:12px;font-weight:600}
.sorter{font-weight:400;font-size:.92rem;display:flex;gap:8px;align-items:center}
select{background:var(--panel);border:1px solid var(--ink2);padding:6px 8px;border-radius:3px;min-height:36px;max-width:100%}
.grid2{width:100%}.grid2 th{font:600 .85rem var(--ui);padding:8px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
.grid2 td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}.grid2 .rc{text-align:center;width:5.5rem}
.grid2 input{width:18px;height:18px;margin-top:.3em}
.gitext{line-height:2.4}.gitext select{font-family:var(--ui);font-size:.95rem;margin:0 4px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:18px}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;color:var(--ink2);min-height:44px;border-radius:0}
.tab.on{border-color:var(--navy);color:var(--ink);font-weight:600}
.tabtitle{font:600 .8rem var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);margin:18px 0 8px}
.chart{width:100%;min-width:480px;max-width:640px;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}.chart .axis{stroke:var(--ink2);stroke-width:1.2}
.chart text{font-family:var(--ui);fill:var(--ink2)}.chart .tk{font-size:12px}.chart .ax{font-size:12.5px;font-weight:500}.chart .ct{font-size:14px;font-weight:600;fill:var(--ink)}
.chart .s0,.chart .dot{fill:var(--s0)}.chart .s1{fill:var(--s1)}.chart .ln{stroke-width:2.5}.chart .l0{stroke:var(--s0)}.chart .l1{stroke:var(--s1)}
.chart .trend{stroke:var(--s1);stroke-width:2;stroke-dasharray:6 4}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--flag-bg);color:var(--flag);border-left:3px solid var(--flag);padding:10px 16px;z-index:16;max-width:calc(100vw - 32px)}
.order small{color:var(--ink2)}
.flash{background:var(--flag-bg);color:var(--flag);padding:12px 14px;margin-bottom:18px;border-left:3px solid var(--flag)}
.veil{position:fixed;inset:0;background:rgba(10,15,25,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.dlg{background:var(--panel);color:var(--ink);padding:26px;max-width:26rem;display:flex;flex-direction:column;gap:12px;border-top:4px solid var(--navy)}
.dbtn{display:flex;justify-content:flex-end;gap:10px;margin-top:8px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(8.5rem,1fr));gap:8px}
.rq{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px;background:var(--panel);border:1px solid var(--line);text-align:left;min-height:64px}
.rq .num{font-family:var(--mono);font-size:1.1rem}.rq .st{font-size:.82rem;color:var(--ink2)}
.rq.marked{border-color:var(--flag);background:var(--flag-bg)}.rq.marked .st{color:var(--flag)}
.rq.edited{box-shadow:inset 0 0 0 2px var(--navy)}
.bigtime{font-family:var(--mono);font-size:clamp(3rem,12vw,5.5rem);font-variant-numeric:tabular-nums}
/* calculator */
.calc{position:fixed;right:20px;bottom:84px;width:248px;background:var(--panel);border:1px solid var(--ink2);z-index:15;box-shadow:0 8px 28px rgba(0,0,0,.25)}
.chead{display:flex;justify-content:space-between;align-items:center;padding:4px 10px;background:var(--soft);font-weight:600;font-size:.9rem}
.cdisp{font-family:var(--mono);font-size:1.4rem;text-align:right;padding:12px;overflow:hidden;white-space:nowrap}
.ckeys{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line)}
.ckeys button{background:var(--panel);border:0;border-radius:0;min-height:44px;font-family:var(--mono)}.ckeys .fn{background:var(--soft)}
.tv i,.scv i{font-style:normal;font-size:.35em;color:var(--ink2);margin-left:.15em}
.insgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(17rem,1fr));gap:12px}
.ins{background:var(--panel);border:1px solid var(--line);padding:18px 20px;min-width:0}.ins.wide{grid-column:1/-1}
.ins h3{font:600 .8rem var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);margin-bottom:10px}
.ins.bad h3{color:var(--no)}.ins.good h3{color:var(--ok)}
.ins ul,.ins ol{margin:0;padding-left:1.2rem;display:flex;flex-direction:column;gap:6px}
.namefield{display:flex;gap:10px;align-items:center;font-weight:600}.namefield input{font-weight:400;border:1px solid var(--ink2);background:var(--panel);padding:10px 12px;min-height:44px;width:min(18rem,100%);border-radius:3px}
/* whiteboard */
.wb{position:fixed;left:16px;bottom:76px;width:min(560px,calc(100vw - 32px));height:min(400px,60vh);background:var(--panel);border:1px solid var(--ink2);z-index:14;box-shadow:0 8px 28px rgba(0,0,0,.25);display:flex;flex-direction:column}
.wb.big{left:16px;right:16px;top:72px;bottom:76px;width:auto;height:auto}
.wb .chead{cursor:move;touch-action:none}.wb .chead small{font-weight:400;color:var(--ink2);margin-left:6px}
.wbt{display:flex;gap:2px;flex-wrap:nowrap;overflow-x:auto}.wbt button{background:none;border:1px solid transparent;padding:4px 8px;font-size:.82rem;min-height:32px}.wbt button.on{border-color:var(--navy);color:var(--navy);font-weight:600}
.wbwrap{flex:1;min-height:0;position:relative;background:var(--bg)}.wbwrap canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.wbinput{position:absolute;font:16px var(--ui);background:var(--panel);border:1px solid var(--navy);padding:2px 4px;width:12rem;z-index:2}
.chart.path{max-width:640px}.chart .pok{fill:var(--s0);stroke:var(--s0);stroke-width:2}.chart .pno{fill:var(--panel);stroke:var(--no);stroke-width:2}.chart.path .ln{stroke-width:1.2;opacity:.5}
/* results */
.total{display:flex;gap:24px;align-items:flex-end;flex-wrap:wrap}
.tv{font-family:var(--mono);font-size:clamp(4rem,14vw,7rem);line-height:.9;color:var(--navy);font-variant-numeric:tabular-nums}
.tp{font-size:1.2rem;font-weight:600;display:flex;flex-direction:column;gap:4px}.tp small{font-weight:400;color:var(--ink2);font-size:.92rem}
.scs{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.sc{background:var(--panel);padding:20px;display:flex;flex-direction:column;gap:4px}
.scn{font-weight:600}.scv{font-family:var(--mono);font-size:2.6rem;line-height:1.1}.scp{color:var(--navy);font-weight:600}.scd{color:var(--ink2);font-size:.9rem}
.track{height:6px;background:var(--soft);margin-top:8px;display:block}.track i{display:block;height:100%;background:var(--navy)}
.hint{font-size:.9rem}
.rt td small{display:block;color:var(--ink2);font-size:.82rem}
.rt td:nth-child(2){white-space:normal;min-width:11rem}
.pill{padding:2px 9px;font-size:.82rem;font-weight:600;border-radius:2px}
.pill.ok,.res.ok{background:var(--ok-bg);color:var(--ok)}.pill.no,.res.no{background:var(--no-bg);color:var(--no)}.pill.un{background:var(--flag-bg);color:var(--flag)}
.slow{color:var(--no);font-weight:600}
.detail td{text-align:left!important;white-space:normal!important;background:var(--bg)}
.dwrap{max-width:46rem;padding:12px 0 20px}
.res{font:600 .78rem var(--ui);padding:2px 8px;margin-left:8px;white-space:nowrap;border-radius:2px}
.opt.right,.rc.right{background:var(--ok-bg)}.opt.wrong,.rc.wrong{background:var(--no-bg)}
.expl{margin-top:18px;padding:14px 16px;background:var(--soft)}.expl b{font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
@media (max-width:820px){
  .main.split{display:block;overflow:auto}.main.split>*{overflow:visible}
  .stim{border-right:0;border-bottom:1px solid var(--line);padding:20px 16px}.qcol{padding:20px 16px 32px}
  .bar{padding-inline:16px}.page{padding-inline:16px}.calc{right:8px;bottom:76px}
}
</style>
<style>img{max-width:100%}[hidden]{display:none!important}</style>

<script>
const BANK={"items":[{"id":"V03","stim":"P1","sub":"Primary purpose","b":0.5,"stem":"The primary purpose of the passage is to","opts":["argue that network effects are weaker in platform markets than economists have assumed","explain why entrants in platform markets rarely reach the scale of incumbents","compare the business practices of ride-hailing platforms with those of food-delivery platforms","defend the regulation of dominant platforms against the charge that it is unnecessary","describe research that qualifies a prevailing view of platform competition and consider what follows for regulation"],"ans":4,"expl":"The passage states the standard view, presents findings that complicate it, and closes with the regulatory implication. It says network effects remain strong at the market level, so it does not argue that they are weak.","sec":"V","type":"mc","kind":"Reading Comprehension","topic":"Reading Comprehension"},{"id":"V04","stim":"P1","sub":"Detail","b":0.6,"stem":"According to the passage, multihoming tends to undermine winner-take-all outcomes because it","opts":["allows the benefits generated by one platform's users to be drawn on by competing platforms","lowers the prices that platforms are able to charge customers who compare services","reduces the total number of participants that any single platform is able to attract","encourages regulators to scrutinize the contractual terms that platforms impose","eliminates the network effects that would otherwise operate across the market"],"ans":0,"expl":"The second paragraph says the network benefits created by one firm's users are, in effect, available to its rivals. The passage says network effects remain strong at the level of the market, so they are not eliminated.","sec":"V","type":"mc","kind":"Reading Comprehension","topic":"Reading Comprehension"},{"id":"V05","stim":"P1","sub":"Inference","b":1,"stem":"The passage suggests that, in the researchers' view, a loyalty tier of the kind described differs from superior matching technology in that the loyalty tier","opts":["is more likely to be adopted by entrants than by incumbent platforms","increases the value that participants receive from the platform that offers it","has little effect on whether participants use more than one platform","can protect a platform's position without improving what the platform offers","is effective only when a platform is already much larger than its rivals"],"ans":3,"expl":"The third paragraph says these devices restore captivity and, unlike superior matching technology, do so without making the service itself better.","sec":"V","type":"mc","kind":"Reading Comprehension","topic":"Reading Comprehension"},{"id":"V06","stim":"P1","sub":"Weaken the explanation","b":1.2,"stem":"Which of the following, if true, would most seriously undermine the researchers' explanation for the instability of market shares?","opts":["In the cities studied, market shares fluctuated just as much among groups of users who were found to use only one platform as among those who used several.","Some platforms in the cities studied introduced loyalty tiers only after entrants had reached scale.","Delivery platforms in smaller cities generally have fewer drivers than those in large cities.","Customers who compare prices across services tend to place more orders overall than customers who do not.","The platforms with the largest market shares in the cities studied also spent the most on advertising."],"ans":0,"expl":"The researchers attribute instability to multihoming. If shares were equally unstable where users did not multihome, something else must be driving the fluctuation.","sec":"V","type":"mc","kind":"Reading Comprehension","topic":"Reading Comprehension"},{"id":"V09","stim":"P2","sub":"Inference","b":0.8,"stem":"The authors of the reassessment would most likely agree with which of the following statements?","opts":["Fungal filaments do not in fact connect the roots of neighboring trees in most forests.","Carbon detected in receiver seedlings almost certainly traveled through soil water rather than through fungal networks.","Forests are more accurately described as arenas of competition than as cooperative communities.","That trees are linked by fungal networks is better established than that seedlings benefit substantially from those links.","The early field studies were poorly designed and should not have been published."],"ans":3,"expl":"They accept the physical connections and the detection of labeled carbon but question whether a benefit has been shown. Alternative pathways were not excluded, which is different from being confirmed.","sec":"V","type":"mc","kind":"Reading Comprehension","topic":"Reading Comprehension"},{"id":"V10","stim":"P2","sub":"Function","b":0.9,"stem":"The passage mentions the experimental barriers used to isolate seedlings primarily in order to","opts":["show that isolated seedlings receive less carbon than connected seedlings do","explain why better growth among connected seedlings cannot be credited to the network","describe the method by which labeled carbon is supplied to donor trees","suggest that seedlings compete with mature trees for soil moisture","argue that field experiments on fungal networks are impossible to conduct"],"ans":1,"expl":"The barriers also changed soil moisture and root competition, so the growth difference had more than one possible cause. That is a confound, cited to show the benefit could not be assigned to the network.","sec":"V","type":"mc","kind":"Reading Comprehension","topic":"Reading Comprehension"},{"id":"V11","stim":"P2","sub":"Structure","b":1.1,"stem":"Which of the following best describes the function of the third paragraph in the passage as a whole?","opts":["It accounts for how a claim came to seem better supported than the underlying evidence warranted.","It presents new experimental data that contradict the findings described in the second paragraph.","It summarizes the evidence in favor of the claim introduced in the first paragraph.","It proposes an alternative hypothesis about how seedlings obtain carbon.","It criticizes the original authors of the early field studies for overstating their results."],"ans":0,"expl":"The paragraph traces how citing papers upgraded inconclusive results into demonstrated benefits, without new data. The original authors are described as cautious, so the criticism is not aimed at them.","sec":"V","type":"mc","kind":"Reading Comprehension","topic":"Reading Comprehension"},{"id":"V15","stim":"P3","sub":"Primary purpose","b":0.6,"stem":"The primary purpose of the passage is to","opts":["propose a new method for measuring literacy in early modern Europe","show that literacy in early modern Europe was higher among women than among men","argue that Swedish church records are the most accurate source of evidence about early literacy","explain why reading was taught before writing in early modern schools","assess the reliability of a method by weighing a criticism of it and a response to that criticism"],"ans":4,"expl":"The passage lays out the signature method, a criticism, the defenders' reply, and the author's judgment of that reply. No new method is proposed.","sec":"V","type":"mc","kind":"Reading Comprehension","topic":"Reading Comprehension"},{"id":"V16","stim":"P3","sub":"Function","b":0.7,"stem":"The author refers to evidence from Sweden primarily in order to","opts":["demonstrate that signature rates were lower in Sweden than elsewhere in Europe","support the claim that many people who could not sign were nevertheless able to read","illustrate the role of the church in providing schooling for the rural poor","show that examiners' records are less reliable than signature counts","suggest that writing was taught before reading in some regions"],"ans":1,"expl":"The Swedish parishes show few signers but a large majority of competent readers, which supports the critics' suspicion that readers who could not sign were numerous.","sec":"V","type":"mc","kind":"Reading Comprehension","topic":"Reading Comprehension"},{"id":"V17","stim":"P3","sub":"Inference","b":1.2,"stem":"The author's response to the defenders of the signature method implies that, in order for signature rates to track changes in literacy over time, which of the following would have to be true?","opts":["The proportion of the population able to sign would have to have risen steadily.","Women would have to have been as likely as men to remain in school through the writing stage.","Church examinations of reading ability would have to have been conducted throughout Europe.","The relationship between the ability to sign and the ability to read would have to have remained roughly constant over the period.","The cost of instruction in writing would have to have been lower than the cost of instruction in reading."],"ans":3,"expl":"The defense needs a stable gap between signing and reading. The author objects that the factors producing the gap were themselves changing, so the required constancy is doubtful.","sec":"V","type":"mc","kind":"Reading Comprehension","topic":"Reading Comprehension"},{"id":"V20","stim":"P4","sub":"Main idea","b":0.5,"stem":"Which of the following best expresses the main idea of the passage?","opts":["Automatic enrollment has failed to increase the retirement wealth of the workers it was intended to help.","Younger and lower-paid employees benefit less from automatic enrollment than other employees do.","The original experiments on automatic enrollment reported participation rates that later studies could not reproduce.","Policy makers should replace automatic enrollment with policies that discourage household debt.","Gains in plan participation overstate the effect of automatic enrollment on retirement wealth, by an amount that depends on how plans are designed."],"ans":4,"expl":"The passage contrasts the dramatic participation effect with the smaller wealth effect and ties the gap to design choices. It explicitly denies that the policy is ineffective.","sec":"V","type":"mc","kind":"Reading Comprehension","topic":"Reading Comprehension"},{"id":"V21","stim":"P4","sub":"Detail (EXCEPT)","b":0.4,"stem":"The passage cites each of the following as a reason that automatic enrollment affects retirement wealth less than participation figures suggest EXCEPT:","opts":["Some employees remain at a default contribution rate lower than the rate they would otherwise have chosen.","Some workers withdraw their balances when they change jobs.","Some employees take on additional debt that offsets their contributions.","Some employers reduce their matching contributions after adopting automatic enrollment.","Default contribution rates are typically set low."],"ans":3,"expl":"Employer matching is never mentioned. The other four appear in the second paragraph.","sec":"V","type":"mc","kind":"Reading Comprehension","topic":"Reading Comprehension"},{"id":"V22","stim":"P4","sub":"Inference","b":1,"stem":"It can be inferred from the passage that the original experiments on automatic enrollment","opts":["measured outcomes that could be observed sooner and more easily than household wealth at retirement","were conducted mainly among older and higher-paid employees","found that most automatically enrolled employees chose contribution rates above the default","followed participants for a decade or more after enrollment","compared plans that differed in their treatment of balances at job change"],"ans":0,"expl":"The final paragraph contrasts the measure that is easiest to observe, participation, with the measure that matters, and says the experiments were not designed to evaluate the design choices. Following workers for a decade describes the later studies.","sec":"V","type":"mc","kind":"Reading Comprehension","topic":"Reading Comprehension"},{"id":"D01","sub":"Divisibility","b":0.5,"ans":2,"expl":"Alone, each fails (n = 4 for the first, n = 6 for the second). Together, n is a multiple of the least common multiple of 4 and 6, which is 12. Answer C. The trap is E, from thinking two partial facts cannot combine.","sec":"D","type":"mc","kind":"Data Sufficiency","topic":"Data Sufficiency","opts":["Statement (1) ALONE is sufficient, but statement (2) alone is not sufficient.","Statement (2) ALONE is sufficient, but statement (1) alone is not sufficient.","BOTH statements TOGETHER are sufficient, but NEITHER statement ALONE is sufficient.","EACH statement ALONE is sufficient.","Statements (1) and (2) TOGETHER are NOT sufficient."],"stem":"<p>Is the positive integer <i>n</i> divisible by 12?</p><div class=\"ds\"><div><span>(1)</span> <i>n</i> is divisible by 4.</div><div><span>(2)</span> <i>n</i> is divisible by 6.</div></div>"},{"id":"D04","sub":"Percent change","b":0.7,"ans":2,"expl":"Revenue is units times average price. Each statement gives one factor only. Together, 1.20 × 0.95 = 1.14, a 14 percent increase. Answer C.","sec":"D","type":"mc","kind":"Data Sufficiency","topic":"Data Sufficiency","opts":["Statement (1) ALONE is sufficient, but statement (2) alone is not sufficient.","Statement (2) ALONE is sufficient, but statement (1) alone is not sufficient.","BOTH statements TOGETHER are sufficient, but NEITHER statement ALONE is sufficient.","EACH statement ALONE is sufficient.","Statements (1) and (2) TOGETHER are NOT sufficient."],"stem":"<p>A store's revenue from sales of a certain product in 2023 was what percent greater than its revenue from sales of that product in 2022?</p><div class=\"ds\"><div><span>(1)</span> The number of units of the product that the store sold in 2023 was 20 percent greater than the number it sold in 2022.</div><div><span>(2)</span> The average price per unit at which the store sold the product in 2023 was 5 percent less than the average price in 2022.</div></div>"},{"id":"D06","sub":"Remainders","b":1.1,"ans":0,"expl":"(1) n = 12k + 7 = 6(2k + 1) + 1, so the remainder is 1: sufficient. (2) n = 1 and n = 5 both give n<sup>2</sup> a remainder of 1, with different remainders for n: not sufficient. Answer A.","sec":"D","type":"mc","kind":"Data Sufficiency","topic":"Data Sufficiency","opts":["Statement (1) ALONE is sufficient, but statement (2) alone is not sufficient.","Statement (2) ALONE is sufficient, but statement (1) alone is not sufficient.","BOTH statements TOGETHER are sufficient, but NEITHER statement ALONE is sufficient.","EACH statement ALONE is sufficient.","Statements (1) and (2) TOGETHER are NOT sufficient."],"stem":"<p>What is the remainder when the positive integer <i>n</i> is divided by 6?</p><div class=\"ds\"><div><span>(1)</span> When <i>n</i> is divided by 12, the remainder is 7.</div><div><span>(2)</span> When <i>n</i><sup>2</sup> is divided by 6, the remainder is 1.</div></div>"},{"id":"D11","sub":"Work and rates","b":0.6,"ans":3,"expl":"(1) Combined rate is 100 units per hour, so 12 hours: sufficient. (2) X makes 60 per hour and Y makes 40 per hour, combined 100, so 12 hours: sufficient. Answer D.","sec":"D","type":"mc","kind":"Data Sufficiency","topic":"Data Sufficiency","opts":["Statement (1) ALONE is sufficient, but statement (2) alone is not sufficient.","Statement (2) ALONE is sufficient, but statement (1) alone is not sufficient.","BOTH statements TOGETHER are sufficient, but NEITHER statement ALONE is sufficient.","EACH statement ALONE is sufficient.","Statements (1) and (2) TOGETHER are NOT sufficient."],"stem":"<p>Working together at their constant rates, how many hours do machines X and Y take to produce 1,200 units?</p><div class=\"ds\"><div><span>(1)</span> Working together at their constant rates, machines X and Y produce 300 units in 3 hours.</div><div><span>(2)</span> Working alone at its constant rate, machine X produces 1,200 units in 20 hours, and machine Y's constant rate is two-thirds of machine X's.</div></div>"},{"id":"D13","sub":"Positive and negative","b":0.9,"ans":1,"expl":"(1) reduces to xz &gt; 0, so x and z share a sign, which could be either: not sufficient. (2) z<sup>2</sup> is positive, so x<sup>3</sup> is negative and x is negative: sufficient, the answer to the question is no. Answer B.","sec":"D","type":"mc","kind":"Data Sufficiency","topic":"Data Sufficiency","opts":["Statement (1) ALONE is sufficient, but statement (2) alone is not sufficient.","Statement (2) ALONE is sufficient, but statement (1) alone is not sufficient.","BOTH statements TOGETHER are sufficient, but NEITHER statement ALONE is sufficient.","EACH statement ALONE is sufficient.","Statements (1) and (2) TOGETHER are NOT sufficient."],"stem":"<p>If <i>xyz</i> ≠ 0, is <i>x</i> &gt; 0?</p><div class=\"ds\"><div><span>(1)</span> <i>xy</i><sup>2</sup><i>z</i><sup>3</sup> &gt; 0</div><div><span>(2)</span> <i>x</i><sup>3</sup><i>z</i><sup>2</sup> &lt; 0</div></div>"},{"id":"D17","sub":"Overlapping sets","b":0.7,"ans":4,"expl":"Together the statements give 120 + 110 − both + neither = 200, so both = 30 + neither. The number who use neither is unknown, so the overlap could be anything from 30 to 110. Answer E.","sec":"D","type":"mc","kind":"Data Sufficiency","topic":"Data Sufficiency","opts":["Statement (1) ALONE is sufficient, but statement (2) alone is not sufficient.","Statement (2) ALONE is sufficient, but statement (1) alone is not sufficient.","BOTH statements TOGETHER are sufficient, but NEITHER statement ALONE is sufficient.","EACH statement ALONE is sufficient.","Statements (1) and (2) TOGETHER are NOT sufficient."],"stem":"<p>In a survey of 200 marketers, each was asked whether they use email campaigns and whether they use paid social campaigns. How many of the marketers use both?</p><div class=\"ds\"><div><span>(1)</span> 120 of the marketers use email campaigns.</div><div><span>(2)</span> 110 of the marketers use paid social campaigns.</div></div>"},{"id":"D20","sub":"Ratios","b":1.1,"ans":0,"expl":"Let analysts = 7k and managers = 2k. (1) 7k/(2k + 6) = 7/3 gives k = 6, so 42 analysts: sufficient. (2) 9k &lt; 60 and 2k a multiple of 4 allows k = 2, 4 or 6: not sufficient. Answer A.","sec":"D","type":"mc","kind":"Data Sufficiency","topic":"Data Sufficiency","opts":["Statement (1) ALONE is sufficient, but statement (2) alone is not sufficient.","Statement (2) ALONE is sufficient, but statement (1) alone is not sufficient.","BOTH statements TOGETHER are sufficient, but NEITHER statement ALONE is sufficient.","EACH statement ALONE is sufficient.","Statements (1) and (2) TOGETHER are NOT sufficient."],"stem":"<p>At a certain firm, the ratio of analysts to managers is 7 to 2. How many analysts work at the firm?</p><div class=\"ds\"><div><span>(1)</span> If the firm hired 6 more managers and no analysts, the ratio of analysts to managers would be 7 to 3.</div><div><span>(2)</span> The firm has fewer than 60 analysts and managers in total, and the number of managers is a multiple of 4.</div></div>"},{"id":"RC01","stim":"RCP1","sub":"Main idea","b":-1.3,"stem":"Which of the following best expresses the main idea of the passage?","opts":["Retailers of every kind should extend their return periods, since doing so always raises profits.","A lenient return policy can raise profits by encouraging purchases, although chiefly where buyers are uncertain about a product before they buy it.","The cost of handling returned items generally exceeds any benefit a retailer gains from a lenient return policy.","Customers frequently abuse generous return policies by returning items they have already used.","Mail-order retailers are more profitable than retailers that sell standardized goods in stores."],"ans":1,"expl":"The passage reports that a longer return period raised profit at one retailer and then limits the lesson to settings where buyers cannot judge a product in advance. The statement that all retailers should extend returns ignores that limit, the claim that costs exceed benefits reverses the finding, and abuse is only a minor point in the last paragraph.","sec":"V","type":"mc","kind":"Reading Comprehension","topic":"Reading Comprehension"},{"id":"RC02","stim":"RCP1","sub":"Detail","b":-1.1,"stem":"According to the passage, customers who were given the 90-day return period placed larger and more frequent orders because they","opts":["were offered lower prices than customers under the 30-day policy","were no longer charged a restocking fee on returned items","intended to use the items once and then send them back","were more willing to buy products that they could not examine before purchase","had been selected for the study because they were already frequent buyers"],"ans":3,"expl":"The surveys cited in the second paragraph indicate that easy returns made customers more willing to order items they could not examine in advance. Prices and restocking fees for this group are not discussed, single-use buying is mentioned only as a possible abuse elsewhere, and the group was selected at random.","sec":"V","type":"mc","kind":"Reading Comprehension","topic":"Reading Comprehension"},{"id":"RC03","stim":"RCP1","sub":"Application","b":-0.8,"stem":"Based on the passage, a more lenient return policy would be most likely to increase the profits of which of the following retailers?","opts":["An online retailer of handmade furniture that customers cannot see in person before it is delivered","A supermarket that sells packaged foods of well-known national brands","A hardware store in which customers can handle every tool before buying it","A shop selling formal wear that customers typically need for a single evening","A chain of stores selling standard printer cartridges identified by model number"],"ans":0,"expl":"The passage says a lenient policy is most valuable where buyers face real uncertainty before purchase, which is the position of someone ordering unseen handmade furniture. Packaged foods and printer cartridges are standardized, tools in a store can be inspected, and single-occasion formal wear is the kind of product the passage associates with abuse.","sec":"V","type":"mc","kind":"Reading Comprehension","topic":"Reading Comprehension"},{"id":"RC04","stim":"RCP2","sub":"Detail (EXCEPT)","b":-0.2,"stem":"The passage mentions each of the following as evidence bearing on the hypotheses about zebra stripes EXCEPT","opts":["a comparison of the intensity of striping with the regions and seasons in which biting flies are most active","observations of how flies behaved near horses wearing coats of different patterns","the limited sharpness of vision of certain predators","temperature measurements of barrels covered with hides of different patterns","rates of fly-borne disease among zebras whose stripes differ in intensity"],"ans":4,"expl":"The passage cites the geographic comparison, the horse-coat trials, the limited acuity of lions and hyenas, and the barrel measurements. It says that biting flies transmit diseases but reports no comparison of disease rates among zebras with different striping.","sec":"V","type":"mc","kind":"Reading Comprehension","topic":"Reading Comprehension"},{"id":"RC05","stim":"RCP2","sub":"Inference","b":-0.4,"stem":"The results of the field trials with horses most strongly support which of the following inferences?","opts":["Biting flies are more strongly attracted to white surfaces than to black ones.","Biting flies are unable to see striped surfaces at any distance.","Stripes do not substantially reduce the ability of biting flies to locate a host from a distance.","Horses wearing striped coats were bitten about as often as horses wearing coats of a single color.","Stripes deter biting flies chiefly by lowering the temperature of the surface on which the flies attempt to land."],"ans":2,"expl":"Flies approached all three kinds of coat at similar rates, so the stripes did not keep flies from finding the horses; the difference arose only at landing. Nothing compares white with black coats, far fewer flies landed on stripes so equal biting is unsupported, and the barrel measurements found no cooling effect.","sec":"V","type":"mc","kind":"Reading Comprehension","topic":"Reading Comprehension"},{"id":"RC06","stim":"RCP2","sub":"Function of a sentence","b":-0.7,"stem":"The author mentions the zebra's unusually short coat hairs primarily in order to","opts":["provide additional evidence against the hypothesis that stripes cool the animal","present a possible answer to a question that the fly hypothesis leaves open","explain why flies failed to slow down as they neared striped coats","suggest that the fly hypothesis is no better supported than the hypotheses it has displaced","show that zebras are exposed to more biting flies than other African grazers are"],"ans":1,"expl":"The preceding sentence raises an unresolved question: why zebras, unlike other grazers exposed to the same flies, needed protection. Short coat hairs are offered as one suggested answer. The passage says the other grazers face the same flies, and it does not treat the open question as undermining the fly hypothesis.","sec":"V","type":"mc","kind":"Reading Comprehension","topic":"Reading Comprehension"},{"id":"RC07","stim":"RCP3","sub":"Primary purpose","b":-0.2,"stem":"The primary purpose of the passage is to","opts":["show that the evidence on which a revisionist account relies is historically inaccurate","reconcile two explanations by showing that each applies to a different branch of the textile industry","describe the conditions under which textile workers labored before and after the rise of factories","assess a challenge to a conventional explanation and argue that the challenge, though partly valid, fails to account for the outcome at issue","argue that the rise of the factory is better explained by the desire to supervise workers than by new machinery"],"ans":3,"expl":"The passage sets out the technological explanation, presents the revisionist challenge, and then judges that challenge a useful corrective that nevertheless cannot explain why factories prevailed. The author accepts that the handloom workshops existed, so their accuracy is not disputed, and the claim that supervision is the better explanation is the revisionist position, not the author's.","sec":"V","type":"mc","kind":"Reading Comprehension","topic":"Reading Comprehension"},{"id":"RC08","stim":"RCP3","sub":"Inference","b":0.3,"stem":"It can be inferred from the passage that the author would most likely agree with which of the following statements about the early handloom workshops?","opts":["Their establishment indicates that merchants saw advantages in centralized production that did not depend on new machinery.","They yielded more cloth per weaver than domestic production did.","They failed chiefly because weavers continued to embezzle raw materials.","They were founded only after powered spinning machinery had come into general use.","Weavers employed in them generally accepted lower earnings than they had received at home."],"ans":0,"expl":"The author grants that supervision may well explain why merchants wanted factories, and the workshops used the same equipment as cottages, so their founding shows a motive independent of machinery. The passage says the workshops lacked more productive machinery, failed because of the wage premium weavers demanded, and preceded the new machines.","sec":"V","type":"mc","kind":"Reading Comprehension","topic":"Reading Comprehension"},{"id":"RC09","stim":"RCP3","sub":"Weaken","b":0.6,"stem":"Which of the following, if true, would most seriously weaken the author's assessment of the revisionist account?","opts":["Several owners of early cotton-spinning factories wrote that they valued the discipline that factory work imposed on their employees.","Weavers in handloom workshops produced no more cloth per day than they had produced at home.","In several branches of textile production that adopted no powered machinery, factories nonetheless displaced domestic work during the same decades.","Water-powered spinning frames could not be operated in buildings as small as a typical cottage.","Piece rates paid to domestic weavers varied considerably from one region to another."],"ans":2,"expl":"The author holds that factories prevailed only where powered machinery raised productivity. Factories displacing domestic work in branches with no such machinery would show that something other than technology, plausibly control, was enough for factories to prevail. Owners valuing discipline and unchanged output in handloom workshops are both consistent with the author's view, and the size of spinning frames supports the traditional account.","sec":"V","type":"mc","kind":"Reading Comprehension","topic":"Reading Comprehension"},{"id":"RC10","stim":"RCP3","sub":"Function of a detail","b":0.1,"stem":"The passage refers to the preference of households for leisure over further earnings primarily in order to","opts":["indicate that domestic workers were less skilled than factory workers","explain why weavers demanded a wage premium before they would enter a workshop","support the traditional view that cottages were unsuited to the new machinery","suggest that merchants exaggerated the difficulties of the putting-out system","account for a pattern of behavior that, on the revisionist view, gave merchants a reason to seek control over work"],"ans":4,"expl":"The preference for leisure explains why output slumped when piece rates rose, one of the complaints that, according to the revisionists, made control attractive to merchants. The wage premium is attributed in the next paragraph to the loss of independence, not to this preference, and skill and machinery are not at issue in this sentence.","sec":"V","type":"mc","kind":"Reading Comprehension","topic":"Reading Comprehension"},{"id":"RC11","stim":"RCP4","sub":"Author's attitude","b":1.1,"stem":"The author's attitude toward selective realism is best described as one of","opts":["dismissal, on the ground that the distinction between working and idle constituents cannot be drawn in a principled way","skepticism, on the ground that a position whose content can be fixed only in hindsight must be mistaken","qualified acceptance: the position withstands a common objection but does not supply the guidance about current theories that realism was meant to provide","approval, on the ground that the position shows the historical record to pose no obstacle to belief in current theories","detachment, since the author reports the views of realists and their critics without evaluating either"],"ans":2,"expl":"The author calls the rejoinder more robust than its critics allow, rejecting the arbitrariness charge, yet less informative than its defenders suppose, because it cannot say which parts of current theory to believe. The author explicitly denies that the retrospective character of the position makes it false, and says its application to present science remains largely unsecured.","sec":"V","type":"mc","kind":"Reading Comprehension","topic":"Reading Comprehension"},{"id":"RC12","stim":"RCP4","sub":"Inference","b":1.8,"stem":"The author's contrast between a conceptual difficulty and an epistemic one most strongly suggests that the author would accept which of the following statements?","opts":["Whether the ether hypothesis figured in the derivation of correct predictions about light was a determinate matter even when physicists were poorly placed to judge it.","The ether hypothesis became an idle constituent of its theory only once a successor theory had dispensed with it.","Because ether theorists regarded the ether as indispensable, it should be counted among the working constituents of their theory.","No constituent of a theory can be classified as working or idle except by reference to the theory that eventually replaces it.","Scientists are generally better placed than their successors to determine which premises their own derivations employed."],"ans":0,"expl":"The author says the question of which premises a derivation employed has an answer independent of later belief, and locates the trouble in when that answer can be confidently known. So the status of the ether was determinate even while practitioners misjudged it. The statements that tie idleness to the successor theory or to practitioners' opinions treat the difficulty as conceptual, which the author denies.","sec":"V","type":"mc","kind":"Reading Comprehension","topic":"Reading Comprehension"},{"id":"RC13","stim":"RCP4","sub":"Weaken","b":2.3,"stem":"Which of the following, if true, would most seriously weaken the author's principal reservation about selective realism?","opts":["The equations from which ether theorists derived their predictions are retained with little change in current physical theory.","Reconstructions by present-day historians show that the successful derivations of the ether theorists go through without any premise concerning a medium.","Many posits central to currently accepted theories are of the same general kind as posits that were later abandoned.","In a number of historical episodes, scientists used a criterion available to them at the time to mark certain posits of their own successful theories as dispensable, and those were the posits later abandoned.","Some theories now judged mistaken in their central posits never yielded any startling predictions."],"ans":3,"expl":"The reservation is that idle posits have been identified with confidence only in retrospect, so the position cannot guide belief about current theory. Evidence that practitioners reliably identified dispensable posits in advance, by a criterion statable at the time, removes that worry. Retained equations and present-day reconstructions are retrospective and merely support points the author already grants, while the remaining statements bear on the critics' historical argument.","sec":"V","type":"mc","kind":"Reading Comprehension","topic":"Reading Comprehension"},{"id":"RC14","stim":"RCP4","sub":"Analogy","b":1.3,"stem":"Which of the following is most closely analogous to the situation of selective realism as the author characterizes it in the final paragraph?","opts":["A scheme of classification whose categories are so loosely drawn that any item could be assigned to any of them","A rule advising investors to hold only the shares responsible for a portfolio's gains, when which shares were responsible can be established only after the period has ended","A forecasting method that was accurate for decades and then failed abruptly when conditions changed","A clinical guideline that identifies in advance which patients will benefit from a treatment but cannot explain why they benefit","A historical account that is abandoned when newly discovered documents contradict its central claim"],"ans":1,"expl":"The author holds that selective realism rests on a real distinction and reads the past correctly, but that the distinction can be applied with confidence only in hindsight and so offers no present guidance. The investment rule is sound in principle yet usable only after the fact. A loosely drawn classification matches the arbitrariness charge the author rejects, and a guideline that works in advance is the opposite case.","sec":"V","type":"mc","kind":"Reading Comprehension","topic":"Reading Comprehension"},{"sec":"D","type":"mc","kind":"Data Sufficiency","topic":"Data Sufficiency","id":"DA01","sub":"Percent discount","b":-1.4,"ans":0,"expl":"From the first statement, 80 percent of the list price is $96, so the list price is $120: sufficient. The second statement gives only the dollar amount of the discount, which fits a list price of $120, $200 or any other amount above $24: not sufficient.","opts":["Statement (1) ALONE is sufficient, but statement (2) alone is not sufficient.","Statement (2) ALONE is sufficient, but statement (1) alone is not sufficient.","BOTH statements TOGETHER are sufficient, but NEITHER statement ALONE is sufficient.","EACH statement ALONE is sufficient.","Statements (1) and (2) TOGETHER are NOT sufficient."],"stem":"<p>What was the list price of a certain jacket?</p><div class=\"ds\"><div><span>(1)</span> At a discount of 20 percent from its list price, the jacket sold for $96.</div><div><span>(2)</span> The jacket sold for $24 less than its list price.</div></div>"},{"sec":"D","type":"mc","kind":"Data Sufficiency","topic":"Data Sufficiency","id":"DA02","sub":"Multiples","b":-1.2,"ans":3,"expl":"The only multiple of 8 strictly between 40 and 50 is 48, so the first statement is sufficient. The only multiple of 12 in that range is also 48, so the second statement is sufficient as well. Each statement alone fixes the value.","opts":["Statement (1) ALONE is sufficient, but statement (2) alone is not sufficient.","Statement (2) ALONE is sufficient, but statement (1) alone is not sufficient.","BOTH statements TOGETHER are sufficient, but NEITHER statement ALONE is sufficient.","EACH statement ALONE is sufficient.","Statements (1) and (2) TOGETHER are NOT sufficient."],"stem":"<p>If <i>n</i> is an integer and 40 &lt; <i>n</i> &lt; 50, what is the value of <i>n</i>?</p><div class=\"ds\"><div><span>(1)</span> <i>n</i> is a multiple of 8.</div><div><span>(2)</span> <i>n</i> is a multiple of 12.</div></div>"},{"sec":"D","type":"mc","kind":"Data Sufficiency","topic":"Data Sufficiency","id":"DA03","sub":"Ordering","b":-0.9,"ans":2,"expl":"With the first statement alone, the order could be Amara, Bruno, Chen or Amara, Chen, Bruno, so Wednesday is not fixed. With the second alone, the order could be Chen, Amara, Bruno or Bruno, Chen, Amara. Together the only possible order is Chen, Amara, Bruno, so Bruno was interviewed on Wednesday.","opts":["Statement (1) ALONE is sufficient, but statement (2) alone is not sufficient.","Statement (2) ALONE is sufficient, but statement (1) alone is not sufficient.","BOTH statements TOGETHER are sufficient, but NEITHER statement ALONE is sufficient.","EACH statement ALONE is sufficient.","Statements (1) and (2) TOGETHER are NOT sufficient."],"stem":"<p>Amara, Bruno and Chen were each interviewed for a position on a different one of three days: Monday, Tuesday and Wednesday of the same week. Who was interviewed on Wednesday?</p><div class=\"ds\"><div><span>(1)</span> Amara was interviewed on an earlier day than Bruno.</div><div><span>(2)</span> Chen was interviewed on an earlier day than Amara.</div></div>"},{"sec":"D","type":"mc","kind":"Data Sufficiency","topic":"Data Sufficiency","id":"DA04","sub":"Equivalent equations","b":-0.8,"ans":4,"expl":"The second statement is the first statement doubled, so the two together carry no more information than one of them. One equation in two unknowns allows, for example, pens at $2.00 and notebooks at $3.00, or pens at $0.50 and notebooks at $4.00. The price of a notebook cannot be determined even with both statements.","opts":["Statement (1) ALONE is sufficient, but statement (2) alone is not sufficient.","Statement (2) ALONE is sufficient, but statement (1) alone is not sufficient.","BOTH statements TOGETHER are sufficient, but NEITHER statement ALONE is sufficient.","EACH statement ALONE is sufficient.","Statements (1) and (2) TOGETHER are NOT sufficient."],"stem":"<p>At a stationery shop, every pen sells for the same price and every notebook sells for the same price. What is the price of one notebook?</p><div class=\"ds\"><div><span>(1)</span> 2 pens and 3 notebooks sell for a total of $13.00.</div><div><span>(2)</span> 4 pens and 6 notebooks sell for a total of $26.00.</div></div>"},{"sec":"D","type":"mc","kind":"Data Sufficiency","topic":"Data Sufficiency","id":"DA05","sub":"Ratio to fraction","b":-0.5,"ans":0,"expl":"A ratio of 5 to 3 means that 3 of every 8 employees are part-time, so the first statement alone gives 3/8. The second statement gives only a difference: 50 and 2, or 120 and 72, both fit and give different fractions. The actual head count is not needed, so combining the statements is unnecessary.","opts":["Statement (1) ALONE is sufficient, but statement (2) alone is not sufficient.","Statement (2) ALONE is sufficient, but statement (1) alone is not sufficient.","BOTH statements TOGETHER are sufficient, but NEITHER statement ALONE is sufficient.","EACH statement ALONE is sufficient.","Statements (1) and (2) TOGETHER are NOT sufficient."],"stem":"<p>Each employee of a certain company is either full-time or part-time. What fraction of the company's employees are part-time?</p><div class=\"ds\"><div><span>(1)</span> The ratio of the number of full-time employees to the number of part-time employees is 5 to 3.</div><div><span>(2)</span> The company has 48 more full-time employees than part-time employees.</div></div>"},{"sec":"D","type":"mc","kind":"Data Sufficiency","topic":"Data Sufficiency","id":"DA06","sub":"Commission threshold","b":0.2,"ans":1,"expl":"A commission above $3,000 requires more than $50,000 of sales above the threshold, that is, total sales above $70,000. The first statement allows sales of $65,000 or $90,000, so it does not settle the question. The second statement caps the commission below 6 percent of $48,000, which is $2,880, so the answer is a definite no and the statement is sufficient.","opts":["Statement (1) ALONE is sufficient, but statement (2) alone is not sufficient.","Statement (2) ALONE is sufficient, but statement (1) alone is not sufficient.","BOTH statements TOGETHER are sufficient, but NEITHER statement ALONE is sufficient.","EACH statement ALONE is sufficient.","Statements (1) and (2) TOGETHER are NOT sufficient."],"stem":"<p>In June, Lorenzo's only commission was equal to 6 percent of the portion of his June sales in excess of $20,000. Was Lorenzo's commission for June greater than $3,000?</p><div class=\"ds\"><div><span>(1)</span> Lorenzo's sales for June were greater than $60,000.</div><div><span>(2)</span> Lorenzo's sales for June were less than $68,000.</div></div>"},{"sec":"D","type":"mc","kind":"Data Sufficiency","topic":"Data Sufficiency","id":"DA07","sub":"Decision rule","b":-0.3,"ans":2,"expl":"The first statement leaves her total at two, three or four quarters, so it is not sufficient. The second leaves her total at one, two or three quarters, so it is not sufficient either. Together she met the target in exactly three quarters, so she received the bonus.","opts":["Statement (1) ALONE is sufficient, but statement (2) alone is not sufficient.","Statement (2) ALONE is sufficient, but statement (1) alone is not sufficient.","BOTH statements TOGETHER are sufficient, but NEITHER statement ALONE is sufficient.","EACH statement ALONE is sufficient.","Statements (1) and (2) TOGETHER are NOT sufficient."],"stem":"<p>A firm pays a year-end bonus to each salesperson who met the quarterly sales target in at least three of the four quarters of the year, and to no one else. Did Mirela, a salesperson at the firm, receive a year-end bonus?</p><div class=\"ds\"><div><span>(1)</span> Mirela met the quarterly sales target in each of the first two quarters of the year.</div><div><span>(2)</span> Mirela met the quarterly sales target in exactly one of the last two quarters of the year.</div></div>"},{"sec":"D","type":"mc","kind":"Data Sufficiency","topic":"Data Sufficiency","id":"DA08","sub":"Mixtures","b":0,"ans":3,"expl":"Either statement shows that the mixture contains 12 liters of alcohol. For 12 liters to be 20 percent of the total, the total must be 60 liters, so 20 liters of water must be added. Each statement alone is sufficient.","opts":["Statement (1) ALONE is sufficient, but statement (2) alone is not sufficient.","Statement (2) ALONE is sufficient, but statement (1) alone is not sufficient.","BOTH statements TOGETHER are sufficient, but NEITHER statement ALONE is sufficient.","EACH statement ALONE is sufficient.","Statements (1) and (2) TOGETHER are NOT sufficient."],"stem":"<p>A 40-liter mixture consists only of alcohol and water. How many liters of water must be added to the mixture so that alcohol makes up 20 percent of the resulting volume?</p><div class=\"ds\"><div><span>(1)</span> Alcohol makes up 30 percent of the 40-liter mixture.</div><div><span>(2)</span> The 40-liter mixture contains 28 liters of water.</div></div>"},{"sec":"D","type":"mc","kind":"Data Sufficiency","topic":"Data Sufficiency","id":"DA09","sub":"Linear cost comparison","b":1.8,"ans":2,"expl":"The difference between the two total charges is a linear function of the number of copies, and one point on a line does not fix it, so neither statement alone is sufficient. Together, Printer P's advantage shrinks by $400 for every additional 3,000 copies, so at 8,000 copies Printer P costs $200 more: a definite no, which makes the statements together sufficient.","opts":["Statement (1) ALONE is sufficient, but statement (2) alone is not sufficient.","Statement (2) ALONE is sufficient, but statement (1) alone is not sufficient.","BOTH statements TOGETHER are sufficient, but NEITHER statement ALONE is sufficient.","EACH statement ALONE is sufficient.","Statements (1) and (2) TOGETHER are NOT sufficient."],"stem":"<p>A publisher will print 8,000 copies of a catalog using either Printer P or Printer Q. Each printer charges a fixed setup fee plus a constant amount per copy, and neither the setup fees nor the per-copy amounts are necessarily the same for the two printers. For 8,000 copies, would Printer P's total charge be less than Printer Q's total charge?</p><div class=\"ds\"><div><span>(1)</span> For 2,000 copies, Printer P's total charge would be $600 less than Printer Q's.</div><div><span>(2)</span> For 5,000 copies, Printer P's total charge would be $200 less than Printer Q's.</div></div>"},{"sec":"D","type":"mc","kind":"Data Sufficiency","topic":"Data Sufficiency","id":"DA10","sub":"Average speed","b":1.3,"ans":1,"expl":"For two equal distances at speeds 40 and <i>v</i>, the average speed is 80<i>v</i>/(40 + <i>v</i>), which exceeds 60 only if <i>v</i> is greater than 120. The first statement says only that <i>v</i> is greater than 40, which allows 50 or 200: not sufficient. The second statement keeps <i>v</i> below 110, so the average is below 8,800/150, about 58.7, and the answer is a definite no: sufficient. Averaging 40 and 110 to get 75 is the trap.","opts":["Statement (1) ALONE is sufficient, but statement (2) alone is not sufficient.","Statement (2) ALONE is sufficient, but statement (1) alone is not sufficient.","BOTH statements TOGETHER are sufficient, but NEITHER statement ALONE is sufficient.","EACH statement ALONE is sufficient.","Statements (1) and (2) TOGETHER are NOT sufficient."],"stem":"<p>Farid drove from his office to a client site along a single route. He drove the first half of the distance at a constant speed of 40 kilometers per hour and the second half of the distance at a different constant speed. Was his average speed for the entire trip greater than 60 kilometers per hour?</p><div class=\"ds\"><div><span>(1)</span> Farid drove the second half of the distance in less time than he drove the first half.</div><div><span>(2)</span> Farid's speed for the second half of the distance was less than 110 kilometers per hour.</div></div>"},{"sec":"D","type":"mc","kind":"Data Sufficiency","topic":"Data Sufficiency","id":"DA11","sub":"Integer solutions","b":2.1,"ans":4,"expl":"The equation 7<i>g</i> + 11<i>m</i> = 149 has exactly two solutions in positive integers: 15 boxes of gloves with 4 of masks, and 4 boxes of gloves with 11 of masks. The second statement alone says almost nothing, and both solutions satisfy it, since they total 19 and 15 boxes. Even together the statements leave 4 or 11 boxes of masks, so the number cannot be determined. The trap is to assume that the integer constraint must yield a single solution.","opts":["Statement (1) ALONE is sufficient, but statement (2) alone is not sufficient.","Statement (2) ALONE is sufficient, but statement (1) alone is not sufficient.","BOTH statements TOGETHER are sufficient, but NEITHER statement ALONE is sufficient.","EACH statement ALONE is sufficient.","Statements (1) and (2) TOGETHER are NOT sufficient."],"stem":"<p>A clinic placed an order consisting only of boxes of gloves, at $7 per box, and boxes of masks, at $11 per box. The order included at least one box of each. How many boxes of masks did the clinic order?</p><div class=\"ds\"><div><span>(1)</span> The total cost of the order was $149.</div><div><span>(2)</span> The order consisted of at least 15 boxes in total.</div></div>"},{"id":"VC01","stim":"VCP1","sub":"Inference","b":1.6,"stem":"Proponents of the multitask account, as it is described in the passage, would be most likely to agree with which of the following statements?","opts":["Employees whose pay depends on measured results reduce the total effort that they devote to their work.","If every valuable aspect of a job could be measured, the account would give an employer no reason to keep the incentives attached to that job weak.","Organizations that tie little pay to performance have generally failed to grasp what agency theory implies.","Employees take no interest in their work beyond the rewards that are attached to it.","Performance pay lowers performance chiefly by changing the way in which employees regard their relationship with their employer."],"ans":1,"expl":"On the multitask account the harm of incentives comes entirely from the gap between measured and unmeasured activities, so where nothing valuable goes unmeasured the account offers no ground for weak incentives, as the last paragraph confirms. The account describes a shift of effort among activities, not a fall in total effort, and it treats weak incentives as a correct application of agency theory. It assumes a self-interested response to rewards without denying all interest in the work, and the idea that rewards recast the employment relationship belongs to the crowding account.","sec":"V","type":"mc","kind":"Reading Comprehension","topic":"Reading Comprehension"},{"id":"VC02","stim":"VCP1","sub":"Strengthen a position","b":1.6,"stem":"Which of the following findings, if obtained, would provide the strongest support for the crowding account over the multitask account, as the passage describes the two?","opts":["After a retailer began paying bonuses for sales volume, the quality of the advice its staff gave to customers, which the bonus scheme did not track, declined.","Fruit pickers paid by the weight of fruit they harvested picked more than pickers paid by the hour, although they reported no greater interest in the work.","Firms in which pay is only weakly tied to measured performance were found to be more profitable than firms in which the tie is strong.","Engineers whose bonuses depended on three of the five aspects of their work that their employer valued improved on those three aspects and declined on the other two.","Nurses' performance declined on every aspect of their work after their employer began to measure and to reward all of the aspects of that work that it valued."],"ans":4,"expl":"The passage says the accounts diverge only where every valuable dimension is measured and rewarded: the multitask account then predicts gains, the crowding account a possible decline. A decline on all dimensions under complete measurement is therefore the one result that favors crowding. Deterioration confined to unmeasured dimensions, and the greater profitability of weak-incentive firms, are expected on both accounts, while gains under piece rates fit the multitask account.","sec":"V","type":"mc","kind":"Reading Comprehension","topic":"Reading Comprehension"},{"id":"VC03","stim":"VCP1","sub":"Function","b":1.8,"stem":"The author's remark that the more careful advocates of the crowding account \"never claimed\" that crowding is universal serves primarily to","opts":["indicate that the piece-rate findings tell against only a version of the crowding account broader than the one its best defenders hold","suggest that advocates of the crowding account have narrowed their claims in response to the piece-rate findings","concede that most advocates of the crowding account have overstated the evidence in its favor","imply that the studies of piece-rate work were too poorly designed to bear on the dispute","distinguish those advocates of the crowding account who accept the multitask account from those who reject it"],"ans":0,"expl":"The remark limits what the reported gains establish: they rule out universal crowding, a claim the account's careful advocates did not make, so the account in its defensible form is untouched. \"Never claimed\" excludes the idea of a retreat prompted by the findings. The charge that proponents overrate their evidence is made earlier and about different studies, and the author questions the reach of the piece-rate studies, not their design.","sec":"V","type":"mc","kind":"Reading Comprehension","topic":"Reading Comprehension"},{"id":"VC04","stim":"VCP1","sub":"Weaken","b":2.1,"stem":"The author gives a reason for declining to treat the studies of piece-rate work as a refutation of the crowding account. Which of the following, if true, would most weaken that reason?","opts":["Several of the piece-rate studies followed workers' output for only a few months after incentive pay was introduced.","Workers in complex occupations often report that their interest in their work declines once they are paid according to measured results.","Some routine jobs include aspects, such as the care of equipment, that employers value but cannot easily measure.","Workers in the piece-rate studies, surveyed before incentive pay was introduced, expressed as much interest in their work as professionals in complex occupations typically express.","The gains reported in the piece-rate studies were larger than proponents of the multitask account had predicted."],"ans":3,"expl":"The author's reason is that people in fully measurable, routine jobs may have had little intrinsic interest for rewards to displace, so gains there say little about crowding elsewhere. Evidence that those workers were as interested in their work as professionals removes that escape, making the gains a real test of crowding. Short follow-up periods and unmeasured aspects of routine jobs would be further grounds for caution, not objections to the author's reason, and reports of declining interest in complex work favor crowding itself.","sec":"V","type":"mc","kind":"Reading Comprehension","topic":"Reading Comprehension"},{"id":"VC05","stim":"VCP2","sub":"Application","b":1.7,"stem":"According to the revised theory as the passage describes it, which of the following populations would be most likely to evolve slower senescence than an otherwise similar population not exposed to the hazard mentioned?","opts":["Lizards on an island where periodic storms kill a large share of individuals regardless of their age or vigor","Insects whose larvae are heavily preyed upon before they reach reproductive age","Rodents exposed to a pathogen that is fatal chiefly to individuals whose bodily condition has begun to decline","Birds that have colonized an island free of the predators that kill many of their mainland relatives","Fish harvested by a fishery whose nets take only the largest and most fecund adults"],"ans":2,"expl":"The revised theory holds that added mortality favors slower aging where it is condition-dependent, falling mainly on the frail, because deterioration is then itself penalized. A pathogen that kills chiefly those already in decline fits this exactly. Storms that kill indiscriminately leave the age pattern of selection unchanged on the models described, predation on larvae and a fishery that removes the most vigorous adults do not penalize deterioration, and the island birds have lost a hazard instead of being exposed to one.","sec":"V","type":"mc","kind":"Reading Comprehension","topic":"Reading Comprehension"},{"id":"VC06","stim":"VCP2","sub":"Author's attitude","b":1.1,"stem":"The author's attitude toward the revised theory of aging can best be described as","opts":["convinced by its reasoning but concerned that, with the data now available, it cannot be put to a real test","persuaded that the stream-fish studies confirm it, though doubtful that it applies to birds and bats","suspicious that it was devised merely to protect the classical theory from contrary evidence, and inclined on that ground to reject it","satisfied that it is correct but convinced that condition-dependent mortality is too rare in the wild for the theory to matter","uncertain whether its formal models are sound, since they depend on assumptions about how populations are regulated"],"ans":0,"expl":"The author calls the revision persuasive as theory and accepts that the models show the classical prediction to be unfounded as a generalization, yet objects that the quantities needed to test the revision have been measured in almost no wild population. The author denies that the fish confirm it, since condition-dependence there was inferred from the result to be explained. Nothing suggests rejection, a claim that condition-dependent mortality is rare, or doubt about the models themselves.","sec":"V","type":"mc","kind":"Reading Comprehension","topic":"Reading Comprehension"},{"id":"VC07","stim":"VCP2","sub":"Weaken","b":2,"stem":"Which of the following, if true, would most weaken the author's objection to the use of the revised theory to explain the stream-fish results?","opts":["Formal models constructed independently by other theorists yield the same conclusions about the effects of mortality that strikes all conditions alike.","Condition-dependent mortality has been measured directly in laboratory populations of several other species of fish.","Fish in the populations below the waterfalls begin to reproduce at a younger age than fish in the populations upstream.","Field trials completed before any data on aging were collected showed that the predators below the waterfalls capture slow-swimming fish at far higher rates than fast-swimming ones.","The growth of the predator-free populations upstream is known to be limited by the availability of food."],"ans":3,"expl":"The objection is that, for these fish, condition-dependent mortality was never measured but was inferred from the very aging result it is supposed to explain. Independent field evidence, gathered beforehand, that predators there take the slow far more often than the fast supplies the missing measurement and removes the circularity. Agreement among models concerns the theory, which the author already accepts, laboratory measurements on other species do not bear on these wild populations, and food limitation upstream addresses only part of what must be known and only for the populations without predators.","sec":"V","type":"mc","kind":"Reading Comprehension","topic":"Reading Comprehension"},{"sec":"D","type":"mc","kind":"Data Sufficiency","topic":"Data Sufficiency","id":"DH01","sub":"Fractions forcing integers","b":1.7,"ans":0,"expl":"The fractions force the Country X group to number 7<i>a</i> and the Country Y group 11<i>b</i> for positive integers <i>a</i> and <i>b</i>. With the first statement, 7<i>a</i> + 11<i>b</i> = 40 has the single solution <i>a</i> = 1, <i>b</i> = 3, so 33 representatives are from Country Y: sufficient. With the second, 2<i>a</i> + 3<i>b</i> = 11 allows <i>a</i> = 1, <i>b</i> = 3 or <i>a</i> = 4, <i>b</i> = 1, giving 33 or 11: not sufficient. The trap is to treat the first statement as one equation in two unknowns.","opts":["Statement (1) ALONE is sufficient, but statement (2) alone is not sufficient.","Statement (2) ALONE is sufficient, but statement (1) alone is not sufficient.","BOTH statements TOGETHER are sufficient, but NEITHER statement ALONE is sufficient.","EACH statement ALONE is sufficient.","Statements (1) and (2) TOGETHER are NOT sufficient."],"stem":"<p>A trade delegation consists of representatives of Country X and representatives of Country Y, with at least one representative of each country. Exactly 2/7 of the representatives of Country X and exactly 3/11 of the representatives of Country Y speak Mandarin. How many of the representatives in the delegation are from Country Y?</p><div class=\"ds\"><div><span>(1)</span> The delegation has 40 representatives in total.</div><div><span>(2)</span> Exactly 11 of the representatives in the delegation speak Mandarin.</div></div>"},{"sec":"D","type":"mc","kind":"Data Sufficiency","topic":"Data Sufficiency","id":"DH02","sub":"Percent change and profit","b":1.8,"ans":1,"expl":"With 2023 revenue <i>R</i> and cost <i>C</i>, profit rose only if 0.2<i>R</i> &gt; 0.3<i>C</i>, that is, only if cost was less than two-thirds of revenue in 2023. The second statement puts cost at 70 percent of revenue, which is more than two-thirds, so profit fell: a definite no, and sufficient. The first statement gives 1.2<i>R</i> − 1.3<i>C</i> &gt; 0.24<i>R</i>, so cost was below about 73.8 percent of revenue, which allows 70 percent (profit fell) or 50 percent (profit rose): not sufficient.","opts":["Statement (1) ALONE is sufficient, but statement (2) alone is not sufficient.","Statement (2) ALONE is sufficient, but statement (1) alone is not sufficient.","BOTH statements TOGETHER are sufficient, but NEITHER statement ALONE is sufficient.","EACH statement ALONE is sufficient.","Statements (1) and (2) TOGETHER are NOT sufficient."],"stem":"<p>In 2024 a company's revenue was 20 percent greater than in 2023, and its total cost was 30 percent greater than in 2023. Profit for a year is revenue minus total cost. Was the company's profit greater in 2024 than in 2023?</p><div class=\"ds\"><div><span>(1)</span> In 2024 the company's profit was more than 20 percent of its revenue.</div><div><span>(2)</span> In 2023 the company's profit was 30 percent of its revenue.</div></div>"},{"sec":"D","type":"mc","kind":"Data Sufficiency","topic":"Data Sufficiency","id":"DH03","sub":"Trains meeting","b":1.2,"ans":3,"expl":"After the trains pass, each must cover the stretch the other covered in the first 3 hours. From the first statement, train A covers in 2 hours what train B covered in 3, so the speeds are in the ratio 3 to 2; train B then needs 3 × 3/2 = 4.5 hours for the stretch that took train A 3 hours, for a total of 7.5 hours. The second statement gives the same 3 to 2 ratio directly and so the same 7.5 hours. Each statement alone is sufficient, and the distance between the stations is never needed.","opts":["Statement (1) ALONE is sufficient, but statement (2) alone is not sufficient.","Statement (2) ALONE is sufficient, but statement (1) alone is not sufficient.","BOTH statements TOGETHER are sufficient, but NEITHER statement ALONE is sufficient.","EACH statement ALONE is sufficient.","Statements (1) and (2) TOGETHER are NOT sufficient."],"stem":"<p>Train A left station P for station Q at the same moment that train B left station Q for station P on a parallel track. Each train traveled at its own constant speed without stopping, and the two trains passed each other exactly 3 hours after they set out. How many hours did train B take to travel from Q to P?</p><div class=\"ds\"><div><span>(1)</span> Train A reached station Q exactly 2 hours after the two trains passed each other.</div><div><span>(2)</span> Train A's speed was 50 percent greater than train B's speed.</div></div>"},{"sec":"D","type":"mc","kind":"Data Sufficiency","topic":"Data Sufficiency","id":"DH04","sub":"Overlapping sets","b":1.8,"ans":2,"expl":"Since the holders of A plus the holders of B minus those with both plus those with neither equals 90, the number with both exceeds the number with neither exactly when the holders of A and the holders of B total more than 90. The first statement leaves the number who hold B open, and the second says only that A has 11 more holders than B, which fits totals such as 51 and 40 or 31 and 20. Together, 52 hold A and 41 hold B, a total of 93, so those with both outnumber those with neither by 3. Neither count can be found individuall
