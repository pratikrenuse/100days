s dressed domestic horses in striped, all-black, or all-white coats. Flies approached all three kinds of coat at similar rates, but far fewer landed on the striped coats; video recordings showed that flies nearing the stripes failed to slow down and often collided with the coat or flew past it.</p>\n<p>The other hypotheses have fared less well. To lions and hyenas, whose vision is less acute than that of humans, stripes blur into uniform gray beyond a short distance, so stripes could not conceal a zebra at the ranges at which these predators typically begin a hunt. And measurements of water-filled barrels covered with striped, black, or white hides revealed no cooling effect of stripes. The fly hypothesis does leave one matter unresolved: why zebras, unlike other African grazers exposed to the same flies, should have needed such protection. One suggestion is that the zebra's unusually short coat hairs allow flies to reach the skin easily.</p>","RCP3":"<p>Before the late eighteenth century, most English cloth was produced under the putting-out system: merchants distributed raw wool or cotton to rural households, whose members spun and wove at home and were paid by the piece. Within a few decades, much of this work had moved into factories. The traditional explanation for the shift is technological. New machines, such as water-powered spinning frames, were too large and costly for a cottage and needed a central source of power; production therefore had to be concentrated wherever a waterwheel or steam engine could be installed.</p>\n<p>Some economic historians have challenged this account by pointing out that the earliest factories often preceded the machinery said to require them. Several early workshops gathered handloom weavers under one roof, where they used the same equipment they had used at home. On the revisionist view, what the factory offered merchants was not superior technology but control. Under putting-out, workers set their own hours, and merchants complained persistently that workers embezzled raw materials and that output slumped whenever piece rates rose, since households that had earned a customary income preferred leisure to further earnings. In a factory, an owner could fix hours, supervise the pace of work, and monitor materials.</p>\n<p>The revisionist account is a useful corrective, but it explains less than its proponents claim. Handloom workshops of the kind it cites were never numerous, and many failed: weavers demanded a wage premium to give up the independence of domestic work, and without more productive machinery owners could seldom afford to pay it. Factories became the dominant form of textile production only in those branches, cotton spinning above all, in which powered machinery had sharply raised output per worker. Supervision may well explain why merchants wanted factories; it does not explain why factories prevailed. That required the productivity gains that allowed factory owners to pay wages high enough to draw workers away from their homes.</p>","RCP4":"<p>Scientific realists hold that the predictive success of mature theories is best explained by their approximate truth: were our best theories not at least roughly right about unobservable entities, their capacity to yield accurate and sometimes startling predictions would be a miracle. Critics answer with history. The record of science, they observe, is crowded with theories that were for a time strikingly successful and that are now judged to have been mistaken not in detail but in their central posits; the caloric theory of heat and the theory of the luminiferous ether are the usual examples. If success did not track truth then, the critics ask, by what right do we suppose that it does now?</p>\n<p>The most influential realist rejoinder concedes the history while contesting its lesson. Not every element of a successful theory, the selective realist argues, contributes to its success. The ether theorists derived correct predictions about the behavior of light from equations that survive in later theory; the hypothesis of an elastic medium filling space, on this account, did no work in those derivations and was an idle accompaniment to them. Realist commitment should therefore extend only to the constituents on which a theory's successes actually depended, and the historical record, read in this way, shows those constituents to have been retained rather than discarded.</p>\n<p>This rejoinder is more robust than its critics allow, but it is also less informative than its defenders suppose. The charge commonly leveled against it, that the distinction between working and idle constituents is arbitrary, is overstated: one can ask of any derivation which premises it in fact employed, and that question has an answer independent of what later scientists came to believe. The more serious difficulty is epistemic rather than conceptual. Historically, the judgment that a given posit was idle has been made with confidence only after a successor theory dispensed with it; practitioners at the time typically regarded the ether as indispensable. A realism whose content can be specified only in retrospect is not thereby false, but it cannot tell us which parts of current theory to believe, and that guidance was precisely what realism was supposed to provide. Selective realism thus rescues the inference from success to truth as a thesis about past science while leaving its application to present science largely unsecured.</p>","VCP1":"<p>Standard agency theory treats pay as an instrument for aligning an employee's effort with an employer's goals: the more closely reward tracks output, the more effort the employee supplies. Yet most organizations tie only a small fraction of pay to measured performance, and firms that strengthen such ties sometimes see overall performance decline. Two accounts of this pattern now compete.</p>\n<p>The first, the multitask account, preserves the assumption that employees respond to rewards in a self-interested way. Most jobs, it observes, comprise several activities, only some of which can be measured. An employee paid according to the measured activities will shift effort toward them and away from the rest, so that a teacher rewarded for examination results neglects whatever the examination does not test. Weak incentives, on this view, are not a failure to apply agency theory but its correct application to work whose valuable dimensions are unevenly observable.</p>\n<p>The second, the crowding account, holds that the assumption itself is at fault. Drawing on experiments in which paid volunteers worked less diligently than unpaid ones, its proponents argue that many employees work partly from interest in the task or commitment to the organization, and that explicit rewards displace these motives by recasting the work as a transaction. Here the damage is done by the reward as such, not by the gap between what is rewarded and what is valued.</p>\n<p>Proponents of crowding commonly cite field studies in which performance pay was followed by deterioration in quality, cooperation, or care. This evidence is less decisive than they suppose. In nearly every such study the deteriorating dimension was one that the pay scheme did not measure, which is precisely what the multitask account predicts. The two accounts diverge only where every valuable dimension of a job is measured and rewarded: there the multitask account predicts that incentives will raise performance, the crowding account that they may still lower it. The few studies of such settings, chiefly of piece-rate agricultural and installation work, report gains. It would be premature, however, to count this as a refutation of crowding. Jobs that can be measured completely tend to be routine, and those who take them may have had little intrinsic interest for rewards to displace. The studies thus show that crowding is not universal, which its more careful advocates never claimed; whether it operates in the complex work where incentive design is actually contested remains a question that existing field evidence, by its very structure, is poorly suited to settle.</p>","VCP2":"<p>The classical evolutionary theory of aging begins from the observation that natural selection weakens with age. Because predation, disease, and accident kill many organisms before they grow old, a mutation whose harmful effects appear only late in life is exposed to selection in few individuals and may persist, particularly if it confers some benefit early. From this reasoning the theory's founders drew a prediction that became canonical: populations subject to high extrinsic mortality, that is, to death from external hazards, should evolve more rapid senescence than populations that are relatively safe.</p>\n<p>Comparative data long seemed to bear this out. Birds and bats, which escape many predators by flight, outlive ground-dwelling mammals of similar size, and island populations of several species age more slowly than their mainland relatives. But a series of studies of small stream fish has unsettled the consensus. Populations living below waterfalls alongside large predators, and suffering far higher mortality, were found to senesce no faster, and by some measures more slowly, than populations in predator-free waters upstream.</p>\n<p>Some theorists have responded that the canonical prediction was never a strict consequence of the theory. Formal models show that if extrinsic hazards strike all ages and conditions alike and population growth is checked by density, added mortality leaves the relative strength of selection at different ages unchanged. What matters is whether mortality is condition-dependent. Where predators take disproportionately the slow and the frail, deterioration is itself penalized, and heavy predation can favor slower aging. On this reading the fish results are not an anomaly but an illustration.</p>\n<p>This revision is persuasive as theory, yet it purchases its consistency with the evidence at a price. The classical prediction could be tested against mortality rates alone; the revised one requires knowing how the risk of death varies with an individual's physiological state and how the population is regulated, quantities that have been measured in almost no wild population, including the fish in question, for which condition-dependence has been inferred from the very result it is invoked to explain. Until such measurements exist, the revised theory can accommodate either faster or slower aging under high mortality, and a theory that accommodates every outcome explains none. That is a reason not to return to the classical prediction, which the models show to be unfounded as a generalization, but to treat the comparative pattern in birds and bats as awaiting explanation rather than as settled support for either version.</p>"},"tables":{"T1":{"title":"Campaign results, third quarter","cols":["Campaign","Channel","Spend ($ thousand)","Clicks (thousand)","Conversions","Revenue ($ thousand)"],"rows":[["A","Search",40,20,800,120],["B","Social",25,25,500,60],["C","Email",5,4,240,30],["D","Display",30,30,300,45],["E","Search",50,20,1000,175],["F","Social",20,16,480,50],["G","Video",45,15,450,90],["H","Email",10,5,400,44]]},"T2":{"title":"Office summary, current year","cols":["Office","Employees","Average salary ($ thousand)","Attrition rate (%)","Remote share (%)","Satisfaction (1 to 10)"],"rows":[["Pune",240,28,12,40,7.8],["Berlin",120,72,8,60,8.1],["Madrid",90,54,15,35,7.2],["Austin",150,95,18,70,6.9],["Toronto",80,78,10,55,7.9],["Singapore",110,84,9,25,7.5],["Lisbon",60,48,20,50,6.5],["Dublin",100,80,14,45,7.4]]},"DBT1":{"title":"Regional warehouses, last month","cols":["Warehouse","Region","Floor area (thousand sq m)","Staff","Daily shipments","On-time rate (%)"],"rows":[["Almere","North",12,45,900,96],["Brno","East",8,30,540,91],["Cadiz","South",15,60,1500,94],["Dijon","West",10,40,720,89],["Espoo","North",6,24,600,97],["Far venue and total cost of a logistics firm ($ million)","cats":["2019","2020","2021","2022","2023","2024"],"series":[{"name":"Revenue","v":[40,50,60,80,90,100]},{"name":"Total cost","v":[30,35,45,50,65,80]}],"y":{"label":"$ million","min":20,"max":100,"step":10}},"DHC1":{"kind":"bar","title":"Parcels delivered in a city by a courier company, by vehicle type (thousands)","cats":["2020","2021","2022","2023","2024"],"series":[{"name":"Van","v":[60,70,75,80,90]},{"name":"Cargo bike","v":[20,30,50,60,90]}],"y":{"label":"Parcels delivered (thousands)","min":0,"max":100,"step":10},"xLabel":"Year"},"DHC2":{"kind":"scatter","title":"Floor area and monthly rent of 12 leased offices","x":{"label":"Floor area (hundred square meters)","min":0,"max":10,"step":1},"y":{"label":"Monthly rent ($ thousand)","min":0,"max":50,"step":5},"pts":[[1,10],[2,15],[2,7.5],[3,20],[4,17.5],[4,25],[5,22.5],[6,35],[6,27.5],[7,30],[8,45],[9,40]],"line":[[0,5],[10,45]],"lineLabel":"Trend line"}},"msr":{"M1":{"tabs":[{"name":"Requirements","html":"<p><b>Email from the operations manager to the events team</b></p>\n <p>We need to confirm a venue for the annual partner conference by the end of the month. The conference runs for three consecutive days, March 10 to 12, and we should plan for 260 attendees on each day.</p>\n <p>A venue is acceptable only if it meets all of the following: it holds at least our planned number of attendees, it is no more than 30 minutes from the airport by car, and the total cost of the event does not exceed our budget of $60,000.</p>\n <p>Total cost means venue rental for the three days, catering for every attendee on each day, and audiovisual (AV) equipment. If a venue does not include AV equipment, we rent it separately for a flat $4,500 covering all three days.</p>"},{"name":"Venues","html":"<table class=\"dt\"><thead><tr><th>Venue</th><th>Capacity</th><th>Rental per day</th><th>Catering per attendee per day</th><th>Minutes from airport</th><th>AV included</th></tr></thead><tbody>\n <tr><td>Harbor Hall</td><td>300</td><td>$6,000</td><td>$40</td><td>20</td><td>Yes</td></tr>\n <tr><td>Meridian Center</td><td>280</td><td>$4,000</td><td>$45</td><td>25</td><td>No</td></tr>\n <tr><td>Oak Pavilion</td><td>240</td><td>$3,000</td><td>$35</td><td>15</td><td>Yes</td></tr>\n <tr><td>Summit House</td><td>400</td><td>$7,500</td><td>$38</td><td>35</td><td>Yes</td></tr></tbody></table>"},{"name":"Finance note","html":"<p><b>Email from the finance lead to the events team</b></p>\n <p>Two things before you commit. First, Meridian Center and Summit House are both offering an early-booking discount of 10 percent on rental charges, though not on catering or AV, for any booking confirmed by January 31. Harbor Hall and Oak Pavilion offer no discount.</p>\n <p>Second, please compare venues on total cost as the operations manager defined it. I will approve whichever acceptable venue has the lowest total cost, and I will assume we confirm before January 31.</p>"}]},"DMS1":{"tabs":[{"name":"Email","html":"<p><b>Email from the human resources director to all department heads</b></p>\n <p>Nominations for this year's professional development fund are now closed. As a reminder, a nominated employee is eligible for funding only if, on the nomination date, the employee has completed at least 2 years with the company and received a rating of at least 3, on our scale of 1 to 5, in the most recent performance review. Nominees who are not eligible receive no funding.</p>\n <p>The total amount that the company pays toward course fees for a department's eligible nominees may not exceed $13,000 for the year. If that limit would be exceeded, the department head must withdraw nominations until it is not. The share of each fee that the company pays is set out in the policy note.</p>"},{"name":"Nominations","html":"<table class=\"dt\"><thead><tr><th>Employee</th><th>Department</th><th>Years with company</th><th>Latest rating</th><th>Course</th><th>Course fee</th><th>Course length (weeks)</th></tr></thead><tbody>\n <tr><td>Anika Rao</td><td>Finance</td><td>4</td><td>4</td><td>Data Modelling</td><td>$3,600</td><td>6</td></tr>\n <tr><td>Bruno Keller</td><td>Finance</td><td>1</td><td>5</td><td>Financial Reporting</td><td>$2,800</td><td>4</td></tr>\n <tr><td>Chen Li</td><td>Finance</td><td>6</td><td>3</td><td>Leadership Certificate</td><td>$8,000</td><td>12</td></tr>\n <tr><td>Dalia Haddad</td><td>Operations</td><td>4</td><td>5</td><td>Supply Chain Diploma</td><td>$6,000</td><td>16</td></tr>\n <tr><td>Emeka Obi</td><td>Operations</td><td>5</td><td>2</td><td>Lean Methods</td><td>$2,000</td><td>5</td></tr>\n <tr><td>Farah Aziz</td><td>Operations</td><td>3</td><td>4</td><td>Project Management</td><td>$4,800</td><td>10</td></tr>\n <tr><td>Goran Petrov</td><td>Operations</td><td>7</td><td>3</td><td>Negotiation Skills</td><td>$1,900</td><td>3</td></tr></tbody></table>"},{"name":"Policy note","html":"<p><b>Professional development fund: cost sharing</b></p>\n <p>For an eligible employee, the company pays the full fee of any course that lasts 8 weeks or fewer. For a course that lasts longer than 8 weeks, the company pays 75 percent of the fee and the employee pays the remaining 25 percent.</p>\n <p>Exception: for an eligible employee whose most recent performance rating is 5, the company pays the full course fee regardless of the length of the course.</p>"}]},"DHS1":{"tabs":[{"name":"Request","html":"<p><b>Email from the logistics coordinator to the shipping analyst</b></p>\n <p>We have three consignments to send out from the central warehouse next week. All three will be picked up on Thursday.</p>\n <table class=\"dt\"><thead><tr><th>Consignment</th><th>Weight (kg)</th><th>Destination zone</th><th>Declared value</th><th>Must arrive within (days after pickup)</th></tr></thead><tbody>\n <tr><td>1</td><td>400</td><td>A</td><td>$30,000</td><td>3</td></tr>\n <tr><td>2</td><td>900</td><td>B</td><td>$60,000</td><td>5</td></tr>\n <tr><td>3</td><td>1,500</td><td>B</td><td>$25,000</td><td>10</td></tr></tbody></table>\n <p>Treat each consignment separately. A consignment goes, whole, to the carrier with the lowest total charge among the carriers whose transit time does not exceed the limit shown above. The total charge for a consignment is the pickup fee, plus the weight charge, plus any fuel surcharge, plus insurance where it is required.</p>\n <p>Any consignment with a declared value above $40,000 must be insured through the carrier that transports it, at that carrier's insurance rate. We do not insure other consignments.</p>"},{"name":"Carrier rates","html":"<table class=\"dt\"><thead><tr><th>Carrier</th><th>Pickup fee per consignment</th><th>Rate per kg, Zone A</th><th>Rate per kg, Zone B</th><th>Transit days, Zone A</th><th>Transit days, Zone B</th><th>Insurance (percent of declared value)</th></tr></thead><tbody>\n <tr><td>Northline</td><td>$120</td><td>$1.80</td><td>$2.40</td><td>2</td><td>4</td><td>0.5</td></tr>\n <tr><td>Castellan</td><td>$60</td><td>$2.00</td><td>$2.60</td><td>3</td><td>5</td><td>0.4</td></tr>\n <tr><td>Varga Freight</td><td>$200</td><td>$1.50</td><td>$2.00</td><td>4</td><td>7</td><td>0.6</td></tr>\n <tr><td>Delmar Express</td><td>$150</td><td>$2.50</td><td>$3.00</td><td>1</td><td>2</td><td>0.3</td></tr></tbody></table>"},{"name":"Carrier terms","html":"<p><b>Notes compiled by the shipping analyst from the carriers' published terms</b></p>\n <p><b>Volume discount.</b> Northline and Varga Freight reduce their rate per kilogram by 10 percent for any single consignment that weighs more than 1,000 kg, and the reduced rate applies to the entire weight of that consignment. Castellan and Delmar Express offer no volume discount.</p>\n <p><b>Fuel surcharge.</b> Northline, Varga Freight and Delmar Express add a fuel surcharge equal to 5 percent of the weight charge, that is, of the weight multiplied by the rate per kilogram after any volume discount. The surcharge is not applied to the pickup fee or to insurance. Castellan adds no fuel surcharge.</p>\n <p><b>Late-week pickups.</b> The transit times that Varga Freight quotes apply to consignments picked up on a Monday, Tuesday or Wednesday. For a pickup on a Thursday or Friday, Varga Freight's transit time is 2 days longer than quoted. The transit times of the other three carriers are the same for every pickup day.</p>"}]}}};

const GUESS = {mc:0.2, tpa:0.03, ta:0.125, gi:0.07};
const DISC = 1.25;
const prob = (q, t) => { const c = GUESS[q.type]; return c + (1-c)/(1+Math.exp(-DISC*(t-q.b))); };
function info(q, t){ const c = GUESS[q.type], p = prob(q,t); return DISC*DISC*((1-p)/p)*Math.pow((p-c)/(1-c),2); }
// Expected a posteriori ability with a standard normal prior. resp: [{q, r}] r = 1 right, 0 wrong, -1 unanswered.
function eap(resp, sd){ sd = sd || 1;
  let num=0, den=0;
  for (let t=-4; t<=4.0001; t+=0.05){
    let l = Math.exp(-t*t/(2*sd*sd));
    for (const {q,r} of resp){ const p = r===-1 ? 1/(1+Math.exp(-DISC*(t-q.b))) : prob(q,t); l *= r===1 ? p : 1-p; }
    num += t*l; den += l;
  }
  return den ? num/den : 0;
}

function weightedPick(cands, score, rnd){
  const top = cands.map(c => [c, score(c)]).sort((a,b) => b[1]-a[1]).slice(0,2);
  const tot = top.reduce((s,x) => s+x[1], 0); let r = rnd()*tot;
  for (const [c,w] of top){ r -= w; if (r <= 0) return c; } return top[0][0];
}

function pickNext(k, path, theta, seen, rnd){

    return g.map(q => q.id); };
  if (k==='Q'){
    const cnt = {NP:0, RP:0, WP:0}; path.forEach(id => cnt[qGroup(ITEM[id])]++);
    let c = pool.filter(q => cnt[qGroup(q)] < Q_QUOTA[qGroup(q)]);
    const last = path.length ? ITEM[path[path.length-1]].sub : ''; const c2 = c.filter(q => q.sub !== last);
    return single(c2.length ? c2 : c);
  }
  if (k==='V'){
    const stims = []; let cr = 0; path.forEach(id => { const q = ITEM[id]; if (q.stim){ if (!stims.includes(q.stim)) stims.push(q.stim); } else cr++; });
    const slot = V_PLAN[cr + stims.length] || 'CR';
    if (slot==='P' && stims.length < 4){
      const size = (s) => BANK.items.filter(q => q.stim===s).length;
      const fours = stims.filter(s => size(s)===4).length;
      const c = pool.filter(q => q.stim && !stims.includes(q.stim) && (fours < 2 || size(q.stim)===3));
      return set(c);
    }
    return single(pool.filter(q => !q.stim));
  }
  const slot = D_PLAN[path.length];
  if (slot==='MSR') return set(pool.filter(q => q.kind==='Multi-Source Reasoning'));
  return single(pool.filter(q => q.kind===slot));
}
/* ---------- scoring ---------- */
const PCT = {
 Q:[[60,1],[65,5],[68,10],[70,15],[72,21],[74,29],[76,40],[78,52],[80,66],[82,76],[84,85],[86,92],[88,95],[89,97],[90,100]],
 V:[[60,1],[66,2],[70,6],[72,10],[74,17],[76,27],[78,42],[80,60],[82,79],[84,91],[86,97],[88,99],[90,100]],
 D:[[60,4],[64,7],[68,15],[70,21],[72,30],[74,41],[76,54],[78,70],[80,84],[82,92],[84,97],[86,99],[90,100]],
 T:[[205,0],[305,2],[355,4],[405,8],[455,16],[505,28],[545,44],[575,59],[605,71],[625,79],[645,87],[655,91],[675,95],[695,97],[705,98],[735,99],[775,100],[805,100]]
};
function pct(tab, v){ const t = PCT[tab]; if (v<=t[0][0]) return t[0][1]; for (let i=1;i<t.length;i++) if (v<=t[i][0]){ const [a,pa]=t[i-1],[b,pb]=t[i]; return Math.round(pa+(pb-pa)*(v-a)/(b-a)); } return 100; }
function phi(z){ const t = 1/(1+0.2316419*Math.abs(z)); const d = 0.3989423*Math.exp(-z*z/2); const p = d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274)))); return z>0 ? 1-p : p; }
// Ability -> percentile among test takers -> the section score that sits at that percentile.
function scaleScore(k, theta){ const p = phi(theta*SPREAD)*100, t = PCT[k]; if (p >= 99.6) return 90; if (p<=t[0][1]) return 60;
  for (let i=1;i<t.length;i++) if (p<=t[i][1]){ const [a,pa]=t[i-1],[b,pb]=t[i]; return Math.round(a+(b-a)*(p-pa)/(pb-pa)); } return 90; }
const SPREAD = 1.18;
const totalScore = (sum) => 205 + 10*Math.round((sum-180)*2/3);

/* ---------- state ---------- */
const $ = (s) => document.querySelector(s);
let app, S, ticker = null;
let ui = {confirm:null, calc:false, wb:false, tab:0, sort:-1, open:{}, hideTimer:false};
function fresh(){ return {phase:'home', order:'QVD', secIdx:0, qIdx:0, answers:{}, times:{}, marks:{}, remaining:0, path:{Q:[],V:[],D:[]}, queue:[], thetaLog:{Q:[],V:[],D:[]},
  breakUsed:false, breakRemaining:0, reviewBase:null, reviewing:false, ended:{}, finishedAt:null}; }
function lsGet(k){ try { const r = localStorage.getItem(k); return r ? JSON.parse(r) : null; } catch(e){ return null; } }
function lsSet(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
const save = () => lsSet(KEY, S);
const secKey = () => S.order[S.secIdx];
const sec = () => SECTIONS[secKey()];
const items = (k) => S.path[k || secKey()].map(id => ITEM[id]);
const curQ = () => items()[S.qIdx];
const fmt = (t) => { t = Math.max(0, Math.round(t)); const m = Math.floor(t/60), s = t%60; return (m<10?'0':'')+m+':'+(s<10?'0':'')+s; };
const esc = (s) => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
function parts(q){ return q.type==='mc' ? 1 : q.type==='tpa' ? 2 : q.type==='ta' ? q.stmts.length : q.blanks.length; }
function complete(q){ const a = S.answers[q.id]; if (q.type==='mc') return Number.isInteger(a);
  return Array.isArray(a) && a.length===parts(q) && a.every(v => Number.isInteger(v)); }
function correct(q){ const a = S.answers[q.id]; if (!complete(q)) return false;
  return q.type==='mc' ? a===q.ans : a.every((v,i) => v===q.ans[i]); }
const responses = (k) => items(k).map(q => ({q, r: correct(q) ? 1 : complete(q) ? 0 : -1}));

/* ---------- timer ---------- */
function startTicker(){ stopTicker(); ticker = setInterval(tick, 1000); }
function stopTicker(){ if (ticker) clearInterval(ticker); ticker = null; }
function tick(){
  // Wall-clock timing: a throttled background tab still loses the right amount of time.
  // Gaps over 90 seconds (laptop asleep, browser closed) are treated as an interruption and not charged.
  const now = Date.now(); let dt = Math.round((now - (S.lastTs || now))/1000); if (dt < 1) return; S.lastTs = now; if (dt > 90) dt = 1;
  if (S.phase==='q' || S.phase==='review'){
    const before = S.remaining; S.remaining -= dt;
    if (S.phase==='q'){ const id = curQ().id; S.times[id] = (S.times[id]||0) + dt; }
    if (S.remaining <= 0){ S.remaining = 0; endSection(true); return; }
    save();
    if (before > 300 && S.remaining <= 300){ ui.hideTimer = false; flash('5 minutes remaining in this section.'); if (S.phase==='review') render(); else { const el = $('#timer'); if (el){ el.textContent = fmt(S.remaining); el.classList.add('low'); } const f = $('#toast'); if (f){ f.textContent = '5 minutes remaining in this section.'; f.hidden = false; setTimeout(() => { f.hidden = true; }, 6000); } flashMsg=''; } return; }
    const el = $('#timer'); if (el){ el.textContent = ui.hideTimer ? 'Show time' : fmt(S.remaining); el.classList.toggle('low', S.remaining <= 300); }
  } else if (S.phase==='break'){
    S.breakRemaining -= dt;
    if (S.breakRemaining <= 0){ beginSection(); return; }
    save();
    const el = $('#btimer'); if (el) el.textContent = fmt(S.breakRemaining);
  }
}

/* ---------- flow ---------- */
function startExam(){ S = fresh(); S.order = ui.mode==='full' ? 'QVD' : ui.mode; S.phase = 'secintro'; WB.strokes = []; lsSet(WBKEY, []); save(); render(); }
function administer(){
  const k = secKey();
  if (!S.queue.length){ const th = eap(responses(k), 1.5); S.queue = pickNext(k, S.path[k], th, lsGet(SEENKEY) || {}, Math.random); }
  const id = S.queue.shift(); S.path[k].push(id);
  const seen = lsGet(SEENKEY) || {}; seen[id] = 1; lsSet(SEENKEY, seen);
}
function beginSection(){ const k = secKey(); S.path[k] = []; S.queue = []; S.thetaLog[k] = []; administer(); S.phase='q'; S.qIdx=0; S.remaining = sec().minutes*60; S.lastTs = Date.now(); S.reviewBase=null; S.reviewing=false; ui.calc=false; ui.hideTimer=false; save(); startTicker(); render(); }
function next(){
  const k = secKey();
  if (S.reviewing){ S.phase='review'; S.reviewing=false; save(); render(); return; }
  S.thetaLog[k].push(Math.round(eap(responses(k))*100)/100);
  if (S.path[k].length < sec().n){ administer(); S.qIdx++; S.phase='q'; }
  else { S.phase='review'; S.reviewBase = {}; items().forEach(q => S.reviewBase[q.id] = JSON.stringify(S.answers[q.id] ?? null)); }
  ui.tab=0; ui.sort=-1; save(); render();
}
function editedIds(){ if (!S.reviewBase) return []; return items().filter(q => JSON.stringify(S.answers[q.id] ?? null) !== S.reviewBase[q.id]).map(q => q.id); }
function endSection(timeout){
  stopTicker(); S.ended[secKey()] = timeout ? 'time' : 'done'; ui.confirm=null; ui.calc=false;
  if (S.secIdx < S.order.length-1){ S.phase='between'; } else { S.phase='results'; S.finishedAt = Date.now(); ui.wb=false; logAttempt(); }
  save(); render();
}
const HISTKEY = 'gmat-adaptive-history';
function logAttempt(){ const h = lsGet(HISTKEY) || []; const sc = {}; let sum = 0; for (const k of S.order){ sc[k] = estimate(k).scaled; sum += sc[k]; }
  h.push({at:S.finishedAt, order:S.order, sc, total: S.order.length===3 ? totalScore(sum) : null}); lsSet(HISTKEY, h.slice(-30)); }
function storageOK(){ try { localStorage.setItem('gmat-probe','1'); localStorage.removeItem('gmat-probe'); return true; } catch(e){ return false; } }
function afterBetween(takeBreak){
  S.secIdx++;
  if (takeBreak){ S.breakUsed = true; S.phase='break'; S.breakRemaining = 600; S.lastTs = Date.now(); save(); startTicker(); render(); }
  else { S.phase='secintro'; save(); render(); }
}
function setAns(q, idx, val){
  if (S.reviewing){ const ed = editedIds();
    if (ed.length >= MAX_EDITS && !ed.includes(q.id)){ flash('You have already changed ' + MAX_EDITS + ' answers in this section. To change this one, first restore one of the others.'); return false; } }
  if (q.type==='mc') S.answers[q.id] = val;
  else { const a = Array.isArray(S.answers[q.id]) ? S.answers[q.id].slice() : new Array(parts(q)).fill(null); a[idx] = val; S.answers[q.id] = a; }
  save(); const nb = $('#nextbtn'); if (nb) nb.disabled = !complete(q);
}
let flashMsg = ''; function flash(m){ flashMsg = m; }

/* ---------- stimulus and answer rendering ---------- */
function tableHTML(t, interactive){
  let rows = t.rows.slice();
  if (interactive && ui.sort >= 0) rows.sort((a,b) => typeof a[ui.sort]==='number' ? a[ui.sort]-b[ui.sort] : String(a[ui.sort]).localeCompare(String(b[ui.sort])));
  const sorter = interactive ? `<label class="sorter">Sort by <select id="sortsel"><option value="-1">Select</option>${t.cols.map((c,i)=>`<option value="${i}" ${ui.sort===i?'selected':''}>${c}</option>`).join('')}</select></label>` : '';

    rows.map(r=>`<tr>${r.map(v=>`<td>${typeof v==='number'?v.toLocaleString('en-US'):v}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function chartSVG(c){
  const W=640,H=400,L=64,R=20,T=44,B=c.kind==='scatter'||c.xLabel?64:48, pw=W-L-R, ph=H-T-B;
  const y = (v) => T + ph - (v-c.y.min)/(c.y.max-c.y.min)*ph;
  let g = `<text x="${L}" y="20" class="ct">${c.title}</text>`;
  for (let v=c.y.min; v<=c.y.max+1e-9; v+=c.y.step){ g += `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" class="grid"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" class="tk">${Math.round(v*100)/100}</text>`; }
  g += `<text transform="translate(16 ${T+ph/2}) rotate(-90)" text-anchor="middle" class="ax">${c.y.label}</text>`;
  g += `<line x1="${L}" x2="${W-R}" y1="${y(c.y.min)}" y2="${y(c.y.min)}" class="axis"/><line x1="${L}" x2="${L}" y1="${T}" y2="${T+ph}" class="axis"/>`;
  const legend = (names) => names.map((n,i)=>`<g transform="translate(${L+i*150} 28)"><rect width="12" height="12" class="s${i}"/><text x="18" y="11" class="tk">${n}</text></g>`).join('');
  if (c.kind==='scatter'){
    const x = (v) => L + (v-c.x.min)/(c.x.max-c.x.min)*pw;
    for (let v=c.x.min; v<=c.x.max+1e-9; v+=c.x.step){ g += `<line x1="${x(v)}" x2="${x(v)}" y1="${T}" y2="${T+ph}" class="grid"/><text x="${x(v)}" y="${T+ph+18}" text-anchor="middle" class="tk">${Math.round(v*100)/100}</text>`; }
    g += `<text x="${L+pw/2}" y="${H-12}" text-anchor="middle" class="ax">${c.x.label}</text>`;
    g += `<line x1="${x(c.line[0][0])}" y1="${y(c.line[0][1])}" x2="${x(c.line[1][0])}" y2="${y(c.line[1][1])}" class="trend"/>`;
    g += c.pts.map(p=>`<circle cx="${x(p[0])}" cy="${y(p[1])}" r="5" class="dot"/>`).join('');
    g += `<g transform="translate(${L} 28)"><line x1="0" x2="16" y1="6" y2="6" class="trend"/><text x="22" y="10" class="tk">${c.lineLabel||'Trend line'}</text></g>`;
  } else {
    const n = c.cats.length, bw = pw/n;
    c.cats.forEach((k,i)=>{ g += `<text x="${L+bw*(i+.5)}" y="${T+ph+18}" text-anchor="middle" class="tk">${k}</text>`; });
    if (c.xLabel) g += `<text x="${L+pw/2}" y="${H-12}" text-anchor="middle" class="ax">${c.xLabel}</text>`;
    if (c.kind==='bar'){
      const m = c.series.length, w = Math.min(46, bw*0.7/m);
      c.series.forEach((s,si)=> s.v.forEach((v,i)=>{ const x0 = L+bw*(i+.5) - m*w/2 + si*w; g += `<rect x="${x0+1}" y="${y(v)}" width="${w-2}" height="${y(c.y.min)-y(v)}" class="s${si}"/>`; }));
    } else {
      c.series.forEach((s,si)=>{ g += `<polyline fill="none" points="${s.v.map((v,i)=>`${L+bw*(i+.5)},${y(v)}`).join(' ')}" class="ln l${si}"/>` + s.v.map((v,i)=>`<circle cx="${L+bw*(i+.5)}" cy="${y(v)}" r="4.5" class="s${si}"/>`).join(''); });
    }
    if (c.series.length>1) g += legend(c.series.map(s=>s.name));
  }
  return `<div class="scrollx"><svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="${esc(c.title)}">${g}</svg></div>`;
}
function stimHTML(q, interactive){

    return show ? `${sel}<span class="res ${a&&a[k]===q.ans[k]?'ok':'no'}">${a&&a[k]===q.ans[k]?'Correct':'Answer: '+q.blanks[k][q.ans[k]]}</span>` : sel; })}</p>`;

  `<div class="toast" id="toast" role="status" hidden></div><div class="main ${split?'split':''}">${split?`<div class="stim">${stimHTML(q,true)}</div>`:''}<div class="qcol">${msg}<div class="qbody"><div class="stem">${q.stem}</div>${answerHTML(q,false,false)}</div></div></div>
  <div class="bar bottom"><label class="bm"><input type="checkbox" id="bm" ${S.marks[q.id]?'checked':''}> Bookmark for review</label>
  ${S.reviewing?`<span class="edits">Answers changed: ${ed.length} of ${MAX_EDITS}</span>`:''}
  <button class="primary" id="nextbtn" ${complete(q)?'':'disabled'}>${S.reviewing?'Return to review':'Next'}</button></div>
  ${ui.calc?calcHTML():''}`;
}
function dialog(t, m, yes, id){ return `<div class="veil"><div class="dlg" role="dialog" aria-modal="true"><h3>${t}</h3><p>${m}</p><div class="dbtn"><button class="ghost" id="dno">Cancel</button><button class="primary" id="${id}">${yes}</button></div></div></div>`; }
function review(){
  const its = items(), ed = editedIds();
  const msg = flashMsg ? `<div class="flash" role="alert">${flashMsg}</div>` : ''; flashMsg='';
  return topbar('<span class="qn">Question Review and Edit</span>') + `<div class="main"><div class="page inpage">${msg}<h2>Review your answers</h2>
  <p>Open any question to look at it again. You can change up to ${MAX_EDITS} answers. You have changed <b>${ed.length}</b>. The clock is still running.</p>
  <div class="rgrid">${its.map((q,i)=>`<button class="rq ${S.marks[q.id]?'marked':''} ${ed.includes(q.id)?'edited':''}" data-go="${i}"><span class="num">${i+1}</span><span class="st">${ed.includes(q.id)?'Changed':(S.marks[q.id]?'Bookmarked':'Answered')}</span></button>`).join('')}</div></div></div>
  <div class="bar bottom"><span></span><button class="primary" id="endsec">End section</button></div>
  ${ui.confirm==='end'?dialog('End this section?','You will not be able to return to it. Any time left on the clock is lost.','End section','cend'):''}`;
}
function between(){
  const prev = SECTIONS[secKey()], nx = SECTIONS[S.order[S.secIdx+1]];
  const why = S.ended[secKey()]==='time' ? 'Time expired.' : 'Section complete.';
  return `<div class="page narrow"><p class="eyebrow">${why}</p><h1>${prev.short} is finished</h1><p class="lead">Next: ${nx.name}.</p>
  ${S.breakUsed ? '<p>You have already used your break.</p>' : '<p>You may take your one optional 10-minute break now. If you skip it here after the first section, you can still take it after the second.</p>'}
  <div class="row">${S.breakUsed?'':'<button class="ghost big" id="takebreak">Take the 10-minute break</button>'}<button class="primary big" id="skipbreak">Continue to ${nx.short}</button></div></div>`;
}
function breakScreen(){
  return `<div class="page narrow center"><p class="eyebrow">Optional break</p><div class="bigtime" id="btimer">${fmt(S.breakRemaining)}</div><p>The next section starts on its own when the break ends, and its clock starts immediately.</p><button class="primary big" id="endbreak">End break and continue</button></div>`;
}

/* ---------- results ---------- */
function estimate(k){
  const its = items(k), n = SECTIONS[k].n, resp = responses(k);
  const un = resp.filter(x => x.r===-1).length + (n - its.length);
  for (let i=its.length; i<n; i++) resp.push({q:{b:-1, type:'mc'}, r:-1});
  const theta = (its.length ? eap(resp) : -3) - STRICT - 0.12*un;
  return {theta, scaled: scaleScore(k, theta), right: its.filter(correct).length, n, un};
}
const ord = (n) => n + (n%100>=11&&n%100<=13 ? 'th' : ['th','st','nd','rd','th','th','th','th','th','th'][n%10]);
const diff = (b) => b < -0.6 ? 'Easy' : b < 0.5 ? 'Medium' : b < 1.3 ? 'Hard' : 'Very hard';
function pathChart(k){
  const its = items(k); if (!its.length) return '';
  const W=640,H=150,L=70,R=10,T=12,B=22, pw=W-L-R, ph=H-T-B, n=SECTIONS[k].n;
  const x = (i) => L + (i+0.5)*pw/n, y = (b) => T + ph - (Math.max(-2,Math.min(2.6,b))+2)/4.6*ph;
  let g = [['Easy',-1.3],['Medium',0],['Hard',0.9],['Very hard',2]].map(([t,b])=>`<line x1="${L}" x2="${W-R}" y1="${y(b)}" y2="${y(b)}" class="grid"/><text x="${L-8}" y="${y(b)+4}" text-anchor="end" class="tk">${t}</text>`).join('');
  g += `<polyline fill="none" class="ln l0" points="${its.map((q,i)=>`${x(i)},${y(q.b)}`).join(' ')}"/>`;
  g += its.map((q,i)=>`<circle cx="${x(i)}" cy="${y(q.b)}" r="5" class="${correct(q)?'pok':'pno'}"/><text x="${x(i)}" y="${H-6}" text-anchor="middle" class="tk">${i+1}</text>`).join('');
  return `<div class="scrollx"><svg viewBox="0 0 ${W} ${H}" class="chart path" role="img" aria-label="Difficulty of each question served">${g}</svg></div><p class="hint">Difficulty of each question you were served. Filled dots are correct answers, hollow dots are misses.</p>`;
}
function skillTable(){
  if (!S.order.includes('Q') || !items('Q').length) return '';
  const g = {}; for (const q of items('Q')){ const k = q.topic+'|'+q.sub; (g[k] = g[k] || {r:0,n:0,t:0,b:0}); g[k].n++; g[k].t += S.times[q.id]||0; g[k].b += q.b; if (correct(q)) g[k].r++; }
  const rows = Object.entries(g).sort((a,b) => (a[1].r/a[1].n)-(b[1].r/b[1].n) || a[0].localeCompare(b[0]));
  return `<section><h2>Quant by skill</h2><p class="hint">Weakest first. Level is the average difficulty of the questions you were served on that skill.</p><div class="scrollx"><table class="dt rt"><thead><tr><th>Topic</th><th>Skill</th><th>Correct</th><th>Level</th><th>Average time</th></tr></thead><tbody>${rows.map(([k,v])=>`<tr class="${v.r<v.n?'miss':''}"><td>${k.split('|')[0]}</td><td>${k.split('|')[1]}</td><td>${v.r} of ${v.n}</td><td>${diff(v.b/v.n)}</td><td>${fmt(v.t/v.n)}</td></tr>`).join('')}</tbody></table></div></section>`;
}
function results(){
  const full = S.order.length===3, SECS = full ? 'QVD' : S.order; const R = {}; let sum = 0; for (const k of SECS){ R[k] = estimate(k); sum += R[k].scaled; }
  const total = totalScore(sum);
  const groups = {};
  for (const k of SECS) for (const q of items(k)){ const key = SECTIONS[k].short+': '+(k==='Q'?q.topic:q.kind); (groups[key] = groups[key] || {r:0,n:0,t:0}); groups[key].n++; groups[key].t += S.times[q.id]||0; if (correct(q)) groups[key].r++; }
  const secCard = (k) => { const r = R[k], s = SECTIONS[k]; return `<div class="sc"><span class="scn">${s.short}</span><span class="scv">${r.scaled}<i> / 90</i></span><span class="scp">${ord(pct(k,r.scaled))} percentile</span><span class="scd">${r.right} of ${r.n} correct${r.un?`, ${r.un} unanswered`:''}</span><span class="track"><i style="width:${(r.scaled-60)/30*100}%"></i></span></div>`; };
  const rows = (k) => items(k).map((q,i)=>{ const ok = correct(q), t = S.times[q.id]||0, open = ui.open[q.id];
    return `<tr class="${ok?'':'miss'}"><td>${i+1}</td><td>${q.kind==='Problem Solving'?q.topic:q.kind}<small>${q.sub}</small></td><td>${diff(q.b)}</td><td><span class="pill ${ok?'ok':(complete(q)?'no':'un')}">${ok?'Correct':(complete(q)?'Wrong':'Unanswered')}</span></td><td class="${t>180?'slow':''}">${fmt(t)}</td><td><button class="link" data-open="${q.id}">${open?'Hide':'Review'}</button></td></tr>` +
    (open?`<tr class="detail"><td colspan="6"><div class="dwrap">${q.stim?`<div class="stim flat">${stimHTML(q,false)}</div>`:''}<div class="stem">${q.stem}</div>${answerHTML(q,true,true)}<div class="expl"><b>Explanation</b><p>${q.expl}</p></div></div></td></tr>`:''); }).join('');
  return `<div class="page"><header class="hero"><p class="eyebrow">Unofficial score report</p><h1>${full ? 'Estimated total score' : 'Estimated '+SECTIONS[SECS].short+' score'}</h1>
  ${full ? `<div class="total"><span class="tv">${total}<i> / 805</i></span><span class="tp">${ord(pct('T',total))} percentile<small>Score ${total} out of a maximum 805 (scale 205 to 805). Likely range ${Math.max(205,total-30)} to ${Math.min(805,total+30)}.</small></span></div>`
   : `<div class="total"><span class="tv">${R[SECS].scaled}<i> / 90</i></span><span class="tp">${ord(pct(SECS,R[SECS].scaled))} percentile<small>Score ${R[SECS].scaled} out of a maximum 90 (section scale 60 to 90). Likely range ${Math.max(60,R[SECS].scaled-2)} to ${Math.min(90,R[SECS].scaled+2)}. ${R[SECS].right} of ${R[SECS].n} correct${R[SECS].un?', '+R[SECS].un+' unanswered':''}. No total score is given for a single section.</small></span></div>`}</header>
  ${full ? `<div class="scs">${SECS.split('').map(secCard).join('')}</div>` : ''}${skillTable()}
  <section><h2>Accuracy and pace by area</h2><div class="scrollx"><table class="dt rt"><thead><tr><th>Area</th><th>Correct</th><th>Average time</th></tr></thead><tbody>${Object.entries(groups).map(([k,g])=>`<tr><td>${k}</td><td>${g.r} of ${g.n}</td><td>${fmt(g.t/g.n)}</td></tr>`).join('')}</tbody></table></div></section>
  ${SECS.split('').map(k=>`<section><h2>${SECTIONS[k].name}</h2>${pathChart(k)}<p class="hint">Target pace is about ${k==='Q'?'2:09':k==='V'?'1:57':'2:15'} per question. Times over 3:00 are highlighted.</p><div class="scrollx"><table class="dt rt"><thead><tr><th>#</th><th>Type</th><th>Level</th><th>Result</th><th>Time</th><th></th></tr></thead><tbody>${rows(k)}</tbody></table></div></section>`).join('')}
  <section class="note"><h2>Reading this score</h2><p>On an adaptive test the score depends on how hard the questions you answered correctly were, not on the count alone, so two people with the same number correct can score differently. Section scores come from your estimated ability mapped to the official 60 to 90 scale through published percentile tables, then marked down slightly so the result is conservative. The total weights the three sections equally, as the real exam does. A new attempt serves questions you have not seen first, but the bank is small enough that some will repeat by a third attempt.</p>
  <div class="row">${ui.confirm==='reset'?'<span>Erase this attempt and start again?</span><button class="ghost" id="dno">Keep it</button><button class="primary" id="creset">Erase and restart</button>':'<button class="ghost" id="reset">Start a new attempt</button>'}</div></section></div>`;
}

/* ---------- calculator ---------- */
let C = {d:'0', acc:null, op:null, fresh:true, mem:0};
function calcHTML(){ const k = ['MC','MR','M+','C','7','8','9','÷','4','5','6','×','1','2','3','−','0','.','±','+','√','%','1/x','='];
  return `<div class="calc" role="group" aria-label="Calculator"><div class="chead"><span>Calculator</span><button class="link" id="calcx">Close</button></div><div class="cdisp" id="cdisp">${C.d}</div><div class="ckeys">${k.map(x=>`<button data-k="${x}" class="${/[0-9.]/.test(x)&&x.length===1?'':'fn'}">${x}</button>`).join('')}</div></div>`; }
function calcKey(k){
  const v = parseFloat(C.d); const show = (n) => { C.d = Number.isFinite(n) ? String(parseFloat(n.toPrecision(12))) : 'Error'; };
  const apply = () => { if (C.op==null || C.acc==null) return v; return C.op==='+'?C.acc+v : C.op==='−'?C.acc-v : C.op==='×'?C.acc*v : C.acc/v; };
  if (/^[0-9]$/.test(k)){ C.d = C.fresh || C.d==='0' ? k : C.d+k; C.fresh=false; }
  else if (k==='.'){ if (C.fresh){ C.d='0.'; C.fresh=false; } else if (!C.d.includes('.')) C.d+='.'; }
  else if (k==='C'){ C.d='0'; C.acc=null; C.op=null; C.fresh=true; }
  else if (k==='±') show(-v);
  else if (k==='√'){ show(Math.sqrt(v)); C.fresh=true; }
  else if (k==='1/x'){ show(1/v); C.fresh=true; }
  else if (k==='%'){ show(C.acc!=null ? C.acc*v/100 : v/100); C.fresh=true; }
  else if (k==='MC') C.mem=0; else if (k==='MR'){ show(C.mem); C.fresh=true; } else if (k==='M+'){ C.mem += v; C.fresh=true; }
  else if (k==='='){ const r = apply(); show(r); C.acc=null; C.op=null; C.fresh=true; }
  else { if (C.op && !C.fresh){ const r = apply(); show(r); C.acc = r; } else C.acc = parseFloat(C.d); C.op = k; C.fresh=true; }
  const el = $('#cdisp'); if (el) el.textContent = C.d;
}

/* ---------- whiteboard: persists across questions and sections, like the online exam's board ---------- */
const WB = { strokes:[], tool:'pen', el:null, cv:null, cur:null, big:false,
  mount(){
    const want = ui.wb && (S.phase==='q' || S.phase==='review');
    if (!want){ if (this.el){ this.el.remove(); this.el = null; } return; }
    if (this.el && document.body.contains(this.el)) return;
    const d = document.createElement('div'); d.className = 'wb' + (this.big?' big':''); d.innerHTML =
      `<div class="chead"><span title="Drag to move">Whiteboard</span><span class="wbt"><button data-t="pen" class="on">Pen</button><button data-t="text">Text</button><button data-t="erase">Eraser</button><button data-a="undo">Undo</button><button data-a="clear">Clear</button><button data-a="size">Resize</button><button data-a="close">Close</button></span></div><div class="wbwrap"><canvas></canvas></div>`;
    document.body.appendChild(d); this.el = d; this.cv = d.querySelector('canvas'); this.fit();
    d.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { this.tool = b.dataset.t; d.querySelectorAll('[data-t]').forEach(x => x.classList.toggle('on', x===b)); });
    d.querySelector('[data-a=undo]').onclick = () => { this.strokes.pop(); this.draw(); this.save(); };
    d.querySelector('[data-a=clear]').onclick = () => { this.strokes = []; this.draw(); this.save(); };
    d.querySelector('[data-a=size]').onclick = () => { this.big = !this.big; d.style.left = d.style.top = d.style.bottom = ''; d.classList.toggle('big', this.big); this.fit(); };
    d.querySelector('[data-a=close]').onclick = () => { ui.wb = false; this.mount(); const b = $('#wbbtn'); if (b) b.setAttribute('aria-pressed','false'); };
    const cv = this.cv, pos = (e) => { const r = cv.getBoundingClientRect(); return [(e.clientX-r.left)/r.width, (e.clientY-r.top)/r.height]; };
    cv.onpointerdown = (e) => { e.preventDefault();
      if (this.tool==='text') return;
      cv.setPointerCapture(e.pointerId); this.cur = {t:this.tool, p:[pos(e)]}; this.strokes.push(this.cur); };
    cv.onpointermove = (e) => { if (!this.cur) return; this.cur.p.push(pos(e)); this.draw(); };
    cv.onclick = (e) => { if (this.tool==='text') this.textAt(e, pos(e)); };
    const hd = d.querySelector('.chead'); let drag = null;
    hd.onpointerdown = (e) => { if (e.target.closest('button') || this.big) return; const r = d.getBoundingClientRect(); drag = [e.clientX-r.left, e.clientY-r.top]; hd.setPointerCapture(e.pointerId); };
    hd.onpointermove = (e) => { if (!drag) return; d.style.left = Math.max(0, Math.min(window.innerWidth-80, e.clientX-drag[0]))+'px'; d.style.top = Math.max(0, Math.min(window.innerHeight-40, e.clientY-drag[1]))+'px'; d.style.bottom = 'auto'; };
    hd.onpointerup = () => { drag = null; };
    cv.onpointerup = cv.onpointercancel = () => { if (this.cur){ this.cur = null; this.save(); } };
  },
  textAt(e, p){ const wrap = this.el.querySelector('.wbwrap'), r = wrap.getBoundingClientRect(); const inp = document.createElement('input'); inp.className = 'wbinput'; inp.setAttribute('aria-label','Whiteboard text');
    inp.style.left = (e.clientX-r.left)+'px'; inp.style.top = (e.clientY-r.top-12)+'px'; wrap.appendChild(inp); inp.focus();
    let fin = false; const done = () => { if (fin) return; fin = true; if (inp.value.trim()){ this.strokes.push({t:'text', p:[p], s:inp.value}); this.draw(); this.save(); } inp.remove(); };
    inp.onkeydown = (ev) => { if (ev.key==='Enter') done(); if (ev.key==='Escape'){ inp.value=''; done(); } }; inp.onblur = done; },
  fit(){ const cv = this.cv, r = cv.parentElement.getBoundingClientRect(), dpr = window.devicePixelRatio || 1; cv.width = r.width*dpr; cv.height = r.height*dpr; this.draw(); },
  draw(){ const cv = this.cv; if (!cv) return; const x = cv.getContext('2d'), W = cv.width, H = cv.height, dpr = window.devicePixelRatio || 1; x.clearRect(0,0,W,H);
    const ink = getComputedStyle(document.documentElement).getPropertyValue('--ink').trim() || '#111';
    for (const s of this.strokes){
      if (s.t==='text'){ x.globalCompositeOperation='source-over'; x.fillStyle = ink; x.font = (16*dpr)+'px IBM Plex Sans, sans-serif'; x.fillText(s.s, s.p[0][0]*W, s.p[0][1]*H); continue; }
      x.globalCompositeOperation = s.t==='erase' ? 'destination-out' : 'source-over'; x.strokeStyle = ink; x.lineWidth = (s.t==='erase'?22:2.2)*dpr; x.lineCap = x.lineJoin = 'round';
      x.beginPath(); s.p.forEach((p,i) => i ? x.lineTo(p[0]*W,p[1]*H) : x.moveTo(p[0]*W,p[1]*H)); if (s.p.length===1) x.lineTo(s.p[0][0]*W+0.1, s.p[0][1]*H); x.stroke(); }
    x.globalCompositeOperation='source-over'; },
  save(){ lsSet(WBKEY, this.strokes.slice(-400)); }
};

/* ---------- events ---------- */
function bind(){
  const on = (sel, ev, fn) => document.querySelectorAll(sel).forEach(el => el.addEventListener(ev, fn));
  on('input[name=order]','change', e => ui.order = e.target.value);
  on('input[name=mode]','change', e => { ui.mode = e.target.value; const y = window.scrollY; render(); window.scrollTo(0,y); });
  on('#start','click', startExam);
  on('#begin','click', beginSection);
  on('#bm','change', e => { S.marks[curQ().id] = e.target.checked; save(); });
  const upd = () => { const el = $('.edits'); if (el) el.textContent = 'Answers changed: ' + editedIds().length + ' of ' + MAX_EDITS; };
  on('.qbody input[type=radio]','change', e => { if (setAns(curQ(), e.target.dataset.p!=null ? +e.target.dataset.p : 0, +e.target.value)===false) render(); else upd(); });
  on('.qbody select','change', e => { if (setAns(curQ(), +e.target.dataset.p, e.target.value===''?null:+e.target.value)===false) render(); else upd(); });
  on('#nextbtn','click', () => { if (complete(curQ())) next(); });
  on('#dno','click', () => { ui.confirm=null; render(); });
  on('.tab','click', e => { ui.tab = +e.currentTarget.dataset.tab; rerenderStim(); });
  on('#sortsel','change', e => { ui.sort = +e.target.value; rerenderStim(); });
  on('.rq','click', e => { S.qIdx = +e.currentTarget.dataset.go; S.reviewing = true; S.phase='q'; ui.tab=0; ui.sort=-1; save(); render(); });
  on('#endsec','click', () => { ui.confirm='end'; render(); });
  on('#cend','click', () => endSection(false));
  on('#takebreak','click', () => afterBetween(true));
  on('#skipbreak','click', () => afterBetween(false));
  on('#endbreak','click', beginSection);
  on('#timer','click', () => { ui.hideTimer = !ui.hideTimer; const el = $('#timer'); el.textContent = ui.hideTimer ? 'Show time' : fmt(S.remaining); });
  on('#wbbtn','click', e => { ui.wb = !ui.wb; e.currentTarget.setAttribute('aria-pressed', ui.wb); WB.mount(); });
  on('#calcbtn','click', () => { ui.calc = !ui.calc; render(); });
  on('#calcx','click', () => { ui.calc = false; render(); });
  on('.ckeys button','click', e => calcKey(e.currentTarget.dataset.k));
  on('[data-open]','click', e => { const id = e.currentTarget.dataset.open; ui.open[id] = !ui.open[id]; const y = window.scrollY; render(); window.scrollTo(0,y); });
  on('#reset','click', () => { ui.confirm='reset'; const y = window.scrollY; render(); window.scrollTo(0,y); });
  on('#creset','click', () => { ui = {confirm:null, calc:false, wb:false, tab:0, sort:-1, open:{}, hideTimer:false}; S = fresh(); save(); render(); });
}
function rerenderStim(){ const el = $('.stim'); if (!el) return; el.innerHTML = stimHTML(curQ(), true);
  el.querySelectorAll('.tab').forEach(t => t.addEventListener('click', e => { ui.tab = +e.currentTarget.dataset.tab; rerenderStim(); }));
  const s = $('#sortsel'); if (s) s.addEventListener('change', e => { ui.sort = +e.target.value; rerenderStim(); }); }

if (typeof window !== 'undefined' && typeof document !== 'undefined' && document.getElementById){
  app = $('#app'); S = lsGet(KEY) || fresh(); if (!S.path) S = fresh(); S.lastTs = Date.now(); WB.strokes = lsGet(WBKEY) || [];
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && /gmat-test/.test(location.pathname)) navigator.serviceWorker.register('sw.js').catch(() => {});
  window.addEventListener('beforeunload', save); window.addEventListener('pagehide', save); document.addEventListener('visibilitychange', () => { save(); if (!document.hidden) tick(); }); window.addEventListener('resize', () => { if (WB.el) WB.fit(); }); render();
}
</script>
</body>
</html>
