familiar size or style.</p>\n<p>The researchers caution that the result may not hold everywhere. A lenient policy is most valuable where buyers face real uncertainty about a product before purchase. Where goods are standardized, or where customers can inspect them in a store, a generous policy removes little uncertainty and may simply invite abuse, such as buying an item for a single occasion and then returning it.</p>","RCP2":"<p>Biologists have proposed several explanations for the black and white stripes of zebras. One long-standing hypothesis holds that stripes serve as camouflage, breaking up the animal's outline and so concealing it from predators. A second proposes that stripes cool the animal: black stripes absorb more heat than white ones, and the resulting temperature differences were thought to generate small air currents across the skin. A third holds that stripes deter biting flies, which transmit several diseases to horses and their relatives in Africa.</p>\n<p>Recent evidence favors the third hypothesis. A comparison across the ranges of zebras and related species found that the intensity of striping was closely associated with the regions and seasons in which biting flies are most active, but showed no consistent association with the presence of large predators or with maximum temperatures. In field trials, researchers dressed domestic horses in striped, all-black, or all-white coats. Flies approached all three kinds of coat at similar rates, but far fewer landed on the striped coats; video recordings showed that flies nearing the stripes failed to slow down and often collided with the coat or flew past it.</p>\n<p>The other hypotheses have fared less well. To lions and hyenas, whose vision is less acute than that of humans, stripes blur into uniform gray beyond a short distance, so stripes could not conceal a zebra at the ranges at which these predators typically begin a hunt. And measurements of water-filled barrels covered with striped, black, or white hides revealed no cooling effect of stripes. The fly hypothesis does leave one matter unresolved: why zebras, unlike other African grazers exposed to the same flies, should have needed such protection. One suggestion is that the zebra's unusually short coat hairs allow flies to reach the skin easily.</p>","RCP3":"<p>Before the late eighteenth century, most English cloth was produced under the putting-out system: merchants distributed raw wool or cotton to rural households, whose members spun and wove at home and were paid by the piece. Within a few decades, much of this work had moved into factories. The traditional explanation for the shift is technological. New machines, such as water-powered spinning frames, were too large and costly for a cottage and needed a central source of power; production therefore had to be concentrated wherever a waterwheel or steam engine could be installed.</p>\n<p>Some economic historians have challenged this account by pointing out that the earliest factories often preceded the machinery said to require them. Several early workshops gathered handloom weavers under one roof, where they used the same equipment they had used at home. On the revisionist view, what the factory offered merchants was not superior technology but control. Under putting-out, workers set their own hours, and merchants complained persistently that workers embezzled raw materials and that output slumped whenever piece rates rose, since households that had earned a customary income preferred leisure to further earnings. In a factory, an owner could fix hours, supervise the pace of work, and monitor materials.</p>\n<p>The revisionist account is a useful corrective, but it explains less than its proponents claim. Handloom workshops of the kind it cites were never numerous, and many failed: weavers demanded a wage premium to give up the independence of domestic work, and without more productive machinery owners could seldom afford to pay it. Factories became the dominant form of textile production only in those branches, cotton spinning above all, in which powered machinery had sharply raised output per worker. Supervision may well explain why merchants wanted factories; it does not explain why factories prevailed. That required the productivity gains that allowed factory owners to pay wages high enough to draw workers away from their homes.</p>","RCP4":"<p>Scientific realists hold that the predictive success of mature theories is best explained by their approximate truth: were our best theories not at least roughly right about unobservable entities, their capacity to yield accurate and sometimes startling predictions would be a miracle. Critics answer with history. The record of science, they observe, is crowded with theories that were for a time strikingly successful and that are now judged to have been mistaken not in detail but in their central posits; the caloric theory of heat and the theory of the luminiferous ether are the usual examples. If success did not track truth then, the critics ask, by what right do we suppose that it does now?</p>\n<p>The most influential realist rejoinder concedes the history while contesting its lesson. Not every element of a successful theory, the selective realist argues, contributes to its success. The ether theorists derived correct predictions about the behavior of light from equations that survive in later theory; the hypothesis of an elastic medium filling space, on this account, did no work in those derivations and was an idle accompaniment to them. Realist commitment should therefore extend only to the constituents on which a theory's successes actually depended, and the historical record, read in this way, shows those constituents to have been retained rather than discarded.</p>\n<p>This rejoinder is more robust than its critics allow, but it is also less informative than its defenders suppose. The charge commonly leveled against it, that the distinction between working and idle constituents is arbitrary, is overstated: one can ask of any derivation which premises it in fact employed, and that question has an answer independent of what later scientists came to believe. The more serious difficulty is epistemic rather than conceptual. Historically, the judgment that a given posit was idle has been made with confidence only after a successor theory dispensed with it; practitioners at the time typically regarded the ether as indispensable. A realism whose content can be specified only in retrospect is not thereby false, but it cannot tell us which parts of current theory to believe, and that guidance was precisely what realism was supposed to provide. Selective realism thus rescues the inference from success to truth as a thesis about past science while leaving its application to present science largely unsecured.</p>","VCP1":"<p>Standard agency theory treats pay as an instrument for aligning an employee's effort with an employer's goals: the more closely reward tracks output, the more effort the employee supplies. Yet most organizations tie only a small fraction of pay to measured performance, and firms that strengthen such ties sometimes see overall performance decline. Two accounts of this pattern now compete.</p>\n<p>The first, the multitask account, preserves the assumption that employees respond to rewards in a self-interested way. Most jobs, it observes, comprise several activities, only some of which can be measured. An employee paid according to the measured activities will shift effort toward them and away from the rest, so that a teacher rewarded for examination results neglects whatever the examination does not test. Weak incentives, on this view, are not a failure to apply agency theory but its correct application to work whose valuable dimensions are unevenly observable.</p>\n<p>The second, the crowding account, holds that the assumption itself is at fault. Drawing on experiments in which paid volunteers worked less diligently than unpaid ones, its proponents argue that many employees work partly from interest in the task or commitment to the organization, and that explicit rewards displace these motives by recasting the work as a transaction. Here the damage is done by the reward as such, not by the gap between what is rewarded and what is valued.</p>\n<p>Proponents of crowding commonly cite field studies in which performance pay was followed by deterioration in quality, cooperation, or care. This evidence is less decisive than they suppose. In nearly every such study the deteriorating dimension was one that the pay scheme did not measure, which is precisely what the multitask account predicts. The two accounts diverge only where every valuable dimension of a job is measured and rewarded: there the multitask account predicts that incentives will raise performance, the crowding account that they may still lower it. The few studies of such settings, chiefly of piece-rate agricultural and installation work, report gains. It would be premature, however, to count this as a refutation of crowding. Jobs that can be measured completely tend to be routine, and those who take them may have had little intrinsic interest for rewards to displace. The studies thus show that crowding is not universal, which its more careful advocates never claimed; whether it operates in the complex work where incentive design is actually contested remains a question that existing field evidence, by its very structure, is poorly suited to settle.</p>","VCP2":"<p>The classical evolutionary theory of aging begins from the observation that natural selection weakens with age. Because predation, disease, and accident kill many organisms before they grow old, a mutation whose harmful effects appear only late in life is exposed to selection in few individuals and may persist, particularly if it confers some benefit early. From this reasoning the theory's founders drew a prediction that became canonical: populations subject to high extrinsic mortality, that is, to death from external hazards, should evolve more rapid senescence than populations that are relatively safe.</p>\n<p>Comparative data long seemed to bear this out. Birds and bats, which escape many predators by flight, outlive ground-dwelling mammals of similar size, and island populations of several species age more slowly than their mainland relatives. But a series of studies of small stream fish has unsettled the consensus. Populations living below waterfalls alongside large predators, and suffering far higher mortality, were found to senesce no faster, and by some measures more slowly, than populations in predator-free waters upstream.</p>\n<p>Some theorists have responded that the canonical prediction was never a strict consequence of the theory. Formal models show that if extrinsic hazards strike all ages and conditions alike and population growth is checked by density, added mortality leaves the relative strength of selection at different ages unchanged. What matters is whether mortality is condition-dependent. Where predators take disproportionately the slow and the frail, deterioration is itself penalized, and heavy predation can favor slower aging. On this reading the fish results are not an anomaly but an illustration.</p>\n<p>This revision is persuasive as theory, yet it purchases its consistency with the evidence at a price. The classical prediction could be tested against mortality rates alone; the revised one requires knowing how the risk of death varies with an individual's physiological state and how the population is regulated, quantities that have been measured in almost no wild population, including the fish in question, for which condition-dependence has been inferred from the very result it is invoked to explain. Until such measurements exist, the revised theory can accommodate either faster or slower aging under high mortality, and a theory that accommodates every outcome explains none. That is a reason not to return to the classical prediction, which the models show to be unfounded as a generalization, but to treat the comparative pattern in birds and bats as awaiting explanation rather than as settled support for either version.</p>","RD1":"<p>Franchising, in which a company licenses its brand and operating methods to independent owners in return for fees and a share of sales, is often explained as a response to scarce capital. On this account, a young chain that cannot borrow enough to open outlets itself recruits franchisees chiefly for their money; once the chain matures and can finance its own growth, it should buy back its franchised outlets and operate them directly.</p>\n<p>The evidence fits this prediction poorly. Most established chains with ready access to capital markets continue to franchise a large and stable share of their outlets, and few carry out systematic buybacks. Moreover, franchisees are an expensive source of funds: an owner whose savings are tied up in one or two outlets bears concentrated risk and will demand a higher return than would diversified investors holding shares in the whole chain.</p>\n<p>An alternative explanation emphasizes the cost of supervision. A salaried manager of a company-owned outlet gains little from extra effort, so the company must monitor the outlet closely. A franchisee, who keeps the outlet's profit after fees, has a strong reason to control costs and work hard without being watched. This reasoning predicts that chains will franchise outlets that are costly to monitor, such as those far from headquarters, and will own those nearby. Studies of restaurant and hotel chains generally confirm this pattern.</p>\n<p>Franchising creates a problem of its own, however. Because customers attribute their experience to the brand rather than to an individual outlet, a franchisee serving mostly travelers who will never return may be tempted to cut quality, keeping the savings while the damage to reputation is spread over the whole chain. This may explain why chains often retain ownership of outlets along highways even where these are remote, and why franchise contracts typically specify detailed standards backed by inspections.</p>","RD2":"<p>Earth formed in a region of the young solar system thought to have been too hot for water ice to condense, so the grains that assembled into the planet should have been dry. Planetary scientists have therefore long supposed that Earth's water was delivered later, by bodies that formed farther from the Sun. For decades comets, which are roughly half ice, seemed the obvious carriers.</p>\n<p>The principal test of any proposed source is isotopic. A small fraction of hydrogen atoms are deuterium, a heavier form of the element, and the ratio of deuterium to ordinary hydrogen in water varies with the place in the solar system where that water originated. Measurements of several comets from the distant Oort cloud found ratios about twice that of Earth's oceans, which appeared to rule comets out as the main source. Attention shifted to carbonaceous chondrites, meteorites derived from asteroids of the outer asteroid belt, which hold up to a tenth of their mass as water bound within minerals and whose deuterium ratios cluster near the oceanic value.</p>\n<p>Two later findings have unsettled this account. First, a comet belonging to a different family, one originating in the Kuiper belt, was found to have an ocean-like ratio, although another comet of the same family, measured afterward, had a ratio more than three times the oceanic value. Second, enstatite chondrites, meteorites thought to resemble the material from which Earth itself was assembled and long assumed to be dry, proved to contain enough hydrogen that building blocks of similar composition could have supplied at least three times the water in the present oceans. Their hydrogen is somewhat poorer in deuterium than ocean water is.</p>\n<p>The second finding does not eliminate delivery from afar: a modest later contribution of deuterium-rich material from carbonaceous asteroids would raise the planet's overall ratio to the value observed. But it shifts the burden of explanation. An outer source is no longer needed to account for the presence of water on Earth, only for its precise composition. Nor are the oceans the whole inventory. Water from the deep mantle, sampled in certain lavas, is poorer in deuterium than seawater, as would be expected if the planet's earliest water came from material like the enstatite chondrites.</p>","RD3":"<p>In much of medieval Europe, a court facing an accusation that could not be settled by witnesses or documents might send the accused to the ordeal. In the ordeal of hot iron, the accused carried a heated bar several paces; the hand was then bound and inspected after three days, and a wound judged to be healing cleanly signified innocence. Historians long treated the practice as a monument to superstition, a procedure whose verdicts could bear no relation to guilt, and they explained its abandonment in the thirteenth century as a victory of reason.</p>\n<p>A revisionist account, drawing on economic theory, holds that ordeals may have sorted the guilty from the innocent rather well. Its argument turns on belief. If the accused generally believed that God would reveal the truth, a guilty person expected to be burned and then punished both for the offense and for the false denial, and so did better to confess or to settle with the accuser. Only the innocent, expecting vindication, would choose to proceed. Willingness to undergo the ordeal therefore itself revealed innocence, and the officiating priests, who controlled the heating of the iron and the inspection of the hand, needed only to ensure that those who proceeded passed. In support, proponents cite a register kept by one thirteenth-century cathedral chapter in which, of the ordeals whose outcome is recorded, roughly two-thirds ended in acquittal, a proportion hard to reconcile with unassisted hot iron.</p>\n<p>The account is ingenious, and it rightly insists that an institution lasting for centuries deserves an explanation other than the stupidity of its users. But the evidence underdetermines it. A high acquittal rate shows that outcomes were managed, not that they were managed in the way described: clergy might equally have favored defendants whom local opinion already held innocent, or those able to pay. Nor can a register of ordeals that were carried out show how many of the accused confessed beforehand, yet it is precisely on this unrecorded group that the argument rests. Finally, the mechanism is fragile in a way its proponents underplay. It works only so long as the accused do not suspect what the priests are doing, and frequent acquittals, visible to the whole community, would seem likely to teach the guilty that the iron seldom burns. How belief could have survived such evidence for generations is a question the theory raises without resolving.</p>"},"tables":{"TBT01":{"title":"Shared office locations operated by a workspace company","cols":["Location","District","Desks","Monthly fee per desk ($)","Meeting rooms","24-hour access","Parking"],"rows":[["Alder","Central",40,320,3,"Yes","No"],["Birch","Harbor",25,240,1,"Yes","No"],["Cedar","Central",60,410,4,"No","Yes"],["Dune","North",30,260,2,"Yes","Yes"],["Elm","Harbor",45,280,2,"No","Yes"],["Fir","North",20,190,1,"No","No"],["Grove","Central",55,350,3,"Yes","Yes"],["Hazel","North",35,270,2,"Yes","No"]]},"TBT02":{"title":"Hotels operated by a regional group, last year","cols":["Hotel","Rooms","Occupancy rate (%)","Average daily rate ($)","Staff","Guest rating (1 to 5)"],"rows":[["Aster",120,75,160,60,4.2],["Brook",200,60,140,90,3.9],["Coral",80,90,220,50,4.6],["Delta",150,70,180,70,4.1],["Ember",300,55,120,110,3.6],["Fjord",90,85,200,45,4.5],["Gable",240,65,150,100,3.8],["Haven",60,80,250,40,4.7],["Iris",180,72,170,80,4]]},"TBT03":{"title":"Parcel depots of a delivery company, ty {"kind":"line","title":"Monthly visitors to a science museum (thousands)","cats":["Jan","Feb","Mar","Apr","May","Jun","Jul"],"series":[{"name":"Visitors","v":[30,45,40,60,35,50,55]}],"y":{"label":"Visitors (thousands)","min":0,"max":70,"step":10}},"GRC03":{"kind":"bar","title":"New accounts opened per quarter at a bank with six branches (hundreds)","cats":["Q1","Q2","Q3","Q4"],"series":[{"name":"Riverside branch","v":[30,40,45,35]},{"name":"Mean of all six branches","v":[20,20,25,15]}],"y":{"label":"New accounts (hundreds)","min":0,"max":50,"step":5}},"GRC04":{"kind":"scatter","title":"Fertilizer applied and wheat yield on 12 test plots","x":{"label":"Fertilizer applied (kg per hectare)","min":0,"max":100,"step":10},"y":{"label":"Yield (metric tons per hectare)","min":0,"max":8,"step":1},"pts":[[10,2.5],[20,3],[20,2],[30,4],[40,3.5],[40,4.5],[50,4],[60,5.5],[70,5],[80,4.5],[90,7],[100,6.5]],"line":[[0,2],[100,7]],"lineLabel":"Trend line"},"GRC05":{"kind":"line","title":"Cumulative units shipped since January 1 (thousands)","cats":["Jan","Feb","Mar","Apr","May","Jun"],"series":[{"name":"Cumulative units","v":[10,25,30,55,60,80]}],"y":{"label":"Cumulative units shipped (thousands)","min":0,"max":80,"step":10}},"GRC06":{"kind":"bar","title":"Applications received and offers made by five degree programs (tens)","cats":["Law","Medicine","Design","History","Physics"],"series":[{"name":"Applications","v":[80,60,90,40,50]},{"name":"Offers","v":[15,25,30,10,20]}],"y":{"label":"Number (tens)","min":0,"max":100,"step":10}},"GRC07":{"kind":"line","title":"Annual revenue of a company with two product lines ($ million)","cats":["2020","2021","2022","2023","2024"],"series":[{"name":"Software","v":[20,25,30,40,50]},{"name":"Hardware","v":[60,65,70,70,75]}],"y":{"label":"Revenue ($ million)","min":0,"max":80,"step":10}},"GRC08":{"kind":"bar","title":"Assessment scores of 40 trainees","cats":["50 to 60","60 to 70","70 to 80","80 to 90","90 to 100"],"series":[{"name":"Trainees","v":[4,10,12,8,6]}],"y":{"label":"Number of trainees","min":0,"max":14,"step":2},"xLabel":"Score"},"GRC09":{"kind":"line","title":"Percent change in the price of a commodity from the end of the preceding quarter","cats":["Q1","Q2","Q3","Q4","Q5","Q6","Q7","Q8"],"series":[{"name":"Percent change","v":[5,10,5,-5,-10,5,10,-5]}],"y":{"label":"Change in price (%)","min":-10,"max":10,"step":5}},"GRC10":{"kind":"scatter","title":"Calls made and contracts signed by 12 sales representatives, last quarter","x":{"label":"Calls made","min":0,"max":200,"step":20},"y":{"label":"Contracts signed","min":0,"max":50,"step":5},"pts":[[20,10],[40,15],[40,20],[60,20],[80,25],[100,22.5],[100,30],[120,27.5],[140,30],[160,35],[180,35],[200,40]],"line":[[0,10],[200,40]],"lineLabel":"Trend line"}},"msr":{"MS1":{"tabs":[{"name":"Group visit policy","html":"<p><b>Memo from the education coordinator of the Halvorsen Science Museum to booking staff</b></p>\n <p>School groups pay the group admission rates shown in the rate sheet. Each group must bring at least one adult for every 8 students, so a group of 17 students must bring at least 3 adults. The adults a group is required to bring are admitted free. Any adults beyond that number pay the adult group rate.</p>\n <p>A workshop session takes at most 30 students and is charged at a flat fee per session, whatever the number of students in it. A group that wants a workshop for all of its students must book enough sessions to seat every student. Adults do not count toward the 30 places.</p>\n <p>A booking requested at least 21 days before the date of the visit receives a reduction of 10 percent on student admission. The reduction does not apply to adult admission or to workshop fees.</p>"},{"name":"Rate sheet","html":"<table class=\"dt\"><thead><tr><th>Day of visit</th><th>Student group rate</th><th>Adult group rate</th></tr></thead><tbody>\n <tr><td>Tuesday to Thursday</td><td>$6</td><td>$9</td></tr>\n <tr><td>Friday</td><td>$7</td><td>$10</td></tr>\n <tr><td>Saturday</td><td>$8</td><td>$12</td></tr></tbody></table>\n <p>The museum is closed to school groups on Sundays and Mondays.</p>\n <table class=\"dt\"><thead><tr><th>Workshop</th><th>Fee per session</th><th>Open to grades</th><th>Days offered</th></tr></thead><tbody>\n <tr><td>Light and Color</td><td>$75</td><td>1 to 4</td><td>Tuesday to Thursday</td></tr>\n <tr><td>Fossil Lab</td><td>$90</td><td>3 to 6</td><td>Tuesday to Friday</td></tr>\n <tr><td>Ancient Writing</td><td>$110</td><td>5 to 8</td><td>Wednesday to Saturday</td></tr></tbody></table>"},{"name":"Booking request","html":"<p><b>Email from Ms. Okonkwo, a teacher at Larch Road School, sent on April 2</b></p>\n <p>I would like to book a visit for Thursday, May 7. We will be 52 students, all in grade 5, accompanied by 9 adults: three teachers and six parent volunteers.</p>\n <p>We would like every student to take part in the Fossil Lab. We will bring our own lunches and will not need the lunchroom.</p>\n <p>The school has approved $520 for museum charges for this trip. Please confirm the booking and let me know the total.</p>"}]},"MS2":{"tabs":[{"name":"Supplier policy","html":"<p><b>Policy note from the quality director of Brannock Bakeries to the procurement team</b></p>\n <p>1. We buy ingredients only from suppliers that are listed as Approved or as Provisional.</p>\n <p>2. There are two requirements for Approved status: (a) the supplier has passed an on-site audit by our quality team within the past 24 months, and (b) the supplier holds a current third-party food safety certificate. A supplier that meets both requirements is listed as Approved, and a supplier that fails either one is not, except as stated in rule 3.</p>\n <p>3. Requirement (a), but never requirement (b), is waived for a supplier that has supplied us continuously for at least 5 years and has had no rejected deliveries in the past 12 months.</p>\n <p>4. A supplier that does not qualify as Approved is listed as Provisional if it meets requirement (b) and an on-site audit of that supplier has been scheduled. Only ingredients that contain no allergen may be bought from a Provisional supplier. Provisional status ends when the audit takes place.</p>"},{"name":"Supplier records","html":"<table class=\"dt\"><thead><tr><th>Supplier</th><th>Ingredient supplied</th><th>Contains an allergen</th><th>Years of continuous supply</th><th>Months since last passed on-site audit</th><th>Food safety certificate</th><th>Rejected deliveries, past 12 months</th></tr></thead><tbody>\n <tr><td>Arbeck Mills</td><td>Wheat flour</td><td>Yes</td><td>8</td><td>31</td><td>Current</td><td>0</td></tr>\n <tr><td>Dalgaard Oats</td><td>Oat flour</td><td>No</td><td>11</td><td>14</td><td>Expired</td><td>0</td></tr>\n <tr><td>Kestrel Foods</td><td>Sunflower oil</td><td>No</td><td>0 (new)</td><td>Never audited</td><td>Current</td><td>0</td></tr>\n <tr><td>Lindqvist Dairy</td><td>Milk powder</td><td>Yes</td><td>3</td><td>9</td><td>Current</td><td>2</td></tr>\n <tr><td>Pemberton Nuts</td><td>Hazelnut meal</td><td>Yes</td><td>0 (new)</td><td>Never audited</td><td>Current</td><td>0</td></tr>\n <tr><td>Tormes Orchards</td><td>Dried apricot</td><td>No</td><td>6</td><td>30</td><td>Current</td><td>1</td></tr></tbody></table>\n <p>Each supplier supplies, or has applied to supply, only the ingredient shown.</p>"},{"name":"Procurement email","html":"<p><b>Email from the procurement manager to the quality director</b></p>\n <p>A few points on the supplier records you circulated this morning, which I agree are accurate as of today.</p>\n <p>Dalgaard's certificate lapsed last month. Their plant manager tells me the renewal inspection went well and that the new certificate should arrive within a few weeks, but we have nothing in writing from the certifying body. Dalgaard is our only source of oat flour, so I would prefer not to interrupt orders, though I recognize that this is your decision and not mine.</p>\n <p>Your team has now scheduled on-site a     num += t*l; den += l;

}

function weightedPick(cands, score, rnd){
  const top = cands.map(c => [c, score(c)]).sort((a,b) => b[1]-a[1]).slice(0,2);
  const tot = top.reduce((s,x) => s+x[1], 0); let r = rnd()*tot;

  const target = theta + STRETCH;

  const set = (cands) => { const groups = {}; cands.forEach(q => (groups[q.stim] = groups[q.stim] || []).push(q));
    const g = weightedPick(Object.values(groups), a => { const m = a.reduce((s,q)=>s+q.b,0)/a.length; return pen(a[0])/Math.pow(0.15+Math.abs(m-target),2); }, rnd);
    return g.map(q => q.id); };
  if (k==='Q'){
    const cnt = {NP:0, RP:0, WP:0}; path.forEach(id => cnt[qGroup(ITEM[id])]++);
    let c = pool.filter(q => cnt[qGroup(q)] < Q_QUOTA[qGroup(q)]);
    const last = path.length ? ITEM[path[path.length-1]].sub : ''; const c2 = c.filter(q => q.sub !== last);
    return single(c2.length ? c2 : c);
  }

function insightsBody(){

  const revise = cur.filter(r => r.basic_misses > 0).sort((a,b) => secOrder[a.section]-secOrder[b.section] || b.basic_misses-a.basic_misses);
  const stretch = cur.filter(r => r.basic_misses === 0 && r.hard_misses > 0).sort(sortW);
  const slow = cur.filter(r => r.correct/r.n >= 0.5 && r.avg_time > PACE[r.section]*1.3).sort((a,b) => b.avg_time/PACE[b.section]-a.avg_time/PACE[a.section]);

  const sc = (r) => `${r.correct} of ${r.n}`;
  const focus = [];
  repeat.forEach(r => { const p = lastSeen(r), k = streak(r); focus.push(`<b>${name(r)}</b>: wrong again. ${sc(r)} now, ${sc(p.m)} on ${dShort(p.at)}${k >= 2 ? `, weak in ${k} earlier exams in a row` : ''}. Go back to the course module before doing more questions.`); });
  weak.filter(r => r.basic_misses > 0).forEach(r => focus.push(`<b>${name(r)}</b>: ${sc(r)}, with ${r.basic_misses} missed at Easy or Medium level. Revise the method, then drill it untimed.`));
  weak.filter(r => r.basic_misses === 0).forEach(r => focus.push(`<b>${name(r)}</b>: ${sc(r)}, missed only at Hard level. Practise harder questions on this.`));
  slow.filter(r => !repeat.includes(r) && !weak.includes(r)).forEach(r => focus.push(`<b>${name(r)}</b>: mostly right but slow, ${fmt(r.avg_time)} a question against a target of ${fmt(PACE[r.section])}. Drill for speed.`));

    const over = its.filter(q => t(q) > 180), rush = its.filter(q => !correct(q) && t(q) < 45), third = Math.max(1, Math.floor(its.length/3));
    const a1 = its.slice(0,third).reduce((x,q) => x+t(q), 0)/third, a3 = its.slice(-third).reduce((x,q) => x+t(q), 0)/third, lost = over.filter(q => !correct(q)).reduce((x,q) => x+t(q), 0);

    if (rush.length) bits.push(`${rush.length} wrong answer${rush.length>1?'s':''} given in under 45 seconds`);
    if (a1 > a3*1.5 && a3 < PACE[SECNAME[k]]*0.8) bits.push(`the first third averaged ${fmt(a1)} a question and the last third ${fmt(a3)}, so the end was rushed`);
    if (its.length < SECTIONS[k].n) bits.push(`${SECTIONS[k].n - its.length} question${SECTIONS[k].n - its.length>1?'s':''} never reached`);

  const card = (t, body, cls) => body ? `<div class="ins ${cls||''}"><h3>${t}</h3>${body}</div>` : '';
  return `<p class="hint">${past.length ? `Compared with your ${past.length} earlier exam${past.length>1?'s':''}${S.candidate ? ' saved under "'+esc(S.candidate)+'"' : ''}.` : 'This is the first exam on record for this name, so there is no earlier pattern to compare yet.'} One or two questions on a topic is thin evidence; a topic that repeats across exams is the signal to trust.</p>
  <div class="insgrid">
  ${card('Focus next, in this order', focus.length ? `<ol>${focus.slice(0,6).map(x => `<li>${x}</li>`).join('')}</ol>` : '<p>Nothing stands out. Keep the same mix and raise the difficulty.</p>', 'wide')}
  ${card('Going wrong repeatedly', li(repeat.map(r => { const p = lastSeen(r); return `${name(r)}: ${sc(r)} now, ${sc(p.m)} on ${dShort(p.at)}`; })), 'bad')}
  ${card('Weak in this exam', li(weak.map(r => `${name(r)}: ${sc(r)}`)), 'bad')}
  ${card('Strong in this exam', li(strong.map(r => `${name(r)}: ${sc(r)}`)), 'good')}
  ${card('Improved since last time', li(improved.map(r => { const p = lastSeen(r); return `${name(r)}: ${sc(p.m)} on ${dShort(p.at)}, ${sc(r)} now`; })), 'good')}
  ${card('Revise the basics', li(revise.map(r => `${name(r)}: ${r.basic_misses} miss${r.basic_misses>1?'es':''} at Easy or Medium level`)))}
  ${card('Ready for harder questions', li(stretch.map(r => `${name(r)}: basics all right, missed ${r.hard_misses} at Hard level`)))}

  </div>`;
}

function chartSVG(c){
  const W=640,H=400,L=64,R=20,T=44,B=c.kind==='scatter'||c.xLabel?64:48, pw=W-L-R, ph=H-T-B;
  const y = (v) => T + ph - (v-c.y.min)/(c.y.max-c.y.min)*ph;
  let g = `<text x="${L}" y="20" class="ct">${c.title}</text>`;
  for (let v=c.y.min; v<=c.y.max+1e-9; v+=c.y.step){ g += `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" class="grid"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" class="tk">${Math.round(v*100)/100}</text>`; }
  g += `<text transform="translate(16 ${T+ph/2}) rotate(-90)" text-anchor="middle" class="ax">${c.y.label}</text>`;
  g += `<line x1="${L}" x2="${W-R}" y1="${y(c.y.min)}" y2="${y(c.y.min)}" class="axis"/><line x1="${L}" x2="${L}" y1="${T}" y2="${T+ph}" class="axis"/>`;
  const legend = (names) => names.map((n,i)=>`<g transform="translate(${L+i*150} 28)"><rect width="12" height="12" class="s${i}"/><text x="18" y="11" class="tk">${n}</text></g>`).join('');
  if (c.kind==='scatter'){
    const x = (v) => L + (v-c.x.min)/(c.x.max-c.x.min)*pw;
    for (let v=c.x.min; v<=c.x.max+1e-9; v+=c.x.step){ g += `<line x1="${x(v)}" x2="${x(v)}" y1="${T}" y2="${T+ph}" class="grid"/><text x="${x(v)}" y="${T+ph+18}" text-anchor="middle" class="tk">${Math.round(v*100)/100}</text>`; }
    g += `<text x="${L+pw/2}" y="${H-12}" text-anchor="middle" class="ax">${c.x.label}</text>`;
    g += `<line x1="${x(c.line[0][0])}" y1="${y(c.line[0][1])}" x2="${x(c.line[1][0])}" y2="${y(c.line[1][1])}" class="trend"/>`;

  } else {
    const n = c.cats.length, bw = pw/n;

    if (c.xLabel) g += `<text x="${L+pw/2}" y="${H-12}" text-anchor="middle" class="ax">${c.xLabel}</text>`;

    } else {
      c.series.forEach((s,si)=>{ g += `<polyline fill="none" points="${s.v.map((v,i)=>`${L+bw*(i+.5)},${y(v)}`).join(' ')}" class="ln l${si}"/>` + s.v.map((v,i)=>`<circle cx="${L+bw*(i+.5)}" cy="${y(v)}" r="4.5" class="s${si}"/>`).join(''); });
    }

  const msg = flashMsg ? `<div class="flash" role="alert">${flashMsg}</div>` : ''; flashMsg='';
  return topbar(`<span class="qn">Question ${S.qIdx+1} of ${n}</span>`) +
  `<div class="toast" id="toast" role="status" hidden></div><div class="main ${split?'split':''}">${split?`<div class="stim">${stimHTML(q,true)}</div>`:''}<div class="qcol">${msg}<div class="qbody"><div class="stem">${q.stem}</div>${answerHTML(q,false,false)}</div></div></div>
  <div class="bar bottom"><label class="bm"><input type="checkbox" id="bm" ${S.marks[q.id]?'checked':''}> Bookmark for review</label>
  ${S.reviewing?`<span class="edits">Answers changed: ${ed.length} of ${MAX_EDITS}</span>`:''}
  <button class="primary" id="nextbtn" ${complete(q)?'':'disabled'}>${S.reviewing?'Return to review':'Next'}</button></div>
  ${ui.calc?calcHTML():''}`;
}
function dialog(t, m, yes, id){ return `<div class="veil"><div class="dlg" role="dialog" aria-modal="true"><h3>${t}</h3><p>${m}</p><div class="dbtn"><button class="ghost" id="dno">Cancel</button><button class="primary" id="${id}">${yes}</button></div></div></div>`; }
function review(){
  const its = items(), ed = editedIds();
  const msg = flashMsg ? `<div class="flash" role="alert">${flashMsg}</div>` : ''; flashMsg='';
  return topbar('<span class="qn">Question Review and Edit</span>') + `<div class="main"><div class="page inpage">${msg}<h2>Review your answers</h2>
  <p>Open any question to look at it again. You can change up to ${MAX_EDITS} answers. You have changed <b>${ed.length}</b>. The clock is still running.</p>
  <div class="rgrid">${its.map((q,i)=>`<button class="rq ${S.marks[q.id]?'marked':''} ${ed.includes(q.id)?'edited':''}" data-go="${i}"><span class="num">${i+1}</span><span class="st">${ed.includes(q.id)?'Changed':(S.marks[q.id]?'Bookmarked':'Answered')}</span></button>`).join('')}</div></div></div>
  <div class="bar bottom"><span></span><button class="primary" id="endsec">End section</button></div>
  ${ui.confirm==='end'?dialog('End this section?','You will not be able to return to it. Any time left on the clock is lost.','End section','cend'):''}`;
}
function between(){
  const prev = SECTIONS[secKey()], nx = SECTIONS[S.order[S.secIdx+1]];
  const why = S.ended[secKey()]==='time' ? 'Time expired.' : 'Section complete.';
  return `<div class="page narrow"><p class="eyebrow">${why}</p><h1>${prev.short} is finished</h1><p class="lead">Next: ${nx.name}.</p>
  ${S.breakUsed ? '<p>You have already used your break.</p>' : '<p>You may take your one optional 10-minute break now. If you skip it here after the first section, you can still take it after the second.</p>'}
  <div class="row">${S.breakUsed?'':'<button class="ghost big" id="takebreak">Take the 10-minute break</button>'}<button class="primary big" id="skipbreak">Continue to ${nx.short}</button></div></div>`;
}
function breakScreen(){
  return `<div class="page narrow center"><p class="eyebrow">Optional break</p><div class="bigtime" id="btimer">${fmt(S.breakRemaining)}</div><p>The next section starts on its own when the break ends, and its clock starts immediately.</p><button class="primary big" id="endbreak">End break and continue</button></div>`;
}

/* ---------- results ---------- */
function estimate(k){
  const its = items(k), n = SECTIONS[k].n, resp = responses(k);
  const un = resp.filter(x => x.r===-1).length + (n - its.length);
  for (let i=its.length; i<n; i++) resp.push({q:{b:-1, type:'mc'}, r:-1});
  const theta = (its.length ? eap(resp) : -3) - STRICT - 0.12*un;
  return {theta, scaled: scaleScore(k, theta), right: its.filter(correct).length, n, un};
}
const ord = (n) => n + (n%100>=11&&n%100<=13 ? 'th' : ['th','st','nd','rd','th','th','th','th','th','th'][n%10]);
const diff = (b) => b < -0.6 ? 'Easy' : b < 0.5 ? 'Medium' : b < 1.3 ? 'Hard' : 'Very hard';
function pathChart(k){
  const its = items(k); if (!its.length) return '';
  const W=640,H=150,L=70,R=10,T=12,B=22, pw=W-L-R, ph=H-T-B, n=SECTIONS[k].n;
  const x = (i) => L + (i+0.5)*pw/n, y = (b) => T + ph - (Math.max(-2,Math.min(2.6,b))+2)/4.6*ph;
  let g = [['Easy',-1.3],['Medium',0],['Hard',0.9],['Very hard',2]].map(([t,b])=>`<line x1="${L}" x2="${W-R}" y1="${y(b)}" y2="${y(b)}" class="grid"/><text x="${L-8}" y="${y(b)+4}" text-anchor="end" class="tk">${t}</text>`).join('');
  g += `<polyline fill="none" class="ln l0" points="${its.map((q,i)=>`${x(i)},${y(q.b)}`).join(' ')}"/>`;
  g += its.map((q,i)=>`<circle cx="${x(i)}" cy="${y(q.b)}" r="5" class="${correct(q)?'pok':'pno'}"/><text x="${x(i)}" y="${H-6}" text-anchor="middle" class="tk">${i+1}</text>`).join('');
  return `<div class="scrollx"><svg viewBox="0 0 ${W} ${H}" class="chart path" role="img" aria-label="Difficulty of each question served">${g}</svg></div><p class="hint">Difficulty of each question you were served. Filled dots are correct answers, hollow dots are misses.</p>`;
}
function skillTable(){
  if (!S.order.includes('Q') || !items('Q').length) return '';
  const g = {}; for (const q of items('Q')){ const k = q.topic+'|'+q.sub; (g[k] = g[k] || {r:0,n:0,t:0,b:0}); g[k].n++; g[k].t += S.times[q.id]||0; g[k].b += q.b; if (correct(q)) g[k].r++; }
  const rows = Object.entries(g).sort((a,b) => (a[1].r/a[1].n)-(b[1].r/b[1].n) || a[0].localeCompare(b[0]));
  return `<section><h2>Quant by skill</h2><p class="hint">Weakest first. Level is the average difficulty of the questions you were served on that skill.</p><div class="scrollx"><table class="dt rt"><thead><tr><th>Topic</th><th>Skill</th><th>Correct</th><th>Level</th><th>Average time</th></tr></thead><tbody>${rows.map(([k,v])=>`<tr class="${v.r<v.n?'miss':''}"><td>${k.split('|')[0]}</td><td>${k.split('|')[1]}</td><td>${v.r} of ${v.n}</td><td>${diff(v.b/v.n)}</td><td>${fmt(v.t/v.n)}</td></tr>`).join('')}</tbody></table></div></section>`;
}
function results(){
  const full = S.order.length===3, SECS = full ? 'QVD' : S.order; const R = {}; let sum = 0; for (const k of SECS){ R[k] = estimate(k); sum += R[k].scaled; }
  const total = totalScore(sum);
  const groups = {};
  for (const k of SECS) for (const q of items(k)){ const key = SECTIONS[k].short+': '+(k==='Q'?q.topic:q.kind); (groups[key] = groups[key] || {r:0,n:0,t:0}); groups[key].n++; groups[key].t += S.times[q.id]||0; if (correct(q)) groups[key].r++; }
  const secCard = (k) => { const r = R[k], s = SECTIONS[k]; return `<div class="sc"><span class="scn">${s.short}</span><span class="scv">${r.scaled}<i> / 90</i></span><span class="scp">${ord(pct(k,r.scaled))} percentile</span><span class="scd">${r.right} of ${r.n} correct${r.un?`, ${r.un} unanswered`:''}</span><span class="track"><i style="width:${(r.scaled-60)/30*100}%"></i></span></div>`; };
  const rows = (k) => items(k).map((q,i)=>{ const ok = correct(q), t = S.times[q.id]||0, open = ui.open[q.id];
    return `<tr class="${ok?'':'miss'}"><td>${i+1}</td><td>${q.kind==='Problem Solving'?q.topic:q.kind}<small>${q.sub}</small></td><td>${diff(q.b)}</td><td><span class="pill ${ok?'ok':(complete(q)?'no':'un')}">${ok?'Correct':(complete(q)?'Wrong':'Unanswered')}</span></td><td class="${t>180?'slow':''}">${fmt(t)}</td><td><button class="link" data-open="${q.id}">${open?'Hide':'Review'}</button></td></tr>` +
    (open?`<tr class="detail"><td colspan="6"><div class="dwrap">${q.stim?`<div class="stim flat">${stimHTML(q,false)}</div>`:''}<div class="stem">${q.stem}</div>${answerHTML(q,true,true)}<div class="expl"><b>Explanation</b><p>${q.expl}</p></div></div></td></tr>`:''); }).join('');
  return `<div class="page"><header class="hero"><p class="eyebrow">Unofficial score report</p><h1>${full ? 'Estimated total score' : 'Estimated '+SECTIONS[SECS].short+' score'}</h1>
  ${full ? `<div class="total"><span class="tv">${total}<i> / 805</i></span><span class="tp">${ord(pct('T',total))} percentile<small>Score ${total} out of a maximum 805 (scale 205 to 805). Likely range ${Math.max(205,total-30)} to ${Math.min(805,total+30)}.</small></span></div>`
   : `<div class="total"><span class="tv">${R[SECS].scaled}<i> / 90</i></span><span class="tp">${ord(pct(SECS,R[SECS].scaled))} percentile<small>Score ${R[SECS].scaled} out of a maximum 90 (section scale 60 to 90). Likely range ${Math.max(60,R[SECS].scaled-2)} to ${Math.min(90,R[SECS].scaled+2)}. ${R[SECS].right} of ${R[SECS].n} correct${R[SECS].un?', '+R[SECS].un+' unanswered':''}. No total score is given for a single section.</small></span></div>`}</header>
  ${full ? `<div class="scs">${SECS.split('').map(secCard).join('')}</div>` : ''}<section><h2>Insights</h2><div id="insights">${insightsBody()}</div></section>${skillTable()}
  <section><h2>Accuracy and pace by area</h2><div class="scrollx"><table class="dt rt"><thead><tr><th>Area</th><th>Correct</th><th>Average time</th></tr></thead><tbody>${Object.entries(groups).map(([k,g])=>`<tr><td>${k}</td><td>${g.r} of ${g.n}</td><td>${fmt(g.t/g.n)}</td></tr>`).join('')}</tbody></table></div></section>
  ${SECS.split('').map(k=>`<section><h2>${SECTIONS[k].name}</h2>${pathChart(k)}<p class="hint">Target pace is about ${k==='Q'?'2:09':k==='V'?'1:57':'2:15'} per question. Times over 3:00 are highlighted.</p><div class="scrollx"><table class="dt rt"><thead><tr><th>#</th><th>Type</th><th>Level</th><th>Result</th><th>Time</th><th></th></tr></thead><tbody>${rows(k)}</tbody></table></div></section>`).join('')}
  <p class="hint"><span id="syncnote">${syncText()}</span> <button class="ghost" id="backup">Download my answers</button></p>
  <section class="note"><h2>Reading this score</h2><p>On an adaptive test the score depends on how hard the questions you answered correctly were, not on the count alone, so two people with the same number correct can score differently. Section scores come from your estimated ability mapped to the official 60 to 90 scale through published percentile tables, then marked down slightly so the result is conservative. The total weights the three sections equally, as the real exam does. A new attempt serves questions you have not seen first, but the bank is small enough that some will repeat by a third attempt.</p>
  <div class="row">${ui.confirm==='reset'?'<span>Erase this attempt and start again?</span><button class="ghost" id="dno">Keep it</button><button class="primary" id="creset">Erase and restart</button>':'<button class="ghost" id="reset">Start a new attempt</button>'}</div></section></div>`;
}

/* ---------- calculator ---------- */
let C = {d:'0', acc:null, op:null, fresh:true, mem:0};
function calcHTML(){ const k = ['MC','MR','M+','C','7','8','9','÷','4','5','6','×','1','2','3','−','0','.','±','+','√','%','1/x','='];
  return `<div class="calc" role="group" aria-label="Calculator"><div class="chead"><span>Calculator</span><button class="link" id="calcx">Close</button></div><div class="cdisp" id="cdisp">${C.d}</div><div class="ckeys">${k.map(x=>`<button data-k="${x}" class="${/[0-9.]/.test(x)&&x.length===1?'':'fn'}">${x}</button>`).join('')}</div></div>`; }
function calcKey(k){
  const v = parseFloat(C.d); const show = (n) => { C.d = Number.isFinite(n) ? String(parseFloat(n.toPrecision(12))) : 'Error'; };
  const apply = () => { if (C.op==null || C.acc==null) return v; return C.op==='+'?C.acc+v : C.op==='−'?C.acc-v : C.op==='×'?C.acc*v : C.acc/v; };
  if (/^[0-9]$/.test(k)){ C.d = C.fresh || C.d==='0' ? k : C.d+k; C.fresh=false; }
  else if (k==='.'){ if (C.fresh){ C.d='0.'; C.fresh=false; } else if (!C.d.includes('.')) C.d+='.'; }
  else if (k==='C'){ C.d='0'; C.acc=null; C.op=null; C.fresh=true; }
  else if (k==='±') show(-v);
  else if (k==='√'){ show(Math.sqrt(v)); C.fresh=true; }
  else if (k==='1/x'){ show(1/v); C.fresh=true; }
  else if (k==='%'){ show(C.acc!=null ? C.acc*v/100 : v/100); C.fresh=true; }
  else if (k==='MC') C.mem=0; else if (k==='MR'){ show(C.mem); C.fresh=true; } else if (k==='M+'){ C.mem += v; C.fresh=true; }
  else if (k==='='){ const r = apply(); show(r); C.acc=null; C.op=null; C.fresh=true; }
  else { if (C.op && !C.fresh){ const r = apply(); show(r); C.acc = r; } else C.acc = parseFloat(C.d); C.op = k; C.fresh=true; }
  const el = $('#cdisp'); if (el) el.textContent = C.d;
}

/* ---------- whiteboard: persists across questions and sections, like the online exam's board ---------- */
const WB = { strokes:[], tool:'pen', el:null, cv:null, cur:null, big:false,
  mount(){
    const want = ui.wb && (S.phase==='q' || S.phase==='review');
    if (!want){ if (this.el){ this.el.remove(); this.el = null; } return; }
    if (this.el && document.body.contains(this.el)) return;
    const d = document.createElement('div'); d.className = 'wb' + (this.big?' big':''); d.innerHTML =
      `<div class="chead"><span title="Drag to move">Whiteboard</span><span class="wbt"><button data-t="pen" class="on">Pen</button><button data-t="text">Text</button><button data-t="erase">Eraser</button><button data-a="undo">Undo</button><button data-a="clear">Clear</button><button data-a="size">Resize</button><button data-a="close">Close</button></span></div><div class="wbwrap"><canvas></canvas></div>`;
    document.body.appendChild(d); this.el = d; this.cv = d.querySelector('canvas'); this.fit();
    d.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { this.tool = b.dataset.t; d.querySelectorAll('[data-t]').forEach(x => x.classList.toggle('on', x===b)); });
    d.querySelector('[data-a=undo]').onclick = () => { this.strokes.pop(); this.draw(); this.save(); };
    d.querySelector('[data-a=clear]').onclick = () => { this.strokes = []; this.draw(); this.save(); };
    d.querySelector('[data-a=size]').onclick = () => { this.big = !this.big; d.style.left = d.style.top = d.style.bottom = ''; d.classList.toggle('big', this.big); this.fit(); };
    d.querySelector('[data-a=close]').onclick = () => { ui.wb = false; this.mount(); const b = $('#wbbtn'); if (b) b.setAttribute('aria-pressed','false'); };
    const cv = this.cv, pos = (e) => { const r = cv.getBoundingClientRect(); return [(e.clientX-r.left)/r.width, (e.clientY-r.top)/r.height]; };
    cv.onpointerdown = (e) => { e.preventDefault();
      if (this.tool==='text') return;
      cv.setPointerCapture(e.pointerId); this.cur = {t:this.tool, p:[pos(e)]}; this.strokes.push(this.cur); };
    cv.onpointermove = (e) => { if (!this.cur) return; this.cur.p.push(pos(e)); this.draw(); };
    cv.onclick = (e) => { if (this.tool==='text') this.textAt(e, pos(e)); };
    const hd = d.querySelector('.chead'); let drag = null;
    hd.onpointerdown = (e) => { if (e.target.closest('button') || this.big) return; const r = d.getBoundingClientRect(); drag = [e.clientX-r.left, e.clientY-r.top]; hd.setPointerCapture(e.pointerId); };
    hd.onpointermove = (e) => { if (!drag) return; d.style.left = Math.max(0, Math.min(window.innerWidth-80, e.clientX-drag[0]))+'px'; d.style.top = Math.max(0, Math.min(window.innerHeight-40, e.clientY-drag[1]))+'px'; d.style.bottom = 'auto'; };
    hd.onpointerup = () => { drag = null; };
    cv.onpointerup = cv.onpointercancel = () => { if (this.cur){ this.cur = null; this.save(); } };
  },
  textAt(e, p){ const wrap = this.el.querySelector('.wbwrap'), r = wrap.getBoundingClientRect(); const inp = document.createElement('input'); inp.className = 'wbinput'; inp.setAttribute('aria-label','Whiteboard text');
    inp.style.left = (e.clientX-r.left)+'px'; inp.style.top = (e.clientY-r.top-12)+'px'; wrap.appendChild(inp); inp.focus();
    let fin = false; const done = () => { if (fin) return; fin = true; if (inp.value.trim()){ this.strokes.push({t:'text', p:[p], s:inp.value}); this.draw(); this.save(); } inp.remove(); };
    inp.onkeydown = (ev) => { if (ev.key==='Enter') done(); if (ev.key==='Escape'){ inp.value=''; done(); } }; inp.onblur = done; },
  fit(){ const cv = this.cv, r = cv.parentElement.getBoundingClientRect(), dpr = window.devicePixelRatio || 1; cv.width = r.width*dpr; cv.height = r.height*dpr; this.draw(); },
  draw(){ const cv = this.cv; if (!cv) return; const x = cv.getContext('2d'), W = cv.width, H = cv.height, dpr = window.devicePixelRatio || 1; x.clearRect(0,0,W,H);
    const ink = getComputedStyle(document.documentElement).getPropertyValue('--ink').trim() || '#111';
    for (const s of this.strokes){
      if (s.t==='text'){ x.globalCompositeOperation='source-over'; x.fillStyle = ink; x.font = (16*dpr)+'px IBM Plex Sans, sans-serif'; x.fillText(s.s, s.p[0][0]*W, s.p[0][1]*H); continue; }
      x.globalCompositeOperation = s.t==='erase' ? 'destination-out' : 'source-over'; x.strokeStyle = ink; x.lineWidth = (s.t==='erase'?22:2.2)*dpr; x.lineCap = x.lineJoin = 'round';
      x.beginPath(); s.p.forEach((p,i) => i ? x.lineTo(p[0]*W,p[1]*H) : x.moveTo(p[0]*W,p[1]*H)); if (s.p.length===1) x.lineTo(s.p[0][0]*W+0.1, s.p[0][1]*H); x.stroke(); }
    x.globalCompositeOperation='source-over'; },
  save(){ lsSet(WBKEY, this.strokes.slice(-400)); }
};

/* ---------- events ---------- */
function bind(){
  const on = (sel, ev, fn) => document.querySelectorAll(sel).forEach(el => el.addEventListener(ev, fn));
  on('input[name=order]','change', e => ui.order = e.target.value);
  on('input[name=mode]','change', e => { ui.mode = e.target.value; const y = window.scrollY; render(); window.scrollTo(0,y); });
  on('#cand','input', e => lsSet(NAMEKEY, e.target.value));
  on('#backup','click', downloadBackup);
  on('#start','click', startExam);
  on('#begin','click', beginSection);
  on('#bm','change', e => { S.marks[curQ().id] = e.target.checked; save(); });
  const upd = () => { const el = $('.edits'); if (el) el.textContent = 'Answers changed: ' + editedIds().length + ' of ' + MAX_EDITS; };
  on('.qbody input[type=radio]','change', e => { if (setAns(curQ(), e.target.dataset.p!=null ? +e.target.dataset.p : 0, +e.target.value)===false) render(); else upd(); });
  on('.qbody select','change', e => { if (setAns(curQ(), +e.target.dataset.p, e.target.value===''?null:+e.target.value)===false) render(); else upd(); });
  on('#nextbtn','click', () => { if (complete(curQ())) next(); });
  on('#dno','click', () => { ui.confirm=null; render(); });
  on('.tab','click', e => { ui.tab = +e.currentTarget.dataset.tab; rerenderStim(); });
  on('#sortsel','change', e => { ui.sort = +e.target.value; rerenderStim(); });
  on('.rq','click', e => { S.qIdx = +e.currentTarget.dataset.go; S.reviewing = true; S.phase='q'; ui.tab=0; ui.sort=-1; save(); render(); });
  on('#endsec','click', () => { ui.confirm='end'; render(); });
  on('#cend','click', () => endSection(false));
  on('#takebreak','click', () => afterBetween(true));
  on('#skipbreak','click', () => afterBetween(false));
  on('#endbreak','click', beginSection);
  on('#timer','click', () => { ui.hideTimer = !ui.hideTimer; const el = $('#timer'); el.textContent = ui.hideTimer ? 'Show time' : fmt(S.remaining); });
  on('#wbbtn','click', e => { ui.wb = !ui.wb; e.currentTarget.setAttribute('aria-pressed', ui.wb); WB.mount(); });
  on('#calcbtn','click', () => { ui.calc = !ui.calc; render(); });
  on('#calcx','click', () => { ui.calc = false; render(); });
  on('.ckeys button','click', e => calcKey(e.currentTarget.dataset.k));
  on('[data-open]','click', e => { const id = e.currentTarget.dataset.open; ui.open[id] = !ui.open[id]; const y = window.scrollY; render(); window.scrollTo(0,y); });
  on('#reset','click', () => { ui.confirm='reset'; const y = window.scrollY; render(); window.scrollTo(0,y); });
  on('#creset','click', () => { ui = {histTried:false, remoteHist:null, confirm:null, calc:false, wb:false, tab:0, sort:-1, open:{}, hideTimer:false}; S = fresh(); save(); render(); });
}
function rerenderStim(){ const el = $('.stim'); if (!el) return; el.innerHTML = stimHTML(curQ(), true);
  el.querySelectorAll('.tab').forEach(t => t.addEventListener('click', e => { ui.tab = +e.currentTarget.dataset.tab; rerenderStim(); }));
  const s = $('#sortsel'); if (s) s.addEventListener('change', e => { ui.sort = +e.target.value; rerenderStim(); }); }

if (typeof window !== 'undefined' && typeof document !== 'undefined' && document.getElementById){
  app = $('#app'); S = lsGet(KEY) || fresh(); if (!S.path) S = fresh(); S.lastTs = Date.now(); WB.strokes = lsGet(WBKEY) || [];
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && /gmat-test/.test(location.pathname)) navigator.serviceWorker.register('sw.js').catch(() => {});
  window.addEventListener('online', flushSync); setTimeout(flushSync, 1500);
  window.addEventListener('beforeunload', save); window.addEventListener('pagehide', save); document.addEventListener('visibilitychange', () => { save(); if (!document.hidden) tick(); }); window.addEventListener('resize', () => { if (WB.el) WB.fit(); }); render();
}
</script>
</body>
</html>
