c","kind":"Problem Solving"},{"id":"QA17","topic":"Word Problems","sub":"Translating word problems","b":-0.5,"stem":"A museum sold 50 tickets for a guided tour. Adult tickets cost $12 each and child tickets cost $8 each. If the total revenue from the 50 tickets was $520, how many adult tickets were sold?","opts":["20","25","30","35","40"],"ans":2,"expl":"If all 50 tickets were child tickets, revenue would be $400. Each adult ticket adds $4, and the extra $120 means 30 adult tickets. The value 20 is the number of child tickets.","sec":"Q","type":"mc","kind":"Problem Solving"},{"id":"QB01","topic":"Ratios","sub":"Combining ratios","b":0.5,"stem":"At a research institute, the ratio of chemists to biologists is 3 to 4, and the ratio of biologists to physicists is 6 to 5. If the institute employs 8 more physicists than chemists and employs no other scientists, how many scientists does it employ?","opts":["186","217","248","279","310"],"ans":2,"expl":"Make the biologist term match: 3 to 4 becomes 9 to 12 and 6 to 5 becomes 12 to 10, so chemists, biologists and physicists are in the ratio 9 to 12 to 10. Physicists exceed chemists by one part, so one part is 8. The total is 31 parts, or 248.","sec":"Q","type":"mc","kind":"Problem Solving"},{"id":"QB02","topic":"Percents","sub":"Double matrix method","b":0.9,"stem":"Of the applicants to a certain training program, 40 percent had prior work experience. The program admitted 30 percent of the applicants who had prior work experience and 10 percent of the applicants who did not. What percent of the admitted applicants had prior work experience?","opts":["18%","30%","60%","66 2/3%","75%"],"ans":3,"expl":"Take 100 applicants: 40 with experience, of whom 12 were admitted, and 60 without, of whom 6 were admitted. Of the 18 admitted, 12 had experience, which is 2/3 or 66 2/3%. The trap is 18%, the share of all applicants who were admitted.","sec":"Q","type":"mc","kind":"Problem Solving"},{"id":"QB03","topic":"Percents","sub":"Percentage concepts","b":1.5,"stem":"A 50-kilogram batch of mineral slurry is 98 percent water by mass. The batch is left in a drying bed until water makes up 96 percent of its mass, and nothing other than water is lost. What is the mass of the batch, in kilograms, after drying?","opts":["24.5","25","48","48.02","49"],"ans":1,"expl":"Track what does not change: the solids. They are 2% of 50 kilograms, which is 1 kilogram. After drying the solids are 4% of the batch, so the batch is 1/0.04 = 25 kilograms. Removing only 1 kilogram of water, which gives 49, wrongly treats the 2 point drop as 2% of the original mass.","sec":"Q","type":"mc","kind":"Problem Solving"},{"id":"QB04","topic":"Percents","sub":"Double matrix method","b":1.9,"stem":"Of the 120 clients of a consulting firm, 70 percent subscribe to the research service and 55 percent subscribe to the advisory service. If at least 10 percent of the clients subscribe to neither service, what is the difference between the greatest possible number and the least possible number of clients who subscribe to both services?","opts":["12","18","24","36","54"],"ans":2,"expl":"Research = 84, advisory = 66. If <i>N</i> clients take neither, then 84 + 66 − both = 120 − <i>N</i>, so both = 30 + <i>N</i>. <i>N</i> is at least 12, and it is at most 36 because the 84 research clients must fit among the 120. So both ranges from 42 to 66, a difference of 24.","sec":"Q","type":"mc","kind":"Problem Solving"},{"id":"QB05","topic":"Percents","sub":"Variables in options","b":1.5,"stem":"The positive number <i>x</i> is <i>p</i> percent greater than the positive number <i>y</i>, and <i>y</i> is <i>p</i> percent less than <i>z</i>, where 0 &lt; <i>p</i> &lt; 100. In terms of <i>p</i>, <i>x</i> is what percent less than <i>z</i>?","opts":["<i>p</i> / 100","<i>p</i><sup>2</sup> / 10,000","<i>p</i><sup>2</sup> / (100 + <i>p</i>)","2<i>p</i> − <i>p</i><sup>2</sup> / 100","<i>p</i><sup>2</sup> / 100"],"ans":4,"expl":"<i>x</i> = <i>z</i>(1 − <i>p</i>/100)(1 + <i>p</i>/100) = <i>z</i>(1 − <i>p</i><sup>2</sup>/10,000), so <i>x</i> is <i>p</i><sup>2</sup>/10,000 of <i>z</i> below <i>z</i>, which as a percent is <i>p</i><sup>2</sup>/100. Check with <i>p</i> = 20: 0.8 × 1.2 = 0.96, a 4 percent shortfall, and 20<sup>2</sup>/100 = 4.","sec":"Q","type":"mc","kind":"Problem Solving"},{"id":"QB06","topic":"Number Properties","sub":"LCM","b":0.6,"stem":"Three warning beacons flash at constant intervals of 18 seconds, 24 seconds and 40 seconds, respectively. If all three beacons flash together at exactly 9:00 a.m., how many more times will all three flash together after 9:00 a.m. and before 10:00 a.m.?","opts":["9","10","11","19","20"],"ans":0,"expl":"18 = 2 × 3<sup>2</sup>, 24 = 2<sup>3</sup> × 3 and 40 = 2<sup>3</sup> × 5, so the least common multiple is 2<sup>3</sup> × 3<sup>2</sup> × 5 = 360 seconds, or 6 minutes. The beacons coincide at 9:06, 9:12 and so on through 9:54, which is 9 times. Counting 10:00 itself gives the trap answer 10.","sec":"Q","type":"mc","kind":"Problem Solving"},{"id":"QB07","topic":"Number Properties","sub":"Prime numbers","b":0.9,"stem":"If <i>p</i> and <i>q</i> are different prime numbers, each greater than 2, which of the following could be a prime number?<div class=\"roman\">I. <i>p</i> + <i>q</i><br>II. <i>pq</i> + 2<br>III. (<i>p</i> + <i>q</i>) / 2</div>","opts":["I only","II only","III only","I and III only","II and III only"],"ans":4,"expl":"Both primes are odd, so <i>p</i> + <i>q</i> is an even number greater than 2 and cannot be prime. With 3 and 5, <i>pq</i> + 2 = 17, which is prime. With 3 and 7, (<i>p</i> + <i>q</i>)/2 = 5, which is prime. So II and III are possible and I is not.","sec":"Q","type":"mc","kind":"Problem Solving"},{"id":"QB08","topic":"Number Properties","sub":"Factors and prime factorization","b":1.9,"stem":"If <i>k</i> is a positive integer and <i>k</i><sup>3</sup> is divisible by 240, what is the least possible number of positive factors of <i>k</i>?","opts":["8","12","16","20","24"],"ans":1,"expl":"240 = 2<sup>4</sup> × 3 × 5. In <i>k</i><sup>3</sup> every prime exponent is 3 times its exponent in <i>k</i>, so <i>k</i> needs at least two 2s (one 2 would give only 2<sup>3</sup>), one 3 and one 5. So <i>k</i> is a multiple of 60 = 2<sup>2</sup> × 3 × 5, which has 3 × 2 × 2 = 12 factors, and any larger multiple of 60 has more. Taking <i>k</i> = 30, with 8 factors, fails because 30<sup>3</sup> has only three 2s.","sec":"Q","type":"mc","kind":"Problem Solving"},{"id":"QB09","topic":"Number Properties","sub":"Factorial","b":2,"stem":"What is the greatest integer <i>k</i> for which 6<sup><i>k</i></sup> is a factor of 28! + 29! + 30! ?","opts":["12","13","14","15","27"],"ans":3,"expl":"Factor out 28!: the sum is 28!(1 + 29 + 29 × 30) = 28!(30 + 29 × 30) = 28! × 30<sup>2</sup>. The number of 3s in 28! is 9 + 3 + 1 = 13, and 30<sup>2</sup> adds 2 more, for 15. There are far more 2s (25 in 28! plus 2), so the 3s set the limit and <i>k</i> = 15. Counting only 28! gives 13, and counting only 30! gives 14.","sec":"Q","type":"mc","kind":"Problem Solving"},{"id":"QB10","topic":"Number Properties","sub":"Co-prime numbers","b":1.9,"stem":"The positive integers <i>a</i> and <i>b</i> have no common factor greater than 1, and <i>a</i> &gt; <i>b</i>. Which of the following pairs of integers must have no common factor greater than 1?<div class=\"roman\">I. <i>a</i> and <i>a</i> + <i>b</i><br>II. <i>a</i> − <i>b</i> and <i>a</i> + <i>b</i><br>III. <i>ab</i> and <i>a</i> + <i>b</i></div>","opts":["I only","II only","I and II only","I and III only","I, II, and III"],"ans":3,"expl":"Any prime dividing both <i>a</i> and <i>a</i> + <i>b</i> also divides their difference <i>b</i>, which is impossible, so I holds. A prime dividing <i>ab</i> divides <i>a</i> or <i>b</i>; if it also divided <i>a</i> + <i>b</i> it would divide the other one too, so III holds. II fails: with <i>a</i> = 5 and <i>b</i> = 3, the pair is 2 and 8.","sec":"Q","type":"mc","kind":"Problem Solving"},{"id":"QB11","topic":"Number Properties","sub":"Remainders and GCD","b":2.1,"stem":"When each of the integers 89, 125 and 215 is divided by the positive integer <i>d</i>, the remainder is <i>r</i> in each case. If <i>d</i> has the greatest value for which this is possible, what is the value of <i>d</i> + <i>r</i>?","opts":["11","17","18","26","35"],"ans":4,"expl":"Numbers that leave the same remainder on division by <i>d</i> differ by multiples of <i>d</i>. The differences are 125 − 89 = 36 and 215 − 125 = 90, and their greatest common divisor is 18, so <i>d</i> = 18. Then 89 = 18 × 4 + 17, so <i>r</i> = 17 and <i>d</i> + <i>r</i> = 35.","sec":"Q","type":"mc","kind":"Problem Solving"},{"id":"QB12","topic":"Number Properties","sub":"Odd and even","b":1.8,"stem":"If <i>x</i>, <i>y</i> and <i>z</i> are integers such that <i>xy</i> + <i>z</i> is odd and <i>x</i> + <i>yz</i> is even, which of the following must be odd?","opts":["<i>z</i>(<i>x</i> + 1)","<i>x</i> + <i>y</i>","<i>yz</i>","<i>xz</i> + <i>y</i>","(<i>x</i> + 1)(<i>z</i> + 1)"],"ans":0,"expl":"Add the two expressions: <i>xy</i> + <i>z</i> + <i>x</i> + <i>yz</i> = (<i>x</i> + <i>z</i>)(<i>y</i> + 1), which is odd plus even, so odd. Both factors are odd, so <i>y</i> is even. Then <i>xy</i> is even, which makes <i>z</i> odd, and <i>yz</i> is even, which makes <i>x</i> even. Only <i>z</i>(<i>x</i> + 1), odd times odd, is odd.","sec":"Q","type":"mc","kind":"Problem Solving"},{"id":"QB13","topic":"Word Problems","sub":"Work","b":0.6,"stem":"A crew of 12 technicians, each working at the same constant rate, can complete an installation in 15 days. The full crew begins the installation, and after 5 days 4 of the technicians are reassigned to another site. How many more days will the remaining technicians need to complete the installation?","opts":["7.5","10","15","20","22.5"],"ans":2,"expl":"The job is 12 × 15 = 180 technician-days. The first 5 days use 60, leaving 120. With 8 technicians, 120/8 = 15 more days. The trap is 10, the time the full crew would have needed.","sec":"Q","type":"mc","kind":"Problem Solving"},{"id":"QB14","topic":"Word Problems","sub":"Upstream and downstream","b":0.8,"stem":"A patrol boat whose speed in still water is a constant 16 kilometers per hour travels downstream from a dock to a checkpoint in 3 hours and then returns upstream to the dock in 5 hours. If the speed of the current is constant, what is the distance, in kilometers, from the dock to the checkpoint?","opts":["48","60","64","75","80"],"ans":1,"expl":"Let the current be <i>c</i>. Equal distances give 3(16 + <i>c</i>) = 5(16 − <i>c</i>), so 8<i>c</i> = 32 and <i>c</i> = 4. The distance is 3 × 20 = 60 kilometers. Ignoring the current gives 48 or 80.","sec":"Q","type":"mc","kind":"Problem Solving"},{"id":"QB15","topic":"Word Problems","sub":"Work","b":1.4,"stem":"Working alone at its constant rate, pump A can fill an empty reservoir in 8 hours. Working alone at its constant rate, pump B can fill the same reservoir in 12 hours. The pumps are run one at a time in alternating one-hour shifts, beginning with pump A, until the reservoir is full. How many hours does it take to fill the empty reservoir?","opts":["9.5","9.6","10","10.5","11"],"ans":0,"expl":"In 24ths of the reservoir, A adds 3 per hour and B adds 2 per hour, so each two-hour cycle adds 5. After 4 cycles (8 hours) the reservoir holds 20. In hour 9, A brings it to 23, and B needs only half an hour for the last 1. The total is 9.5 hours. The trap is 9.6, from treating the alternation as an average rate of 2.5 per hour.","sec":"Q","type":"mc","kind":"Problem Solving"},{"id":"QB16","topic":"Word Problems","sub":"Circular tracks","b":2.4,"stem":"Runners P and Q each run at a constant speed around a circular track. When they start at the same time from the same point and run in the same direction, the faster runner, P, first draws level with Q at the moment P completes exactly 4 laps. If instead they start at the same time from the same point and run in opposite directions indefinitely, at how many different points on the track will they pass each other?","opts":["1","3","4","7","12"],"ans":3,"expl":"P gains exactly one lap on Q while running 4 laps, so Q runs 3 laps in that time and the speeds are in the ratio 4 to 3. Running in opposite directions, they cover one lap between them from one meeting to the next, of which P covers 4/7. So the meeting points fall at 4/7, 8/7, 12/7 and so on of a lap from the start, and since 4 and 7 share no factor, these land on all 7 points that divide the track into sevenths before repeating.","sec":"Q","type":"mc","kind":"Problem Solving"},{"id":"RC01","stim":"RCP1","sub":"Main idea","b":-1.3,"stem":"Which of the following best expresses the main idea of the passage?","opts":["Retailers of every kind should extend their return periods, since doing so always raises profits.","A lenient return policy can raise profits by encouraging purchases, although chiefly where buyers are uncertain about a product before they buy it.","The cost of handling returned items generally exceeds any benefit a retailer gains from a lenient return policy.","Customers frequently abuse generous return policies by returning items they have already used.","Mail-order retailers are more profitable than retailers that sell standardized goods in stores."],"ans":1,"expl":"The passage reports that a longer return period raised profit at one retailer and then limits the lesson to settings where buyers cannot judge a product in advance. The statement that all retailers should extend returns ignores that limit, the claim that costs exceed benefits reverses the finding, and abuse is only a minor point in the last paragraph.","sec":"V","type":"mc","kind":"Reading Comprehension","topic":"Reading Comprehension"},{"id":"RC02","stim":"RCP1","sub":"Detail","b":-1.1,"stem":"According to the passage, customers who were given the 90-day return period placed larger and more frequent orders because they","opts":["were offered lower prices than customers under the 30-day policy","were no longer charged a restocking fee on returned items","intended to use the items once and then send them back","were more willing to buy products that they could not examine before purchase","had been selected for the study because they were already frequent buyers"],"ans":3,"expl":"The surveys cited in the second paragraph indicate that easy returns made customers more willing to order items they could not examine in advance. Prices and restocking fees for this group are not discussed, single-use buying is mentioned only as a possible abuse elsewhere, and the group was selected at random.","sec":"V","type":"mc","kind":"Reading Comprehension","topic":"Reading Comprehension"},{"id":"RC03","stim":"RCP1","sub":"Application","b":-0.8,"stem":"Based on the passage, a more lenient return policy would be most likely to increase the profits of which of the following retailers?","opts":["An online retailer of handmade furniture that customers cannot see in person before it is delivered","A supermarket that sells packaged foods of well-known national brands","A hardware store in which customers can handle every tool before buying it","A shop selling formal wear that customers typically need for a single evening","A chain of stores selling standard printer cartridges identified by model number"],"ans":0,"expl":"The passage says a lenient policy is most valuable where buyers face real uncertainty before purchase, which is the position of someone ordering unseen handmade furniture. Packaged foods and printer cartridges are standardized, tools in a store can be inspected, and single-occasion formal wear is the kind of product the passage associates with abuse.","sec":"V","type":"mc","kind":"Reading Comprehension","topic":"Reading Comprehension"},{"id":"RC04","stim":"RCP2","sub":"Detail (EXCEPT)","b":-0.2,"stem":"The passage mentions each of the following as evidence bearing on the hypotheses about zebra stripes EXCEPT","opts":["a comparison of the intensity of striping with the regions and seasons in which biting flies are most active","observations of how flies behaved near horses wearing coats of different patterns","the limited sharpness of vision of certain predators","temperature measurements of barrels covered with hides of different patterns","rates of fly-borne disease among zebras whose stripes differ in intensity"],"ans":4,"expl":"The passage cites the geographic comparison, the horse-coat trials, the limited acuity of lions and hyenas, and the barrel measurements. It says that biting flies transmit diseases but reports no comparison of disease rates among zebras with different striping.","sec":"V","type":"mc","kind":"Reading Comprehension","topic":"Reading Comprehension"},{"id":"RC05","stim":"RCP2","sub":"Inference","b":-0.4,"stem":"The results of the field trials with horses most strongly support which of the following inferences?","opts":["Biting flies are more strongly attracted to white surfaces than to black ones.","Biting flies are unable to see striped surfaces at any distance.","Stripes do not substantially reduce the ability of biting flies to locate a host from a distance.","Horses wearing striped coats were bitten about as often as horses wearing coats of a single color.","Stripes deter biting flies chiefly by lowering the temperature of the surface on which the flies attempt to land."],"ans":2,"expl":"Flies approached all three kinds of coat at similar rates, so the stripes did not keep flies from finding the horses; the difference arose only at landing. Nothing compares white with black coats, far fewer flies landed on stripes so equal biting is unsupported, and the barrel measurements found no cooling effect.","sec":"V","type":"mc","kind":"Reading Comprehension","topic":"Reading Comprehension"},{"id":"RC06","stim":"RCP2","sub":"Function of a sentence","b":-0.7,"stem":"The author mentions the zebra's unusually short coat hairs primarily in order to","opts":["provide additional evidence against the hypothesis that stripes cool the animal","present a possible answer to a question that the fly hypothesis leaves open","explain why flies failed to slow down as they neared striped coats","suggest that the fly hypothesis is no better supported than the hypotheses it has displaced","show that zebras are exposed to more biting flies than other African grazers are"],"ans":1,"expl":"The preceding sentence raises an unresolved question: why zebras, unlike other grazers exposed to the same flies, needed protection. Short coat hairs are offered as one suggested answer. The passage says the other grazers face the same flies, and it does not treat the open question as undermining the fly hypothesis.","sec":"V","type":"mc","kind":"Reading Comprehension","topic":"Reading Comprehension"},{"id":"RC07","stim":"RCP3","sub":"Primary purpose","b":-0.2,"stem":"The primary purpose of the passage is to","opts":["show that the evidence on which a revisionist account relies is historically inaccurate","reconcile two explanations by showing that each applies to a different branch of the textile industry","describe the conditions under which textile workers labored before and after the rise of factories","assess a challenge to a conventional explanation and argue that the challenge, though partly valid, fails to account for the outcome at issue","argue that the rise of the factory is better explained by the desire to supervise workers than by new machinery"],"ans":3,"expl":"The passage sets out the technological explanation, presents the revisionist challenge, and then judges that challenge a useful corrective that nevertheless cannot explain why factories prevailed. The author accepts that the handloom workshops existed, so their accuracy is not disputed, and the claim that supervision is the better explanation is the revisionist position, not the author's.","sec":"V","type":"mc","kind":"Reading Comprehension","topic":"Reading Comprehension"},{"id":"RC08","stim":"RCP3","sub":"Inference","b":0.3,"stem":"It can be inferred from the passage that the author would most likely agree with which of the following statements about the early handloom workshops?","opts":["Their establishment indicates that merchants saw advantages in centralized production that did not depend on new machinery.","They yielded more cloth per weaver than domestic production did.","They failed chiefly because weavers continued to embezzle raw materials.","They were founded only after powered spinning machinery had come into general use.","Weavers employed in them generally accepted lower earnings than they had received at home."],"ans":0,"expl":"The author grants that supervision may well explain why merchants wanted factories, and the workshops used the same equipment as cottages, so their founding shows a motive independent of machinery. The passage says the workshops lacked more productive machinery, failed because of the wage premium weavers demanded, and preceded the new machines.","sec":"V","type":"mc","kind":"Reading Comprehension","topic":"Reading Comprehension"},{"id":"RC09","stim":"RCP3","sub":"Weaken","b":0.6,"stem":"Which of the following, if true, would most seriously weaken the author's assessment of the revisionist account?","opts":["Several owners of early cotton-spinning factories wrote that they valued the discipline that factory work imposed on their employees.","Weavers in handloom workshops produced no more cloth per day than they had produced at home.","In several branches of textile production that adopted no powered machinery, factories nonetheless displaced domestic work during the same decades.","Water-powered spinning frames could not be operated in buildings as small as a typical cottage.","Piece rates paid to domestic weavers varied considerably from one region to another."],"ans":2,"expl":"The author holds that factories prevailed only where powered machinery raised productivity. Factories displacing domestic work in branches with no such machinery would show that something other than technology, plausibly control, was enough for factories to prevail. Owners valuing discipline and unchanged output in handloom workshops are both consistent with the author's view, and the size of spinning frames supports the traditional account.","sec":"V","type":"mc","kind":"Reading Comprehension","topic":"Reading Comprehension"},{"id":"RC10","stim":"RCP3","sub":"Function of a detail","b":0.1,"stem":"The passage refers to the preference of households for leisure over further earnings primarily in order to","opts":["indicate that domestic workers were less skilled than factory workers","explain why weavers demanded a wage premium before they would enter a workshop","support the traditional view that cottages were unsuited to the new machinery","suggest that merchants exaggerated the difficulties of the putting-out system","account for a pattern of behavior that, on the revisionist view, gave merchants a reason to seek control over work"],"ans":4,"expl":"The preference for leisure explains why output slumped when piece rates rose, one of the complaints that, according to the revisionists, made control attractive to merchants. The wage premium is attributed in the next paragraph to the loss of independence, not to this preference, and skill and machinery are not at issue in this sentence.","sec":"V","type":"mc","kind":"Reading Comprehension","topic":"Reading Comprehension"},{"id":"RC11","stim":"RCP4","sub":"Author's attitude","b":1.1,"stem":"The author's attitude toward selective realism is best described as one of","opts":["dismissal, on the ground that the distinction between working and idle constituents cannot be drawn in a principled way","skepticism, on the ground that a position whose content can be fixed only in hindsight must be mistaken","qualified acceptance: the position withstands a common objection but does not supply the guidance about current theories that realism was meant to provide","approval, on the ground that the position shows the historical record to pose no obstacle to belief in current theories","detachment, since the author reports the views of realists and their critics without evaluating either"],"ans":2,"expl":"The author calls the rejoinder more robust than its critics allow, rejecting the arbitrariness charge, yet less informative than its defenders suppose, because it cannot say which parts of current theory to believe. The author explicitly denies that the retrospective character of the position makes it false, and says its application to present science remains largely unsecured.","sec":"V","type":"mc","kind":"Reading Comprehension","topic":"Reading Comprehension"},{"id":"RC12","stim":"RCP4","sub":"Inference","b":1.8,"stem":"The author's contrast between a conceptual difficulty and an epistemic one most strongly suggests that the author would accept which of the following statements?","opts":["Whether the ether hypothesis figured in the derivation of correct predictions about light was a determinate matter even when physicists were poorly placed to judge it.","The ether hypothesis became an idle constituent of its theory only once a successor theory had dispensed with it.","Because ether theorists regarded the ether as indispensable, it should be counted among the working constituents of their theory.","No constituent of a theory can be classified as working or idle except by reference to the theory that eventually replaces it.","Scientists are generally better placed than their successors to determine which premises their own derivations employed."],"ans":0,"expl":"The author says the question of which premises a derivation employed has an answer independent of later belief, and locates the trouble in when that answer can be confidently known. So the status of the ether was determinate even while practitioners misjudged it. The statements that tie idleness to the successor theory or to practitioners' opinions treat the difficulty as conceptual, which the author denies.","sec":"V","type":"mc","kind":"Reading Comprehension","topic":"Reading Comprehension"},{"id":"RC13","stim":"RCP4","sub":"Weaken","b":2.3,"stem":"Which of the following, if true, would most seriously weaken the author's principal reservation about selective realism?","opts":["The equations from which ether theorists derived their predictions are retained with little change in current physical theory.","Reconstructions by present-day historians show that the successful derivations of the ether theorists go through without any premise concerning a medium.","Many posits central to currently accepted theories are of the same general kind as posits that were later abandoned.","In a number of historical episodes, scientists used a criterion available to them at the time to mark certain posits of their own successful theories as dispensable, and those were the posits later abandoned.","Some theories now judged mistaken in their central posits never yielded any startling predictions."],"ans":3,"expl":"The reservation is that idle posits have been identified with confidence only in retrospect, so the position cannot guide belief about current theory. Evidence that practitioners reliably identified dispensable posits in advance, by a criterion statable at the time, removes that worry. Retained equations and present-day reconstructions are retrospective and merely support points the author already grants, while the remaining statements bear on the critics' historical argument.","sec":"V","type":"mc","kind":"Reading Comprehension","topic":"Reading Comprehension"},{"id":"RC14","stim":"RCP4","sub":"Analogy","b":1.3,"stem":"Which of the following is most closely analogous to the situation of selective realism as the author characterizes it in the final paragraph?","opts":["A scheme of classification whose categories are so loosely drawn that any item could be assigned to any of them","A rule advising investors to hold only the shares responsible for a portfolio's gains, when which shares were responsible can be established only after the period has ended","A forecasting method that was accurate for decades and then failed abruptly when conditions changed","A clinical guideline that identifies in advance which patients will benefit from a treatment but cannot explain why they benefit","A historical account that is abandoned when newly discovered documents contradict its central claim"],"ans":1,"expl":"The author holds that selective realism rests on a real distinction and reads the past correctly, but that the distinction can be applied with confidence only in hindsight and so offers no present guidance. The investment rule is sound in principle yet usable only after the fact. A loosely drawn classification matches the arbitrariness charge the author rejects, and a guideline that works in advance is the opposite case.","sec":"V","type":"mc","kind":"Reading Comprehension","topic":"Reading Comprehension"},{"id":"CR01","sub":"Weaken","b":-1.2,"stem":"<p>Six months ago the public library in Pellmore began keeping its central branch open until 10 p.m. on weekdays instead of closing at 6 p.m. In the six months since, the number of books borrowed from the central branch each month has been 12 percent higher than in the same months a year earlier. The library's director concludes that the longer opening hours are responsible for the increase in borrowing.</p><p>Which of the following, if true, most seriously weakens the director's conclusion?</p>","opts":["Keeping the central branch open until 10 p.m. has raised the library's staffing costs.","The central branch holds more books than any other library branch in Pellmore.","Libraries in several towns near Pellmore did not change their opening hours during the past six months.","Shortly after the central branch extended its hours, the library closed its branch in the eastern part of Pellmore and directed that branch's borrowers to the central branch.","Most of the books borrowed from the central branch after 6 p.m. are novels."],"ans":3,"expl":"If borrowers from a closed branch were sent to the central branch during the same six months, their borrowing alone could account for the 12 percent rise. That gives a cause other than the longer hours. Staffing costs, the size of the collection and the kinds of books borrowed say nothing about why borrowing increased.","sec":"V","type":"mc","kind":"Critical Reasoning","topic":"Critical Reasoning"},{"id":"CR02","sub":"Weaken","b":-0.3,"stem":"<p>Street parking in the central district of Marvesh is nearly always full, and drivers circling in search of a space add substantially to traffic congestion there. The city council plans to double the hourly rate charged at the district's parking meters. Council members reason that the higher rate will lead many drivers to leave their cars at home, so that fewer cars will be circling and congestion in the district will ease.</p><p>Which of the following, if true, casts the most doubt on the council members' reasoning?</p>","opts":["The great majority of drivers who park at meters in the central district have their parking charges reimbursed in full by their employers.","The hourly rate at meters in the central district has not been raised in more than ten years.","Some drivers who now park at meters in the central district would switch to private garages there if the rate were doubled.","Bus service between the central district and the rest of Marvesh is frequent and runs until midnight.","If the rate were doubled and meter use stayed the same, the city's revenue from parking meters would double."],"ans":0,"expl":"The plan works only if the higher rate is felt by the drivers who park at meters. If employers reimburse the charges in full, those drivers have no added reason to leave their cars at home. Drivers moving to garages would stop circling, and good bus service makes leaving the car at home easier, so both of those facts support the plan.","sec":"V","type":"mc","kind":"Critical Reasoning","topic":"Critical Reasoning"},{"id":"CR03","sub":"Weaken","b":1.1,"stem":"<p>Last year the education ministry of Daroval identified the 50 secondary schools with the lowest average scores on the national mathematics examination and assigned each of them a team of specialist coaches. On this year's examination the average score of those 50 schools was nine points higher than it had been last year, whereas the national average was unchanged. The ministry concludes that the coaching was responsible for the improvement and proposes to extend it to 200 more schools.</p><p>Which of the following, if true, most seriously weakens the ministry's conclusion?</p>","opts":["Several of the 50 schools had also been among the 50 lowest-scoring schools in each of the three years before last year.","The average score of the 50 schools on this year's examination remained well below the national average.","The coaches were drawn from schools whose examination scores were among the highest in Daroval.","The schools that ranked just above the lowest 50 last year, none of which received coaching, showed on average no improvement this year.","Historically, schools in Daroval whose average scores in a given year were unusually low or unusually high have tended to score much closer to the national average in the following year."],"ans":4,"expl":"The 50 schools were chosen because their scores were extreme in a single year. If extreme scores in Daroval ordinarily drift back toward the national average the next year, a rise of several points was to be expected with no coaching at all. Uncoached schools just above the cutoff failing to improve would, if anything, support the ministry, and scores that are still below average are consistent with real improvement.","sec":"V","type":"mc","kind":"Critical Reasoning","topic":"Critical Reasoning"},{"id":"CR04","sub":"Strengthen","b":-1,"stem":"<p>Halvern Growers raises tomatoes in six greenhouses. Last season it placed bumblebee hives in one greenhouse and, in the other five, continued to rely on workers who pollinate the plants by shaking them by hand. The plants in the greenhouse with the hives yielded 18 percent more fruit by weight than the plants in the other greenhouses did. Halvern's managers conclude that pollination by bumblebees increases tomato yield, and they plan to place hives in all six greenhouses.</p><p>Which of the following, if true, most strengthens the managers' conclusion?</p>","opts":["Bumblebee hives must be replaced roughly every ten weeks during the growing season.","All six greenhouses were planted last season with the same tomato variety and were kept at the same temperature, humidity and light levels.","The greenhouse in which the hives were placed is the most recently built of the six and has the newest irrigation equipment.","Some growers of peppers and strawberries in the same region also keep bumblebee hives.","The workers who had previously pollinated plants in the greenhouse with the hives were assigned to other tasks last season."],"ans":1,"expl":"The conclusion attributes the higher yield to the bees and not to some other difference among the greenhouses. Learning that variety, temperature, humidity and light were the same everywhere removes the most obvious rival explanations. Newer irrigation equipment in the greenhouse with the hives would be exactly such a rival explanation and would weaken the conclusion.","sec":"V","type":"mc","kind":"Critical Reasoning","topic":"Critical Reasoning"},{"id":"CR05","sub":"Strengthen","b":0.1,"stem":"<p>Sundric Lines operates four diesel ferries between Port Almeda and Kessin Island. It plans to replace them with battery-powered electric ferries, each of which costs considerably more to buy than a new diesel ferry does. Sundric's managers argue that, because electricity for the crossings will cost far less than diesel fuel, the savings in operating costs will more than make up for the higher purchase price within eight years.</p><p>Which of the following, if true, provides the strongest support for the managers' argument?</p>","opts":["Electric ferries are quieter than diesel ferries, and passengers surveyed by Sundric said they would prefer them.","The price of diesel fuel in the region has both risen and fallen sharply during the past decade.","The batteries, which are by far the most expensive component of an electric ferry, are guaranteed by their manufacturer to operate without replacement for at least twelve years.","Two other ferry operators in the same country have recently ordered electric ferries.","Each port served by an electric ferry needs a charging station, which Sundric would have to build at its own expense."],"ans":2,"expl":"The argument counts only fuel savings against the higher purchase price, so it fails if some other large cost arises within the eight years. A guarantee that the costly batteries will not need replacing for twelve years removes the most likely such cost. Charging stations are an additional expense and weaken the argument, while passenger preference and other operators' orders do not bear on costs.","sec":"V","type":"mc","kind":"Critical Reasoning","topic":"Critical Reasoning"},{"id":"CR06","sub":"Strengthen","b":1.5,"stem":"<p>Researchers at Elvast Laboratories tested Relvane, a new drug for chronic migraine, in a twelve-week trial. Four hundred patients were assigned at random to receive either Relvane or a placebo, and neither the patients nor the physicians who assessed them knew which they were receiving. Among the patients who completed all twelve weeks, those taking Relvane reported a markedly greater reduction in the number of migraine days per month than those taking the placebo did. The researchers concluded that Relvane reduces the frequency of migraines.</p><p>Which of the following, if true, most strengthens the researchers' conclusion?</p>","opts":["Patients who left the trial early were no more numerous in the group receiving Relvane than in the group receiving the placebo, and in both groups nearly all of them left for reasons unrelated to their migraines.","Patients in the placebo group who completed the trial reported, on average, a small reduction in the number of migraine days per month.","Patients taking Relvane reported fewer side effects than the researchers had expected.","Among the patients assigned to Relvane, those who left the trial early had, at the time they left, experienced a smaller reduction in migraine days than those who went on to complete the trial.","The daily diary used to count migraine days has been used in trials of several earlier migraine treatments."],"ans":0,"expl":"Random assignment makes the two groups comparable at the start, but the comparison reported covers only patients who finished. If patients who were not improving dropped out of the Relvane group, the remaining patients would look better whether or not the drug works. Showing that withdrawals were equally common in both groups and unrelated to migraines closes that gap. Early leavers in the Relvane group having improved less is the very pattern that would undermine the result.","sec":"V","type":"mc","kind":"Critical Reasoning","topic":"Critical Reasoning"},{"id":"CR07","sub":"Assumption","b":-1.1,"stem":"<p>Veltra Cycles has always sold its bicycles only through independent dealers. Next year it will also begin selling directly to consumers through its own website. Veltra's managers predict that the total number of Veltra bicycles sold each year will rise as a result, since the website will reach consumers in the many towns of Ostravia that have no Veltra dealer.</p><p>The managers' prediction depends on which of the following assumptions?</p>","opts":["Bicycles sold through the website will be priced lower than the same bicycles sold by dealers.","Veltra will earn a larger profit on each bicycle sold through the website than on each bicycle sold through a dealer.","None of Veltra's competitors sells bicycles directly to consumers through a website.","Most consumers in towns that have no Veltra dealer do not currently own a bicycle.","The opening of the website will not cause a decline in sales through dealers large enough to offset the sales made through the website."],"ans":4,"expl":"The prediction concerns total sales, which are dealer sales plus website sales. If dealer sales fell by as much as the website sold, for example because existing customers simply switched channels, the total would not rise. Prices, profit per bicycle and competitors' practices could be otherwise without affecting whether the total rises.","sec":"V","type":"mc","kind":"Critical Reasoning","topic":"Critical Reasoning"},{"id":"CR08","sub":"Assumption","b":0.8,"stem":"<p>Two years ago Dorrin Appliances began buying the water pumps for its dishwashers from a new supplier, and every dishwasher it has sold since then contains one of that supplier's pumps. Dorrin offers a one-year warranty on every dishwasher it sells. In the past twelve months the number of warranty claims Dorrin received for dishwashers was one-third lower than in the twelve months before the change of supplier. Dorrin's quality manager concludes that the new supplier's pumps are more reliable than the pumps Dorrin used previously.</p><p>The quality manager's conclusion depends on which of the following assumptions?</p>","opts":["The new supplier's pumps cost Dorrin no more than the pumps it used previously.","Before the change of supplier, a failed pump was the cause of every warranty claim Dorrin received for a dishwasher.","Dishwashers made by Dorrin's competitors have not also generated fewer warranty claims in the past twelve months.","Dorrin did not sell substantially fewer dishwashers in the past two years than in the two years before the change of supplier.","The new supplier does not sell water pumps to any other maker of dishwashers."],"ans":3,"expl":"The evidence is a count of claims, and the count depends on how many dishwashers are under warranty as well as on how reliable they are. If far fewer dishwashers had been sold recently, claims would fall even with pumps of unchanged reliability. The argument does not need pumps to have caused every earlier claim, only some of them.","sec":"V","type":"mc","kind":"Critical Reasoning","topic":"Critical Reasoning"},{"id":"CR09","sub":"Assumption","b":1.8,"stem":"<p>Ten years ago, coal-fired plants generated 60 percent of the electricity produced in Calvessa; today they generate 45 percent, and wind and solar installations account for nearly all of the difference. The amount of carbon dioxide emitted for each unit of electricity generated from coal has not changed over that period. Calvessa's energy minister concludes that the country's coal-fired plants now emit less carbon dioxide each year than they did ten years ago.</p><p>The minister's conclusion depends on which of the following assumptions?</p>","opts":["The total amount of electricity generated in Calvessa each year has not increased over the past ten years.","The total amount of electricity generated in Calvessa each year has not grown by one-third or more over the past ten years.","Generating a unit of electricity from wind or solar installations emits less carbon dioxide than generating a unit of electricity from coal.","The amount of electricity generated from coal in Calvessa each year has fallen by 15 percent over the past ten years.","None of the coal-fired plants operating in Calvessa ten years ago has since been replaced by a newer coal-fired plant."],"ans":1,"expl":"With emissions per unit fixed, coal emissions fall only if the amount of coal-generated electricity falls, and that amount is the coal share times total generation. A share of 45 percent yields less than the old 60 percent only if the total has grown by a factor smaller than 60/45, that is, by less than one-third. No growth at all would guarantee the conclusion but is more than the argument needs, since the conclusion survives modest growth. A fall of exactly 15 percent confuses percentage points with percent and is also not required.","sec":"V","type":"mc","kind":"Critical Reasoning","topic":"Critical Reasoning"},{"id":"CR10","sub":"Inference","b":-0.9,"stem":"<p>Kestrel Dairy sells milk only to supermarkets in the province of Ardane, and milk is the only product it sells. The number of liters of milk that Kestrel sold last year was exactly the same as the number it sold the year before, but its revenue from milk sales was higher last year than the year before. Kestrel's cost of producing each liter of milk was also higher last year than the year before.</p><p>If the statements above are true, which of the following must also be true?</p>","opts":["Kestrel's profit was higher last year than the year before.","Supermarkets in Ardane charged shoppers more for milk last year than the year before.","The average price per liter that Kestrel received for its milk was higher last year than the year before.","Kestrel's share of the milk sold to supermarkets in Ardane was the same last year as the year before.","The total amount of milk bought by supermarkets in Ardane did not increase last year."],"ans":2,"expl":"Revenue is liters sold times the average price received. With liters unchanged and revenue higher, the average price per liter must have been higher. Profit cannot be determined because both revenue and unit cost rose, and nothing is said about retail prices or about the rest of the Ardane market.","sec":"V","type":"mc","kind":"Critical Reasoning","topic":"Critical Reasoning"},{"id":"CR11","sub":"Inference","b":1.5,"stem":"<p>At Ostrin Pharma, a compound is advanced to clinical trials only if it has passed both a toxicity screen and a stability screen. Any compound that fails the toxicity screen is archived, and an archived compound is never advanced to clinical trials. Last year every compound developed by Ostrin's Halde laboratory was either advanced to clinical trials or archived. Some of the Halde compounds that passed the toxicity screen last year were not advanced to clinical trials.</p><p>If the statements above are true, which of the following must also be true?</p>","opts":["Some of the Halde laboratory's compounds failed the stability screen last year.","Every Halde compound that passed both screens last year was advanced to clinical trials.","Every Halde compound that was archived last year had failed the toxicity screen.","At least one Halde compound that was archived last year had passed the toxicity screen.","Any Halde compound that failed the stability screen last year had also failed the toxicity screen."],"ans":3,"expl":"Every Halde compound was either advanced or archived, so the compounds that passed the toxicity screen but were not advanced must have been archived. Failing the toxicity screen is therefore sufficient for being archived but is not the only route to it. Passing both screens is required for advancement but does not guarantee it, so the compounds that were held back need not have failed the stability screen.","sec":"V","type":"mc","kind":"Critical Reasoning","topic":"Critical Reasoning"},{"id":"CR12","sub":"Evaluate","b":-0.6,"stem":"<p>Brandt and Oyelaran, a maker of hand tools, plans to close its plant in the city of Sorrenta and move all production to a new plant in the country of Velmora, where hourly wages for factory workers are 40 percent lower. The company has determined that the cost of materials, energy, and shipping for each tool would be the same at either location. Its managers conclude that the move will reduce the company's cost of producing each tool.</p><p>Which of the following would be most useful to know in evaluating the managers' conclusion?</p>","opts":["Whether any of the company's competitors have moved production to Velmora","Whether workers at the Velmora plant would produce about as many tools per hour as workers at the Sorrenta plant do","Whether hourly wages for factory workers are lower in Velmora than in the countries that border it","Whether the Sorrenta plant could be sold for more than it cost the company to build","Whether the company's sales of hand tools have grown over the past five years"],"ans":1,"expl":"Labor cost per tool is the hourly wage divided by the number of tools a worker makes in an hour. A wage that is 40 percent lower reduces the cost per tool only if output per hour does not fall by a comparable proportion. The sale price of the old plant is a one-time amount and does not change what each tool costs to produce.","sec":"V","type":"mc","kind":"Critical Reasoning","topic":"Critical Reasoning"},{"id":"CR13","sub":"Resolve the paradox","b":-1.3,"stem":"<p>To reduce the amount of plastic discarded by households, the town of Wexcombe prohibited shops from giving customers thin plastic carrier bags. In the year after the prohibition took effect, shops in Wexcombe handed out virtually no such bags. Yet the total weight of plastic in the household refuse collected in the town was greater than in the year before, although the town's population and the volume of goods sold in its shops were unchanged.</p><p>Which of the following, if true, most helps to explain the increase in the weight of plastic in household refuse?</p>","opts":["Before the prohibition, most households in Wexcombe reused carrier bags to line their refuse bins; afterward they bought bin liners, each of which contains several times as much plastic as a carrier bag.","Towns neighboring Wexcombe did not prohibit thin plastic carrier bags during the same period.","Paper bags cost shops in Wexcombe more to supply than thin plastic carrier bags did.","A large majority of Wexcombe's residents said that they supported the prohibition.","The prohibition exempts the small bags used to wrap raw meat and fish, and shops handed out as many of these as before."],"ans":0,"expl":"If the banned bags had been doing a second job as bin liners, households had to replace them, and the replacements contain much more plastic each. That turns the removal of light bags into a net increase in discarded plastic. An exemption for bags whose use did not change cannot explain why the total rose.","sec":"V","type":"mc","kind":"Critical Reasoning","topic":"Critical Reasoning"},{"id":"CR14","sub":"Boldface","b":1.2,"stem":"<p>Critics of Tavora's central bank contend that its decision to hold interest rates steady will allow inflation to accelerate. <b>Consumer prices in Tavora did rise faster last quarter than in any quarter of the preceding five years.</b> Yet nearly all of that rise is traceable to a single poor harvest, which pushed up food prices and whose effects will fade once the next crop is brought in. Prices of goods and services other than food have risen no faster than before. <b>So last quarter's figures give little reason to expect persistent inflation</b>, and the bank's decision is therefore defensible.</p><p>In the argument given, the two portions in boldface play which of the following roles?</p>","opts":["The first is evidence that the argument offers in support of its main conclusion; the second is that main conclusion.","The first is a claim whose truth the argument disputes; the second is a conclusion that the argument draws in order to support its main conclusion.","The first is a fact that the argument grants and that appears to favor the critics' position; the second is a conclusion that the argument draws in order to support its main conclusion.","The first is a fact that the argument grants and that appears to favor the critics' position; the second is the main conclusion of the argument.","The first is a finding whose significance the argument seeks to limit; the second is evidence offered in support of that limitation."],"ans":2,"expl":"The argument accepts that prices rose unusually fast, a fact that seems to back the critics, and then explains it away as a temporary effect of one harvest. From that explanation it infers that the figures do not point to persistent inflation, and it uses this inference to reach its final claim that the bank's decision is defensible. The second boldface portion is thus an intermediate conclusion, not the main conclusion and not a piece of evidence.","sec":"V","type":"mc","kind":"Critical Reasoning","topic":"Critical Reasoning"},{"id":"CR15","sub":"Flaw in the reasoning","b":0.2,"stem":"<p>Rapido Couriers, a scooter delivery firm in the city of Novessa, reviewed every accident involving its riders over the past three years. Seventy percent of the accidents took place within two kilometers of the depot from which the rider had set out. The firm's safety officer concludes that the streets close to the depots are more dangerous for riders than streets farther away, and recommends that the depots be moved to quieter districts.</p><p>The safety officer's reasoning is most vulnerable to the criticism that it</p>","opts":["treats a condition that is sufficient for an accident to occur as though it were necessary for an accident to occur","relies on a record of accidents that covers too short a period to reveal any pattern","takes for granted that riders who have accidents are less skilled than riders who do not","draws a conclusion about all of the firm's depots from evidence about only one of them","fails to consider that the firm's riders may do the great majority of their riding within two kilometers of their depots"],"ans":4,"expl":"A count of accidents shows where accidents happen, not how risky each kilometer ridden is. Every delivery starts and ends at a depot, so riders may cover far more distance near depots than anywhere else, and 70 percent of accidents could then reflect lower risk per kilometer, not higher. The review covered every accident at the firm over three years, so the objections about a short record or a single depot do not apply.","sec":"V","type":"mc","kind":"Critical Reasoning","topic":"Critical Reasoning"},{"id":"CR16","sub":"Complete the passage","b":-0.8,"stem":"<p>Pear growers in the Lunetta Valley depend on seasonal pickers who travel from other regions and whose contracts bring them to the valley in the first week of September, when the pears normally ripen. This year an unusually warm spring has caused the pears to ripen three weeks early, and pears left on the tree for more than a few days after ripening cannot be sold. The growers nevertheless expect to lose very little of this year's crop, since __________.</p><p>Which of the following most logically completes the passage?</p>","opts":["pears from the Lunetta Valley usually sell for a higher price than pears grown in other regions","enough residents of the valley's own towns have agreed to work as pickers during the weeks before the seasonal pickers arrive","the warm spring has also caused pears to ripen early in the regions from which the seasonal pickers travel","the seasonal pickers are paid according to the weight of the fruit they pick","weather forecasters expect next year's spring in the valley to be cooler than this year's"],"ans":1,"expl":"The crop is at risk because ripe pears must be picked within days and the usual pickers will not arrive for three weeks. The growers' confidence makes sense only if someone else can pick the fruit in the meantime, which local residents working as pickers would do. Early ripening in the pickers' home regions would, if anything, keep them away longer.","sec":"V","type":"mc","kind":"Critical Reasoning","topic":"Critical Reasoning"},{"sec":"D","type":"mc","kind":"Data Sufficiency","topic":"Data Sufficiency","id":"DA01","sub":"Percent discount","b":-1.4,"ans":0,"expl":"From the first statement, 80 percent of the list price is $96, so the list price is $120: sufficient. The second statement gives only the dollar amount of the discount, which fits a list price of $120, $200 or any other amount above $24: not sufficient.","opts":["Statement (1) ALONE is sufficient, but statement (2) alone is not sufficient.","Statement (2) ALONE is sufficient, but statement (1) alone is not sufficient.","BOTH statements TOGETHER are sufficient, but NEITHER statement ALONE is sufficient.","EACH statement ALONE is sufficient.","Statements (1) and (2) TOGETHER are NOT sufficient."],"stem":"<p>What was the list price of a certain jacket?</p><div class=\"ds\"><div><span>(1)</span> At a discount of 20 percent from its list price, the jacket sold for $96.</div><div><span>(2)</span> The jacket sold for $24 less than its list price.</div></div>"},{"sec":"D","type":"mc","kind":"Data Sufficiency","topic":"Data Sufficiency","id":"DA02","sub":"Multiples","b":-1.2,"ans":3,"expl":"The only multiple of 8 strictly between 40 and 50 is 48, so the first statement is sufficient. The only multiple of 12 in that range is also 48, so the second statement is sufficient as well. Each statement alone fixes the value.","opts":["Statement (1) ALONE is sufficient, but statement (2) alone is not sufficient.","Statement (2) ALONE is sufficient, but statement (1) alone is not sufficient.","BOTH statements TOGETHER are sufficient, but NEITHER statement ALONE is sufficient.","EACH statement ALONE is sufficient.","Statements (1) and (2) TOGETHER are NOT sufficient."],"stem":"<p>If <i>n</i> is an integer and 40 &lt; <i>n</i> &lt; 50, what is the value of <i>n</i>?</p><div class=\"ds\"><div><span>(1)</span> <i>n</i> is a multiple of 8.</div><div><span>(2)</span> <i>n</i> is a multiple of 12.</div></div>"},{"sec":"D","type":"mc","kind":"Data Sufficiency","topic":"Data Sufficiency","id":"DA03","sub":"Ordering","b":-0.9,"ans":2,"expl":"With the first statement alone, the order could be Amara, Bruno, Chen or Amara, Chen, Bruno, so Wednesday is not fixed. With the second alone, the order could be Chen, Amara, Bruno or Bruno, Chen, Amara. Together the only possible order is Chen, Amara, Bruno, so Bruno was interviewed on Wednesday.","opts":["Statement (1) ALONE is sufficient, but statement (2) alone is not sufficient.","Statement (2) ALONE is sufficient, but statement (1) alone is not sufficient.","BOTH statements TOGETHER are sufficient, but NEITHER statement ALONE is sufficient.","EACH statement ALONE is sufficient.","Statements (1) and (2) TOGETHER are NOT sufficient."],"stem":"<p>Amara, Bruno and Chen were each interviewed for a position on a different one of three days: Monday, Tuesday and Wednesday of the same week. Who was interviewed on Wednesday?</p><div class=\"ds\"><div><span>(1)</span> Amara was interviewed on an earlier day than Bruno.</div><div><span>(2)</span> Chen was interviewed on an earlier day than Amara.</div></div>"},{"sec":"D","type":"mc","kind":"Data Sufficiency","topic":"Data Sufficiency","id":"DA04","sub":"Equivalent equations","b":-0.8,"ans":4,"expl":"The second statement is the first statement doubled, so the two together carry no more information than one of them. One equation in two unknowns allows, for example, pens at $2.00 and notebooks at $3.00, or pens at $0.50 and notebooks at $4.00. The price of a notebook cannot be determined even with both statements.","opts":["Statement (1) ALONE is sufficient, but statement (2) alone is not sufficient.","Statement (2) ALONE is sufficient, but statement (1) alone is not sufficient.","BOTH statements TOGETHER are sufficient, but NEITHER statement ALONE is sufficient.","EACH statement ALONE is sufficient.","Statements (1) and (2) TOGETHER are NOT sufficient."],"stem":"<p>At a stationery shop, every pen sells for the same price and every notebook sells for the same price. What is the price of one notebook?</p><div class=\"ds\"><div><span>(1)</span> 2 pens and 3 notebooks sell for a total of $13.00.</div><div><span>(2)</span> 4 pens and 6 notebooks sell for a total of $26.00.</div></div>"},{"sec":"D","type":"mc","kind":"Data Sufficiency","topic":"Data Sufficiency","id":"DA05","sub":"Ratio to fraction","b":-0.5,"ans":0,"expl":"A ratio of 5 to 3 means that 3 of every 8 employees are part-time, so the first statement alone gives 3/8. The second statement gives only a difference: 50 and 2, or 120 and 72, both fit and give different fractions. The actual head count is not needed, so combining the statements is unnecessary.","opts":["Statement (1) ALONE is sufficient, but statement (2) alone is not sufficient.","Statement (2) ALONE is sufficient, but statement (1) alone is not sufficient.","BOTH statements TOGETHER are sufficient, but NEITHER statement ALONE is sufficient.","EACH statement ALONE is sufficient.","Statements (1) and (2) TOGETHER are NOT sufficient."],"stem":"<p>Each employee of a certain company is either full-time or part-time. What fraction of the company's employees are part-time?</p><div class=\"ds\"><div><span>(1)</span> The ratio of the number of full-time employees to the number of part-time employees is 5 to 3.</div><div><span>(2)</span> The company has 48 more full-time employees than part-time employees.</div></div>"},{"sec":"D","type":"mc","kind":"Data Sufficiency","topic":"Data Sufficiency","id":"DA06","sub":"Commission threshold","b":0.2,"ans":1,"expl":"A commission above $3,000 requires more than $50,000 of sales above the threshold, that is, total sales above $70,000. The first statement allows sales of $65,000 or $90,000, so it does not settle the question. The second statement caps the commission below 6 percent of $48,000, which is $2,880, so the answer is a definite no and the statement is sufficient.","opts":["Statement (1) ALONE is sufficient, but statement (2) alone is not sufficient.","Statement (2) ALONE is sufficient, but statement (1) alone is not sufficient.","BOTH statements TOGETHER are sufficient, but NEITHER statement ALONE is sufficient.","EACH statement ALONE is sufficient.","Statements (1) and (2) TOGETHER are NOT sufficient."],"stem":"<p>In June, Lorenzo's only commission was equal to 6 percent of the portion of his June sales in excess of $20,000. Was Lorenzo's commission for June greater than $3,000?</p><div class=\"ds\"><div><span>(1)</span> Lorenzo's sales for June were greater than $60,000.</div><div><span>(2)</span> Lorenzo's sales for June were less than $68,000.</div></div>"},{"sec":"D","type":"mc","kind":"Data Sufficiency","topic":"Data Sufficiency","id":"DA07","sub":"Decision rule","b":-0.3,"ans":2,"expl":"The first statement leaves her total at two, three or four quarters, so it is not sufficient. The second leaves her total at one, two or three quarters, so it is not sufficient either. Together she met the target in exactly three quarters, so she received the bonus.","opts":["Statement (1) ALONE is sufficient, but statement (2) alone is not sufficient.","Statement (2) ALONE is sufficient, but statement (1) alone is not sufficient.","BOTH statements TOGETHER are sufficient, but NEITHER statement ALONE is sufficient.","EACH statement ALONE is sufficient.","Statements (1) and (2) TOGETHER are NOT sufficient."],"stem":"<p>A firm pays a year-end bonus to each salesperson who met the quarterly sales target in at least three of the four quarters of the year, and to no one else. Did Mirela, a salesperson at the firm, receive a year-end bonus?</p><div class=\"ds\"><div><span>(1)</span> Mirela met the quarterly sales target in each of the first two quarters of the year.</div><div><span>(2)</span> Mirela met the quarterly sales target in exactly one of the last two quarters of the year.</div></div>"},{"sec":"D","type":"mc","kind":"Data Sufficiency","topic":"Data Sufficiency","id":"DA08","sub":"Mixtures","b":0,"ans":3,"expl":"Either statement shows that the mixture contains 12 liters of alcohol. For 12 liters to be 20 percent of the total, the total must be 60 liters, so 20 liters of water must be added. Each statement alone is sufficient.","opts":["Statement (1) ALONE is sufficient, but statement (2) alone is not sufficient.","Statement (2) ALONE is sufficient, but statement (1) alone is not sufficient.","BOTH statements TOGETHER are sufficient, but NEITHER statement ALONE is sufficient.","EACH statement ALONE is sufficient.","Statements (1) and (2) TOGETHER are NOT sufficient."],"stem":"<p>A 40-liter mixture consists only of alcohol and water. How many liters of water must be added to the mixture so that alcohol makes up 20 percent of the resulting volume?</p><div class=\"ds\"><div><span>(1)</span> Alcohol makes up 30 percent of the 40-liter mixture.</div><div><span>(2)</span> The 40-liter mixture contains 28 liters of water.</div></div>"},{"sec":"D","type":"mc","kind":"Data Sufficiency","topic":"Data Sufficiency","id":"DA09","sub":"Linear cost comparison","b":1.8,"ans":2,"expl":"The difference between the two total charges is a linear function of the number of copies, and one point on a line does not fix it, so neither statement alone is sufficient. Together, Printer P's advantage shrinks by $400 for every additional 3,000 copies, so at 8,000 copies Printer P costs $200 more: a definite no, which makes the statements together sufficient.","opts":["Statement (1) ALONE is sufficient, but statement (2) alone is not sufficient.","Statement (2) ALONE is sufficient, but statement (1) alone is not sufficient.","BOTH statements TOGETHER are sufficient, but NEITHER statement ALONE is sufficient.","EACH statement ALONE is sufficient.","Statements (1) and (2) TOGETHER are NOT sufficient."],"stem":"<p>A publisher will print 8,000 copies of a catalog using either Printer P or Printer Q. Each printer charges a fixed setup fee plus a constant amount per copy, and neither the setup fees nor the per-copy amounts are necessarily the same for the two printers. For 8,000 copies, would Printer P's total charge be less than Printer Q's total charge?</p><div class=\"ds\"><div><span>(1)</span> For 2,000 copies, Printer P's total charge would be $600 less than Printer Q's.</div><div><span>(2)</span> For 5,000 copies, Printer P's total charge would be $200 less than Printer Q's.</div></div>"},{"sec":"D","type":"mc","kind":"Data Sufficiency","topic":"Data Sufficiency","id":"DA10","sub":"Average speed","b":1.3,"ans":1,"expl":"For two equal distances at speeds 40 and <i>v</i>, the average speed is 80<i>v</i>/(40 + <i>v</i>), which exceeds 60 only if <i>v</i> is greater than 120. The first statement says only that <i>v</i> is greater than 40, which allows 50 or 200: not sufficient. The second statement keeps <i>v</i> below 110, so the average is below 8,800/150, about 58.7, and the answer is a definite no: sufficient. Averaging 40 and 110 to get 75 is the trap.","opts":["Statement (1) ALONE is sufficient, but statement (2) alone is not sufficient.","Statement (2) ALONE is sufficient, but statement (1) alone is not sufficient.","BOTH statements TOGETHER are sufficient, but NEITHER statement ALONE is sufficient.","EACH statement ALONE is sufficient.","Statements (1) and (2) TOGETHER are NOT sufficient."],"stem":"<p>Farid drove from his office to a client site along a single route. He drove the first half of the distance at a constant speed of 40 kilometers per hour and the second half of the distance at a different constant speed. Was his average speed for the entire trip greater than 60 kilometers per hour?</p><div class=\"ds\"><div><span>(1)</span> Farid drove the second half of the distance in less time than he drove the first half.</div><div><span>(2)</span> Farid's speed for the second half of the distance was less than 110 kilometers per hour.</div></div>"},{"sec":"D","type":"mc","kind":"Data Sufficiency","topic":"Data Sufficiency","id":"DA11","sub":"Integer solutions","b":2.1,"ans":4,"expl":"The equation 7<i>g</i> + 11<i>m</i> = 149 has exactly two solutions in positive integers: 15 boxes of gloves with 4 of masks, and 4 boxes of gloves with 11 of masks. The second statement alone says almost nothing, and both solutions satisfy it, since they total 19 and 15 boxes. Even together the statements leave 4 or 11 boxes of masks, so the number cannot be determined. The trap is to assume that the integer constraint must yield a single solution.","opts":["Statement (1) ALONE is sufficient, but statement (2) alone is not sufficient.","Statement (2) ALONE is sufficient, but statement (1) alone is not sufficient.","BOTH statements TOGETHER are sufficient, but NEITHER statement ALONE is sufficient.","EACH statement ALONE is sufficient.","Statements (1) and (2) TOGETHER are NOT sufficient."],"stem":"<p>A clinic placed an order consisting only of boxes of gloves, at $7 per box, and boxes of masks, at $11 per box. The order included at least one box of each. How many boxes of masks did the clinic order?</p><div class=\"ds\"><div><span>(1)</span> The total cost of the order was $149.</div><div><span>(2)</span> The order consisted of at least 15 boxes in total.</div></div>"},{"sec":"D","type":"tpa","kind":"Two-Part Analysis","topic":"Two-Part Analysis","id":"DT01","sub":"Linear system","b":-1.2,"stem":"<p>A gym charges each new member a one-time joining fee plus a fixed monthly fee. A new member pays a total of $290 for the first 6 months of membership and a total of $470 for the first 12 months of membership.</p><p>Select the joining fee and the monthly fee, in dollars. Make only two selections, one in each column.</p>","cols":["Joining fee","Monthly fee"],"rows":["20","30","45","90","110","180"],"ans":[4,1],"expl":"The additional 6 months cost 470 − 290 = 180 dollars, so the monthly fee is $30. The first 6 months then include 6 × 30 = 180 dollars of monthly fees, leaving a joining fee of 290 − 180 = 110 dollars. The value 180 is the cost of six months, not a fee."},{"sec":"D","type":"tpa","kind":"Two-Part Analysis","topic":"Two-Part Analysis","id":"DT02","sub":"Conclusion and assumption","b":-0.8,"stem":"<p>Transport planner: Eighteen months ago the city introduced a bicycle-sharing program in its downtown district. Since then, weekday car traffic downtown has fallen by 8 percent. We should therefore expect that extending the program to the riverside district will bring down car traffic there as well.</p><p>Select the statement that best expresses the <i>conclusion</i> of the planner's argument and the statement that is an <i>assumption</i> on which the argument depends. Make only two selections, one in each column.</p>","cols":["Conclusion","Assumption"],"rows":["Weekday car traffic in the downtown district has fallen since the bicycle-sharing program was introduced.","Extending the bicycle-sharing program to the riverside district will reduce car traffic in that district.","The bicycle-sharing program was at least partly responsible for the decline in car traffic in the downtown district.","A bicycle-sharing program costs the city less to operate than a new bus route would.","Most residents of the riverside district already own a bicycle.","Weekday car traffic is heavier in the riverside district than in the downtown district."],"ans":[1,2],"expl":"The planner reasons from the downtown decline to a prediction about the riverside district, so the prediction is the conclusion and the downtown decline is evidence. The prediction follows only if the program actually contributed to the downtown decline; if something else caused it, the evidence gives no support. Operating costs, bicycle ownership and relative traffic levels are not needed for the reasoning."},{"sec":"D","type":"tpa","kind":"Two-Part Analysis","topic":"Two-Part Analysis","id":"DT03","sub":"Weighted average","b":-0.2,"stem":"<p>A grocer mixes nuts that cost $8.00 per kilogram with dried fruit that costs $5.00 per kilogram. The resulting mix weighs 30 kilograms and costs the grocer $6.20 per kilogram.</p><p>Select the number of kilograms of nuts and the number of kilograms of dried fruit in the mix. Make only two selections, one in each column.</p>","cols":["Nuts","Dried fruit"],"rows":["10","12","15","18","20","24"],"ans":[1,3],"expl":"The mix costs 30 × 6.20 = 186 dollars. If all 30 kilograms were dried fruit the cost would be 150 dollars, and each kilogram of nuts adds 3 dollars, so there are 36/3 = 12 kilograms of nuts and 18 kilograms of dried fruit. Reversing the two amounts gives a cost of $6.80 per kilogram."},{"sec":"D","type":"tpa","kind":"Two-Part Analysis","topic":"Two-Part Analysis","id":"DT04","sub":"Strengthen and weaken","b":0.3,"stem":"<p>A grocery chain installed electronic shelf labels, which allow prices to be changed instantly from a central office, in 20 of its 180 stores. In the 12 months after installation, the average profit margin of those 20 stores rose from 3.0 percent to 3.6 percent. The chain's operations director concludes that installing the labels in the remaining 160 stores would raise their average profit margin by a similar amount.</p><p>Select the statement that, if true, most <i>strengthens</i> the director's reasoning and the statement that, if true, most <i>weakens</i> it. Make only two selections, one in each column.</p>","cols":["Strengthens","Weakens"],"rows":["Several competing grocery chains installed electronic shelf labels in their stores some years ago.","During the same 12 months, the average profit margin of the chain's 160 stores without electronic shelf labels did not change measurably.","The electronic shelf labels are expected to last at least ten years before they need to be replaced.","The 20 stores were chosen because perishable goods, the category in which frequent price changes do the most to reduce losses from unsold stock, make up a far larger share of their sales than of sales at the other stores.","Some shoppers at the 20 stores reported that the electronic labels were easier to read than paper labels.","The chain's average profit margin across all 180 stores is lower than the national average for grocery chains."],"ans":[1,3],"expl":"If margins at the stores without the labels were flat over the same period, a chain-wide trend cannot explain the gain, which supports the labels as its cause. If the 20 stores were picked because they stand to gain unusually much from frequent price changes, their result is a poor guide to what the other stores would gain. The remaining statements concern competitors, durability, legibility and industry comparisons, none of which bears on whether the margin gain would be repeated."},{"sec":"D","type":"tpa","kind":"Two-Part Analysis","topic":"Two-Part Analysis","id":"DT05","sub":"Grouping constraints","b":1.7,"stem":"<p>Six consultants, Aiko, Bram, Carmen, Dev, Esi and Felipe, will be divided into two project teams, Team 1 and Team 2, with exactly three consultants on each team. The division must satisfy these conditions: Aiko and Bram are on different teams. Aiko and Dev are on different teams. If Carmen is on Team 1, then Dev is on Team 2. If Aiko is on Team 2, then Esi and Felipe are on the same team as each other.</p><p>Select the statement that <i>must be true</i> of the division and the statement that <i>cannot be true</i> of the division. Make only two selections, one in each column.</p>","cols":["Must be true","Cannot be true"],"rows":["Carmen is on Team 2.","Esi and Felipe are on the same team.","Aiko is on Team 1.","Carmen and Felipe are both on Team 2.","Carmen and Esi are on the same team.","Felipe is on Team 1."],"ans":[2,3],"expl":"Bram and Dev are always together on the team opposite Aiko. If Aiko were on Team 2, Bram and Dev would be on Team 1, Esi and Felipe would have to join Aiko on Team 2, and Carmen would be on Team 1 with Dev, which is forbidden; so Aiko is on Team 1. That leaves three divisions, with Team 1 as Aiko, Carmen, Esi; Aiko, Carmen, Felipe; or Aiko, Esi, Felipe. In none of them are Carmen and Felipe both on Team 2, and each of the other statements is true in at least one division and false in at least one."},{"sec":"D","type":"tpa","kind":"Two-Part Analysis","topic":"Two-Part Analysis","id":"DT06","sub":"Equal products","b":1,"stem":"<p>A warehouse stores identical crates in a rectangular grid in which every row contains the same number of crates. If the grid had 3 more rows and 4 fewer crates in each row, it would hold exactly the same number of crates as it does now. If the grid instead had 2 fewer rows and 4 more crates in each row, it would again hold exactly the same number of crates as it does now.</p><p>Select the number of rows in the grid and the number of crates in each row. Make only two selections, one in each column.</p>","cols":["Rows","Crates in each row"],"rows":["10","12","15","16","20","24"],"ans":[1,4],"expl":"With <i>r</i> rows of <i>c</i> crates, (<i>r</i> + 3)(<i>c</i> − 4) = <i>rc</i> gives 3<i>c</i> = 4<i>r</i> + 12, and (<i>r</i> − 2)(<i>c</i> + 4) = <i>rc</i> gives <i>c</i> = 2<i>r</i> − 4. Substituting, 6<i>r</i> − 12 = 4<i>r</i> + 12, so <i>r</i> = 12 and <i>c</i> = 20. Check: 12 × 20, 15 × 16 and 10 × 24 all equal 240; the values 15, 16, 10 and 24 describe the alternative grids, not the actual one."},{"sec":"D","type":"gi","kind":"Graphics Interpretation","topic":"Graphics Interpretation","id":"DG01","sub":"Percent change and share","b":-1.2,"stim":"DGC1","stem":"The chart shows the revenue of a bakery chain in each quarter of last year. Select the option from each list that makes the statement most accurate.","text":"From the third quarter to the fourth quarter, revenue increased by {0}. Fourth-quarter revenue was {1} of total revenue for the year.","blanks":[["30%","33%","50%","67%"],["25%","37.5%","45%","60%"]],"ans":[2,1],"expl":"Revenue rose from 60 to 90, an increase of 30 on a base of 60, which is 50%. Dividing the increase by 90 instead gives the tempting 33%. Total revenue for the year was 40 + 50 + 60 + 90 = 240, and 90/240 = 37.5%."},{"sec":"D","type":"gi","kind":"Graphics Interpretation","topic":"Graphics Interpretation","id":"DG02","sub":"Comparing two series","b":-0.8,"stim":"DGC2","stem":"The chart shows the number of support tickets that a software company received and the number it resolved in each of six months. Select the option from each list that makes the statement most accurate.","text":"The number of tickets resolved was greater than the number received in exactly {0} of the six months. Over the six months as a whole, the number of tickets received was {1} the number resolved.","blanks":[["1","2","3","4"],["20 less than","equal to","20 greater than","40 greater than"]],"ans":[1,2],"expl":"Resolved exceeded received only in April (120 against 110) and May (100 against 90); in June the two were equal. Total received was 80 + 100 + 120 + 110 + 90 + 100 = 600 and total resolved was 70 + 90 + 100 + 120 + 100 + 100 = 580, so received was 20 greater."},{"sec":"D","type":"gi","kind":"Graphics Interpretation","topic":"Graphics Interpretation","id":"DG03","sub":"Slope of a trend line","b":0.2,"stim":"DGC3","stem":"The graph shows the age and the hourly output of each of 12 packaging machines in a plant, with a trend line fitted to the data. Select the option from each list that makes the statement most accurate.","text":"According to the trend line, each additional year of age is associated with a change in output of approximately {0} units per hour. The number of machines whose actual output is greater than the output that the trend line predicts for a machine of that age is {1}.","blanks":[["−9","−5","−2","5"],["4","5","6","7"]],"ans":[1,1],"expl":"The trend line falls from 90 at age 0 to 40 at age 10, a change of −50 over 10 years, or −5 units per hour per year. The line predicts 90 − 5 × age. The machines above it are those at (1, 90), (2, 85), (4, 75), (5, 70) and (9, 50), which is 5 machines; the other 7 lie below the line."},{"sec":"D","type":"gi","kind":"Graphics Interpretation","topic":"Graphics Interpretation","id":"DG04","sub":"Median and mean of a distribution","b":0.4,"stim":"DGC4","stem":"A quality team inspected 50 batches and recorded the number of defects found in each batch. The chart shows how many batches had each number of defects. Select the option from each list that mak
