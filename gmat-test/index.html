e conclusion of the argument as a whole.","The first is a fact that the managers cite in support of their explanation; the second is a conclusion that challenges that explanation.","The first is a finding that the argument seeks to explain; the second is an explanation of that finding that the argument endorses.","The first is evidence that the argument takes to show that the software saved no fuel; the second is a conclusion drawn from that evidence.","The first is a consideration that weighs against replacing vans with a lighter model; the second is a recommendation based on that consideration."],"ans":0,"expl":"The replacement of vans is introduced to suggest that lighter vehicles, and not the software, may account for the saving. The argument's own conclusion is the limited one that the managers lack good grounds for their attribution. The argument never claims that the software saved no fuel, only that this has not yet been shown either way."},{"id":"CB15","sec":"V","type":"mc","kind":"Critical Reasoning","topic":"Critical Reasoning","sub":"Boldface","b":1,"pattern":"Two pieces of evidence each eliminate a different rival explanation, clearing the way for a third explanation that is the main conclusion.","stem":"<p>Historians long attributed the ninth-century collapse of trade at the port of Assuna to the silting of its harbor. <b>Sediment cores, however, show that the harbor remained deep enough for seagoing ships for a century after the collapse</b>. Some scholars now hold instead that caravan routes shifted and stopped bringing inland goods to Assuna for export. <b>Yet surviving customs tablets record that the volume of goods reaching Assuna by caravan grew throughout the period of the collapse</b>, while the number of ships calling at the port fell sharply. Most probably, then, sea traders simply abandoned Assuna for the newly built harbor at Meroth.</p><p>In the argument above, the two portions in boldface play which of the following roles?</p>","opts":["The first is evidence against an explanation that the argument rejects; the second is evidence that the argument uses to defend a rival explanation proposed by some scholars.","The first is a finding that the argument sets out to explain; the second is a finding that the argument's own explanation cannot account for.","The first is evidence offered against one explanation of an event; the second is evidence offered against a different explanation of that event, and the argument adopts neither explanation.","The first is evidence against an explanation that the argument rejects; the second is the explanation that the argument itself favors.","The first is evidence that the argument uses to reject a long-held explanation; the second is evidence that some scholars cite against the argument's main conclusion."],"ans":2,"expl":"The sediment cores count against the silting account, and the customs tablets count against the caravan account that some scholars put in its place. The argument discards both and settles on a third explanation, the move of sea traders to Meroth. The tablets are evidence, not an explanation, and they are used against the scholars' proposal, not in its defense."},{"id":"CB16","sec":"V","type":"mc","kind":"Critical Reasoning","topic":"Critical Reasoning","sub":"Evaluate","b":1,"pattern":"A finding of no difference between treated and untreated groups is uninformative if both groups were already exposed to the treatment by another route.","stem":"<p>Vantrell Systems wanted to know whether glasses that filter blue light reduce the eye strain its programrs report. Sixty programrs who had reported similar levels of eye strain were assigned at random to two groups of thirty. For three months, members of one group wore the filtering glasses throughout every working day, while members of the other group wore none. At the end of the trial, the two groups reported, on average, the same level of eye strain. Vantrell concluded that filtering blue light does not reduce eye strain among its programrs.</p><p>The answer to which of the following questions would be most useful in evaluating Vantrell's conclusion?</p>","opts":["Whether Vantrell's programrs report more eye strain than employees who spend less of the working day at monitors","Whether glasses that filter a larger proportion of blue light than those used in the trial are available","Whether the programrs who wore the glasses found them comfortable","Whether the average level of eye strain reported by the two groups was higher at the end of the trial than at the beginning","Whether the monitors at which Vantrell's programrs work already remove most of the blue light from what they display"],"ans":4,"expl":"If the monitors already remove most blue light, both groups were working in filtered light and the glasses added almost nothing, so equal results would say little about whether filtering helps. If the monitors do not, the trial is a fair comparison and the conclusion is much better supported. Since both groups ended at the same level, knowing whether that level rose or fell over the three months does not separate the two possibilities."},{"id":"CB17","sec":"V","type":"mc","kind":"Critical Reasoning","topic":"Critical Reasoning","sub":"Complete the passage","b":0.2,"pattern":"A substitute that matches the old method on one function cannot replace it because the old method also serves a second function.","stem":"<p>Which of the following most logically completes the passage?</p><p>Apple growers in the Sennoch Valley spray their orchards each spring with a chemical that kills the larvae of the ring moth, which bore into young fruit. A supplier now sells a tiny wasp that destroys ring moth eggs before they hatch, and in trial orchards where the wasps were released and no spraying was done, ring moth damage was no greater than in sprayed orchards. Nevertheless, growers who release the wasps are unlikely to be able to give up the spring spraying, since ______.</p>","opts":["the wasps do not survive the winter and must be bought anew each spring","the spray also controls the bark mite, a pest that the wasps do not attack and that, left unchecked, ruins as much fruit as the ring moth does","the wasps do no harm to the bees that pollinate apple blossom","the chemical is less expensive now than it was five years ago","some growers in the valley took no part in the trial"],"ans":1,"expl":"The trial shows that the wasps handle ring moths as well as the spray does, so the blank needs a reason why spraying is still required. A second serious pest that only the spray controls is such a reason. Having to buy wasps every spring adds a cost but does not show that spraying must continue."},{"id":"CB18","sec":"V","type":"mc","kind":"Critical Reasoning","topic":"Critical Reasoning","sub":"Flaw in the reasoning","b":-0.9,"pattern":"Advice to adopt a trait is drawn from a correlation that a common underlying factor could explain.","stem":"<p>A survey of people who graduated from Dunmore University ten years ago found that those who had taken the fewest elective courses outside their main subject now earn, on average, considerably more than those who had taken the most. On the strength of this finding, a career adviser at the university tells current students that they can expect to raise their future earnings by taking as few elective courses outside their main subject as the university's rules allow.</p><p>The adviser's reasoning is most vulnerable to criticism on the grounds that it</p>","opts":["relies on a survey of the graduates of only one university","takes for granted that every student wishes to earn as much as possible","does not state how much more the higher-earning graduates earn","overlooks the possibility that the subjects whose programs leave little room for outside electives are themselves the subjects that lead to better-paid careers","treats earnings ten years after graduation as though they were earnings over a whole career"],"ans":3,"expl":"The adviser moves from a correlation to a recommendation. If graduates in certain subjects both had little room for outside electives and entered better-paid fields, the choice of subject explains the pattern, and a student in another subject would gain nothing by avoiding electives. The advice is addressed to students of the same university, so the survey's scope is not the weakness."},{"id":"RDQ01","stim":"RD1","sub":"Main idea","b":-0.4,"stem":"The passage is primarily concerned with","opts":["arguing that mature chains would be more profitable if they bought back their franchised outlets","explaining why franchisees demand higher returns than do investors in a chain as a whole","questioning one explanation of why companies franchise and presenting an alternative, along with a difficulty that franchising itself creates","showing that the cost of supervising salaried managers is the only factor that determines whether an outlet is franchised","describing the contractual standards that chains use to prevent franchisees from lowering quality"],"ans":2,"expl":"The first two paragraphs set out the capital-scarcity explanation and the evidence against it, the third offers the supervision-cost explanation, and the fourth adds the reputation problem that franchising brings. The claim that supervision cost is the only factor is contradicted by the last paragraph, and the points about franchisee returns and contract standards are supporting details rather than the main concern.","sec":"V","type":"mc","kind":"Reading Comprehension","topic":"Reading Comprehension"},{"id":"RDQ02","stim":"RD1","sub":"Detail","b":0,"stem":"According to the passage, franchisees are a costly source of capital for a chain because they","opts":["must be inspected more often than salaried managers of company-owned outlets","are generally unable to borrow as much as an established chain can","tend to lower quality when most of their customers are unlikely to return","keep the profit of their outlets after paying fees to the chain","have their wealth concentrated in few outlets and therefore require a higher return than diversified investors would"],"ans":4,"expl":"The second paragraph states that an owner whose savings are tied up in one or two outlets bears concentrated risk and will demand a higher return than diversified shareholders. Keeping the outlet profit and the temptation to cut quality are raised in later paragraphs for other purposes, and the passage says franchisees work without being watched, not that they need more inspection than managers.","sec":"V","type":"mc","kind":"Reading Comprehension","topic":"Reading Comprehension"},{"id":"RDQ03","stim":"RD1","sub":"Strengthen","b":0.4,"stem":"Which of the following, if true, would most strengthen the explanation offered in the last paragraph for why chains often own their highway outlets?","opts":["Among franchised outlets of the same chain, those with the smallest proportion of repeat customers receive the lowest scores in quality inspections.","Highway outlets earn higher profits on average than do outlets of the same chain in residential districts.","Chains that have many highway outlets tend to be younger than chains that have few.","Franchisees who operate highway outlets usually pay the same percentage of sales in fees as other franchisees do.","Company-owned outlets located near headquarters are visited by supervisors more often than are company-owned outlets on highways."],"ans":0,"expl":"The last paragraph claims that a franchisee whose customers will not return is tempted to cut quality, which gives the chain a reason to keep such outlets. Evidence that franchised outlets with the fewest repeat customers score worst on quality supports that mechanism directly. Higher highway profits would suggest a different motive for ownership, and the remaining statements say nothing about how franchisees behave when customers do not return.","sec":"V","type":"mc","kind":"Reading Comprehension","topic":"Reading Comprehension"},{"id":"RDQ04","stim":"RD2","sub":"Primary purpose","b":0.1,"stem":"The primary purpose of the passage is to","opts":["demonstrate that comets, rather than asteroids, supplied most of the water now found in Earth's oceans","explain how deuterium ratios are measured in comets, meteorites, and lavas","argue that the isotopic composition of water cannot reveal where in the solar system the water originated","describe how later findings have weakened the case that Earth's water must have come from the outer solar system, while leaving room for some contribution from that source","reconcile the view that Earth formed from dry material with the abundance of water in the deep mantle"],"ans":3,"expl":"The passage sets out the delivery account, then reports two findings that unsettle it, and concludes that an outer source is no longer needed to explain the presence of water, only its exact composition. It never claims that comets were the main source or that the isotopic test is useless, and it treats the idea of dry building material as undermined rather than as something to be reconciled with mantle water.","sec":"V","type":"mc","kind":"Reading Comprehension","topic":"Reading Comprehension"},{"id":"RDQ05","stim":"RD2","sub":"Inference","b":0.9,"stem":"The passage suggests that the measurements of the two Kuiper belt comets bear on the earlier conclusion about comets chiefly by indicating that","opts":["the ratios reported for the comets of the Oort cloud were measured inaccurately","a judgment about comets as a class had been based on a sample that did not reflect how much they vary","comets of the Kuiper belt family delivered more water to Earth than carbonaceous asteroids did","deuterium ratios are an unreliable means of testing any proposed source of Earth's water","comets of the Kuiper belt family formed closer to the Sun than carbonaceous asteroids did"],"ans":1,"expl":"Comets were set aside as the main source after several Oort cloud comets showed ratios about twice the oceanic value, yet two comets of another family gave one ocean-like ratio and one far higher. That spread indicates comets differ widely, so the earlier sample could not speak for all of them. Nothing suggests the earlier measurements were wrong, that these comets were the larger contributor, or that the isotopic test, on which the rest of the passage relies, should be discarded.","sec":"V","type":"mc","kind":"Reading Comprehension","topic":"Reading Comprehension"},{"id":"RDQ06","stim":"RD2","sub":"Function","b":1,"stem":"The author mentions water from the deep mantle in the last paragraph most probably in order to","opts":["offer evidence consistent with the idea that the material from which Earth was assembled carried water","show that the oceans have gradually lost deuterium since they formed","establish that carbonaceous asteroids contributed nothing to Earth's water","explain why enstatite chondrites were for a long time assumed to be dry","suggest that the isotopic test cannot be applied to water that lies below Earth's surface"],"ans":0,"expl":"Mantle water is poorer in deuterium than seawater, and the author says this is what would be expected if the earliest water came from material like the enstatite chondrites, whose hydrogen is also deuterium-poor. The observation therefore supports an origin in the building blocks. The author has just allowed a modest carbonaceous contribution, says nothing about the oceans losing deuterium, and applies the isotopic test to the mantle rather than doubting it.","sec":"V","type":"mc","kind":"Reading Comprehension","topic":"Reading Comprehension"},{"id":"RDQ07","stim":"RD2","sub":"Weaken","b":0.8,"stem":"Which of the following, if true, would most seriously undermine the suggestion that the material from which Earth was assembled could account for the presence of water on the planet?","opts":["Carbonaceous chondrites contain considerably more water per unit of mass than enstatite chondrites do.","Comets of the Oort cloud differ from one another in deuterium ratio more than was once believed.","Enstatite chondrites make up only a small proportion of the meteorites that have been recovered on Earth.","The quantity of carbonaceous material needed to raise Earth's overall deuterium ratio to the observed value is small in relation to the mass of the planet.","The heat generated by the collisions through which Earth was assembled would have expelled nearly all the hydrogen held in the colliding material."],"ans":4,"expl":"The suggestion depends on the hydrogen in enstatite-like material having stayed with the growing planet. If the collisions that built Earth drove off nearly all of that hydrogen, the building blocks could not have supplied the water whatever they first contained. How rarely such meteorites are found today has no bearing on what Earth was made of, and the statements about carbonaceous material are compatible with the modest later contribution the passage already accepts.","sec":"V","type":"mc","kind":"Reading Comprehension","topic":"Reading Comprehension"},{"id":"RDQ08","stim":"RD3","sub":"Author's attitude","b":1,"stem":"The author's attitude toward the revisionist account of ordeals is best described as","opts":["dismissive, on the ground that it merely restates the traditional view of ordeals in the vocabulary of economics","approving of the evidence its proponents offer but opposed to its premise that the institution needs a rational explanation","respectful of its ingenuity and of its starting point but doubtful that the evidence cited establishes the mechanism it proposes","neutral, in that the author reports the account and the objections of its critics without assessing either","fully persuaded, apart from a wish that more registers of the same kind were available"],"ans":2,"expl":"The author calls the account ingenious and says it rightly demands an explanation other than stupidity, then argues that the evidence underdetermines it and that its mechanism is fragile. That is qualified respect combined with doubt about proof. The author accepts the premise and questions the evidence, which is the reverse of approving the evidence and rejecting the premise, and the account contradicts the traditional view rather than restating it.","sec":"V","type":"mc","kind":"Reading Comprehension","topic":"Reading Comprehension"},{"id":"RDQ09","stim":"RD3","sub":"Application","b":0.7,"stem":"Which of the following, if discovered, would most directly supply the kind of information that, according to the author, the register cited by proponents cannot provide?","opts":["A register from a second cathedral chapter in which three-quarters of the recorded ordeals ended in acquittal","Court rolls from the same region that note, for each accusation referred to the ordeal, whether the accused withdrew the denial before the appointed day","A manual for priests describing how the iron might be allowed to cool before it was handed to the accused","Accounts showing that accused persons who made gifts to the chapter were acquitted more often than those who did not","A collection of sermons from the period affirming that God reveals the truth through the ordeal"],"ans":1,"expl":"The author objects that a register of ordeals actually carried out cannot show how many of the accused confessed beforehand, the group on which the argument rests. Rolls recording whether each accused withdrew the denial before the ordeal would fill exactly that gap. A second register of outcomes has the same limitation, a manual shows only that results could be managed, and the accounts of gifts would bear on the rival explanation that clergy favored those able to pay.","sec":"V","type":"mc","kind":"Reading Comprehension","topic":"Reading Comprehension"},{"id":"RDQ10","stim":"RD3","sub":"Weaken","b":1.1,"stem":"Which of the following, if true, would most weaken the final objection that the author raises against the revisionist account?","opts":["The priests who officiated at ordeals themselves believed that the outcome expressed the judgment of God.","Many of those acquitted by ordeal were afterward widely regarded by their neighbors as having been guilty.","The ordeal was abandoned soon after church councils forbade the clergy to take part in it.","Ordeals took place so seldom in any one district that few people ever learned the outcome of more than one or two.","An accused person who confessed before the ordeal received a lighter penalty than one who underwent it and failed."],"ans":3,"expl":"The final objection is that frequent acquittals, visible to the whole community, would teach the guilty that the iron seldom burns and so destroy the belief on which the mechanism depends. If people rarely learned of more than one or two outcomes, they could not have noticed how often the accused passed, and belief could have persisted. What priests believed does not change what observers saw, acquittals of people thought guilty would deepen the suspicion, and the lighter penalty for confession supports the earlier reasoning without touching the question of whether belief could last.","sec":"V","type":"mc","kind":"Reading Comprehension","topic":"Reading Comprehension"},{"sec":"D","type":"tpa","kind":"Two-Part Analysis","topic":"Two-Part Analysis","id":"TP01","sub":"Rule application","b":-1,"pattern":"Apply a two-tier rule in which one condition governs whether something is permitted at all and a separate condition imposes an extra step on only some permitted cases.","stem":"<p>A community tool library applies the following rules. Tools may be lent only to a registered member whose membership began at least 30 days ago and who currently has no overdue tool. A member who is entitled to borrow may take a hand tool without any further step, but may take a power tool only after completing the library's safety briefing.</p><p>Each of the people listed below has asked to borrow the item indicated today, and none of them has yet completed the safety briefing.</p><p>Select the person who may be lent the requested item <i>only after completing the safety briefing</i> and the person who <i>may not be lent the requested item at all</i> today. Make only two selections, one in each column.</p>","cols":["Only after the briefing","Not at all"],"rows":["Chiara, a member for 3 weeks with no overdue tool, who requests a cordless power sander","Amara, a member for 2 years with no overdue tool, who requests a hand saw","Esi, a member for 8 months who returned her only overdue tool yesterday, and who requests a hand plane","Benedikt, a member for 45 days with no overdue tool, who requests a power drill","Dmitri, a member for 5 years with no overdue tool, who requests a set of wrenches"],"ans":[3,0],"expl":"Benedikt has been a member for more than 30 days and has nothing overdue, so he is entitled to borrow, but a power drill requires the briefing first. Chiara has been a member for only 21 days, so she may not borrow anything, whatever the item. Amara, Dmitri and Esi are all entitled to borrow and want hand tools; Esi has no tool overdue now, so her earlier late return does not matter."},{"sec":"D","type":"tpa","kind":"Two-Part Analysis","topic":"Two-Part Analysis","id":"TP02","sub":"Logical constraints","b":0.9,"pattern":"Ordering six items under a fixed-gap rule, a chain rule and a non-adjacency rule, then separating what is forced from what is merely possible.","stem":"<p>An inspector will audit six sites, B, C, D, E, F and G, one per week over six consecutive weeks numbered 1 through 6. The schedule must satisfy these conditions: D is audited exactly two weeks after B. E is audited before F, and F is audited before G. G is not audited in week 6. C and E are not audited in consecutive weeks.</p><p>Select the statement that <i>must be true</i> of the schedule and the statement that <i>cannot be true</i> of the schedule. Make only two selections, one in each column.</p>","cols":["Must be true","Cannot be true"],"rows":["Site C is audited in week 6.","Site E is audited in week 1 or week 2.","Site B is audited before site F.","Sites D and E are audited exactly two weeks apart.","Site G is audited in week 3.","Site D is audited before site F."],"ans":[1,3],"expl":"Since E, F and G come in that order and G is not last, E is in week 3 at the latest; but E in week 3 forces F and G into weeks 4 and 5, leaving weeks 1, 2 and 6 for B, C and D, where D cannot be two weeks after B. So E is in week 1 or 2. If D were two weeks from E, D would be in week 3 or 4 and B would have to share E's week, which is impossible. The five possible orders are B E D F G C, E B F D G C, E F B G D C, E F C B G D and E F G B C D, and each of the other statements is true in some of these and false in others."},{"sec":"D","type":"tpa","kind":"Two-Part Analysis","topic":"Two-Part Analysis","id":"TP03","sub":"Cause and effect","b":0,"pattern":"Trace a stated causal chain to pick out the factor credited with an outcome, then run the chain forward from a changed starting condition to find the predicted result.","stem":"<p>Urban ecologist: When a city replaces the gravel verges beside its streets with sealed pavement, less rainwater soaks into the soil beside the road. Street trees respond to the drier soil by growing their roots closer to the surface, and it is these shallow roots, not any weakness in the paving material, that lift and crack the pavement within a few years. Cities that respond by repairing the cracks with thicker pavement spend more on each repair without changing anything about how the roots grow.</p><p>Select the statement that the ecologist identifies as a <i>cause</i> of the cracking, and the statement that the ecologist's account most strongly predicts would be an <i>effect</i> of replacing sealed pavement with gravel verges again. Make only two selections, one in each column.</p>","cols":["Cause of the cracking","Effect of restoring verges"],"rows":["The material used for sealed pavement is less durable than gravel.","More rainwater soaks into the soil beside the road.","The city spends more on each pavement repair.","Street trees beside the road grow more slowly.","Street trees beside the road develop roots near the surface.","Repairs are made with thicker pavement."],"ans":[4,1],"expl":"The ecologist says outright that shallow roots lift and crack the pavement, and explicitly rules out a weakness in the paving material. Sealing the verges is what reduced the rainwater reaching the soil, so undoing it should let more rainwater soak in. Thicker pavement and higher repair spending are responses to the cracking, not causes of it, and nothing in the account concerns how fast the trees grow."},{"sec":"D","type":"tpa","kind":"Two-Part Analysis","topic":"Two-Part Analysis","id":"TP04","sub":"Strengthen and weaken","b":0.3,"pattern":"Evaluate a plan whose success needs a quantity to rise by more than a break-even proportion: one fact shows the rise is achievable, another shows a physical limit prevents it.","stem":"<p>The transit authority of Corvale plans to cut every bus fare by 25 percent. It predicts that the lower fares will attract enough additional riders that the total revenue it collects from fares will not fall. As evidence it cites a survey in which a large share of the residents who do not ride the buses named the fare as their main reason.</p><p>Select the statement that, if true, most <i>strengthens</i> the authority's prediction and the statement that, if true, most <i>weakens</i> it. Make only two selections, one in each column.</p>","cols":["Strengthens","Weakens"],"rows":["After a city of similar size and layout cut its bus fares by one quarter, the number of fare-paying bus trips there rose by more than 40 percent within a year.","The authority has not changed its bus fares at any time in the past six years.","Bus fares in the neighboring city of Aldmoor are higher than the fares Corvale currently charges.","The authority's cost of operating a bus trip does not depend on how many passengers are on board.","At the hours when most of the surveyed non-riders say they would travel, buses on the main routes already carry as many passengers as they can hold.","Most current riders say that they are satisfied with how often the buses run."],"ans":[0,4],"expl":"At three quarters of the old fare, revenue holds only if paid trips rise by at least one third, so a comparable city where trips rose by more than 40 percent is direct evidence that the prediction can come true. If the buses are already full when the would-be riders want to travel, those riders cannot be carried, so ridership cannot rise enough. The cost of a trip concerns expenses, not fare revenue, and the remaining statements leave the size of the ridership response open."},{"sec":"D","type":"tpa","kind":"Two-Part Analysis","topic":"Two-Part Analysis","id":"TP05","sub":"Logical constraints","b":1.1,"pattern":"Split a group into two teams of fixed sizes under conditional and same-team rules, using a contradiction and the size limit to find the members whose team is forced.","stem":"<p>Seven analysts, Hana, Imran, Jorge, Kemi, Lucia, Mateo and Nadia, will each be assigned to exactly one of two teams: a field team of four analysts and a desk team of three analysts. The assignment must satisfy these conditions: Lucia and Mateo are assigned to the same team. Hana and Nadia are not both assigned to the field team. If Nadia is assigned to the desk team, then Lucia is also assigned to the desk team. If Hana is assigned to the field team, then Lucia is also assigned to the field team.</p><p>Select the analyst who <i>must</i> be assigned to the field team and the analyst who <i>must</i> be assigned to the desk team. Make only two selections, one in each column.</p>","cols":["Must be on the field team","Must be on the desk team"],"rows":["Hana","Imran","Jorge","Lucia","Mateo","Nadia"],"ans":[5,0],"expl":"If Hana were on the field team, Lucia would be too, and Nadia would have to be on the desk team, which would force Lucia onto the desk team as well: a contradiction, so Hana is on the desk team. If Nadia were on the desk team, Lucia and therefore Mateo would join her and Hana there, making four on a team of three, so Nadia is on the field team. Each of the other analysts can be placed on either team, for example Imran, Jorge, Kemi, Nadia in the field or Kemi, Lucia, Mateo, Nadia in the field."},{"sec":"D","type":"tpa","kind":"Two-Part Analysis","topic":"Two-Part Analysis","id":"TP06","sub":"Assumption and supporting fact","b":1.1,"pattern":"Identify an assumption the argument requires, rejecting a stronger claim it does not need, and pair it with the fact that makes that particular assumption more likely.","stem":"<p>Agronomist: Growers in the Tessin valley are replacing their traditional pear variety with a new variety that ripens three weeks earlier. Early pears reach the market when few other pears are on sale, and so they typically fetch a price about 30 percent higher. Clearly, then, a grower who switches to the new variety will earn more revenue from each hectare of orchard than a grower who does not.</p><p>Select for <i>Assumption</i> a statement that the agronomist's argument requires, and select for <i>Supporting fact</i> the statement that, if true, provides the strongest support for that assumption. Make only two selections, one in each column.</p>","cols":["Assumption","Supporting fact"],"rows":["In five seasons of field trials in the valley, the weight of fruit harvested per hectare from the new variety was within 2 percent of that from the traditional variety.","The new variety yields at least as much fruit per hectare as the traditional variety does.","Consumers in the markets served by the valley prefer the taste of the new variety to that of the traditional variety.","Growers outside the valley have not yet planted the new variety.","Any shortfall in the new variety's yield per hectare relative to the traditional variety's is too small to cancel the advantage of its higher price.","Pears of the new variety can be kept in storage no longer than pears of the traditional variety can."],"ans":[4,0],"expl":"Revenue per hectare is price times yield, so a higher price guarantees more revenue only if the new variety does not yield so much less that the price advantage is wiped out. The argument does not need the stronger claim that the new variety yields at least as much: it could yield somewhat less and the conclusion would still follow. Trial harvests within 2 percent of each other show that any shortfall is far smaller than a 30 percent price advantage, which is exactly what the required assumption says."},{"sec":"D","type":"tpa","kind":"Two-Part Analysis","topic":"Two-Part Analysis","id":"TP07","sub":"Conditional reasoning","b":1.8,"pattern":"In a fixed-size selection governed by several conditional rules, find the one condition among the options that guarantees another of the options.","stem":"<p>A foundation will fund exactly four of seven proposals, Q, R, S, T, U, V and W. The selection must satisfy these conditions: Q and R are not both funded. If S is funded, then T is funded. At least one of U and V is funded. If W is funded, then at least one of Q and U is funded. T, V and W are not all funded.</p><p>Select for <i>Condition</i> and for <i>Consequence</i> the two different statements such that, if the statement selected for Condition is true, the statement selected for Consequence must also be true. Make only two selections, one in each column.</p>","cols":["Condition","Consequence"],"rows":["Q is not funded.","T is funded.","S is not funded.","W is not funded.","V is funded.","R is not funded."],"ans":[3,1],"expl":"If W is not funded, the four funded proposals come from Q, R, S, T, U and V. At most one of Q and R is funded, so at least three of S, T, U and V are, and the only such group without T is S, U, V, which is ruled out because S requires T. So T must be funded. No other pairing works: for example S, T, U, V shows that Q and R can both be unfunded while W is unfunded, Q, U, V, W satisfies every rule without S or T, and Q, S, T, U and R, S, T, U show that funding T or leaving S out does not settle V or either of Q and R."},{"sec":"D","type":"tpa","kind":"Two-Part Analysis","topic":"Two-Part Analysis","id":"TP08","sub":"Linked unknowns","b":-0.9,"pattern":"Recover a fixed charge and a per-unit charge from two totals by differencing.","stem":"<p>A caterer charges a fixed delivery fee plus a constant price per meal. An order of 40 meals costs a total of $530, and an order of 65 meals costs a total of $830.</p><p>Select the delivery fee, in dollars, and the price per meal, in dollars. Make only two selections, one in each column.</p>","cols":["Delivery fee","Price per meal"],"rows":["10","12","15","30","50","60"],"ans":[4,1],"expl":"The 25 extra meals cost $830 − $530 = $300, so each meal costs $12. Then 40 meals cost $480, which leaves a delivery fee of $530 − $480 = $50."},{"sec":"D","type":"tpa","kind":"Two-Part Analysis","topic":"Two-Part Analysis","id":"TP09","sub":"Expressions with variables","b":0.1,"pattern":"Net rate of two opposing constant rates written in variables, and its reciprocal as the time to finish the job.","stem":"<p>Working alone at a constant rate, an inlet valve fills an empty reservoir in <i>x</i> hours. Working alone at a constant rate, an outlet valve drains the full reservoir in <i>y</i> hours, where <i>y</i> &gt; <i>x</i>. Both valves are opened at the same moment while the reservoir is empty.</p><p>Select the expression for the fraction of the reservoir that is filled during each hour while both valves are open, and the expression for the number of hours needed to fill the reservoir with both valves open. Make only two selections, one in each column.</p>","cols":["Fraction filled per hour","Hours to fill"],"rows":["1/(<i>y</i> − <i>x</i>)","(<i>y</i> − <i>x</i>)/(<i>xy</i>)","(<i>x</i> + <i>y</i>)/(<i>xy</i>)","<i>xy</i>/(<i>y</i> − <i>x</i>)","<i>xy</i>/(<i>x</i> + <i>y</i>)","<i>y</i> − <i>x</i>"],"ans":[1,3],"expl":"Each hour the inlet adds 1/<i>x</i> of the reservoir and the outlet removes 1/<i>y</i>, a net gain of 1/<i>x</i> − 1/<i>y</i> = (<i>y</i> − <i>x</i>)/<i>xy</i>. The time to fill is the reciprocal, <i>xy</i>/(<i>y</i> − <i>x</i>). The expressions with <i>x</i> + <i>y</i> describe two valves that both fill, and <i>y</i> − <i>x</i> wrongly subtracts times instead of rates."},{"sec":"D","type":"tpa","kind":"Two-Part Analysis","topic":"Two-Part Analysis","id":"TP10","sub":"Weighted average","b":0.3,"pattern":"A blend of two concentrations hits a target value only at one ratio of the two amounts, and the pair must be assigned in the right order.","stem":"<p>A grower blends fertilizer P, which is 16 percent nitrogen by weight, with fertilizer Q, which is 30 percent nitrogen by weight. The resulting blend is exactly 22 percent nitrogen by weight.</p><p>Select a number of kilograms of fertilizer P and a number of kilograms of fertilizer Q that are jointly consistent with this information. Make only two selections, one in each column.</p>","cols":["Kilograms of P","Kilograms of Q"],"rows":["15","18","24","27","35","40"],"ans":[2,1],"expl":"With <i>p</i> kilograms of P and <i>q</i> kilograms of Q, 16<i>p</i> + 30<i>q</i> = 22(<i>p</i> + <i>q</i>), so 6<i>p</i> = 8<i>q</i> and <i>p</i> : <i>q</i> = 4 : 3. The only two listed values in that ratio are 24 and 18. Because 22 is closer to 16 than to 30, the blend must contain more of P, so P is 24 kilograms and Q is 18 kilograms."},{"sec":"D","type":"tpa","kind":"Two-Part Analysis","topic":"Two-Part Analysis","id":"TP11","sub":"Linked unknowns","b":1,"pattern":"Account for total idle time and total running time across identical units to link the number of units with the length of the period.","stem":"<p>A bottling plant runs one production shift using a set of identical filling machines. At every moment of the shift, exactly 2 of the machines are stopped for cleaning and all of the other machines are running. Over the whole shift, each machine is stopped for a total of exactly 3 hours, and the machines together accumulate 180 machine-hours of running time.</p><p>Select the number of filling machines in the set and the length of the shift, in hours. Make only two selections, one in each column.</p>","cols":["Number of machines","Length of shift (hours)"],"rows":["9","10","12","15","18","20"],"ans":[2,4],"expl":"Let there be <i>m</i> machines and a shift of <i>t</i> hours. Counting stopped time two ways gives 2<i>t</i> = 3<i>m</i>, so <i>t</i> = 1.5<i>m</i>. Running time is (<i>m</i> − 2)<i>t</i> = 180, so 1.5<i>m</i>(<i>m</i> − 2) = 180 and <i>m</i>(<i>m</i> − 2) = 120, which gives <i>m</i> = 12 and <i>t</i> = 18. The values 10 and 15 come from treating the 10 running machines as the whole set."},{"sec":"D","type":"tpa","kind":"Two-Part Analysis","topic":"Two-Part Analysis","id":"TP12","sub":"Extreme values","b":1.6,"pattern":"Least and greatest possible value of the largest of several distinct integers when the mean and the median are fixed.","stem":"<p>Each of the 7 stores in a chain sold a different positive whole number of units of a certain product last week. The mean number of units sold per store was 24, and the median number sold was 22.</p><p>Select the least possible number and the greatest possible number of units sold by the store that sold the most. Make only two selections, one in each column.</p>","cols":["Least possible","Greatest possible"],"rows":["28","29","30","93","96","99"],"ans":[2,3],"expl":"The seven numbers total 168 and the fourth largest is 22. For the greatest maximum make the others as small as possible: 1, 2, 3, 22, 23, 24 total 75, leaving 93. For the least maximum make the three smallest as large as possible, 19, 20, 21, so the three largest total at least 168 − 22 − 60 = 86; three different integers with largest 29 total at most 27 + 28 + 29 = 84, so the largest is at least 30, and 19, 20, 21, 22, 27, 29, 30 achieves it. The values 96 and 99 ignore the requirement that all seven numbers differ."},{"id":"MR01","sec":"D","type":"mc","kind":"Multi-Source Reasoning","topic":"Multi-Source Reasoning","sub":"Apply a rule to a request","b":-0.9,"stim":"MS1","pattern":"Apply a ratio requirement that rounds up, stated in one source, to the facts of a request in another source.","stem":"According to the policy and the booking request, how many of the adults in the Larch Road School group will be charged admission?","opts":["0","2","3","7","9"],"ans":1,"expl":"One adult is required for every 8 students, and 52 ÷ 8 = 6.5, so the group must bring at least 7 adults. Those 7 are admitted free. The group is bringing 9 adults, so the remaining 2 pay the adult group rate."},{"id":"MR02","sec":"D","type":"ta","kind":"Multi-Source Reasoning","topic":"Multi-Source Reasoning","sub":"Eligibility checks","b":-0.3,"stim":"MS1","pattern":"Check the facts of a request against several separate eligibility conditions spread over a policy and a table.","stem":"For each of the following statements, select <i>Yes</i> if the statement can be inferred from the information in the three sources. Otherwise, select <i>No</i>.","labels":["Yes","No"],"stmts":["On the date requested, the students in the group could take the Light and Color workshop in place of the Fossil Lab.","The booking qualifies for the 10 percent reduction on student admission.","The Fossil Lab would not be available to the group if it moved its visit to a Saturday."],"ans":[1,0,0],"expl":"Light and Color is offered on Thursdays but is open only to grades 1 to 4, and the students are in grade 5, so the first statement fails. The request was sent on April 2 for May 7, which is 35 days ahead and well beyond the 21 days required, so the reduction applies. The Fossil Lab is offered Tuesday to Friday only, so it is not available on a Saturday."},{"id":"MR03","sec":"D","type":"ta","kind":"Multi-Source Reasoning","topic":"Multi-Source Reasoning","sub":"Total cost from rules","b":0.3,"stim":"MS1","pattern":"Build a total charge from a rate table and a policy in which a discount applies to only one component of the charge.","stem":"Suppose the museum confirms the visit exactly as requested. For each of the following statements, select <i>Yes</i> if the statement is supported by the information in the three sources. Otherwise, select <i>No</i>.","labels":["Yes","No"],"stmts":["The workshop fees for the group will total $180.","The early-booking reduction will lower the group's total charge by more than $40.","The total charge for the visit will be within the amount the school has approved."],"ans":[0,1,0],"expl":"With 52 students and 30 places per session, two Fossil Lab sessions are needed: 2 × $90 = $180. Student admission is 52 × $6 = $312, and the reduction is 10 percent of that alone, $31.20, which is less than $40. The total is $280.80 for students, $18 for the 2 paying adults and $180 for workshops, or $478.80, which is within $520."},{"id":"MR04","sec":"D","type":"mc","kind":"Multi-Source Reasoning","topic":"Multi-Source Reasoning","sub":"Necessary and sufficient conditions","b":0.6,"stim":"MS2","pattern":"Classify entities under a rule with two necessary conditions, one of which can be waived, while ignoring an attribute that the rule does not make relevant.","stem":"Based on the policy and the supplier records, which of the following lists every supplier that currently meets the requirements for Approved status, and no others?","opts":["Lindqvist Dairy only","Arbeck Mills and Dalgaard Oats","Dalgaard Oats and Lindqvist Dairy","Arbeck Mills, Dalgaard Oats and Lindqvist Dairy","Arbeck Mills and Lindqvist Dairy"],"ans":4,"expl":"Lindqvist Dairy passed an audit 9 months ago and holds a current certificate, so it is Approved; its rejected deliveries matter only for the waiver, which it does not need. Arbeck Mills has no audit within 24 months, but with 8 years of continuous supply and no rejected deliveries the audit requirement is waived, and its certificate is current. Dalgaard Oats fails the certificate requirement, which is never waived. Tormes Orchards has an audit 30 months old and loses the waiver because of its rejected delivery, and the two new applicants have never been audited."},{"id":"MR05","sec":"D","type":"ta","kind":"Multi-Source Reasoning","topic":"Multi-Source Reasoning","sub":"Conditional inference","b":0.9,"stim":"MS2","pattern":"Decide whether a stated or hypothetical change of one fact is enough to satisfy a multi-condition rule, including a restriction attached to a lesser status.","stem":"For each of the following statements, select <i>Yes</i> if the statement can be inferred from the information in the three sources. Otherwise, select <i>No</i>.","labels":["Yes","No"],"stmts":["If the certifying body issued Dalgaard Oats a renewed certificate today, Dalgaard Oats would qualify for Approved status without a new on-site audit.","Because an on-site audit of Pemberton Nuts has been scheduled, the company may now buy hazelnut meal from Pemberton Nuts.","If an on-site audit of Tormes Orchards were scheduled today, the company could buy dried apricot from Tormes Orchards before that audit took place."],"ans":[0,1,0],"expl":"Dalgaard Oats passed an audit 14 months ago, so the certificate is the only requirement it fails; a current certificate would make it Approved. Pemberton Nuts qualifies as Provisional, but only ingredients with no allergen may be bought from a Provisional supplier, and hazelnut meal contains one. Tormes Orchards holds a current certificate, so a scheduled audit would make it Provisional until the audit, and dried apricot contains no allergen."},{"id":"MR06","sec":"D","type":"ta","kind":"Multi-Source Reasoning","topic":"Multi-Source Reasoning","sub":"Effect of a change","b":1.2,"stim":"MS2","pattern":"Judge which single changes of fact alter the outcome of a rule system, separating attributes that matter for one entity from the same attributes that are irrelevant for another.","stem":"For each of the following events, select <i>Yes</i> if the event, occurring today with everything else unchanged, would change the number of suppliers from which the company may buy the ingredient shown in the supplier records. Otherwise, select <i>No</i>.","labels":["Yes","No"],"stmts":["A delivery from Arbeck Mills is rejected.","A third delivery from Lindqvist Dairy is rejected.","An on-site audit of Dalgaard Oats is scheduled for next month."],"ans":[0,1,1],"expl":"At present the company may buy from Arbeck Mills and Lindqvist Dairy, which are Approved, and from Kestrel Foods, which is Provisional and supplies an ingredient with no allergen. Arbeck Mills is Approved only through the waiver, so a rejected delivery would end its Approved status, and with no audit scheduled it could not be Provisional either: the number falls to two. Lindqvist Dairy is Approved through its recent audit, so further rejected deliveries change nothing. A scheduled audit cannot help Dalgaard Oats, because both Approved and Provisional status require a current certificate."},{"id":"MR07","sec":"D","type":"mc","kind":"Multi-Source Reasoning","topic":"Multi-Source Reasoning","sub":"Weighted average","b":1,"stim":"MS3","pattern":"Recover the mean of one subgroup from the overall mean, the mean of the other subgroup and the subgroup shares given in a different source.","stem":"Last quarter, what was the mean number of trips per day per non-electric bike at the Station depot?","opts":["2.4","2.75","3.5","4.0","4.5"],"ans":3,"expl":"Station has 350 bikes, of which 40 percent, or 140, are electric and 210 are not. All bikes together made 350 × 5.0 = 1,750 trips per day, and electric bikes made 140 × 6.5 = 910 of them. The non-electric bikes therefore made 840 trips per day, or 840 ÷ 210 = 4.0 each. Treating 5.0 as the simple average of the two types gives the tempting 3.5."},{"id":"MR08","sec":"D","type":"ta","kind":"Multi-Source Reasoning","topic":"Multi-Source Reasoning","sub":"Relative prices and shares","b":1.8,"stim":"MS3","pattern":"Convert budget equivalences into relative unit prices and combine them with counts derived from shares, distinguishing a share of units from a share of activity.","stem":"For each of the following statements, select <i>Yes</i> if the statement is supported by the information in the three sources. Otherwise, select <i>No</i>.","labels":["Yes","No"],"stmts":["Last quarter, electric bikes accounted for more than half of all trips made on bikes from the three depots.","If the fleet manager's plan is carried out, the budget will pay for overhauls of more than half of the bikes flagged for overhaul.","The contractor's price for a battery replacement is more than twice its price for an overhaul."],"ans":[0,0,1],"expl":"Electric bikes number 100, 150 and 140 and made 450 + 750 + 910 = 2,110 of the 1,200 + 1,000 + 1,750 = 3,950 daily trips, about 53 percent, although they are only 39 percent of the fleet. Measured in standard services, the budget is 1,800, an overhaul costs 1,800 ÷ 720 = 2.5 and a battery replacement costs 1,800 ÷ 450 = 4. The plan spends 1,000 on services and 140 × 4 = 560 on batteries at Station, the only depot above 6 trips, leaving 240, enough for 96 of the 175 flagged bikes. A battery replacement costs 1.6 times an overhaul, not more than twice."},{"id":"MR09","sec":"D","type":"ta","kind":"Multi-Source Reasoning","topic":"Multi-Source Reasoning","sub":"What-if reasoning","b":2.1,"stim":"MS3","pattern":"Evaluate hypothetical changes to a mix or a price by first deriving quantities that no source states directly, such as a subgroup rate or a residual budget.","stem":"For each of the following statements, select <i>Yes</i> if the statement is supported by the information in the three sources. Otherwise, select <i>No</i>.","labels":["Yes","No"],"stmts":["If 150 of Canal's non-electric bikes were replaced by electric bikes, and electric and non-electric bikes at Canal each kept last quarter's mean trips per day, Canal's mean trips per bike per day would exceed Hillside's mean for last quarter.","If the contractor's price for a battery replacement were 25 percent higher, with the budget and the other two prices unchanged, the fleet manager's plan would pay for fewer than half as many overhauls as it does at the actual prices.","Last quarter, the total number of trips per day made on non-electric bikes was greater at Station than at Canal."],"ans":[1,0,0],"expl":"Canal's 100 electric bikes made 450 of its 1,200 daily trips, so its 300 non-electric bikes averaged 2.5. With 250 electric and 150 non-electric bikes the mean would be (250 × 4.5 + 150 × 2.5) ÷ 400 = 3.75, below Hillside's 4.0, even though the electric share would then be higher than Hillside's. In standard-service units a battery replacement would cost 5 instead of 4, so Station's batteries would take 700 instead of 560 and the remainder would fall from 240 to 100, cutting overhauls from 96 to 40. Non-electric bikes made 840 trips per day at Station against 750 at Canal, although Canal has more of them."},{"sec":"D","type":"gi","kind":"Graphics Interpretation","topic":"Graphics Interpretation","id":"GR01","sub":"Scatter plot: filter then extreme","b":-1.1,"stim":"GRC01","pattern":"Count the points that satisfy a condition on one axis, then find the extreme on the other axis within that subset only.","stem":"Each point in the graph represents one of 10 training courses offered by a company. The horizontal position shows the percent of employees who enrolled in the course, and the vertical position shows the percent of those enrolled who completed it. Select the option from each list that makes the statement most accurate.","text":"The number of courses in which more than half of the employees enrolled is {0}. Among those courses, the lowest completion rate is {1}.","blanks":[["3","4","5","6"],["20%","40%","50%","70%"]],"ans":[2,1],"expl":"Five points lie to the right of 50 on the horizontal axis, at 55, 60, 70, 80 and 90. Their completion rates are 40, 70, 50, 80 and 70, so the lowest is 40%. The course with a 20% completion rate is the lowest overall, but only 25% of employees enrolled in it, so it is outside the subset."},{"sec":"D","type":"gi","kind":"Graphics Interpretation","topic":"Graphics Interpretation","id":"GR02","sub":"Line chart: range and median","b":-0.8,"stim":"GRC02","pattern":"Read the range of a short series from its two extremes and find the median by ordering the values, not by taking the middle position.","stem":"The graph shows the number of visitors to a science museum in each of seven consecutive months. Select the option from each list that makes the statement most accurate.","text":"The range of the seven monthly visitor numbers is {0} thousand. The median of the seven monthly visitor numbers is {1} thousand.","blanks":[["20","25","30","60"],["40","45","50","60"]],"ans":[2,1],"expl":"The greatest value is 60 (April) and the least is 30 (January), so the range is 30. In order the values are 30, 35, 40, 45, 50, 55, 60, and the fourth of the seven is 45. Taking the value of the middle month, April, gives 60, which is the maximum and not the median."},{"sec":"D","type":"gi","kind":"Graphics Interpretation","topic":"Graphics Interpretation","id":"GR03","sub":"Mean of a group and one member","b":-0.3,"stim":"GRC03","pattern":"Recover a group total from its mean, remove one known member, and compare that member's share of the total across periods.","stem":"A bank has exactly six branches. For each quarter of last year, the chart shows the number of new accounts opened at the Riverside branch and the mean number of new accounts opened per branch across all six branches. Select the option from each list that makes the statement most accurate.","text":"In the third quarter, the mean number of new accounts opened at the five branches other than Riverside was {0} hundred. The Riverside branch accounted for the greatest share of all new accounts opened at the bank in {1}.","blanks":[["16","17.5","21","25"],["Q1","Q2","Q3","Q4"]],"ans":[2,3],"expl":"In the third quarter the six branches opened 6 × 25 = 150 hundred accounts, so the other five opened 150 − 45 = 105, a mean of 21. Riverside's share is its bar divided by six times the mean: 30/120, 40/120, 45/150 and 35/90, which is 25%, about 33%, 30% and about 39%. The share peaks in Q4, even though Riverside opened the most accounts in Q3."},{"sec":"D","type":"gi","kind":"Graphics Interpretation","topic":"Graphics Interpretation","id":"GR04","sub":"Trend line: slope and deviation","b":0,"stim":"GRC04","pattern":"Read a rate from a trend line with a non-zero intercept and express one point's deviation as a percent of the predicted value.","stem":"The graph shows the amount of fertilizer applied and the wheat yield for each of 12 test plots, with a trend line fitted to the data. Select the option from each list that makes the statement most accurate.","text":"According to the trend line, each additional 10 kilograms of fertilizer per hectare is associated with an increase in yield of {0} metric tons per hectare. The yield of the plot that received 80 kilograms per hectare was {1} than the yield the trend line predicts for that amount.","blanks":[["0.05","0.2","0.5","0.7"],["15% lower","25% lower","33% lower","25% higher"]],"ans":[2,1],"expl":"The trend line rises from 2 at 0 kilograms to 7 at 100 kilograms, a gain of 5 metric tons over 100 kilograms, or 0.5 per 10 kilograms. The 0.05 figure is the gain per single kilogram, and dividing 7 by 100 ignores the starting value of 2. At 80 kilograms the line predicts 6, and the plot yielded 4.5, which is 1.5/6 = 25% lower; dividing by 4.5 gives the 33% figure."},{"sec":"D","type":"gi","kind":"Graphics Interpretation","topic":"Graphics Interpretation","id":"GR05","sub":"Cumulative line chart","b":0.3,"stim":"GRC05","pattern":"On a cumulative chart, a period's amount is the difference between consecutive points, not the height of the point.","stem":"The graph shows, for the end of each of the first six months of a year, the cumulative number of units a manufacturer had shipped since January 1 of that year. Select the option from each list that makes the statement most accurate.","text":"The month in which the manufacturer shipped the greatest number of units was {0}. The units shipped in February, March and April together were {1} of all units shipped in the six months.","blanks":[["February","April","June"],["37.5%","56.25%","68.75%"]],"ans":[1,1],"expl":"Monthly shipments are the rises between consecutive points: 10, 15, 5, 25, 5 and 20, so April is greatest. June has the highest point only because the chart is cumulative. February through April account for 55 − 10 = 45 of the 80 thousand units, which is 56.25%; using 55/80 wrongly includes January."},{"sec":"D","type":"gi","kind":"Graphics Interpretation","topic":"Graphics Interpretation","id":"GR06","sub":"Ratio of two bars and overall rate","b":0.6,"stim":"GRC06","pattern":"Compare a derived rate across categories and against the pooled rate, which is total over total and not something read from a single bar.","stem":"The chart shows the number of applications received and the number of offers made by each of five degree programs at a university last year. A program's offer rate is the number of offers it made divided by the number of applications it received. Select the option from each list that makes the statement most accurate.","text":"The program with the lowest offer rate was {0}. The number of programs whose offer rate was higher than the offer rate for the five programs combined was {1}.","blanks":[["Law","Design","History","Physics"],["1","2","3","4"]],"ans":[0,2],"expl":"Offer rates are 15/80, 25/60, 30/90, 10/40 and 20/50, or about 19%, 42%, 33%, 25% and 40%. Law is lowest, although History made the fewest offers. Combined, 100 offers on 320 applications is about 31%, and Medicine, Design and Physics exceed it."},{"sec":"D","type":"gi","kind":"Graphics Interpretation","topic":"Graphics Interpretation","id":"GR07","sub":"Share of change versus share of level","b":0.8,"stim":"GRC07","pattern":"Distinguish a component's share of the total increase from its own growth rate, and a change in share (percentage points) from a percent change.","stem":"A company has exactly two product lines, Software and Hardware. The graph shows the annual revenue from each product line for five consecutive years. Select the option from each list that makes the statement most accurate.","text":"Software accounted for approximately {0} of the increase in the company's total revenue from 2020 to 2024. Over the same period, Software's share of the company's total revenue rose by {1} percentage points.","blanks":[["40%","60%","67%","150%"],["15","30","60"]],"ans":[2,0],"expl":"Total revenue rose from 80 to 125, an increase of 45, of which Software contributed 50 − 20 = 30, or about 67%. The 150% figure is Software's own growth rate. Software's share went from 20/80 = 25% to 50/125 = 40%, a rise of 15 percentage points; 30 is its dollar increase and 60 is the relative change in the share."},{"sec":"D","type":"gi","kind":"Graphics Interpretation","topic":"Graphics Interpretation","id":"GR08","sub":"Histogram: bounds","b":1.1,"stim":"GRC08","pattern":"With grouped data, exact values are unknown, so statistics can only be bounded by pushing every value to an end of its interval.","stem":"The chart shows the distribution of scores of 40 trainees on an assessment. Each interval includes its lower endpoint but not its upper endpoint, and no trainee scored 100. Select the option from each list that makes the statement most accurate.","text":"The least possible value of the mean score of the 40 trainees is {0}. The greatest possible number of trainees who scored 85 or higher is {1}.","blanks":[["65.5","70.5","75.5","80.5"],["6","10","14","26"]],"ans":[1,2],"expl":"The mean is smallest when every trainee sits at the bottom of the interval: (4 × 50 + 10 × 60 + 12 × 70 + 8 × 80 + 6 × 90)/40 = 2,820/40 = 70.5. Using interval midpoints gives 75.5, which is an estimate and not a bound. All 8 trainees in the 80 to 90 interval could have scored 85 or more, so with the 6 above them the maximum is 14."},{"sec":"D","type":"gi","kind":"Graphics Interpretation","topic":"Graphics Interpretation","id":"GR09","sub":"Chart of percent changes, not levels","b":1.6,"stim":"GRC09","pattern":"When a chart plots period-over-period percent changes, the level rises whenever the plotted value is positive, and equal percent rises and falls do not cancel.","stem":"For each of eight consecutive quarters, the graph shows the percent change in the price of a commodity from the end of the preceding quarter to the end of that quarter. Select the option from each list that makes the statement most accurate.","text":"Of the eight quarter-end prices, the highest was the price at the end of {0}. The number of quarters at the end of which the price was lower than at the end of the preceding quarter was {1}.","blanks":[["Q2","Q3","Q7"],["3","4","5"]],"ans":[1,0],"expl":"The price rises in every quarter with a positive value, so it climbs through Q3, even though the plotted line turns down after Q2. From the end of Q3 to the end of Q7 the price is multiplied by 0.95 × 0.90 × 1.05 × 1.10, which is about 0.99, because a fall of a given percent outweighs a later rise of the same percent; so the end of Q7 is slightly below the end of Q3, and Q8 is lower still. The price fell only in the three quarters with negative values, Q4, Q5 and Q8; counting the four downward segments of the line confuses the change with the level."},{"sec":"D","type":"gi","kind":"Graphics Interpretation","topic":"Graphics Interpretation","id":"GR10","sub":"Scatter plot: derived ratio","b":1.2,"stim":"GRC10","pattern":"A ratio y/x can fall as x rises even when y and x are positively related, if the trend has a positive intercept; compare points with a ray from the origin.","stem":"Each point in the graph represents one of 12 sales representatives at a firm. The horizontal position shows the number of calls the representative made last quarter, and the vertical position shows the number of contracts the representative signed. A trend line is fitted to the data. A representative's conversion rate is the number of contracts signed divided by the number of calls made. Select the option from each list that makes the statement most accurate.","text":"Among these representatives, the relationship between the number of calls made and the conversion rate is {0}. The number of representatives whose conversion rate was greater than 25 percent is {1}.","blanks":[["strongly positive","negligible","strongly negative"],["3","6","9"]],"ans":[2,1],"expl":"Contracts rise with calls, but the trend line starts at 10 contracts for 0 calls and gains only 15 contracts per 100 calls, so contracts grow less than proportionally and the conversion rate falls steadily, from 50% at 20 calls to 20% at 200 calls. A conversion rate above 25% means a point above the ray from the origin through (40, 10), (100, 25) and (200, 50). Six points lie above that ray: those at 20, 40 (two), 60 and 80 calls, and the upper point at 100 calls."},{"sec":"D","type":"ta","kind":"Table Analysis","topic":"Table Analysis","id":"TB01","sub":"Filtering on yes/no attributes","b":-1,"stim":"TBT01","pattern":"Apply one or two categorical filters to the rows and test a quantified claim (every, exactly, most) on the filtered subset.","stem":"The table gives information about the eight shared office locations operated by a workspace company. For each of the following statements, select <i>Yes</i> if the statement is supported by the information in the table. Otherwise, select <i>No</i>.","labels":["Yes","No"],"stmts":["Every location that has parking has at least 2 meeting rooms.","Exactly two locations offer 24-hour access at a monthly fee per desk below $300.","Most of the locations that do not offer 24-hour access have parking."],"ans":[0,1,0],"expl":"The locations with parking are Cedar, Dune, Elm and Grove, with 4, 2, 2 and 3 meeting rooms: Yes. The 24-hour locations charging less than $300 are Birch, Dune and Hazel, which is three and not two: No. Cedar, Elm and Fir lack 24-hour access, and two of those three have parking: Yes."},{"sec":"D","type":"ta","kind":"Table Analysis","topic":"Table Analysis","id":"TB02","sub":"Medians and derived products","b":-0.1,"stim":"TBT02","pattern":"Find medians of two columns by sorting each separately, and compare a quantity formed by multiplying two columns.","stem":"The table gives information about the nine hotels operated by a regional group last year. Revenue per available room is the occupancy rate multiplied by the average daily rate. For each of the following statements, select <i>Yes</i> if the statement is supported by the information in the table. Otherwise, select <i>No</i>.","labels":["Yes","No"],"stmts":["The hotel with the median number of rooms is also the hotel with the median occupancy rate.","Revenue per available room at Fjord was more than twice that at Ember.","Each hotel with a guest rating of 4.2 or higher has fewer rooms per staff member than each hotel with a guest rating below 4.0."],"ans":[1,0,0],"expl":"Sorted by rooms, the fifth hotel is Delta (150 rooms); sorted by occupancy, the fifth is Iris (72%), so the medians belong to different hotels: No. Fjord earns 0.85 × 200 = $170 per available room and Ember 0.55 × 120 = $66, and 170 is more than 132: Yes. Hotels rated 4.2 or higher have 2.0, 1.6, 2.0 and 1.5 rooms per staff member, while those rated below 4.0 have about 2.2, 2.7 and 2.4: Yes."},{"sec":"D","type":"ta","kind":"Table Analysis","topic":"Table Analysis","id":"TB03","sub":"Sorting and rate per unit","b":0.3,"stim":"TBT03","pattern":"Check whether the extreme rows of one column coincide with the extreme rows of another, and count rows whose derived per-unit rate clears a threshold.","stem":"The table gives information about the eight parcel depots of a delivery company on a typical weekday. For each of the following statements, select <i>Yes</i> if the statement is supported by the information in the table. Otherwise, select <i>No</i>.","labels":["Yes","No"],"stmts":["The depot with the highest on-time rate is the depot with the fewest complaints per 1,000 parcels.","The three depots with the most vans are also the three depots that handle the most parcels.","At more than half of the depots, the number of parcels handled per van is greater than 150."],"ans":[1,0,0],"expl":"Colne has the highest on-time rate (97%), but Esher has the fewest complaints (3 per 1,000): No. Dover, Brent and Flint have the most vans (40, 36, 30) and also handle the most parcels (5,200, 4,500, 4,800): Yes. Parcels per van are 180, 125, 160, 130, 125, 160, 180 and 168, so five of the eight depots exceed 150: Yes."},{"sec":"D","type":"ta","kind":"Table Analysis","topic":"Table Analysis","id":"TB04","sub":"Percent changes versus levels","b":0.9,"stim":"TBT04","pattern":"A table of successive percent changes describes movements, not levels: equal rises and falls do not cancel, and the level bottoms out at the last negative change.","stem":"For each of eight product categories at a supermarket chain, the table shows the percent change in the category's price index from the end of the preceding month to the end of the month shown, together with the category's share of the chain's sales. For each of the following statements, select <i>True</i> if the statement is supported by the information in the table. Otherwise, select <i>False</i>.","labels":["True","False"],"stmts":["The price index for Beverages was lower at the end of April than it was at the end of the preceding December.","The price index for Dairy was higher at the end of March than it was at the end of January.","Of the four month-ends from January through April, the price index for Household was lowest at the end of April."],"ans":[0,1,1],"expl":"Beverages rose 2% and later fell 2%, and 1.02 × 0.98 is less than 1, so the index ended slightly below its December level: True. After January, Dairy fell 1% and then rose 0.5%, and 0.99 × 1.005 is less than 1, so March was below January: False. Household fell in January and February and rose in March and April, so its lowest month-end level was February; the small positive April figure is a rise, not a low level: False."},{"sec":"D","type":"ta","kind":"Table Analysis","topic":"Table Analysis","id":"TB05","sub":"Recovering counts from rates","b":1.1,"stim":"TBT05","pattern":"Convert rates back into counts (count divided by rate, or count times rate) before comparing rows, since the highest rate need not give the highest count.","stem":"The table gives information about the eight branches of a consumer lender last year. The approval rate is the number of loans approved as a percent of the number of loan applications the branch received, and the default rate is the percent of the branch's approved loans that defaulted. For each of the following statements, select <i>Yes</i> if the statement is supported by the information in the table. Otherwise, select <i>No</i>.","labels":["Yes","No"],"stmts":["Esk received more loan applications than Bala, Dee and Fal combined.","The branch that lent the greatest total amount approved fewer loans than exactly six of the other branches.","The branch with the highest default rate had more defaulted loans than any other branch."],"ans":[0,0,1],"expl":"Applications equal loans approved divided by the approval rate: Esk 750/0.30 = 2,500, against 600 + 640 + 625 = 1,865 for Bala, Dee and Fal: Yes. Total lent is loans times average loan, and Humber leads with 400 × 50 = $20,000 thousand while approving fewer loans than every branch except Dee: Yes. Fal has the highest default rate, giving 5% of 500 = 25 defaults, but Clyde had 3.75% of 960 = 36: No."},{"sec":"D","type":"ta","kind":"Table Analysis","topic":"Table Analysis","id":"TB06","sub":"Overlap bounds within groups","b":1.8,"stim":"TBT06","pattern":"Bound the overlap of two subsets separately within each group; the pooled totals understate the forced overlap, and the largest subset limits how many can be in neither.","stem":"The table gives information about the seven engineering teams at a technology company. Each engineer belongs to exactly one team, and an engineer may hold one, both or neither of the two certificates. For each of the following statements, select <i>Yes</i> if the statement must be true based on the information in the table. Otherwise, select <i>No</i>.","labels":["Yes","No"],"stmts":["In Flux, fewer than 40 engineers hold exactly one of the two certificates.","Fewer than 45 of the company's engineers hold both certificates.","In Atlas, at least one engineer who works remotely holds a certificate."],"ans":[0,1,0],"expl":"Flux has 25 + 28 = 53 certificates among 45 engineers, so at least 8 engineers hold both, and the number holding exactly one is at most 53 − 2 × 8 = 37: Yes. Overlap is forced team by team: at least 15 in Atlas, 25 in Cirrus and 8 in Flux, so at least 48 engineers hold both, even though the company totals (365 certificates, 375 engineers) seem to force none: No. In Atlas at least 30 of the 40 engineers hold a certificate, so at most 10 hold neither, and with 12 remote engineers at least two of them must hold one: Yes."}],"passages":{"P1":"<p>Standard accounts of competition in platform markets hold that network effects produce winner-take-all outcomes: because each additional user raises the value of a platform to every other user, an early lead compounds until rivals are starved of participants. On this view, a dominant ride-hailing or food-delivery platform should be nearly unassailable, and regulators should worry chiefly about entrenchment.</p>\n<p>Recent empirical work complicates this picture. Economists studying delivery platforms in several large cities found that market shares fluctuated substantially from year to year and that entrants routinely reached scale despite incumbents' size advantage. The researchers attribute this instability to multihoming, the practice of participating on several platforms at once. When drivers keep two apps open and customers compare prices across services, a platform's installed base is not really captive; the network benefits created by one firm's users are, in effect, available to its rivals. Network effects remain strong at the level of the market, but they do not attach to any particular firm.</p>\n<p>This finding does not imply that such markets are benign. Platforms respond to multihoming with devices designed to discourage it, such as loyalty tiers that reward drivers for a minimum number of weekly trips or subscriptions that waive delivery fees for customers who order exclusively through one service. These devices can restore the captivity that multihoming erodes, and, unlike superior matching technology, they do so without making the service itself better. The researchers therefore suggest that regulators attend less to a platform's size than to the contractual terms by which it binds participants, since it is these terms, rather than scale as such, that determine whether a lead can be contested.</p>","P2":"<p>The idea that forest trees exchange resources through common mycorrhizal networks, webs of fungal filaments linking the roots of neighboring plants, has moved quickly from research journals into popular culture. In its strongest form, the claim is that mature trees channel carbon through these networks to shaded seedlings, including their own offspring, and that forests are therefore better understood as cooperative communities than as arenas of competition.</p>\n<p>A recent reassessment of the field evidence urges caution. Its authors do not dispute that fungi physically connect the roots of different trees or that labeled carbon supplied to one tree can later be detected in another. Their concern is with what such detection shows. In most field experiments, the quantity of carbon recovered in receiver seedlings was small relative to the seedlings' own photosynthetic output, and few studies excluded alternative pathways, such as movement through soil water, by which carbon might travel without any network. Moreover, where seedlings connected to a network grew better than isolated ones, the experimental barriers used to isolate seedlings also altered soil moisture and root competition, so that the benefit could not be assigned to the network itself.</p>\n<p>The reassessment also documents a pattern in how the evidence has been reported. Papers citing the early field studies increasingly described their results as demonstrating benefits to seedlings, although the original authors had often characterized the same results as inconclusive. The authors of the reassessment note that an appealing hypothesis can thus acquire the appearance of an established finding without any accumulation of supporting data. They conclude not that resource sharing among trees is implausible but that the experiments required to establish it, ones that manipulate network connections while holding other soil conditions constant, have for the most part yet to be performed.</p>","P3":"<p>Historians seeking to measure literacy in early modern Europe have long relied on signatures. Because parish registers, wills, and court depositions required individuals either to sign their names or to make a mark, the proportion of signers offers a rare quantitative index reaching back before any systematic survey of education. The method rests on the observation that, in the schools of the period, reading was taught first and writing only afterward, often for an additional fee. A person able to sign had therefore, it was assumed, almost certainly learned to read, while the number of readers who never learned to write was thought to be roughly offset by signers who could write little beyond their names.</p>\n<p>Critics have challenged the second half of this assumption. Since instruction in reading was cheaper and shorter than instruction in writing, and since many girls in particular were withdrawn from school before the writing stage, the population of readers who could not sign may have been very large. Evidence from Sweden, where the church examined households annually on their ability to read scripture, supports this suspicion: in parishes where fewer than one in five adults could sign, examiners recorded that a large majority read competently. If comparable conditions held elsewhere, signature counts understate reading ability, and they do so unevenly, obscuring the literacy of women and of the rural poor more than that of urban men.</p>\n<p>Defenders of the method reply that its value never lay in the absolute levels it reports. Whatever the gap between signing and reading, they argue, it was probably stable enough within a given region that changes in signature rates over time still track real changes in literacy. This defense is weaker than it appears, however, for the very factors that produced the gap, the cost and sequence of schooling, were themselves changing over the period in question.</p>","P4":"<p>Automatic enrollment in employer retirement plans is among the most frequently cited successes of behavioral economics. When employees must opt out of a plan rather than opt in, participation rises sharply, often from below half of eligible workers to above ninety percent, and the effect is largest among younger and lower-paid employees, the groups least likely to enroll on their own.</p>\n<p>Participation, however, is only a proxy for the outcome that policy makers care about, namely household wealth at retirement. Studies that follow automatically enrolled workers for a decade or more report considerably smaller effects on that outcome than the participation figures suggest. One reason is that default contribution rates are typically set low, and many employees who would otherwise have chosen a higher rate remain at the default. Another is that a substantial share of workers withdraw their balances when they change jobs. A third is that some employees offset their new contributions by taking on additional debt, so that their net worth rises by less than their account balances.</p>\n<p>None of this shows that automatic enrollment is ineffective. It shows that a policy can succeed dramatically by the measure that is easiest to observe while achieving much less by the measure that matters, and that the size of the discrepancy depends on design choices, such as the default rate and the treatment of balances at job change, that the original experiments were not designed to evaluate.</p>","RCP1":"<p>Retailers have long regarded lenient return policies as a cost of doing business: every returned item must be inspected, repackaged, and often resold at a discount. For this reason, many managers assume that the surest way to protect profits is to tighten the terms of returns, for example by shortening the period within which a purchase may be sent back or by charging a restocking fee.</p>\n<p>A study of a large mail-order clothing retailer suggests that this assumption is mistaken, at least for some firms. The retailer extended its return period from 30 days to 90 days for a randomly selected group of customers. As expected, these customers returned more items than did customers under the old policy. However, they also placed larger and more frequent orders, and the profit from the additional purchases was more than twice the added cost of handling returns. Surveys indicated why: customers who knew they could return an item easily were more willing to order products they could not examine in advance, such as a garment in an un
