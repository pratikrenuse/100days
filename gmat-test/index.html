 Bo can complete the same audit in 24 days. Bo began the audit alone, Ana joined him some days later, and they then worked together until the audit was complete, exactly 10 days after Bo began. For how many days did Bo work alone?","opts":["3","4","6","7","8"],"ans":0,"expl":"Bo worked all 10 days and so completed 10/24 = 5/12 of the audit. Ana completed the other 7/12, which at 1/12 per day took her 7 days. She therefore joined after Bo had worked 10 − 7 = 3 days alone. The value 7 is the number of days Ana worked."},{"sec":"Q","type":"mc","kind":"Problem Solving","id":"NR06","topic":"Work/Rate Problems","sub":"Overlapping groups of machines","b":1.1,"pattern":"Rates of overlapping groups are given, and an individual rate is isolated by adding and subtracting group rates rather than group times.","stem":"Machines X, Y and Z each work at a constant rate. Machines X and Y, working together, complete a certain job in 6 hours. Machines Y and Z, working together, complete the job in 8 hours. All three machines, working together, complete the job in 4 hours. How many hours does machine Y, working alone, take to complete the job?","opts":["8","10","12","14","24"],"ans":4,"expl":"In rates, (X + Y) + (Y + Z) − (X + Y + Z) = Y, so the rate of Y is 1/6 + 1/8 − 1/4 = 1/24 of the job per hour. Machine Y therefore needs 24 hours. Applying the same idea to the times gives 6 + 8 − 4 = 10, which is wrong because times do not add. The values 8 and 12 are the times for X alone and Z alone."},{"sec":"Q","type":"mc","kind":"Problem Solving","id":"NR07","topic":"Work/Rate Problems","sub":"Alternating shifts","b":1.4,"pattern":"Two workers alternate fixed shifts, so the job is tracked in whole cycles and the final partial shift must be handled at the rate of whoever is working.","stem":"Working alone at its constant rate, pump X can drain a flooded basement in 6 hours. Working alone at its constant rate, pump Y can drain the same basement in 10 hours. The pumps are run one at a time in alternating one-hour shifts, beginning with pump X, until the basement is drained. How long does it take to drain the basement?","opts":["7 hours 12 minutes","7 hours 20 minutes","7 hours 30 minutes","7 hours 36 minutes","8 hours"],"ans":1,"expl":"Each two-hour cycle drains 1/6 + 1/10 = 4/15 of the basement, so after 6 hours 12/15 is drained and 1/5 remains. Pump X drains 1/6 in the seventh hour, leaving 1/30, which pump Y drains in (1/30)/(1/10) = 1/3 hour. The total is 7 hours 20 minutes. Dividing the job by the average rate of 2/15 per hour gives 7 hours 30 minutes, which ignores that the faster pump works the larger share of the final hours."},{"sec":"Q","type":"mc","kind":"Problem Solving","id":"NR08","topic":"Work/Rate Problems","sub":"Two types of machines","b":1.2,"pattern":"Two mixed crews of two machine types give two linear equations in the unit rates; solve for one type and scale to a new crew.","stem":"At a port, each large conveyor works at one constant rate and each small conveyor works at another constant rate. Working together, 2 large and 2 small conveyors can unload a certain ship in 12 hours. Working together, 2 large and 7 small conveyors can unload the same ship in 6 hours. How many hours would 8 large conveyors, working together, take to unload the ship?","opts":["2.5","3","4","5","7.5"],"ans":3,"expl":"The first crew unloads 1/12 of the ship per hour and the second unloads 1/6 per hour, so the 5 extra small conveyors contribute 1/12 per hour and each small conveyor unloads 1/60 per hour. Then 2 large conveyors unload 1/12 − 2/60 = 1/20 per hour, so each large conveyor unloads 1/40 per hour. Eight of them unload 1/5 per hour and need 5 hours. The value 7.5 is the time for 8 small conveyors."},{"sec":"Q","type":"mc","kind":"Problem Solving","id":"NR09","topic":"Distance/Rate Problems","sub":"Unit conversion of speed","b":-1.2,"pattern":"A speed in kilometers per hour must be converted to meters per second before it is multiplied by a time given in seconds.","stem":"A survey drone flies at a constant speed of 54 kilometers per hour. How many meters does the drone travel in 20 seconds?","opts":["180","270","300","324","1,080"],"ans":2,"expl":"54 kilometers per hour is 54,000 meters in 3,600 seconds, or 15 meters per second. In 20 seconds the drone travels 15 × 20 = 300 meters. Multiplying 54 by 20 without converting gives 1,080."},{"sec":"Q","type":"mc","kind":"Problem Solving","id":"NR10","topic":"Distance/Rate Problems","sub":"Average speed","b":-0.8,"pattern":"Average speed over two legs described in different ways (one by distance, one by time) is total distance divided by total time, not the mean of the speeds.","stem":"A truck traveled the first 180 kilometers of a delivery route at a constant speed of 90 kilometers per hour and then traveled for 3 more hours at a constant speed of 60 kilometers per hour. What was the average speed of the truck, in kilometers per hour, for the entire route?","opts":["64","68","70","72","75"],"ans":3,"expl":"The first leg took 180/90 = 2 hours, and the second leg covered 3 × 60 = 180 kilometers. The average speed is 360 kilometers divided by 5 hours, or 72 kilometers per hour. The value 75 is the simple mean of the two speeds, which would be right only if the two legs took equal time."},{"sec":"Q","type":"mc","kind":"Problem Solving","id":"NR11","topic":"Distance/Rate Problems","sub":"Meeting with a head start","b":-0.1,"pattern":"Two travelers move toward each other with one starting earlier: remove the head-start distance, close the rest at the sum of the speeds, then answer for the requested traveler.","stem":"Two stations are 420 kilometers apart on a straight track. A freight train leaves the western station at 8:00 a.m. and travels east at a constant speed of 60 kilometers per hour. An express train leaves the eastern station at 9:00 a.m. and travels west on a parallel track at a constant speed of 120 kilometers per hour. When the two trains pass each other, how many kilometers is the freight train from the western station?","opts":["140","180","210","240","280"],"ans":1,"expl":"By 9:00 a.m. the freight train has covered 60 kilometers, leaving 360 kilometers between the trains. They close that gap at 60 + 120 = 180 kilometers per hour, so they pass 2 hours later. The freight train has then traveled for 3 hours, or 180 kilometers. The value 140 ignores the head start, and 240 is the distance covered by the express train."},{"sec":"Q","type":"mc","kind":"Problem Solving","id":"NR12","topic":"Distance/Rate Problems","sub":"Circular track, catching up","b":0.2,"pattern":"Two bodies circle a track in the same direction; the faster gains one full lap at the difference of the speeds, and the answer is a quantity for one of them at that moment.","stem":"Two cyclists start at the same time from the same point on a 400-meter circular track and ride in the same direction, one at a constant speed of 10 meters per second and the other at a constant speed of 8 meters per second. At the moment when the faster cyclist first overtakes the slower cyclist, how many laps of the track has the faster cyclist completed?","opts":["4","5","8","9","10"],"ans":1,"expl":"The faster cyclist gains 2 meters each second and must gain a full 400 meters, which takes 200 seconds. In that time the faster cyclist rides 2,000 meters, or 5 laps. The value 4 is the number of laps completed by the slower cyclist."},{"sec":"Q","type":"mc","kind":"Problem Solving","id":"NR13","topic":"Distance/Rate Problems","sub":"Upstream and downstream","b":0.5,"pattern":"Downstream and upstream times over the same distance give the two effective speeds, from which the speed of the current alone is extracted and used.","stem":"A ferry whose speed in still water is constant travels 48 kilometers downstream on a river in 2 hours and makes the return trip upstream in 3 hours. If the current flows at a constant speed, how many hours would a raft drifting with the current take to travel the same 48 kilometers?","opts":["2.4","5","6","10","12"],"ans":4,"expl":"The downstream speed is 24 kilometers per hour and the upstream speed is 16 kilometers per hour. Their difference is twice the speed of the current, so the current flows at 4 kilometers per hour and the raft needs 48/4 = 12 hours. Taking the full difference of 8 as the speed of the current gives 6, and 2.4 uses the speed of the ferry in still water."},{"sec":"Q","type":"mc","kind":"Problem Solving","id":"NR14","topic":"Distance/Rate Problems","sub":"Trains and relative speed","b":1,"pattern":"One train overtakes another on a parallel track: the distance to cover is the sum of the two lengths and the rate is the difference of the speeds, after converting units.","stem":"Train P is 180 meters long and travels at a constant speed of 90 kilometers per hour. Train Q is 220 meters long and travels in the same direction on a parallel track at a constant speed of 54 kilometers per hour. How many seconds elapse from the moment the front of train P draws level with the rear of train Q until the moment the rear of train P draws level with the front of train Q?","opts":["10","18","22","30","40"],"ans":4,"expl":"The speeds are 25 and 15 meters per second, so train P gains 10 meters per second on train Q. To pass completely, train P must gain the length of train Q plus its own length, 220 + 180 = 400 meters, which takes 40 seconds. Using the sum of the speeds gives 10, and using only one train length gives 18 or 22."},{"sec":"Q","type":"mc","kind":"Problem Solving","id":"NR15","topic":"Distance/Rate Problems","sub":"Circular track, opposite directions","b":1.7,"pattern":"Two bodies on a closed loop with different lap times: the time until both are back at the start is a common multiple of the lap times, which is different from the time between meetings.","stem":"Two runners start at the same time from point S on a circular track and run in opposite directions at constant speeds. One runner completes each lap in 40 seconds and the other completes each lap in 60 seconds. Between the start and the next moment at which both runners are at point S at the same time, how many times do the runners pass each other at points other than S?","opts":["2","3","4","5","6"],"ans":2,"expl":"Both runners are at S together again after the least common multiple of 40 and 60 seconds, which is 120 seconds, when they have run 3 laps and 2 laps. Running in opposite directions, they cover one lap between them every 1/(1/40 + 1/60) = 24 seconds, so they meet at 24, 48, 72, 96 and 120 seconds. The meeting at 120 seconds is at S, which leaves 4 meetings elsewhere. Counting all 5 meetings is the trap."},{"sec":"Q","type":"mc","kind":"Problem Solving","id":"NR16","topic":"Distance/Rate Problems","sub":"Two runs, proportional reasoning","b":1.5,"pattern":"Two trials over the same course at unchanged speeds are linked: a distance shortfall in one trial and a time head start in the other describe the same interval for the slower traveler.","stem":"Two delivery robots, A and B, each travel at a constant speed along a straight 600-meter corridor. In a first trial they start together at one end, and when robot A reaches the other end, robot B is still 120 meters from it. In a second trial robot B starts 30 seconds before robot A from the same end, and the two robots reach the other end at the same moment. How many seconds does robot A take to travel the length of the corridor?","opts":["120","150","180","200","240"],"ans":0,"expl":"In the time robot A covers 600 meters, robot B covers 480 meters, so robot B needs exactly 30 more seconds to cover the last 120 meters and travels at 4 meters per second. The speeds are in the ratio 600 to 480, so robot A travels at 5 meters per second and takes 600/5 = 120 seconds. The value 150 is the time taken by robot B."},{"sec":"Q","type":"mc","kind":"Problem Solving","topic":"Overlapping Sets","id":"NS01","sub":"Counts with a neither group","b":-1.1,"pattern":"Two-set counts with a neither group, where the question asks for the members of one set only rather than for the overlap.","stem":"A warehouse audit covered 140 pallets. Of these, 85 held fragile goods, 60 were bound for export, and 25 neither held fragile goods nor were bound for export. How many of the pallets held fragile goods but were not bound for export?","opts":["30","55","60","80","85"],"ans":1,"expl":"Removing the 25 pallets in neither group leaves 115 pallets that are fragile, bound for export, or both. Since 85 + 60 = 145, exactly 145 − 115 = 30 pallets are in both groups. The fragile pallets not bound for export number 85 − 30 = 55. The value 30 is the overlap, and 80 comes from forgetting the neither group."},{"sec":"Q","type":"mc","kind":"Problem Solving","topic":"Overlapping Sets","id":"NS02","sub":"Conditional percent, total not given","b":-0.3,"pattern":"Percents of two complementary subgroups share a characteristic, and the question asks what percent of those with the characteristic come from one subgroup.","stem":"Of the patients seen at a clinic last month, 25 percent were new patients and the rest were returning patients. A follow-up visit was scheduled for 80 percent of the new patients and for 40 percent of the returning patients. What percent of the patients for whom a follow-up visit was scheduled were new patients?","opts":["20%","25%","40%","50%","80%"],"ans":2,"expl":"Take 100 patients: 25 new and 75 returning. Follow-up visits were scheduled for 0.8 × 25 = 20 new patients and 0.4 × 75 = 30 returning patients, 50 in all. New patients are 20 of those 50, which is 40 percent. The value 20 percent is the share of all patients, not of those with a follow-up visit."},{"sec":"Q","type":"mc","kind":"Problem Solving","topic":"Overlapping Sets","id":"NS03","sub":"Regions linked by relations","b":0,"pattern":"The exclusive regions of two sets are each described relative to the overlap, and the question asks for one full set rather than a region.","stem":"Each of the 180 employees at a company office has a parking permit, a transit pass, both, or neither. Exactly 25 employees have neither. The number of employees who have only a transit pass is twice the number who have both, and the number who have only a parking permit is 15 more than the number who have both. How many of the employees have a parking permit?","opts":["35","50","70","85","105"],"ans":3,"expl":"Let <i>x</i> be the number with both. The 155 employees who have at least one of the two split into <i>x</i> with both, 2<i>x</i> with only a transit pass and <i>x</i> + 15 with only a parking permit, so 4<i>x</i> + 15 = 155 and <i>x</i> = 35. Those with a parking permit are the 50 with only a permit plus the 35 with both, 85 in all. Stopping at 50 counts only the employees who have a permit and no pass."},{"sec":"Q","type":"mc","kind":"Problem Solving","topic":"Overlapping Sets","id":"NS04","sub":"Changing the base","b":0.3,"pattern":"A percent of a subgroup is converted to a percent of the whole, moved to the complementary column of the matrix, and then expressed on a different base.","stem":"Of the invoices a firm issued last year, 30 percent were paid late and 20 percent were issued to overseas clients, the rest being issued to domestic clients. If 40 percent of the invoices that were paid late had been issued to overseas clients, what percent of the invoices issued to domestic clients were paid late?","opts":["22.5%","24%","30%","37.5%","60%"],"ans":0,"expl":"Take 100 invoices: 30 were paid late, and 0.4 × 30 = 12 of those were overseas, so 18 late invoices were domestic. Domestic invoices number 80, and 18/80 = 22.5 percent. The value 60 percent is the share of late invoices that were domestic, which uses the wrong base."},{"sec":"Q","type":"mc","kind":"Problem Solving","topic":"Overlapping Sets","id":"NS05","sub":"Greatest possible value","b":0.9,"pattern":"A lower limit on the neither group restricts the possible overlap, and the question asks for the greatest possible number in exactly one of the two sets.","stem":"In a survey of 250 households, 160 reported owning a dishwasher and 120 reported owning a clothes dryer. If at least 40 of the households reported owning neither appliance, what is the greatest possible number of households that reported owning exactly one of the two appliances?","opts":["40","70","140","210","220"],"ans":2,"expl":"If <i>b</i> households own both, then 280 − <i>b</i> own at least one, so the number owning neither is <i>b</i> − 30 and the number owning exactly one is 280 − 2<i>b</i>. The count owning exactly one is greatest when <i>b</i> is as small as possible. At least 40 households own neither, so <i>b</i> is at least 70, giving 280 − 140 = 140. The value 220 ignores the condition on the neither group, and 210 simply subtracts 40 from 250."},{"sec":"Q","type":"mc","kind":"Problem Solving","topic":"Overlapping Sets","id":"NS06","sub":"Two bases, total not given","b":1.1,"pattern":"The overlap is given as a percent of one set and as a fraction of the other, the neither group fixes the scale, and the answer is a conditional percent on the complement of the first set.","stem":"At a trade conference, 60 percent of the attendees who registered early attended the opening session, and attendees who registered early made up 2/3 of all those who attended the opening session. If 35 percent of all attendees neither registered early nor attended the opening session, what percent of the attendees who did not register early attended the opening session?","opts":["15%","30%","45%","50%","60%"],"ans":1,"expl":"Let <i>E</i> be the percent of attendees who registered early. Then 0.6<i>E</i> registered early and attended the session, and this is 2/3 of the session attendees, so 0.9<i>E</i> attended the session and 0.3<i>E</i> attended it without registering early. Those with at least one characteristic total <i>E</i> + 0.3<i>E</i> = 65, so <i>E</i> = 50. Of the 50 percent who did not register early, 15 percent of all attendees attended the session, and 15/50 is 30 percent."},{"sec":"Q","type":"mc","kind":"Problem Solving","topic":"Overlapping Sets","id":"NS07","sub":"Linked conditional percents","b":1,"pattern":"Two conditional percents on complementary rows are linked by a multiple, both set totals are given, and the neither cell is asked for.","stem":"Of the customers of a certain bank, 40 percent use the bank's mobile app and 56 percent hold one of its credit cards. The percent of the app users who hold a credit card is twice the percent of the customers not using the app who hold a credit card. What percent of the bank's customers neither use the app nor hold a credit card?","opts":["8%","16%","24%","32%","36%"],"ans":4,"expl":"Take 100 customers: 40 use the app and 60 do not. If the fraction <i>p</i> of those not using the app hold a card, then 2<i>p</i> of the app users do, so 60<i>p</i> + 80<i>p</i> = 56 and <i>p</i> = 0.4. That gives 24 card holders among the 60 customers not using the app, leaving 60 − 24 = 36 with neither. The value 8 percent is the group that uses the app without holding a card."},{"sec":"Q","type":"mc","kind":"Problem Solving","topic":"Overlapping Sets","id":"NS08","sub":"Overlap as two fractions, whole numbers","b":1.8,"pattern":"The overlap is a different fraction of each set, so every region is a whole-number multiple of a common unit, and a bound on the total selects the multiple.","stem":"In a certain club, exactly 3/7 of the members who play chess also play bridge, and exactly 4/9 of the members who play bridge also play chess. The club has fewer than 100 members, 20 of whom play neither game, and at least one member plays both. How many of the members play exactly one of the two games?","opts":["12","16","27","28","31"],"ans":4,"expl":"The number playing both equals 3/7 of the chess players and 4/9 of the bridge players, so it must be a multiple of 12: with 12<i>k</i> playing both, there are 28<i>k</i> chess players and 27<i>k</i> bridge players. Then 16<i>k</i> play only chess and 15<i>k</i> play only bridge, and the club has 43<i>k</i> + 20 members. Fewer than 100 members forces <i>k</i> = 1, so 16 + 15 = 31 members play exactly one game."},{"sec":"V","type":"mc","kind":"Critical Reasoning","topic":"Critical Reasoning","id":"CA01","sub":"Weaken","b":-1,"pattern":"A correlation between two features of places is used to predict the effect of an intervention; a third factor tied to location explains the correlation.","stem":"<p>A health survey in the city of Halvick found that residents of neighborhoods with many street trees are treated for asthma far less often than residents of neighborhoods with few street trees. Citing this finding, a member of the city council has proposed planting 10,000 trees in the neighborhoods that now have the fewest, arguing that the planting will substantially reduce the number of asthma cases in those neighborhoods.</p><p>Which of the following, if true, most seriously weakens the council member's argument?</p>","opts":["Trees planted along streets take at least ten years to reach their full height.","Some residents of the neighborhoods with few street trees have said that they would rather the money be spent on playgrounds.","Halvick's neighborhoods with few street trees lie beside the city's industrial district, whose factories emit pollutants known to trigger asthma.","The survey counted only cases of asthma that were treated at clinics within Halvick.","Asthma is treated less often in Halvick as a whole than in most other cities of similar size."],"ans":2,"expl":"The argument treats the link between trees and asthma as causal. If the neighborhoods with few trees are also the ones exposed to factory pollutants that trigger asthma, the pollution rather than the lack of trees may account for the difference, and planting trees would leave the real cause untouched. The time trees need to grow, residents' spending preferences and comparisons with other cities do not bear on whether trees reduce asthma."},{"sec":"V","type":"mc","kind":"Critical Reasoning","topic":"Critical Reasoning","id":"CA02","sub":"Weaken","b":0,"pattern":"A plan removes one source of a problem; the problem will persist because a larger source lies outside the plan.","stem":"<p>Each summer, blooms of algae fed by phosphorus make Lake Orvind unsafe for swimming. Household laundry detergents sold in the surrounding province of Meravand contain phosphorus, which passes through the province's wastewater plants into rivers that drain into the lake. The provincial government therefore plans to prohibit the sale of detergents that contain phosphorus, and it predicts that within a few years of the ban the summer blooms will no longer occur.</p><p>Which of the following, if true, most seriously calls the government's prediction into question?</p>","opts":["More than four-fifths of the phosphorus that reaches Lake Orvind is washed from fertilized farmland in Meravand, where the use of fertilizer is not restricted.","Detergents that contain no phosphorus cost somewhat more to produce than those that contain it.","Several lakes in neighboring provinces that have no algae blooms receive less phosphorus each year than Lake Orvind does.","Meravand's wastewater plants could be refitted to remove phosphorus, but only at great expense.","Some households in Meravand already choose detergents that contain no phosphorus."],"ans":0,"expl":"The prediction assumes that detergent is the source of enough of the lake's phosphorus that removing it will end the blooms. If most of the phosphorus comes from farmland that the ban does not touch, the blooms can be expected to continue. That some households already avoid phosphorus only trims the ban's effect slightly, and the cost of alternatives or of refitting plants does not show that the ban would fail to end the blooms."},{"sec":"V","type":"mc","kind":"Critical Reasoning","topic":"Critical Reasoning","id":"CA03","sub":"Weaken","b":0.9,"pattern":"A quality difference between older and newer surviving objects is attributed to their makers; selective survival of the older group explains it instead.","stem":"<p>Historian: The national archive of Sarvenia holds several hundred manuscripts that were copied at the scriptorium of Velloch Abbey. Those copied before 1200 contain, page for page, far fewer copying errors than those copied after 1300. Since the abbey's scribes used the same script and the same writing materials in both periods, the difference shows that the scribes who worked at Velloch before 1200 were more careful copyists than those who worked there after 1300.</p><p>Which of the following, if true, most seriously weakens the historian's argument?</p>","opts":["The archive holds about three times as many Velloch manuscripts copied after 1300 as copied before 1200.","Velloch Abbey employed more scribes after 1300 than it had employed before 1200.","Most of the errors in the later manuscripts are omissions of single words rather than of whole lines.","The manuscripts from both periods were examined by the same team of scholars, who applied the same definition of a copying error throughout.","Around 1250 the abbey's librarians inspected every manuscript then in its collection and scraped clean for reuse those they judged too faulty to keep; no such inspection was ever made again."],"ans":4,"expl":"The historian assumes that the surviving manuscripts fairly represent what each generation of scribes produced. If the faulty early manuscripts were destroyed in a one-time inspection that the later manuscripts never faced, the early survivors would look better even if the early scribes were no more careful. The smaller number of early manuscripts is suggestive but does not by itself show that survival depended on quality, and consistent examination methods only make the measured difference more secure."},{"sec":"V","type":"mc","kind":"Critical Reasoning","topic":"Critical Reasoning","id":"CA04","sub":"Weaken","b":0.3,"pattern":"A prediction rests on an analogy with a past case; the mechanism that worked in the past case depended on the very thing now being removed.","stem":"<p>When the fish cannery in the town of Port Senna closed eight years ago, 600 workers lost their jobs. Within two years, however, nearly all of them had been hired by businesses that opened in the town after the closure. Now the Drayholm shipyard, Port Senna's largest employer, has announced that it will close, eliminating 900 jobs. Town officials, pointing to what happened after the cannery closed, predict that most of the shipyard's workers will likewise find new jobs in Port Senna within a few years.</p><p>Which of the following, if true, casts the most doubt on the officials' prediction?</p>","opts":["The shipyard's workers earn, on average, higher wages than the cannery's workers earned.","Most of the businesses that opened in Port Senna after the cannery closed make parts or provide services for the Drayholm shipyard.","Some of the workers who lost their jobs when the cannery closed were later hired by the shipyard.","The building that housed the cannery has stood empty since the cannery closed.","Two towns near Port Senna have each lost a large employer during the past eight years."],"ans":1,"expl":"The officials reason that what followed the cannery's closure will follow the shipyard's. If the businesses that absorbed the cannery workers exist to supply the shipyard, the earlier recovery depended on the shipyard itself, so its closure removes the source of the new jobs and may eliminate those businesses too. Higher shipyard wages concern the quality of new jobs, not whether jobs will be found, and the fact that some cannery workers joined the shipyard involves only an unspecified few."},{"sec":"V","type":"mc","kind":"Critical Reasoning","topic":"Critical Reasoning","id":"CA05","sub":"Weaken","b":1,"pattern":"A fall in a rate is credited to an intervention; a change in who is counted in the denominator would lower the rate with no change in risk.","stem":"<p>Two years ago Northmere Hospital adopted a new treatment protocol for patients admitted with cardiac conditions. In the year before the protocol was adopted, 8 percent of the hospital's cardiac admissions ended in the patient's death within 30 days; in the year after, the figure was 5 percent. The hospital's staffing, equipment and medications were the same in both years. The hospital's director concludes that the protocol has reduced the risk of death faced by patients with cardiac conditions who are treated at Northmere.</p><p>Which of the following, if true, most seriously weakens the director's argument?</p>","opts":["Other hospitals that have adopted the same protocol have reported declines in 30-day cardiac mortality that are smaller than the decline at Northmere.","The protocol was devised by Northmere's own cardiologists rather than by a national medical body.","Among patients admitted to Northmere for conditions other than cardiac conditions, the proportion who died within 30 days was the same in both years.","Since shortly after the protocol was adopted, patients who arrive at Northmere with chest pain and are kept overnight for observation, most of whom prove to have no serious illness, have been recorded as cardiac admissions rather than as emergency visits.","The cardiac patients admitted to Northmere in the year after the protocol was adopted were, on average, slightly older than those admitted in the year before."],"ans":3,"expl":"The director infers lower risk from a lower death rate among cardiac admissions. If large numbers of low-risk observation patients were newly counted as cardiac admissions, the percentage of admissions ending in death would fall even if seriously ill patients fared no better than before. Smaller declines at other hospitals are still declines and so are consistent with the protocol working, while the unchanged rate for other patients and the older cardiac patients both make the director's explanation more plausible, not less."},{"sec":"V","type":"mc","kind":"Critical Reasoning","topic":"Critical Reasoning","id":"CA06","sub":"Strengthen","b":-1,"pattern":"A price incentive is meant to shift behavior; the plan is supported by evidence that the target group is able to change its behavior.","stem":"<p>The buses operated by Tovar Transit are badly overcrowded between 7 and 9 in the morning but run half empty for the rest of the day. Tovar cannot afford to buy more buses or hire more drivers. Instead, it plans to cut the fare by 40 percent for any trip that begins before 7 or after 9 in the morning, expecting that the lower fare will relieve the morning overcrowding.</p><p>Which of the following, if true, most strongly supports the expectation that Tovar's plan will succeed?</p>","opts":["Tovar's fares are already lower than those of transit systems in cities of comparable size.","Many of the people who ride Tovar's buses between 7 and 9 in the morning have employers that let them choose when their working day begins.","Most of the riders who now travel on Tovar's buses after 9 in the morning are students or retired people.","Tovar's revenue from fares has declined in each of the past three years.","Overcrowding on Tovar's buses is worse on weekdays than on weekends."],"ans":1,"expl":"The plan works only if riders who now travel between 7 and 9 are able to travel at other times. Riders whose employers let them choose their starting time can respond to the cheaper fare by shifting their trips, which is exactly the change the plan needs. Facts about who rides after 9, about Tovar's fares relative to other cities and about its revenue do not show that peak riders can or will move."},{"sec":"V","type":"mc","kind":"Critical Reasoning","topic":"Critical Reasoning","id":"CA07","sub":"Strengthen","b":0.1,"pattern":"A causal claim drawn from a self-selected group is supported by showing the groups did not differ on the outcome before the treatment.","stem":"<p>Garrow Logistics offers its warehouse employees a voluntary two-day course in safe lifting. Company records show that, in the year after last year's course, the employees who had taken it suffered back injuries at less than half the rate of the employees who had not. Garrow's managers conclude that the course prevents back injuries, and they intend to require all warehouse employees to take it.</p><p>Which of the following, if true, most strengthens the managers' conclusion?</p>","opts":["The course is taught by instructors who are certified by a national safety organization.","Back injuries are the most common cause of lost workdays at Garrow's warehouses.","Nearly all of the employees who took the course rated it as useful in a survey conducted on its final day.","In the year before the course was given, the employees who went on to take it had suffered back injuries at about the same rate as the employees who did not take it.","The employees who took the course had, on average, worked at Garrow longer than those who did not."],"ans":3,"expl":"Because employees chose whether to take the course, those who took it might simply have been the more careful workers all along. Learning that the two groups had similar injury rates beforehand rules out that explanation and leaves the course as the likely cause of the later difference. Instructor credentials and favorable ratings do not show that injuries fell because of the course, and a difference in experience between the groups would offer a rival explanation."},{"sec":"V","type":"mc","kind":"Critical Reasoning","topic":"Critical Reasoning","id":"CA08","sub":"Strengthen","b":0.4,"pattern":"Two rival explanations of an increase are named; the conclusion is supported by a pattern in the data that one explanation predicts and the other does not.","stem":"<p>After Brellan Grocers replaced half of the staffed checkout lanes in 20 of its stores with self-checkout machines, the value of goods that left those stores without being paid for rose sharply. Such losses could result either from honest mistakes, as when a customer fails to notice that an item did not scan, or from deliberate theft. Brellan's management has concluded that deliberate theft accounts for most of the increase, and it plans to post a security guard beside the machines in each store.</p><p>Which of the following, if true, most strongly supports management's conclusion?</p>","opts":["The increase in unpaid goods at the 20 stores has consisted almost entirely of the most expensive items the stores sell, with little change for inexpensive items of similar size and packaging.","Other grocery chains have reported increases of similar size in unpaid goods after installing self-checkout machines.","Before the machines were installed, losses from unpaid goods at the 20 stores were no higher than at Brellan's other stores.","Most customers at the 20 stores say that they find the self-checkout machines easy to use.","The number of customers visiting the 20 stores has not changed since the machines were installed."],"ans":0,"expl":"Honest scanning mistakes should fall on cheap and costly items alike, whereas a thief has reason to prefer costly ones. An increase confined to the most expensive items, with no matching change for similar cheap items, is what deliberate theft predicts and what honest error does not. Similar increases at other chains and the stores' unremarkable earlier losses fit either explanation, and customers' reports that the machines are easy to use do not show that items are seldom missed by accident."},{"sec":"V","type":"mc","kind":"Critical Reasoning","topic":"Critical Reasoning","id":"CA09","sub":"Strengthen","b":0.9,"pattern":"One of two candidate causes is supported indirectly: the effect is equally strong where the rival cause is absent but the favored cause is present.","stem":"<p>Over the past fifteen years, frog populations in the ponds of the Tessary Highlands have fallen by more than half. Some biologists attribute the decline to pesticides, which the prevailing westerly winds carry up from the farms on the plain that lies to the west of the highlands. Dr. Imani Okoro contends instead that the main cause is predation by trout, which anglers' associations have released into ponds throughout the highlands and which eat tadpoles.</p><p>Which of the following, if true, most strongly supports Dr. Okoro's contention?</p>","opts":["Tadpoles have been found in the stomachs of trout caught in several highland ponds.","Trout were first released into highland ponds during the same decade in which pesticide use on the farms began to increase.","Frog populations have fallen as steeply in ponds on the eastern slopes of the highlands, which a high central ridge shelters from the westerly winds, as in ponds on the western slopes.","Frog populations on the plain, where no trout have been released, have also declined, though less steeply than those in the highlands.","The trout released in the highlands grow more slowly than trout of the same species do in rivers on the plain."],"ans":2,"expl":"If wind-borne pesticides were the main cause, ponds sheltered from the wind should have fared better than exposed ones. An equally steep decline on the sheltered eastern slopes, where trout are present but little pesticide arrives, points away from pesticides and toward trout. That trout stomachs contain tadpoles adds nothing to what is already stated, namely that trout eat tadpoles, and a decline on the trout-free plain is evidence that pesticides can reduce frog numbers by themselves."},{"sec":"V","type":"mc","kind":"Critical Reasoning","topic":"Critical Reasoning","id":"CA10","sub":"Assumption","b":-0.8,"pattern":"A lower limit per unit is taken to mean a lower total; the argument assumes the number of units cannot rise to compensate.","stem":"<p>Gravel from the Harwen Ridge quarry reaches its customers by truck, and every truck must cross the Stell Bridge. Engineers have found the bridge to be weaker than was thought, and beginning next month no truck crossing it may carry more than three-quarters of the load that the quarry's trucks now carry. The quarry's owner concludes that, once the limit takes effect, the quarry will deliver less gravel each month than it does now.</p><p>Which of the following is an assumption on which the owner's argument depends?</p>","opts":["The quarry's customers would be unwilling to pay more for gravel than they pay now.","The Stell Bridge will not be strengthened within the next few years.","The quarry's trucks are the heaviest vehicles that regularly cross the Stell Bridge.","Demand for the quarry's gravel has not been declining in recent months.","The quarry cannot increase the number of trips its trucks make across the bridge each month by enough to make up for the smaller loads."],"ans":4,"expl":"Smaller loads mean less gravel delivered only if the number of loads does not rise to compensate. If the quarry could run enough additional trips, monthly deliveries need not fall, so the owner must be assuming that it cannot. The conclusion concerns what happens once the limit is in force, so the bridge's eventual repair, what customers would pay and the weight of other vehicles are beside the point."},{"sec":"V","type":"mc","kind":"Critical Reasoning","topic":"Critical Reasoning","id":"CA11","sub":"Assumption","b":0.9,"pattern":"A loss on one product is to be recovered through a linked product; the argument assumes the extra sales create linked purchases that would not have happened anyway.","stem":"<p>Dorrane Office Supply sells Varro printers, which accept only Varro ink cartridges, and Dorrane is the only seller of those cartridges. Over the life of a Varro printer, Dorrane's profit on the cartridges bought for it is several times the amount that Dorrane would lose on each printer under a plan to sell the printers below cost. Since the lower price is sure to increase the number of Varro printers sold, Dorrane's managers conclude that the plan will increase the company's total profit.</p><p>The managers' conclusion depends on which of the following assumptions?</p>","opts":["Dorrane's competitors will not lower the prices of their own printers in response to the plan.","The cost to Dorrane of obtaining Varro cartridges will not rise while the plan is in effect.","At least some of the additional printers sold under the plan will go to customers who would otherwise have bought fewer Varro cartridges.","Customers who buy a printer at a reduced price print more pages with it than do customers who pay the full price.","Dorrane currently earns a larger profit on each Varro printer it sells than on each Varro cartridge it sells."],"ans":2,"expl":"The plan gives up profit on every printer in exchange for additional cartridge sales. If the extra printers went mainly to people who would have bought the same number of cartridges anyway, such as existing Varro owners replacing old machines early, there would be no additional cartridge profit to set against the losses. Competitors' reactions and cartridge costs could change how much the plan earns, but the argument does not require that they stay fixed, since the lower price is stated to raise sales and a rise in costs could be slight."},{"sec":"V","type":"mc","kind":"Critical Reasoning","topic":"Critical Reasoning","id":"CA12","sub":"Assumption","b":1.1,"pattern":"New lower-yield sources become worth using and total output is predicted to rise; the argument assumes using them does not displace higher-yield sources that share the same limited capacity.","stem":"<p>The Pellar copper mine contains seams of ore of many different grades. Its operators work a seam only if the copper it yields can be sold for more than the cost of extracting it, and until now only the richest seams have met that test. This year the price of copper has risen by 40 percent, and analysts agree that it will stay at the new level for at least a decade. At that price many of Pellar's poorer seams meet the operators' test. Therefore, the amount of copper that Pellar produces each year will increase.</p><p>Which of the following is an assumption on which the argument depends?</p>","opts":["Working the poorer seams will not require Pellar to divert digging and processing capacity from the richest seams.","The cost of extracting copper from the poorer seams will not rise at all during the next decade.","The poorer seams together contain more copper than the richest seams do.","Other copper mines will not increase their own production in response to the higher price.","Pellar's operators did not expect the price of copper to rise this year."],"ans":0,"expl":"The argument moves from more seams being worth working to more copper being produced. That step fails if the mine's diggers and mill are a fixed resource and each hour spent on a poor seam is an hour taken from a rich one, since the same capacity would then yield less copper, not more. Extraction costs need not stay perfectly flat for the poorer seams to keep passing the test, and the price is stated to hold whatever other mines do."},{"sec":"V","type":"mc","kind":"Critical Reasoning","topic":"Critical Reasoning","id":"CA13","sub":"Inference","b":0,"pattern":"A group forms a small share of a count but a large share of a total that is proportional to a quantity; the group's average quantity must exceed that of the rest.","stem":"<p>The port of Haldry charges every arriving vessel a harbor fee that is strictly proportional to the vessel's cargo capacity in metric tons, whether or not the vessel arrives fully loaded. Last year container ships accounted for 30 percent of all vessel arrivals at Haldry but paid 70 percent of the harbor fees that the port collected. The remaining arrivals were bulk carriers, tankers and ferries, and the port's schedule of fees did not change during the year.</p><p>The statements above, if true, most strongly support which of the following conclusions?</p>","opts":["Most of the cargo unloaded at Haldry last year arrived in container ships.","Container ships arriving at Haldry last year were, on average, more nearly full than the other vessels that arrived.","Haldry earned a greater profit last year from serving container ships than from serving all other vessels combined.","The container ships that arrived at Haldry last year had, on average, a greater cargo capacity than the other vessels that arrived.","The number of container ships arriving at Haldry each year has been increasing."],"ans":3,"expl":"Because fees are proportional to capacity, 70 percent of the fees means 70 percent of the total capacity of all arrivals. Since that capacity belonged to only 30 percent of the arrivals, the average container ship must have had a larger capacity than the average other vessel. Fees depend on capacity and not on the cargo actually carried, so nothing follows about how much cargo was unloaded or how full the ships were, and fee revenue is not profit."},{"sec":"V","type":"mc","kind":"Critical Reasoning","topic":"Critical Reasoning","id":"CA14","sub":"Inference","b":1.2,"pattern":"Equal and opposite percent changes in a count and a per-unit amount do not cancel; with the overall total fixed, the remaining categories must have moved the other way.","stem":"<p>In the country of Lorvik, all electricity is consumed by one of three classes of user: households, industry and commerce. Total annual electricity consumption in Lorvik was exactly the same last year as it had been five years earlier. Over those five years the number of households in Lorvik rose by 10 percent, while the average amount of electricity consumed per household fell by 10 percent, largely because of a government program that subsidized the purchase of efficient appliances.</p><p>If the statements above are true, which of the following must also be true?</p>","opts":["Households in Lorvik consumed the same total amount of electricity last year as they had five years earlier.","Industry and commerce in Lorvik together consumed more electricity last year than they had five years earlier.","Industry in Lorvik consumed more electricity last year than it had five years earlier.","Had there been no appliance program, total electricity consumption in Lorvik would have been higher last year than it was five years earlier.","Households accounted for a smaller share of Lorvik's electricity consumption last year than industry did."],"ans":1,"expl":"Household consumption is the number of households times the average per household, so it changed by a factor of 1.1 times 0.9, which is 0.99: a fall of 1 percent, not no change. With the national total unchanged, industry and commerce taken together must have consumed correspondingly more. Nothing fixes how that increase was divided between industry and commerce, and what would have happened without the program cannot be deduced, since other things might then have differed as well."},{"sec":"V","type":"mc","kind":"Critical Reasoning","topic":"Critical Reasoning","id":"CA15","sub":"Resolve the paradox","b":0,"pattern":"An overall population falls while its local impact rises in one area; the population has redistributed itself toward that area.","stem":"<p>Five years ago wolves were reintroduced to Tarrow Forest, where deer had long been so numerous that their browsing killed many young trees. Since then the number of deer in the forest has fallen by a third. Yet foresters report that in the forest's steep, densely wooded ravines, more young trees are now being killed by the browsing of deer than were being killed there before the wolves arrived.</p><p>Which of the following, if true, most helps to explain the foresters' report?</p>","opts":["The wolves in Tarrow Forest prey on wild boar and hares as well as on deer.","Since the wolves arrived, deer have largely abandoned the forest's open meadows, where wolves hunt most successfully, and now spend most of their time in the ravines.","Young trees in the ravines grow more slowly than young trees elsewhere in the forest.","The deer killed by the wolves have mostly been old or sick animals.","Foresters have planted fewer young trees in Tarrow Forest during the past five years than they did during the five years before."],"ans":1,"expl":"Fewer deer overall can still mean more deer in one place. If the surviving deer have crowded into the ravines to avoid wolves, browsing there would increase even as the forest's total deer population fell. The wolves' other prey and the age of the deer they kill do not explain why damage rose in the ravines in particular, and slow growth in the ravines was presumably true before the wolves came as well."},{"sec":"V","type":"mc","kind":"Critical Reasoning","topic":"Critical Reasoning","id":"CA16","sub":"Resolve the paradox","b":0.4,"pattern":"A measure is widely taken up yet the targeted outcome does not improve; those who take it up were never the ones producing the outcome.","stem":"<p>Three years ago the country of Veltin began requiring a refundable deposit on every drink bottle sold, with the aim of reducing the number of bottles discarded along its roads. The scheme appears to be popular: about 90 percent of the bottles sold are now returned to shops for the refund. Nevertheless, surveys that count discarded bottles along the same stretches of road each year have found no fewer bottles since the deposit was introduced than they found before.</p><p>Which of the following, if true, most helps to resolve the apparent discrepancy described above?</p>","opts":["Sales of bottled drinks in Veltin have risen slightly since the deposit was introduced.","The roadside surveys have been carried out each year by the same teams using the same methods.","The deposit is the same for bottles of every size.","Some shops in Veltin were slow to install the machines that accept returned bottles.","Nearly all of the bottles returned for the refund come from households that, before the deposit was introduced, put their empty bottles out for recycling collection."],"ans":4,"expl":"A high return rate reduces roadside litter only if the returned bottles would otherwise have been thrown away. If almost all of them come from households that used to recycle, the scheme has changed where recycled bottles go without changing the behavior of the people who discard bottles by the road. A slight rise in sales is far too small to offset a 90 percent return rate, and consistent survey methods make the puzzle sharper instead of explaining it."},{"sec":"V","type":"mc","kind":"Critical Reasoning","topic":"Critical Reasoning","id":"CA17","sub":"Evaluate","b":0.2,"pattern":"Two hypotheses about how a collection was assembled make different predictions about a measurable property of its members; the useful question is the one that tests that property.","stem":"<p>Excavators at Marsenna found a jar containing more than 2,000 silver coins buried beneath the floor of a villa. The coins were minted over a span of sixty years. Some historians believe that the owner gathered whatever coins were at hand and buried them all at once during a crisis. Others believe that the hoard is a family's savings, each coin having been set aside in the jar soon after it was minted, year after year. Coins in everyday circulation grow steadily more worn, whereas coins that have been set aside do not.</p><p>Which of the following would it be most useful to determine in order to decide between the two views?</p>","opts":["Whether the most recently minted coin in the hoard was minted shortly before the villa was abandoned","Whether the total value of the hoard exceeded what a villa of that size could have earned in a year","Whether the coins minted early in the sixty-year span are markedly more worn than those minted late in it","Whether hoards of similar size have been found beneath other villas near Marsenna","Whether the jar was of a type made near Marsenna or was imported from elsewhere"],"ans":2,"expl":"If the coins were gathered from circulation at a single moment, the oldest would have circulated for decades and should be far more worn than the newest. If each was set aside soon after minting, old and new coins should be about equally fresh. Either answer to the question about wear therefore favors one view over the other, whereas the date of the latest coin, the hoard's value and the existence of other hoards are compatible with both views."},{"sec":"V","type":"mc","kind":"Critical Reasoning","topic":"Critical Reasoning","id":"CA18","sub":"Complete the passage","b":-0.9,"pattern":"A plan is said to have an unintended side effect; the completion supplies the change in behavior that produces it.","stem":"<p>Which of the following most logically completes the passage?</p><p>To raise revenue, Velmaris Airlines plans to begin charging a fee for each suitcase that a passenger checks into the aircraft's hold, while continuing to let every passenger carry one bag into the cabin free of charge. Velmaris's timetable allows only 25 minutes for passengers to board each flight. Velmaris's operations managers warn that the fee is likely to make Velmaris's flights depart late more often than they do now, since ______.</p>","opts":["passengers seeking to avoid the fee will carry larger bags into the cabin, and finding space for such bags slows boarding","several of Velmaris's competitors already charge a fee for checked suitcases","passengers who check suitcases must arrive at the airport earlier than those who do not","the revenue from the fee would greatly exceed the cost of collecting it","most delays to Velmaris's flights are at present caused by bad weather"],"ans":0,"expl":"The blank needs a reason why charging for checked suitcases would delay departures. If passengers respond by bringing bigger bags into the cabin, stowing them will take longer than the short boarding period allows. What competitors charge, how much the fee earns and the present causes of delay give no reason to expect additional late departures, and passengers arriving earlier would not slow boarding."},{"id":"CB01","sec":"V","type":"mc","kind":"Critical Reasoning","topic":"Critical Reasoning","sub":"Weaken","b":-1.1,"pattern":"A cost-saving plan is undermined by a practical limit that stops the new means from doing the same work as the old.","stem":"<p>Corvale Freight delivers parcels in the city of Estrin using 60 diesel vans, each of which covers about 240 kilometers a day. Electric vans cost about the same to buy as diesel vans, and the electricity needed to drive an electric van one kilometre costs less than half as much as the diesel needed for the same distance. Corvale's managers therefore plan to replace all 60 diesel vans with 60 electric vans, expecting that the change will enable the company to make the same deliveries at lower cost.</p><p>Which of the following, if true, most seriously calls into question the managers' expectation?</p>","opts":["Over the past five years the price of diesel in Estrin has risen more slowly than the price of electricity.","An electric van of the kind Corvale would buy can travel no more than 130 kilometers before it must be taken out of service for several hours to recharge.","Some of Corvale's competitors in Estrin have not yet replaced any of their diesel vans.","Electric vans are quieter than diesel vans, and Estrin allows quiet vehicles to make deliveries at night.","Corvale's diesel vans could be sold for more than half the price originally paid for them."],"ans":1,"expl":"The managers expect 60 electric vans to do the work of 60 diesel vans. If an electric van can cover only 130 of the 240 kilometers needed each day before spending hours recharging, the same deliveries would require many more vans, so the saving on energy may be wiped out. The price trend still leaves electricity at less than half the cost, and the remaining statements are either irrelevant or favorable to the plan."},{"id":"CB02","sec":"V","type":"mc","kind":"Critical Reasoning","topic":"Critical Reasoning","sub":"Weaken","b":0,"pattern":"A difference between participants and non-participants is credited to a program, although the participants already differed before it.","stem":"<p>In the province of Ostrenna, an agricultural cooperative offered its member wheat farmers a free winter workshop on soil management. At the next harvest, the farms whose owners had attended the workshop produced, on average, 15 percent more wheat per hectare than the farms whose owners had not attended. The cooperative's directors concluded that the techniques taught at the workshop raise wheat yields and that the cooperative should pay to repeat the workshop every winter.</p><p>Which of the following, if true, most seriously weakens the directors' reasoning?</p>","opts":["The yield figures for all of the farms were taken from the farmers' own reports and were not independently measured.","Several farmers who did not attend the workshop said that they would attend if it were offered again.","Wheat prices in Ostrenna were lower at this harvest than at the previous one.","The farmers who attended the workshop were, for the most part, those whose farms had produced the highest wheat yields per hectare in the province in each of the previous five years.","The workshop also covered soil management techniques for crops other than wheat."],"ans":3,"expl":"The directors treat the yield gap as an effect of the workshop. If the attending farms were already the highest yielding farms long before the workshop, the gap is explained without any contribution from the techniques taught. Self-reported figures apply equally to both groups of farms and so do not account for the difference between them."},{"id":"CB03","sec":"V","type":"mc","kind":"Critical Reasoning","topic":"Critical Reasoning","sub":"Weaken","b":0.9,"pattern":"A product that looks unprofitable under an equal allocation of shared costs is to be dropped, although most of the costs assigned to it would remain.","stem":"<p>Pellura Ceramics makes plain tiles and decorated tiles in equal numbers, firing both in the same kilns. Its accountants divide the company's total annual costs, including rent and the fuel that keeps the kilns continuously hot, equally among all the tiles produced. On this basis each decorated tile sells for well above its cost, whereas each plain tile sells for slightly less than its cost. Pellura's owner concludes that the company's annual profit would be higher if it stopped making plain tiles and continued to make and sell the same number of decorated tiles as it does now.</p><p>Which of the following, if true, most seriously weakens the owner's conclusion?</p>","opts":["The clay and shaping labor for a plain tile cost far less than the price at which the tile sells, and almost none of the other costs that the accountants assign to plain tiles would be eliminated if Pellura stopped making them.","Revenue from plain tiles makes up roughly one third of Pellura's total annual revenue.","Several of Pellura's competitors sell plain tiles at a lower price than Pellura does.","The price of the fuel used to heat Pellura's kilns is expected to rise next year.","Pellura has never produced more decorated tiles in a year than it produces now."],"ans":0,"expl":"The owner assumes that dropping plain tiles would remove the full cost the accountants assign to them. If nearly all of that cost is rent and kiln fuel that would continue anyway, then dropping plain tiles removes far more revenue than cost, and profit falls. The share of revenue that plain tiles supply does not by itself hurt the conclusion, because the owner's figures already set that revenue against a larger assigned cost."},{"id":"CB04","sec":"V","type":"mc","kind":"Critical Reasoning","topic":"Critical Reasoning","sub":"Weaken","b":0.9,"pattern":"Abolishing a conditional rule is expected to remove a harm, although the condition that triggers the rule was never met in the cases of harm.","stem":"<p>At Veldmark University, a scholarship is suspended for the following term whenever its holder's grade average for a term falls below 3.0. Over the past decade, about one in six scholarship holders has withdrawn from the university before graduating, and most of those who withdrew cited money as a reason. Administrators reason that suspensions leave students suddenly unable to pay their fees. They therefore propose abolishing the suspension rule, predicting that this change will substantially reduce the proportion of scholarship holders who withdraw.</p><p>Which of the following, if true, casts the most doubt on the administrators' prediction?</p>","opts":["Students at Veldmark who do not hold scholarships withdraw before graduating at a somewhat higher rate than scholarship holders do.","A suspended scholarship is restored as soon as its holder again achieves a term average of 3.0 or higher.","The number of scholarships that Veldmark awards each year has grown over the past decade.","Most scholarship holders at Veldmark also work part time during term.","Among the scholarship holders who withdrew from Veldmark during the past decade, none had earned a grade average lower than 3.2 in any term before withdrawing."],"ans":4,"expl":"The prediction depends on suspensions being what drove scholarship holders to leave. If no one who withdrew ever had a term average below 3.2, none of them ever had a scholarship suspended, so abolishing the rule would have changed nothing for them. That a suspension can later be lifted makes suspensions less severe but leaves open that a suspended term forces students out."},{"id":"CB05","sec":"V","type":"mc","kind":"Critical Reasoning","topic":"Critical Reasoning","sub":"Strengthen","b":-1,"pattern":"A causal claim is strengthened by showing that the effect is concentrated exactly where the proposed cause acts most strongly.","stem":"<p>Norvik Hosting runs its servers in two halls. Three months ago the company replaced the cooling system in Hall 2 with a new system that uses less electricity; the system in Hall 1 was left unchanged. Since then, the number of servers failing each week in Hall 2 has doubled, while the failure rate in Hall 1 has stayed the same. Norvik's chief engineer has concluded that the new cooling system is responsible for the additional failures in Hall 2.</p><p>Which of the following, if true, most strongly supports the chief engineer's conclusion?</p>","opts":["The servers in Hall 2 are, on average, older than those in Hall 1.","The new cooling system cost less to install than the system in Hall 1 originally did.","Nearly all of the additional failures in Hall 2 have occurred in the racks farthest from the new system's air outlets, where temperatures are now higher than they were before the replacement.","Norvik plans to install the same cooling system in Hall 1 next year.","Some of the servers that failed in Hall 2 were restored to service within a day."],"ans":2,"expl":"If the extra failures cluster in the racks that the new system cools least well and that are now hotter than before, the pattern of failures matches what the new system would be expected to cause. The age of the servers did not change when the cooling system did, and the other statements say nothing about why failures rose."},{"id":"CB06","sec":"V","type":"mc","kind":"Critical Reasoning","topic":"Critical Reasoning","sub":"Strengthen","b":1,"pattern":"An argument from the absence of evidence is strengthened by showing that the evidence would reliably have been detected had the activity taken place.","stem":"<p>Excavators at the ancient port of Seremna have uncovered a large workshop containing hundreds of loom weights and spindle whorls, evidence that cloth was woven there on a considerable scale. Chemical tests of the workshop's floors, drains and storage pits found no trace of any of the plant or mineral dyes known to have been used in the region at the time. The excavators conclude that cloth woven in the workshop was not dyed there, and that Seremna's weavers either sent their cloth elsewhere to be colored or sold it undyed.</p><p>Which of the following, if true, most strengthens the excavators' argument?</p>","opts":["The workshop remained in use for about a century after it was built.","At other workshops of the same period where dyeing is known to have been carried out, the same chemical tests have invariably detected dye residues in floors and drains, including those lying in soils like Seremna's.","Dyed cloth commanded a considerably higher price than undyed cloth in the markets of the region.","Loom weights of the kind found in the workshop were used throughout the region for several centuries.","Written records from the period mention Seremna as a source of cloth but do not say whether the cloth was dyed."],"ans":1,"expl":"The argument moves from finding no dye to concluding that no dyeing took place, which is safe only if dyeing would have left residues that these tests pick up after so long. Evidence that the tests always find residues at known dyeing sites in similar soils supplies that link. An undisturbed site shows that nothing was removed later, but not that dye residues would have survived or been detected."},{"id":"CB07","sec":"V","type":"mc","kind":"Critical Reasoning","topic":"Critical Reasoning","sub":"Strengthen","b":1.6,"pattern":"A proposed causal mechanism is supported by showing that the benefit disappears in the subgroup where the mechanism cannot operate.","stem":"<p>In the country of Pravelle, some primary care clinics employ a pharmacist on site who reviews every prescription before it is dispensed; other clinics do not. A health authority study found that patients of clinics with an on-site pharmacist were readmitted to the hospital within a year of a hospital stay markedly less often than patients of other clinics. The authority concluded that the pharmacists' reviews prevent readmissions by catching harmful combinations of medications, and it recommended funding an on-site pharmacist at every clinic.</p><p>Which of the following, if true, provides the strongest support for the authority's conclusion?</p>","opts":["Pharmacists in Pravelle's hospitals routinely find and correct harmful combinations among the medications of patients who are about to be discharged.","Clinics with an on-site pharmacist tend to be located in larger towns, where patients live closer to a hospital.","On-site pharmacists spend part of each day advising clinic staff on the storage of medications.","In the study, patients taking only a single medication were readmitted about as often if they attended a clinic with an on-site pharmacist as if they attended a clinic without one.","The clinics with an on-site pharmacist had employed one for an average of six years at the time of the study."],"ans":3,"expl":"Patients on a single medication cannot be harmed by a combination, so if the reviews work as the authority claims, these patients should gain nothing, and that is what the study shows. The result also suggests that clinics with pharmacists are not simply better at keeping every kind of patient out of the hospital. Corrections made by hospital pharmacists apply to patients of both kinds of clinic and leave less for clinic pharmacists to catch."},{"id":"CB08","sec":"V","type":"mc","kind":"Critical Reasoning","topic":"Critical Reasoning","sub":"Assumption","b":0.1,"pattern":"A plan that offers a new means of self-service assumes that the people it targets will actually use that means.","stem":"<p>Quenta Software receives about 9,000 telephone calls a month from customers seeking help with its accounting program, and answering them is costly. An analysis showed that 60 percent of these calls concern questions that are answered in the program's printed manual. Quenta therefore plans to add to the program a searchable help page containing the full text of the manual, and it expects that this addition will substantially reduce the number of calls it must answer each month.</p><p>Quenta's expectation depends on which of the following assumptions?</p>","opts":["A substantial number of the customers who now call with questions that are answered in the manual would consult the help page before telephoning.","The questions raised in the remaining 40 percent of calls cannot be answered by any written material.","Customers who telephone Quenta are more satisfied with the answers they receive than customers who consult the manual.","None of Quenta's competitors includes a help page in its accounting program.","Most of Quenta's customers no longer have the printed manual."],"ans":0,"expl":"Customers already have the answers in the manual and telephone anyway, so the help page cuts calls only if many of those customers would turn to it first. If they would not, the number of calls stays where it is. The plan could still work even if most customers have kept their manuals, since a searchable page may simply be easier to use."},{"id":"CB09","sec":"V","type":"mc","kind":"Critical Reasoning","topic":"Critical Reasoning","sub":"Assumption","b":0.9,"pattern":"An unchanged number of eligible people is taken to show unchanged participation, on the assumption that none of them had previously been shut out by lack of access.","stem":"<p>In Karelle, only students enrolled in the advanced physics course at their school may sit the national advanced physics examination, which is given once a year at designated test centers. Last year the examination board opened 40 additional centers, most of them in rural districts that previously had none. Because the number of students enrolled in the course was the same last year as in the year before, an education official concluded that the new centers cannot have increased the number of students who took the examination.</p><p>The official's conclusion depends on which of the following assumptions?</p>","opts":["Most of the students enrolled in the course in the year before last took the examination that year.","The new test centers are at least as well equipped as the centers that existed before.","Few, if any, of the students enrolled in the course in the year before last failed to take the examination because no test centre was within their reach.","The number of schools in Karelle that offer the advanced physics course did not increase last year.","Students who took the examination at the new centers scored as well, on average, as students who sat it elsewhere."],"ans":2,"expl":"The official treats enrollment as if it fixed the number of candidates. That holds only if enrolled students were not previously kept from the examination by distance; if many were, the new rural centers could raise the number of candidates with enrollment unchanged. The conclusion does not need most enrolled students to have took the examination before, only that access was not what kept the others away."},{"id":"CB10","sec":"V","type":"mc","kind":"Critical Reasoning","topic":"Critical Reasoning","sub":"Inference","b":0.2,"pattern":"Distinguishing what must follow about a rate within one group from what merely seems to follow about the combined rate when group sizes shift.","stem":"<p>Tarvo Motors builds engines at two plants. Every engine is inspected before it leaves either plant, and the inspection standard has not changed. This year the North plant built fewer engines than it did last year, yet the number of engines from that plant found to be defective was greater than last year's. The South plant built more engines this year than last, and the proportion of its engines found to be defective was the same in both years.</p><p>The statements above, if true, most strongly support which of the following conclusions?</p>","opts":["A larger proportion of the engines built at the North plant were found to be defective this year than last year.","The proportion of all Tarvo engines found to be defective was greater this year than last year.","The South plant built more engines this year than the North plant did.","The number of engines from the South plant found to be defective was the same this year as last year.","A smaller proportion of the South plant's engines than of the North plant's engines were found to be defective this year."],"ans":0,"expl":"More defective engines out of fewer engines built means the defective proportion at the North plant must have risen. The company-wide proportion need not have risen: if the South plant has a much lower defect rate and now builds a much larger share of all engines, the overall proportion can fall. With an unchanged rate and higher output, the South plant's count of defective engines rose, and nothing fixes how the two plants compare with each other."},{"id":"CB11","sec":"V","type":"mc","kind":"Critical Reasoning","topic":"Critical Reasoning","sub":"Inference","b":1.9,"pattern":"Two rules measure a time window from different events, so an apparent violation forces only a conclusion about the order of those events.","stem":"<p>In Corvia, a pharmacy may dispense the drug Zetrolin only to a patient who presents a prescription for it written by a liver specialist. A specialist may write such a prescription only for a patient who has had a liver function test performed in Corvia within the 30 days before the prescription is written. Every liver function test performed in Corvia is supposed to be entered in a national registry. An audit found that last March several patients were dispensed Zetrolin although the registry showed no liver function test for them in the 30 days before the drug was dispensed.</p><p>If the statements above are true, which of the following must also be true?</p>","opts":["At least one specialist wrote a prescription for Zetrolin for a patient who had not had a liver function test within the preceding 30 days.","If the registry is complete and every specialist and pharmacy complied with the rules, then each of the patients identified by the audit was dispensed Zetrolin on a later day than the day on which the prescription was written.","If the registry is complete, then at least one pharmacy dispensed Zetrolin to a patient who did not present a specialist's prescription.","Some liver function tests performed in Corvia last March were not entered in the registry.","If every specialist and pharmacy complied with the rules, then the registry omits at least one liver function test for each of the patients identified by the audit."],"ans":1,"expl":"The testing rule counts 30 days back from the day the prescription is written, whereas the audit counted 30 days back from the day the drug was dispensed. If the registry is complete and everyone complied, each patient had a test within 30 days before the prescription but none within 30 days before dispensing, which is possible only if dispensing came later than the writing of the prescription. Because that possibility exists, neither a breach of the rules nor a gap in the registry has to have occurred."},{"id":"CB12","sec":"V","type":"mc","kind":"Critical Reasoning","topic":"Critical Reasoning","sub":"Resolve the paradox","b":-0.7,"pattern":"An expansion of supply coincides with a fall in use because the terms of access changed at the same time.","stem":"<p>Two years ago the public library in the town of Halvering offered 4,000 electronic book titles, and its members borrowed electronic books about 90,000 times that year. Last year the library changed its supplier and doubled the number of electronic titles on offer to 8,000. The library's membership did not decline, and surveys show that members' interest in electronic books remained as strong as before. Nevertheless, the number of electronic book loans last year fell to about 60,000.</p><p>Which of the following, if true, most helps to explain the fall in electronic book loans?</p>","opts":["Loans of printed books from the library also fell slightly last year.","Many of the newly added titles are on specialized subjects that attract few readers.","Libraries in several nearby towns also increased the number of electronic titles they offer.","The library announced the larger collection in its monthly newsletter.","Under the terms of the new supplier, each title can be on loan to only one member at a time, whereas previously any number of members could borrow the same title simultaneously."],"ans":4,"expl":"If only one member at a time can now borrow a given title, popular titles that used to be borrowed by many members at once are tied up for weeks, so total loans can fall even with twice as many titles and undiminished interest. New titles that attract few readers would explain why loans did not rise, but not why they fell by a third."},{"id":"CB13","sec":"V","type":"mc","kind":"Critical Reasoning","topic":"Critical Reasoning","sub":"Boldface","b":0.8,"pattern":"After conceding a general principle, the author argues that a particular case is an exception (intermediate conclusion) and on that basis rejects a proposal (main conclusion).","stem":"<p>Several members of the Ardmoor school board propose lengthening the school day by one hour, citing studies in which additional instruction time raised students' examination results. Those studies are sound, and where pupils spend the added time being taught, results generally do improve. <b>In Ardmoor, however, a longer day is unlikely to improve results</b>: the district cannot afford to hire more teachers, so the extra hour would be supervised study, and Ardmoor's pupils already have a supervised study period that most of them spend idle. <b>The board should therefore not adopt the proposal.</b></p><p>In the argument above, the two portions in boldface play which of the following roles?</p>","opts":["The first is a general principle that the argument accepts; the second is a conclusion drawn from that principle.","The first is the position that the argument as a whole is intended to establish; the second is a judgment offered in support of that position.","The first is a concession made to the board members who favor the proposal; the second is the main conclusion of the argument.","The first is a claim that the argument supports with evidence and then uses to support its main conclusion; the second is that main conclusion.","The first is evidence offered against the studies cited by the board members; the second is the conclusion that those studies are meant to support."],"ans":3,"expl":"The statement that a longer day is unlikely to help in Ardmoor is backed by the facts about teachers and study periods, and it is in turn the reason given for rejecting the proposal, so it is an intermediate conclusion. The recommendation not to adopt the proposal is what the whole argument aims at. The concession in the passage is the acceptance of the studies, which is not in boldface."},{"id":"CB14","sec":"V","type":"mc","kind":"Critical Reasoning","topic":"Critical Reasoning","sub":"Boldface","b":0.7,"pattern":"A fact pointing to a rival cause is set against a favored explanation, and the author concludes only that the favored explanation is not yet justified.","stem":"<p>Since Orbital Parcel began using route-planning software two years ago, its vans have burned 9 percent less fuel per parcel delivered. Orbital's managers credit the software and intend to buy a more advanced version. <b>Over the same two years, however, Orbital replaced a third of its vans with a lighter model</b>, and a lighter van burns less fuel whatever route it follows. Until the fuel consumption of the older vans alone has been examined, therefore, <b>the managers have no good grounds for crediting the saving to the software</b>.</p><p>In the argument above, the two portions in boldface play which of the following roles?</p>","opts":["The first is a fact presented as pointing to an explanation other than the one the managers favor; the second is th
