es the statement most accurate.","text":"The median number of defects per batch is {0}. The mean number of defects per batch is {1} the median.","blanks":[["1","1.5","2","2.5"],["less than","equal to","greater than"]],"ans":[1,2],"expl":"With 50 batches, the median is the average of the 25th and 26th values in order. Ten batches had 0 defects and fifteen had 1, so the 25th value is 1 and the 26th is 2, giving a median of 1.5. The mean is (0 + 15 + 10 + 15 + 40 + 25)/50 = 105/50 = 2.1, which is greater than the median because of the cluster of batches with 4 or 5 defects."},{"sec":"D","type":"gi","kind":"Graphics Interpretation","topic":"Graphics Interpretation","id":"DG05","sub":"Relative growth and profit","b":1.6,"stim":"DGC5","stem":"The chart shows the annual revenue and the annual total cost of a logistics firm for six consecutive years. Profit for a year is revenue minus total cost. Select the option from each list that makes the statement most accurate.","text":"Of the five year-to-year changes shown, the percent increase in total cost was greater than the percent increase in revenue in exactly {0}. From 2022 to 2024, revenue increased by 25 percent while profit {1}.","blanks":[["1","2","3","4"],["decreased by 10 percent","decreased by 33 percent","decreased by 50 percent","increased by 60 percent"]],"ans":[2,1],"expl":"Cost grows faster than revenue exactly when cost as a share of revenue rises. That share was 75%, 70%, 75%, 62.5%, about 72% and 80%, so it rose in three of the five changes: 2020 to 2021, 2022 to 2023 and 2023 to 2024. Profit was 80 − 50 = 30 in 2022 and 100 − 80 = 20 in 2024, a decrease of 10 on a base of 30, or about 33 percent. The 60 percent figure is the growth in total cost, and 50 percent uses the 2024 profit as the base."},{"sec":"D","type":"ta","kind":"Table Analysis","topic":"Table Analysis","labels":["Yes","No"],"id":"DB01","sub":"Reading and sorting","b":-1,"stim":"DBT1","stem":"The table shows data for the eight regional warehouses of a distribution company for last month. For each of the following statements, select <i>Yes</i> if the statement is supported by the information in the table. Otherwise, select <i>No</i>.","stmts":["The warehouse with the largest floor area is also the warehouse with the greatest number of daily shipments.","Each of the two West warehouses had fewer daily shipments than each of the two North warehouses.","Exactly three of the warehouses had an on-time rate of at least 95 percent."],"ans":[0,1,0],"expl":"Cadiz has both the largest floor area (15) and the most daily shipments (1,500): Yes. The West warehouses shipped 720 and 990 per day, and the North warehouse Espoo shipped only 600, so the claim fails: No. On-time rates of at least 95 percent belong to Almere (96), Espoo (97) and Graz (95), exactly three: Yes."},{"sec":"D","type":"ta","kind":"Table Analysis","topic":"Table Analysis","labels":["Yes","No"],"id":"DB02","sub":"Derived values and median","b":0.2,"stim":"DBT2","stem":"The table shows last year's results for the nine appliance models sold by a manufacturer. For each of the following statements, select <i>Yes</i> if the statement is supported by the information in the table. Otherwise, select <i>No</i>.","stmts":["For every Kettle model, the difference between price and unit cost is at least 30 percent of the price.","The median of the nine return rates is less than the mean of the nine return rates.","The model that generated the greatest revenue (units sold multiplied by price) is a Blender."],"ans":[1,0,0],"expl":"Bolt has a price of $40 and a unit cost of $30, a difference of only 25 percent of the price, so the first statement fails: No. Sorted, the return rates are 1.5, 2, 2.5, 3, 3.5, 4, 5, 6, 7, with median 3.5, while the mean is 34.5/9, about 3.8: Yes. Revenue in $ thousand is greatest for Dune at 22 × 120 = 2,640, ahead of Aria at 2,400 and Crest and Gale at 2,250, and Dune is a Blender: Yes."},{"sec":"D","type":"ta","kind":"Table Analysis","topic":"Table Analysis","labels":["Yes","No"],"id":"DB03","sub":"Derived ratios and weighted averages","b":1.7,"stim":"DBT3","stem":"The table shows last year's data for the ten solar farms operated by an energy company. For each of the following statements, select <i>Yes</i> if the statement is supported by the information in the table. Otherwise, select <i>No</i>.","stmts":["The median, across the ten farms, of annual output per MW of capacity is greater than Alba's annual output per MW of capacity.","Of the farms that have been in operation for fewer than 9 years, more than half had an operating cost of less than $10 thousand per GWh of output.","The three farms in Spain, taken together, had a lower operating cost per GWh of output than the two farms in Portugal, taken together."],"ans":[0,1,1],"expl":"Output per MW is 2.0 for Alba, and the ten values in order are 1.6, 1.7, 1.8, 1.9, 2.0, 2.1, 2.1, 2.2, 2.3, 2.5, so the median is 2.05: Yes. Five farms have operated for fewer than 9 years (Brisa, Cerro, Erfoud, Gala, Ifrane), with costs per GWh of 10.5, 8, 10.5, 9 and 11 in $ thousand; only two are below 10, which is not more than half: No. Spain: 3,032/247, about 12.3. Portugal: 1,854/156, about 11.9, because the low-cost Brisa produces most of the Portuguese output. Averaging the individual farm ratios instead of pooling the totals wrongly favours Spain: No."},{"sec":"D","kind":"Multi-Source Reasoning","topic":"Multi-Source Reasoning","stim":"DMS1","id":"DM01","type":"mc","sub":"Apply criteria to a table","b":-0.8,"stem":"Based on the information in the sources, how many of the seven nominated employees are eligible for funding?","opts":["2","3","4","5","6"],"ans":3,"expl":"The email requires at least 2 years with the company and a rating of at least 3. In the nominations table, Bruno Keller has only 1 year with the company and Emeka Obi has a rating of 2, so both are ineligible. The other five nominees meet both conditions."},{"sec":"D","kind":"Multi-Source Reasoning","topic":"Multi-Source Reasoning","stim":"DMS1","id":"DM02","type":"ta","sub":"Combine rules and data","b":-0.2,"labels":["Yes","No"],"stem":"For each of the following statements, select <i>Yes</i> if the statement can be inferred from the information in the three sources. Otherwise, select <i>No</i>.","stmts":["The company will pay the full fee for Dalia Haddad's course.","Farah Aziz will pay $1,200 of her course fee herself.","The total amount that the company will pay toward course fees for the Finance nominees is greater than $10,000."],"ans":[0,0,1],"expl":"Dalia Haddad is eligible and has a rating of 5, so the exception gives her the full fee even though her course lasts 16 weeks: Yes. Farah Aziz is eligible, her course lasts 10 weeks and her rating is 4, so she pays 25 percent of $4,800, which is $1,200: Yes. In Finance, Bruno Keller is ineligible, Anika Rao receives $3,600 and Chen Li receives 75 percent of $8,000, or $6,000, a total of $9,600: No."},{"sec":"D","kind":"Multi-Source Reasoning","topic":"Multi-Source Reasoning","stim":"DMS1","id":"DM03","type":"mc","sub":"What-if calculation","b":0.5,"stem":"Suppose the head of Operations had also nominated one more eligible employee, whose most recent rating is 4, for a course lasting 9 weeks. What is the greatest course fee for which the company's total payment for the Operations nominees would not exceed the department limit?","opts":["$1,125","$1,500","$2,000","$3,000","$4,000"],"ans":2,"expl":"For the current Operations nominees the company pays $6,000 for Dalia Haddad (rating 5, full fee), 75 percent of $4,800 = $3,600 for Farah Aziz and $1,900 for Goran Petrov, while Emeka Obi is ineligible: $11,500 in all. That leaves $1,500 under the $13,000 limit. For a 9-week course the company pays 75 percent of the fee, so the fee can be at most 1,500/0.75 = $2,000."},{"id":"QC01","topic":"Percents","sub":"Double matrix method","b":1.7,"stem":"In a survey of the households in a certain district, 75 percent of the households that own a car also own a bicycle, and 60 percent of the households that own a bicycle also own a car. If 16 percent of the households own neither a car nor a bicycle, what percent of the households own both?","opts":["36%","40%","42%","45%","48%"],"ans":2,"expl":"Let <i>x</i> be the percent that own both. Then car owners are 4<i>x</i>/3 and bicycle owners are 5<i>x</i>/3, so the households that own at least one are 4<i>x</i>/3 + 5<i>x</i>/3 − <i>x</i> = 2<i>x</i>. Since 2<i>x</i> = 84, <i>x</i> = 42. Multiplying 75 percent by 60 percent to get 45% is the trap, because the two percents have different bases.","sec":"Q","type":"mc","kind":"Problem Solving"},{"id":"QC02","topic":"Ratios","sub":"Changing ratios","b":1.9,"stem":"A leasing company owns only trucks and vans, in the ratio 5 to 3, and it owns more than 100 but fewer than 200 vehicles in all. After the company sells 6 of its vehicles and acquires none, the ratio of trucks to vans is 7 to 4. How many of the 6 vehicles sold were trucks?","opts":["1","2","3","4","5"],"ans":1,"expl":"The original total is a multiple of 8 and the total after the sale, which is 6 less, is a multiple of 11. Between 100 and 200 the only multiple of 8 that works is 160, since 154 = 11 × 14. So the fleet went from 100 trucks and 60 vans to 98 trucks and 56 vans, and 2 trucks were sold.","sec":"Q","type":"mc","kind":"Problem Solving"},{"id":"QC03","topic":"Percents","sub":"Variables in options","b":2,"stem":"A company has exactly two divisions. From last year to this year, the revenue of division X increased by <i>a</i> percent, the revenue of division Y decreased by <i>b</i> percent, and the total revenue of the company increased by <i>c</i> percent, where <i>a</i>, <i>b</i> and <i>c</i> are positive. In terms of <i>a</i>, <i>b</i> and <i>c</i>, division X accounted for what fraction of the total revenue of the company last year?","opts":["(<i>a</i> − <i>c</i>) / (<i>a</i> + <i>b</i>)","(<i>b</i> − <i>c</i>) / (<i>a</i> + <i>b</i>)","(<i>a</i> + <i>c</i>) / (<i>a</i> + <i>b</i>)","(<i>b</i> + <i>c</i>) / (<i>a</i> − <i>c</i>)","(<i>b</i> + <i>c</i>) / (<i>a</i> + <i>b</i>)"],"ans":4,"expl":"Let last year's revenues be <i>X</i> and <i>Y</i>. The net change gives <i>aX</i> − <i>bY</i> = <i>c</i>(<i>X</i> + <i>Y</i>), so <i>X</i>(<i>a</i> − <i>c</i>) = <i>Y</i>(<i>b</i> + <i>c</i>) and <i>X</i> to <i>Y</i> is (<i>b</i> + <i>c</i>) to (<i>a</i> − <i>c</i>). The share of X is therefore (<i>b</i> + <i>c</i>) / (<i>a</i> + <i>b</i>). The expression (<i>a</i> − <i>c</i>) / (<i>a</i> + <i>b</i>) is the share of Y, and (<i>b</i> + <i>c</i>) / (<i>a</i> − <i>c</i>) is the ratio of X to Y, not a share of the total.","sec":"Q","type":"mc","kind":"Problem Solving"},{"id":"QC04","topic":"Percents","sub":"Percent change","b":1.2,"stem":"In 2022, division A accounted for 25 percent of the total revenue of a certain company. In 2023, the revenue of division A was 80 percent greater than in 2022, and division A accounted for 36 percent of the total revenue of the company. By what percent did the combined revenue of the rest of the company increase from 2022 to 2023?","opts":["6 2/3%","10%","11%","20%","25%"],"ans":0,"expl":"Take the 2022 total as 100, so division A had 25 and the rest had 75. In 2023 division A had 45, which is 36 percent of the total, so the total was 125 and the rest had 80. The rest rose from 75 to 80, an increase of 5/75, or 6 2/3%. The 25% figure is the growth of the whole company and 11 is only the change in share.","sec":"Q","type":"mc","kind":"Problem Solving"},{"id":"QC05","topic":"Percents","sub":"Profit and loss","b":1.9,"stem":"A merchant sold an item at a profit. If the merchant's cost for the item had been 10 percent lower and the selling price had been the same, the profit, expressed as a percent of the cost, would have been 15 percentage points greater than it actually was. The merchant's actual profit was what percent of the cost?","opts":["20%","25%","30%","35%","50%"],"ans":3,"expl":"Let the cost be 100 and the selling price <i>S</i>, so the actual profit percent is <i>S</i> − 100. With a cost of 90 the price is 10<i>S</i>/9 percent of cost, which exceeds <i>S</i> percent by <i>S</i>/9. Setting <i>S</i>/9 = 15 gives <i>S</i> = 135, a profit of 35%. Check: a cost of 90 and a price of 135 give a profit of 50 percent of cost, which is 15 points higher; 50% is the hypothetical figure, not the actual one.","sec":"Q","type":"mc","kind":"Problem Solving"},{"id":"QC06","topic":"Number Properties","sub":"Factorial","b":1.7,"stem":"For a positive integer <i>n</i>, the product of all the integers from 1 to <i>n</i>, inclusive, is written out in full, and the number of consecutive zeros at the right end of the result is counted. Which of the following CANNOT be that count for any value of <i>n</i>?","opts":["13","14","15","16","17"],"ans":4,"expl":"The count of ending zeros equals the number of factors of 5 in <i>n</i>!, which rises by 1 at each multiple of 5 but by 2 at each multiple of 25. The counts are 13 for <i>n</i> = 55, 14 for 60, 15 for 65 and 16 for 70. At <i>n</i> = 75, a multiple of 25, the count jumps from 16 straight to 18, so 17 is never reached.","sec":"Q","type":"mc","kind":"Problem Solving"},{"id":"QC07","topic":"Number Properties","sub":"Units digit","b":2,"stem":"If <i>a</i> and <i>b</i> are positive integers and the units digit of 3<sup><i>a</i></sup> × 7<sup><i>b</i></sup> is 3, which of the following must be true?<div class=\"roman\">I. <i>a</i> + <i>b</i> is odd.<br>II. <i>a</i> is greater than <i>b</i>.<br>III. The units digit of 3<sup><i>b</i></sup> × 7<sup><i>a</i></sup> is 7.</div>","opts":["I only","III only","I and II only","I and III only","I, II, and III"],"ans":3,"expl":"Since 3<sup>3</sup> ends in 7, the units digit of 7<sup><i>b</i></sup> equals that of 3<sup>3<i>b</i></sup>, so the product has the units digit of 3<sup><i>a</i> + 3<i>b</i></sup>. Powers of 3 end in 3, 9, 7, 1 in a cycle of 4, so <i>a</i> + 3<i>b</i> leaves remainder 1 when divided by 4, which means <i>a</i> − <i>b</i> does too. Then <i>a</i> − <i>b</i> is odd, so <i>a</i> + <i>b</i> is odd, and <i>b</i> + 3<i>a</i> = 4<i>a</i> − (<i>a</i> − <i>b</i>) leaves remainder 3, giving a units digit of 7. Statement II fails for <i>a</i> = 1 and <i>b</i> = 4, since 3 × 2,401 ends in 3.","sec":"Q","type":"mc","kind":"Problem Solving"},{"id":"QC08","topic":"Number Properties","sub":"Consecutive integers","b":1.6,"stem":"If <i>n</i> is a positive integer, which of the following must be divisible by 6?<div class=\"roman\">I. <i>n</i>(<i>n</i> + 1)(<i>n</i> + 5)<br>II. <i>n</i>(<i>n</i><sup>2</sup> + 5)<br>III. <i>n</i>(<i>n</i> + 2)(<i>n</i> + 4)</div>","opts":["I only","III only","I and II only","I and III only","I, II, and III"],"ans":2,"expl":"In I, <i>n</i>(<i>n</i> + 1) is even, and <i>n</i> + 5 leaves the same remainder as <i>n</i> + 2 when divided by 3, so one of the three factors is a multiple of 3. In II, <i>n</i>(<i>n</i><sup>2</sup> + 5) = (<i>n</i> − 1)<i>n</i>(<i>n</i> + 1) + 6<i>n</i>, a product of three consecutive integers plus a multiple of 6. Expression III is always a multiple of 3 but is odd whenever <i>n</i> is odd; for <i>n</i> = 1 it equals 15.","sec":"Q","type":"mc","kind":"Problem Solving"},{"id":"QC09","topic":"Number Properties","sub":"Factors and prime factorization","b":2,"stem":"The positive integer <i>n</i> is a multiple of 12 and has exactly 15 positive factors. What is the greatest possible value of <i>n</i>?","opts":["144","324","400","576","1,296"],"ans":1,"expl":"Because 15 = 15 × 1 = 5 × 3, <i>n</i> is either a 14th power of a prime or of the form <i>p</i><sup>4</sup><i>q</i><sup>2</sup> for different primes <i>p</i> and <i>q</i>. A multiple of 12 contains both 2 and 3, so <i>n</i> is 2<sup>4</sup> × 3<sup>2</sup> = 144 or 3<sup>4</sup> × 2<sup>2</sup> = 324, and the greater is 324. The integer 400 has 15 factors but is not a multiple of 3, while 576 and 1,296 have 21 and 25 factors.","sec":"Q","type":"mc","kind":"Problem Solving"},{"id":"QC10","topic":"Number Properties","sub":"LCM","b":1.7,"stem":"For how many different positive integers <i>n</i> is the least common multiple of <i>n</i> and 24 equal to 360?","opts":["4","6","8","12","24"],"ans":0,"expl":"Write 360 = 2<sup>3</sup> × 3<sup>2</sup> × 5 and 24 = 2<sup>3</sup> × 3. Since 24 supplies only one factor of 3 and no factor of 5, <i>n</i> must contain exactly 3<sup>2</sup> and exactly 5, and no other primes. The power of 2 in <i>n</i> is free to be anything from 2<sup>0</sup> to 2<sup>3</sup>, which gives 4 values: 45, 90, 180 and 360. Counting all the factors of 360, or all its multiples of 45 and 15, overcounts.","sec":"Q","type":"mc","kind":"Problem Solving"},{"id":"QC11","topic":"Number Properties","sub":"Different remainders","b":1,"stem":"When the positive integer <i>n</i> is divided by 18, the remainder is 7. Which of the following could be the remainder when <i>n</i> is divided by 12?","opts":["1","3","5","9","11"],"ans":0,"expl":"Since 18 is a multiple of 6, <i>n</i> leaves remainder 1 when divided by 6. An integer that is 1 more than a multiple of 6 leaves remainder 1 or 7 when divided by 12, and nothing else. For example, <i>n</i> = 25 leaves remainder 7 on division by 18 and remainder 1 on division by 12.","sec":"Q","type":"mc","kind":"Problem Solving"},{"id":"QC12","topic":"Number Properties","sub":"Prime numbers","b":1.9,"stem":"For how many prime numbers <i>p</i> are <i>p</i> + 10 and <i>p</i> + 20 also both prime numbers?","opts":["None","One","Two","Three","More than three"],"ans":1,"expl":"When divided by 3, the numbers <i>p</i>, <i>p</i> + 10 and <i>p</i> + 20 leave the same remainders as <i>p</i>, <i>p</i> + 1 and <i>p</i> + 2, so exactly one of them is a multiple of 3. The only prime multiple of 3 is 3 itself, and it can only be the smallest of the three, so <i>p</i> = 3. Since 3, 13 and 23 are all prime, there is exactly one such value.","sec":"Q","type":"mc","kind":"Problem Solving"},{"id":"QC13","topic":"Word Problems","sub":"Work","b":1.3,"stem":"Working together at their constant rates, machines X and Y complete a certain production run in 12 hours. On one occasion, machine X worked alone on the run for the first 5 hours and was then shut down, and machine Y, working alone, completed the rest of the run in 26 more hours. How many hours would machine X, working alone, take to complete the entire run?","opts":["18","20","24","30","36"],"ans":0,"expl":"Treat the 5 hours of X and the first 5 of Y's 26 hours as 5 hours of joint work, which completes 5/12 of the run. The remaining 7/12 was done by Y alone in 21 hours, so Y's rate is 1/36 of the run per hour. Then X's rate is 1/12 − 1/36 = 1/18, so X alone takes 18 hours; 36 is the time for Y.","sec":"Q","type":"mc","kind":"Problem Solving"},{"id":"QC14","topic":"Word Problems","sub":"Time, speed, distance","b":2,"stem":"Dara and Emil start walking at the same time from opposite ends of a straight path, Dara from end X and Emil from end Y, and each walks at a constant speed. They first pass each other at a point 450 meters from X. Each continues to the opposite end of the path, turns around immediately, and walks back, and they pass each other for the second time at a point 250 meters from Y. What is the length of the path, in meters?","opts":["700","950","1,100","1,350","1,600"],"ans":2,"expl":"At the first meeting the two have covered one path length between them, and Dara has walked 450 meters. At the second meeting they have covered three path lengths between them, so Dara has walked 3 × 450 = 1,350 meters. That distance is one full length plus 250 meters back from Y, so the length is 1,350 − 250 = 1,100 meters. Adding 450 and 250 to get 700 ignores the distance between the two meeting points.","sec":"Q","type":"mc","kind":"Problem Solving"},{"id":"QC15","topic":"Word Problems","sub":"Trains","b":1.6,"stem":"A train moving at a constant speed completely passes a man who is walking beside the track in the same direction as the train at 6 kilometers per hour in 18 seconds. The same train completely passes a second man, who is walking beside the track in the opposite direction at 6 kilometers per hour, in 15 seconds. What is the length of the train, in meters?","opts":["225","250","275","300","330"],"ans":3,"expl":"The length equals relative speed times passing time in each case, so (<i>v</i> − 6) × 18 = (<i>v</i> + 6) × 15, which gives <i>v</i> = 66 kilometers per hour. The relative speed for the first man is 60 kilometers per hour, or 50/3 meters per second, so the length is 50/3 × 18 = 300 meters. Using the train's own speed of 66 with either time gives 275 or 330.","sec":"Q","type":"mc","kind":"Problem Solving"},{"id":"QC16","topic":"Word Problems","sub":"Translating word problems","b":1.5,"stem":"Farid is now twice as old as Greta was when Farid was as old as Greta is now. If the sum of their present ages is 63 years, what is Farid's present age, in years?","opts":["21","27","28","35","36"],"ans":4,"expl":"Let the present ages be <i>F</i> and <i>G</i>. Farid was <i>G</i> years old <i>F</i> − <i>G</i> years ago, when Greta was <i>G</i> − (<i>F</i> − <i>G</i>) = 2<i>G</i> − <i>F</i>. So <i>F</i> = 2(2<i>G</i> − <i>F</i>), which gives 3<i>F</i> = 4<i>G</i>, and with <i>F</i> + <i>G</i> = 63 the ages are 36 and 27. Check: 9 years ago Farid was 27 and Greta was 18, and 36 is twice 18.","sec":"Q","type":"mc","kind":"Problem Solving"},{"id":"VC01","stim":"VCP1","sub":"Inference","b":1.6,"stem":"Proponents of the multitask account, as it is described in the passage, would be most likely to agree with which of the following statements?","opts":["Employees whose pay depends on measured results reduce the total effort that they devote to their work.","If every valuable aspect of a job could be measured, the account would give an employer no reason to keep the incentives attached to that job weak.","Organizations that tie little pay to performance have generally failed to grasp what agency theory implies.","Employees take no interest in their work beyond the rewards that are attached to it.","Performance pay lowers performance chiefly by changing the way in which employees regard their relationship with their employer."],"ans":1,"expl":"On the multitask account the harm of incentives comes entirely from the gap between measured and unmeasured activities, so where nothing valuable goes unmeasured the account offers no ground for weak incentives, as the last paragraph confirms. The account describes a shift of effort among activities, not a fall in total effort, and it treats weak incentives as a correct application of agency theory. It assumes a self-interested response to rewards without denying all interest in the work, and the idea that rewards recast the employment relationship belongs to the crowding account.","sec":"V","type":"mc","kind":"Reading Comprehension","topic":"Reading Comprehension"},{"id":"VC02","stim":"VCP1","sub":"Strengthen a position","b":1.6,"stem":"Which of the following findings, if obtained, would provide the strongest support for the crowding account over the multitask account, as the passage describes the two?","opts":["After a retailer began paying bonuses for sales volume, the quality of the advice its staff gave to customers, which the bonus scheme did not track, declined.","Fruit pickers paid by the weight of fruit they harvested picked more than pickers paid by the hour, although they reported no greater interest in the work.","Firms in which pay is only weakly tied to measured performance were found to be more profitable than firms in which the tie is strong.","Engineers whose bonuses depended on three of the five aspects of their work that their employer valued improved on those three aspects and declined on the other two.","Nurses' performance declined on every aspect of their work after their employer began to measure and to reward all of the aspects of that work that it valued."],"ans":4,"expl":"The passage says the accounts diverge only where every valuable dimension is measured and rewarded: the multitask account then predicts gains, the crowding account a possible decline. A decline on all dimensions under complete measurement is therefore the one result that favors crowding. Deterioration confined to unmeasured dimensions, and the greater profitability of weak-incentive firms, are expected on both accounts, while gains under piece rates fit the multitask account.","sec":"V","type":"mc","kind":"Reading Comprehension","topic":"Reading Comprehension"},{"id":"VC03","stim":"VCP1","sub":"Function","b":1.8,"stem":"The author's remark that the more careful advocates of the crowding account \"never claimed\" that crowding is universal serves primarily to","opts":["indicate that the piece-rate findings tell against only a version of the crowding account broader than the one its best defenders hold","suggest that advocates of the crowding account have narrowed their claims in response to the piece-rate findings","concede that most advocates of the crowding account have overstated the evidence in its favor","imply that the studies of piece-rate work were too poorly designed to bear on the dispute","distinguish those advocates of the crowding account who accept the multitask account from those who reject it"],"ans":0,"expl":"The remark limits what the reported gains establish: they rule out universal crowding, a claim the account's careful advocates did not make, so the account in its defensible form is untouched. \"Never claimed\" excludes the idea of a retreat prompted by the findings. The charge that proponents overrate their evidence is made earlier and about different studies, and the author questions the reach of the piece-rate studies, not their design.","sec":"V","type":"mc","kind":"Reading Comprehension","topic":"Reading Comprehension"},{"id":"VC04","stim":"VCP1","sub":"Weaken","b":2.1,"stem":"The author gives a reason for declining to treat the studies of piece-rate work as a refutation of the crowding account. Which of the following, if true, would most weaken that reason?","opts":["Several of the piece-rate studies followed workers' output for only a few months after incentive pay was introduced.","Workers in complex occupations often report that their interest in their work declines once they are paid according to measured results.","Some routine jobs include aspects, such as the care of equipment, that employers value but cannot easily measure.","Workers in the piece-rate studies, surveyed before incentive pay was introduced, expressed as much interest in their work as professionals in complex occupations typically express.","The gains reported in the piece-rate studies were larger than proponents of the multitask account had predicted."],"ans":3,"expl":"The author's reason is that people in fully measurable, routine jobs may have had little intrinsic interest for rewards to displace, so gains there say little about crowding elsewhere. Evidence that those workers were as interested in their work as professionals removes that escape, making the gains a real test of crowding. Short follow-up periods and unmeasured aspects of routine jobs would be further grounds for caution, not objections to the author's reason, and reports of declining interest in complex work favor crowding itself.","sec":"V","type":"mc","kind":"Reading Comprehension","topic":"Reading Comprehension"},{"id":"VC05","stim":"VCP2","sub":"Application","b":1.7,"stem":"According to the revised theory as the passage describes it, which of the following populations would be most likely to evolve slower senescence than an otherwise similar population not exposed to the hazard mentioned?","opts":["Lizards on an island where periodic storms kill a large share of individuals regardless of their age or vigor","Insects whose larvae are heavily preyed upon before they reach reproductive age","Rodents exposed to a pathogen that is fatal chiefly to individuals whose bodily condition has begun to decline","Birds that have colonized an island free of the predators that kill many of their mainland relatives","Fish harvested by a fishery whose nets take only the largest and most fecund adults"],"ans":2,"expl":"The revised theory holds that added mortality favors slower aging where it is condition-dependent, falling mainly on the frail, because deterioration is then itself penalized. A pathogen that kills chiefly those already in decline fits this exactly. Storms that kill indiscriminately leave the age pattern of selection unchanged on the models described, predation on larvae and a fishery that removes the most vigorous adults do not penalize deterioration, and the island birds have lost a hazard instead of being exposed to one.","sec":"V","type":"mc","kind":"Reading Comprehension","topic":"Reading Comprehension"},{"id":"VC06","stim":"VCP2","sub":"Author's attitude","b":1.1,"stem":"The author's attitude toward the revised theory of aging can best be described as","opts":["convinced by its reasoning but concerned that, with the data now available, it cannot be put to a real test","persuaded that the stream-fish studies confirm it, though doubtful that it applies to birds and bats","suspicious that it was devised merely to protect the classical theory from contrary evidence, and inclined on that ground to reject it","satisfied that it is correct but convinced that condition-dependent mortality is too rare in the wild for the theory to matter","uncertain whether its formal models are sound, since they depend on assumptions about how populations are regulated"],"ans":0,"expl":"The author calls the revision persuasive as theory and accepts that the models show the classical prediction to be unfounded as a generalization, yet objects that the quantities needed to test the revision have been measured in almost no wild population. The author denies that the fish confirm it, since condition-dependence there was inferred from the result to be explained. Nothing suggests rejection, a claim that condition-dependent mortality is rare, or doubt about the models themselves.","sec":"V","type":"mc","kind":"Reading Comprehension","topic":"Reading Comprehension"},{"id":"VC07","stim":"VCP2","sub":"Weaken","b":2,"stem":"Which of the following, if true, would most weaken the author's objection to the use of the revised theory to explain the stream-fish results?","opts":["Formal models constructed independently by other theorists yield the same conclusions about the effects of mortality that strikes all conditions alike.","Condition-dependent mortality has been measured directly in laboratory populations of several other species of fish.","Fish in the populations below the waterfalls begin to reproduce at a younger age than fish in the populations upstream.","Field trials completed before any data on aging were collected showed that the predators below the waterfalls capture slow-swimming fish at far higher rates than fast-swimming ones.","The growth of the predator-free populations upstream is known to be limited by the availability of food."],"ans":3,"expl":"The objection is that, for these fish, condition-dependent mortality was never measured but was inferred from the very aging result it is supposed to explain. Independent field evidence, gathered beforehand, that predators there take the slow far more often than the fast supplies the missing measurement and removes the circularity. Agreement among models concerns the theory, which the author already accepts, laboratory measurements on other species do not bear on these wild populations, and food limitation upstream addresses only part of what must be known and only for the populations without predators.","sec":"V","type":"mc","kind":"Reading Comprehension","topic":"Reading Comprehension"},{"id":"VC08","sub":"Weaken","b":0.9,"stem":"<p>Orvane, which sells accounting software by subscription, offers prospective customers a free trial, and its advertisements state the length of the trial. Last year Orvane shortened the trial from 30 days to 14. Under the 30-day trial, 8 percent of those who began a trial went on to become paying subscribers; under the 14-day trial, 12 percent have done so. Orvane's marketing director concludes that the shorter trial is bringing Orvane more new paying subscribers each month than the longer trial did.</p><p>Which of the following, if true, most seriously weakens the marketing director's conclusion?</p>","opts":["Subscribers who joined after a 14-day trial have so far canceled their subscriptions at about the same rate as those who joined after a 30-day trial.","Under both trial lengths, most of those who became paying subscribers did so within ten days of beginning the trial.","Subscribers who joined after a 14-day trial have more often chosen Orvane's least expensive plan than did those who joined after a 30-day trial.","Several of Orvane's competitors continue to offer 30-day trials of their accounting software.","The number of people beginning a trial of Orvane's software each month fell from about 5,000 to about 3,000 when the trial was shortened."],"ans":4,"expl":"The conclusion concerns the number of new subscribers, but the evidence is a pair of conversion rates. Eight percent of 5,000 is 400 a month, whereas 12 percent of 3,000 is only 360, so the shorter trial would be yielding fewer subscribers, not more. The plan that new subscribers choose bears on revenue, not on how many subscribers there are, and the timing of conversions and the cancellation rate do nothing to undermine the conclusion.","sec":"V","type":"mc","kind":"Critical Reasoning","topic":"Critical Reasoning"},{"id":"VC09","sub":"Weaken","b":1.2,"stem":"<p>Castellan Hotels operates 40 hotels, each run by a general manager. A review found that in the hotels whose general managers hold a weekly one-on-one meeting with each department head, far fewer department heads resigned over the past three years than in the hotels whose general managers hold no such meetings. Castellan's directors conclude that the meetings make department heads less likely to resign. They will therefore require every general manager to hold the meetings, and they expect resignations to fall across the company.</p><p>Which of the following, if true, most seriously weakens the directors' reasoning?</p>","opts":["General managers who hold the weekly meetings spend less time with hotel guests than do general managers who hold no such meetings.","When a department head resigns, the general manager must do that person's work until a replacement has been trained, and general managers in this position report having no time for regular meetings.","Among department heads who resigned, dissatisfaction with pay was cited as a reason equally often in hotels with the weekly meetings and in hotels without them.","A few of the general managers who hold no weekly meetings had no department head resign during the three years reviewed.","Department heads at Castellan resign less often than do department heads at most comparable hotel companies."],"ans":1,"expl":"The directors read the correlation as showing that meetings prevent resignations. If resignations themselves leave general managers too busy to hold meetings, the causation may run the other way, and requiring meetings would not reduce resignations. A few exceptions do not disturb a general tendency, and the remaining statements leave the difference between the two groups of hotels unexplained.","sec":"V","type":"mc","kind":"Critical Reasoning","topic":"Critical Reasoning"},{"id":"VC10","sub":"Strengthen","b":1,"stem":"<p>Halcyon Mills weaves cloth in two halls, A and B, which use identical looms. Last year the company lined the walls of hall A with sound-absorbing panels; hall B was left as it was. Over the following twelve months, the proportion of cloth from hall A that had to be rejected for weaving faults fell by a fifth, while the proportion rejected from hall B did not change. The production manager concludes that the reduction in noise enabled the weavers in hall A to concentrate better and so to make fewer faults.</p><p>Which of the following, if true, most strengthens the production manager's conclusion?</p>","opts":["While the panels were being fitted, the lamps in hall A were replaced with brighter ones, and weavers there say that broken threads are now easier to see.","Weavers in hall A, aware that their hall had been chosen for improvement, have since reported greater satisfaction with the company than have weavers in hall B.","Within hall A, the fall in the proportion of rejected cloth was greatest at the looms where the measured drop in noise was greatest.","The saving that resulted from the reduction in rejected cloth in hall A exceeded the cost of the panels.","The proportion of rejected cloth in hall A fell by about the same amount on the day shift as on the night shift."],"ans":2,"expl":"If the improvement at each loom tracks the size of the drop in noise there, noise itself, and not something else that happened in hall A, is the likely cause. Brighter lamps and the morale of weavers who know they were singled out sound like good news for hall A, but each is a rival explanation of the fall in faults and so weakens the conclusion. The saving relative to cost and the similarity across shifts do not bear on why faults fell.","sec":"V","type":"mc","kind":"Critical Reasoning","topic":"Critical Reasoning"},{"id":"VC11","sub":"Strengthen","b":1.9,"stem":"<p>Five years ago the province of Aldany repealed the law that required motorcyclists to wear helmets. In the year before the repeal, motorcyclists accounted for 15 percent of all deaths on Aldany's roads; last year they accounted for 24 percent. A safety campaigner concludes that, kilometer for kilometer, riding a motorcycle in Aldany carries a greater risk of death now than it did before the repeal.</p><p>Which of the following, if true, most strengthens the campaigner's conclusion?</p>","opts":["The total number of deaths on Aldany's roads was greater last year than in the year before the repeal.","Most of the motorcyclists who died on Aldany's roads last year were not wearing helmets.","The number of motorcycles registered in Aldany has risen by half since the repeal.","Both the total number of deaths on Aldany's roads and the total distance ridden by motorcyclists there were about the same last year as in the year before the repeal.","Deaths among car occupants in Aldany have fallen sharply since the repeal, owing to improvements in the design of cars."],"ans":3,"expl":"A larger share of deaths shows a higher risk per kilometer only if the number of motorcyclist deaths rose and the distance ridden did not rise with it. With total deaths steady, the move from 15 to 24 percent means many more motorcyclist deaths, and with distance ridden steady, that is a higher risk per kilometer. A rise in total deaths establishes more motorcyclist deaths but leaves open that riders simply covered more distance, which is what a jump in registrations would suggest. Fewer car-occupant deaths would raise the motorcyclists' share with no change in their risk.","sec":"V","type":"mc","kind":"Critical Reasoning","topic":"Critical Reasoning"},{"id":"VC12","sub":"Assumption","b":2.1,"stem":"<p>At Lindqvar Pharmacies, about half of all prescriptions are filled by dispensing robots and the rest by pharmacists working by hand. Company records show one dispensing error for every 10,000 prescriptions filled by robot and five for every 10,000 filled by hand. Lindqvar's operations director concludes that if the prescriptions now filled by hand were instead filled by the robots, errors on those prescriptions would occur less often than they do now.</p><p>Which of the following is an assumption on which the operations director's argument depends?</p>","opts":["The prescriptions now filled by hand are not ones on which the robots would make errors at five or more times the rate at which they make errors on the prescriptions they now fill.","The robots make errors at the same rate on every kind of prescription.","The prescriptions now filled by hand are no more complicated to dispense than those now filled by robot.","Pharmacists would make errors more often than the robots do if they filled the prescriptions that the robots now fill.","Pharmacists relieved of dispensing by hand would not make additional errors in their other duties."],"ans":0,"expl":"The robots' record was earned on a different set of prescriptions. The conclusion fails if, on the prescriptions now filled by hand, the robots would err at five or more times their present rate, since that would equal or exceed the pharmacists' five per 10,000; the argument therefore must assume this is not so. A uniform robot error rate, or prescriptions of equal complexity, would guarantee the conclusion but is more than the argument needs, because the robots could do somewhat worse on these prescriptions and still beat five per 10,000.","sec":"V","type":"mc","kind":"Critical Reasoning","topic":"Critical Reasoning"},{"id":"VC13","sub":"Assumption","b":2,"stem":"<p>In the town of Brennock, every application for a building permit is either granted or refused. A permit for a building in the Old Quarter is granted only if the Heritage Board raises no objection, and the Board objects to any proposed building in the Old Quarter that would rise above four stories. Marlo Developments has applied for a permit for a three-story building in the Old Quarter. Marlo's lawyer concludes that the permit will be granted.</p><p>The lawyer's conclusion follows logically if which of the following is assumed?</p>","opts":["The Heritage Board objects to a proposed building in the Old Quarter only if the building would rise above four stories.","Any application for a permit for a building in the Old Quarter to which the Heritage Board raises no objection is granted.","A permit for a building in the Old Quarter is refused only if the building would rise above four stories.","Every proposed building in the Old Quarter that would rise above four stories is refused a permit.","The Heritage Board has never objected to a proposed building in the Old Quarter of fewer than five stories."],"ans":2,"expl":"The stated rules make the absence of an objection necessary for a permit, not sufficient, and say when the Board must object, not when it will refrain. If refusal occurs only for buildings above four stories, a three-story building is not refused and, since every application is granted or refused, it is granted. Knowing only that the Board will not object leaves open refusal on other grounds, and knowing only that unopposed applications are granted leaves open that the Board objects for some other reason; each of those fills one of the two gaps, not both.","sec":"V","type":"mc","kind":"Critical Reasoning","topic":"Critical Reasoning"},{"id":"VC14","sub":"Inference","b":1.7,"stem":"<p>Quarry Lane Nurseries sells plants both at its garden center and through its website. Last year, website orders accounted for 40 percent of the company's sales revenue; this year they accounted for 50 percent. Revenue from sales at the garden center was the same this year as last year, and the number of website orders was 20 percent greater this year than last.</p><p>If the statements above are true, which of the following must also be true?</p>","opts":["Quarry Lane's total sales revenue was 10 percent greater this year than last year.","Revenue from website orders was 25 percent greater this year than last year.","The number of purchases made at the garden center was the same this year as last year.","More customers bought from Quarry Lane through its website this year than bought at its garden center.","The average revenue per website order was greater this year than last year."],"ans":4,"expl":"Unchanged garden center revenue was 60 percent of last year's total and 50 percent of this year's, so website revenue rose from two thirds of that amount to the whole of it, an increase of 50 percent. Since the number of website orders rose by only 20 percent, revenue per website order must have risen. Total revenue rose by 20 percent, not 10, and nothing is said about numbers of customers or of garden center purchases.","sec":"V","type":"mc","kind":"Critical Reasoning","topic":"Critical Reasoning"},{"id":"VC15","sub":"Boldface","b":1.8,"stem":"<p>Hydrologist: Since the operators of the Verrin Reservoir began releasing water in short pulses rather than in a steady flow, the trout population downstream has doubled. The operators credit the pulses, which scour silt from the gravel in which trout spawn. <b>But during the same period a tannery that had discharged effluent into the river above the reservoir closed</b>, and trout are sensitive to such effluent. Admittedly, <b>the silt covering the spawning gravel has thinned since the pulses began</b>. Yet silt thinned just as much in a neighboring river where pulsed releases were introduced and trout numbers did not change. The recovery is therefore more probably due to the closure of the tannery than to the pulses.</p><p>In the hydrologist's argument, the two portions in boldface play which of the following roles?</p>","opts":["The first is a finding that the argument seeks to explain; the second is evidence that the argument offers against the operators' explanation of that finding.","The first is evidence offered in support of the explanation that the argument favors; the second is a fact that the argument grants as seeming to favor a rival explanation and whose force it then seeks to limit.","The first is evidence offered in support of the explanation that the argument favors; the second is evidence that the argument offers against a rival explanation.","The first is a consideration that weighs against the operators' explanation; the second is a fact that the argument accepts as showing that the pulses contributed to the recovery.","The first calls into question a finding reported by the operators; the second is the main conclusion of the argument."],"ans":1,"expl":"The tannery's closure is the hydrologist's evidence for the explanation the argument ends by favoring. The thinning of the silt is conceded (\"Admittedly\") because it appears to support the operators, and the comparison with the neighboring river is then used to blunt it. The thinning silt is not itself evidence against the operators, since that work is done by the neighboring river, and the hydrologist never grants that the pulses helped the trout. The finding to be explained is the doubling of the trout population, which nobody disputes.","sec":"V","type":"mc","kind":"Critical Reasoning","topic":"Critical Reasoning"},{"id":"VC16","sub":"Evaluate","b":1.2,"stem":"<p>Tessaly Rail counts a train as delayed if it reaches its final station more than ten minutes after the arrival time shown in the published timetable. Two years ago, 22 percent of Tessaly's trains were delayed; last year only 16 percent were. The proportion of trains that left their first station at the time shown in the timetable was the same in both years. Tessaly's chief executive concludes that the company's trains are now completing their journeys in less time than they did two years ago.</p><p>The answer to which of the following questions would be most useful in evaluating the chief executive's conclusion?</p>","opts":["Did Tessaly run the same number of trains last year as it ran two years ago?","Did other rail operators that use the same tracks record a similar fall in the proportion of their trains that were delayed?","Were the trains that were delayed last year concentrated on Tessaly's longest routes?","Did the timetable allow the same amount of time for each journey last year as it had allowed two years earlier?","Do Tessaly's passengers regard ten minutes as a reasonable threshold for counting a train as delayed?"],"ans":3,"expl":"Delay is measured against the timetable, so fewer delays show faster journeys only if the timetable did not simply allow more time. If scheduled journey times were lengthened, trains could run exactly as before and still be counted as delayed less often. The number of trains is irrelevant to a proportion, and what other operators experienced, where delays were concentrated, and what passengers think of the threshold do not tell us whether journeys actually became shorter.","sec":"V","type":"mc","kind":"Critical Reasoning","topic":"Critical Reasoning"},{"sec":"D","type":"mc","kind":"Data Sufficiency","topic":"Data Sufficiency","id":"DH01","sub":"Fractions forcing integers","b":1.7,"ans":0,"expl":"The fractions force the Country X group to number 7<i>a</i> and the Country Y group 11<i>b</i> for positive integers <i>a</i> and <i>b</i>. With the first statement, 7<i>a</i> + 11<i>b</i> = 40 has the single solution <i>a</i> = 1, <i>b</i> = 3, so 33 representatives are from Country Y: sufficient. With the second, 2<i>a</i> + 3<i>b</i> = 11 allows <i>a</i> = 1, <i>b</i> = 3 or <i>a</i> = 4, <i>b</i> = 1, giving 33 or 11: not sufficient. The trap is to treat the first statement as one equation in two unknowns.","opts":["Statement (1) ALONE is sufficient, but statement (2) alone is not sufficient.","Statement (2) ALONE is sufficient, but statement (1) alone is not sufficient.","BOTH statements TOGETHER are sufficient, but NEITHER statement ALONE is sufficient.","EACH statement ALONE is sufficient.","Statements (1) and (2) TOGETHER are NOT sufficient."],"stem":"<p>A trade delegation consists of representatives of Country X and representatives of Country Y, with at least one representative of each country. Exactly 2/7 of the representatives of Country X and exactly 3/11 of the representatives of Country Y speak Mandarin. How many of the representatives in the delegation are from Country Y?</p><div class=\"ds\"><div><span>(1)</span> The delegation has 40 representatives in total.</div><div><span>(2)</span> Exactly 11 of the representatives in the delegation speak Mandarin.</div></div>"},{"sec":"D","type":"mc","kind":"Data Sufficiency","topic":"Data Sufficiency","id":"DH02","sub":"Percent change and profit","b":1.8,"ans":1,"expl":"With 2023 revenue <i>R</i> and cost <i>C</i>, profit rose only if 0.2<i>R</i> &gt; 0.3<i>C</i>, that is, only if cost was less than two-thirds of revenue in 2023. The second statement puts cost at 70 percent of revenue, which is more than two-thirds, so profit fell: a definite no, and sufficient. The first statement gives 1.2<i>R</i> − 1.3<i>C</i> &gt; 0.24<i>R</i>, so cost was below about 73.8 percent of revenue, which allows 70 percent (profit fell) or 50 percent (profit rose): not sufficient.","opts":["Statement (1) ALONE is sufficient, but statement (2) alone is not sufficient.","Statement (2) ALONE is sufficient, but statement (1) alone is not sufficient.","BOTH statements TOGETHER are sufficient, but NEITHER statement ALONE is sufficient.","EACH statement ALONE is sufficient.","Statements (1) and (2) TOGETHER are NOT sufficient."],"stem":"<p>In 2024 a company's revenue was 20 percent greater than in 2023, and its total cost was 30 percent greater than in 2023. Profit for a year is revenue minus total cost. Was the company's profit greater in 2024 than in 2023?</p><div class=\"ds\"><div><span>(1)</span> In 2024 the company's profit was more than 20 percent of its revenue.</div><div><span>(2)</span> In 2023 the company's profit was 30 percent of its revenue.</div></div>"},{"sec":"D","type":"mc","kind":"Data Sufficiency","topic":"Data Sufficiency","id":"DH03","sub":"Trains meeting","b":1.2,"ans":3,"expl":"After the trains pass, each must cover the stretch the other covered in the first 3 hours. From the first statement, train A covers in 2 hours what train B covered in 3, so the speeds are in the ratio 3 to 2; train B then needs 3 × 3/2 = 4.5 hours for the stretch that took train A 3 hours, for a total of 7.5 hours. The second statement gives the same 3 to 2 ratio directly and so the same 7.5 hours. Each statement alone is sufficient, and the distance between the stations is never needed.","opts":["Statement (1) ALONE is sufficient, but statement (2) alone is not sufficient.","Statement (2) ALONE is sufficient, but statement (1) alone is not sufficient.","BOTH statements TOGETHER are sufficient, but NEITHER statement ALONE is sufficient.","EACH statement ALONE is sufficient.","Statements (1) and (2) TOGETHER are NOT sufficient."],"stem":"<p>Train A left station P for station Q at the same moment that train B left station Q for station P on a parallel track. Each train traveled at its own constant speed without stopping, and the two trains passed each other exactly 3 hours after they set out. How many hours did train B take to travel from Q to P?</p><div class=\"ds\"><div><span>(1)</span> Train A reached station Q exactly 2 hours after the two trains passed each other.</div><div><span>(2)</span> Train A's speed was 50 percent greater than train B's speed.</div></div>"},{"sec":"D","type":"mc","kind":"Data Sufficiency","topic":"Data Sufficiency","id":"DH04","sub":"Overlapping sets","b":1.8,"ans":2,"expl":"Since the holders of A plus the holders of B minus those with both plus those with neither equals 90, the number with both exceeds the number with neither exactly when the holders of A and the holders of B total more than 90. The first statement leaves the number who hold B open, and the second says only that A has 11 more holders than B, which fits totals such as 51 and 40 or 31 and 20. Together, 52 hold A and 41 hold B, a total of 93, so those with both outnumber those with neither by 3. Neither count can be found individually, which tempts the choice that the statements together are not sufficient.","opts":["Statement (1) ALONE is sufficient, but statement (2) alone is not sufficient.","Statement (2) ALONE is sufficient, but statement (1) alone is not sufficient.","BOTH statements TOGETHER are sufficient, but NEITHER statement ALONE is sufficient.","EACH statement ALONE is sufficient.","Statements (1) and (2) TOGETHER are NOT sufficient."],"stem":"<p>Each of the 90 analysts at a firm holds certification A, certification B, both certifications or neither. Do more of the analysts hold both certifications than hold neither?</p><div class=\"ds\"><div><span>(1)</span> Exactly 52 of the analysts hold certification A.</div><div><span>(2)</span> The number of analysts who hold certification A but not certification B is 11 greater than the number who hold certification B but not certification A.</div></div>"},{"sec":"D","type":"mc","kind":"Data Sufficiency","topic":"Data Sufficiency","id":"DH05","sub":"Primes and factoring","b":1.8,"ans":4,"expl":"From the first statement, (<i>p</i> − <i>q</i>)(<i>p</i> + <i>q</i>) = 72 with both factors even, so the factor pairs are 2 and 36, 4 and 18, or 6 and 12. These give 19 and 17, 11 and 7, or 9 and 3, and only the first two are pairs of primes, so the sum is 36 or 18. The second statement alone fits countless pairs, and it does not separate the two remaining cases, because their differences are 2 and 4. Even together the statements leave two possible sums.","opts":["Statement (1) ALONE is sufficient, but statement (2) alone is not sufficient.","Statement (2) ALONE is sufficient, but statement (1) alone is not sufficient.","BOTH statements TOGETHER are sufficient, but NEITHER statement ALONE is sufficient.","EACH statement ALONE is sufficient.","Statements (1) and (2) TOGETHER are NOT sufficient."],"stem":"<p>If <i>p</i> and <i>q</i> are prime numbers, what is the value of <i>p</i> + <i>q</i>?</p><div class=\"ds\"><div><span>(1)</span> <i>p</i><sup>2</sup> − <i>q</i><sup>2</sup> = 72</div><div><span>(2)</span> <i>p</i> − <i>q</i> &lt; 6</div></div>"},{"sec":"D","type":"mc","kind":"Data Sufficiency","topic":"Data Sufficiency","id":"DH06","sub":"Tournament logic","b":1.7,"ans":0,"expl":"The Bears, the Comets and the Dynamos played three games among themselves, and each of those games was won by one of the three, so together they have at least three wins. If none of them won more than once, each won exactly one of those games and none of them beat the Arrows, so the Arrows won all three games: the first statement is sufficient. The second statement is silent on the game between the Arrows and the Dynamos, since the one loss it gives the Dynamos could have come against the Bears or the Comets: not sufficient.","opts":["Statement (1) ALONE is sufficient, but statement (2) alone is not sufficient.","Statement (2) ALONE is sufficient, but statement (1) alone is not sufficient.","BOTH statements TOGETHER are sufficient, but NEITHER statement ALONE is sufficient.","EACH statement ALONE is sufficient.","Statements (1) and (2) TOGETHER are NOT sufficient."],"stem":"<p>Four teams, the Arrows, the Bears, the Comets and the Dynamos, played a tournament in which each team played each of the other three teams exactly once and no game ended in a tie. Did the Arrows win all three of their games?</p><div class=\"ds\"><div><span>(1)</span> None of the other three teams won more than one of its games.</div><div><span>(2)</span> The Arrows won their games against the Bears and the Comets, and the Dynamos lost at least one of their games.</div></div>"},{"sec":"D","type":"tpa","kind":"Two-Part Analysis","topic":"Two-Part Analysis","id":"DH07","sub":"Combined work rates","b":0.9,"stem":"<p>Working together at their respective constant rates, machines R and S complete a certain production order in 12 hours. If machine R works alone on the order for 5 hours and is then shut down, machine S, working alone, needs 26 more hours to complete the order.</p><p>Select the number of hours that machine R, working alone, would take to complete the entire order and the number of hours that machine S, working alone, would take to complete the entire order. Make only two selections, one in each column.</p>","cols":["Machine R alone","Machine S alone"],"rows":["15","18","20","24","30","36"],"ans":[1,5],"expl":"Let the hourly rates be <i>r</i> and <i>s</i>, so <i>r</i> + <i>s</i> = 1/12 and 5<i>r</i> + 26<i>s</i> = 1. Substituting <i>r</i> = 1/12 − <i>s</i> gives 5/12 + 21<i>s</i> = 1, so <i>s</i> = 1/36 and <i>r</i> = 1/18: machine R needs 18 hours and machine S needs 36. Times of 20 and 30 hours, or 24 and 24, also give a combined time of 12 hours, but they fail the second condition, since 5/20 + 26/30 and 5/24 + 26/24 are both greater than 1."},{"sec":"D","type":"tpa","kind":"Two-Part Analysis","topic":"Two-Part Analysis","id":"DH08","sub":"Assumption and weakener","b":0.8,"stem":"<p>The port authority of Kesra plans to deepen the port's harbor channel so that container vessels of the largest class, which at present cannot enter the port, will be able to dock there. Because these vessels carry cargo at a lower cost per container than smaller vessels do, the authority predicts that, once the channel has been deepened, shipping lines will send substantially more cargo through Kesra, and that the port's revenue from handling fees, which are charged per container, will therefore rise.</p><p>Select the statement that is an <i>assumption</i> on which the authority's prediction depends and the statement that, if true, most seriously <i>weakens</i> the authority's reasoning. Make only two selections, one in each column.</p>","cols":["Assumption","Weakens"],"rows":["Deepening the channel will cost more than any other project that the authority has undertaken.","At least some of the cargo that would arrive at Kesra on vessels of the largest class is cargo that would not otherwise pass through the port.","Every shipping line that operates vessels of the largest class will send at least one of them to Kesra once the channel has been deepened.","The number of vessels of the largest class in service worldwide has grown in each of the past five years.","The cranes at Kesra's container terminals cannot reach across the decks of vessels of the largest class, and the authority has neither plans nor funds to replace them.","Handling fees per container at Kesra are currently lower than those at most other ports in the region."],"ans":[1,4],"expl":"If all of the cargo arriving on the largest vessels would have come through Kesra anyway on smaller ones, the volume of cargo, and with it fee revenue, would not rise, so the prediction depends on some of that cargo being new to the port. If the port's cranes cannot unload the largest vessels, a deeper channel will not bring their cargo to Kesra, which undermines the reasoning. The statement about every shipping line claims far more than the prediction needs, the project's cost bears on spending and not on fee revenue, and the growth of the fleet and the level of current fees neither are required by the reasoning nor count against it."},{"sec":"D","type":"tpa","kind":"Two-Part Analysis","topic":"Two-Part Analysis","id":"DH09","sub":"Selection constraints","b":1.7,"stem":"<p>A conference organizer will select exactly four of seven speakers, F, G, H, J, K, L and M, for a panel. The selection must satisfy these conditions: F and H are not both selected. If G is selected, J is also selected. K and L are not both selected. M is selected only if F is selected. At least one of H and K is selected.</p><p>Select the statement that <i>must be true</i> of the selection and the statement that <i>cannot be true</i> of the selection. Make only two selections, one in each column.</p>","cols":["Must be true","Cannot be true"],"rows":["F is selected.","J is selected.","H and K are both selected.","G and M are both selected.","Exactly one of H and K is selected.","Neither G nor L is selected."],"ans":[1,3],"expl":"If J were left out, G would be out as well, and four speakers would have to come from F, H, K, L and M, which is impossible because the pairs F, H and K, L can each supply at most one; so J is always selected. Working through the cases gives exactly four possible panels: F G J K; F J K M; G H J K; and G H J L. G and M never appear together, because M requires F, which excludes H and so requires K, and G requires J, making five speakers. Each of the other statements is true of at least one of the four panels and false of at least one."},{"sec":"D","type":"gi","kind":"Graphics Interpretation","topic":"Graphics Interpretation","id":"DH10","sub":"Share changes and relative growth","b":1.4,"stim":"DHC1","stem":"The chart shows the number of parcels that a courier company delivered in a city by van and by cargo bike in each of five years. Every parcel was delivered by one of the two vehicle types. Select the option from each list that makes the statement most accurate.","text":"The cargo-bike share of all parcels delivered rose by the greatest number of percentage points between {0}. From 2020 to 2024, the percent increase in the number of parcels delivered by cargo bike was {1} times the percent increase in the number delivered by van.","blanks":[["2020 and 2021","2021 and 2022","2022 and 2023","2023 and 2024"],["3","4.5","7","9"]],"ans":[1,2],"expl":"The cargo-bike share was 20/80 = 25%, 30/100 = 30%, 50/125 = 40%, 60/140, about 42.9%, and 90/180 = 50%, so the year-to-year gains were 5, 10, about 2.9 and about 7.1 percentage points; the largest came between 2021 and 2022, even though the largest gain in the number of bike parcels came between 2023 and 2024. Bike deliveries rose from 20 to 90, an increase of 350 percent, and van deliveries rose from 60 to 90, an increase of 50 percent, so the multiple is 7. Dividing the growth factors, 4.5 by 1.5, gives the tempting 3."},{"sec":"D","type":"gi","kind":"Graphics Interpretation","topic":"Graphics Interpretation","id":"DH11","sub":"Rates on a scatter plot","b":1.6,"stim":"DHC2","stem":"The graph shows the floor area and the monthly rent of each of 12 offices leased by a consulting firm, with a trend line fitted to the data. Select the option from each list that makes the statement most accurate.","text":"The number of offices for which the monthly rent is more than $50 per square meter of floor area is {0}. The monthly rent of the office with a floor area of 800 square meters is approximately {1} greater than the rent that the trend line predicts for an office of that size.","blanks":[["4","5","6","7"],["8%","18%","22%","25%"]],"ans":[2,2],"expl":"Rent of $50 per square meter means $5 thousand per hundred square meters, so the offices in question lie above the line from the origin through (10, 50). Those are the offices at (1, 10), (2, 15), (3, 20), (4, 25), (6, 35) and (8, 45), which is 6 offices. The trend line rises from 5 to 45 over 10 units, so it predicts 5 + 4 × 8 = 37 for 800 square meters; the actual rent of 45 is 8 higher, and 8/37 is about 22 percent. Using 45 as the base gives 18 percent, and 8 is the difference in $ thousand, not a percent."},{"id":"DH12","sec":"D","type":"ta","kind":"Table Analysis","topic":"Table Analysis","sub":"Derived ratios and pooled rates","b":1.7,"stim":"DHT1","labels":["Yes","No"],"stem":"The table shows data for the nine routes that an airline operates from its hub in a typical week. The load factor of a route is the percent of the seats offered on that route that are occupied by passengers, so the number of passengers carried on a route in a week is weekly flights × seats per flight × (load factor ÷ 100). For each of the following statements, select <i>Yes</i> if the statement is supported by the information in the table. Otherwise, select <i>No</i>.","stmts":["The route with the highest average fare per kilometer of distance is also the route with the lowest load factor.","On the three Regional routes taken together, fewer than 74 percent of the seats offered in a week are occupied.","Of the routes with more than 10 weekly flights, more than half carry more than 1,600 passengers per week."],"ans":[0,0,1],"expl":"Fare per kilometer is highest for Porto at 56/280 = $0.20, ahead of Faro at $0.16, and Porto also has the lowest load factor, 60 percent: Yes. The Regional routes offer 1,350 + 1,680 + 3,780 = 6,810 seats and carry 945 + 1,512 + 2,457 = 4,914 passengers, about 72 percent, because Geneva, with the lowest load factor, offers the most seats; the simple average of 70, 90 and 65 is a misleading 75: Yes. Five routes have more than 10 weekly flights, carrying 1,512 (Cork), 1,568 (Faro), 2,457 (Geneva), 1,824 (Madeira) and 1,470 (Porto) passengers, and only two of these exceed 1,600: No."},{"sec":"D","kind":"Multi-Source Reasoning","topic":"Multi-Source Reasoning","stim":"DHS1","id":"DH13","type":"mc","sub":"Apply rules across sources","b":1.3,"stem":"Under the coordinator's rules, which carrier will transport Consignment 2, and what will be the total charge for that consignment?","opts":["Northline, at $2,580","Northline, at $2,688","Castellan, at $2,400","Castellan, at $2,640","Varga Freight, at $2,450"],"ans":3,"expl":"Consignment 2 weighs 900 kg, goes to Zone B within 5 days, and must be insured because its declared value of $60,000 is above $40,000. Varga Freight needs 7 + 2 = 9 days for a Thursday pickup, so it cannot be used, although its charge of $2,450 would be the lowest. Northline charges 120 + 2,160 × 1.05 + 300 = $2,688, Castellan charges 60 + 2,340 + 240 = $2,640 with no surcharge, and Delmar Express charges 150 + 2,700 × 1.05 + 180 = $3,165, so Castellan is used at $2,640."},{"sec":"D","kind":"Multi-Source Reasoning","topic":"Multi-Source Reasoning","stim":"DHS1","id":"DH14","type":"ta","sub":"Conditional rules","b":1.8,"labels":["Yes","No"],"stem":"For each of the following statements, select <i>Yes</i> if the statement can be inferred from the information in the three sources. Otherwise, select <i>No</i>.","stmts":["Consignment 1 will be transported by Northline.","If the pickup of Consignment 2 were moved from Thursday to Tuesday, that consignment would be transported by a different carrier from the one that will transport it under the current schedule.","The carrier that will transport Consignment 3 will charge at least $450 less in total for it than any other carrier that can deliver it within the limit."],"ans":[1,1,0],"expl":"For Consignment 1, Northline charges 120 + 720 × 1.05 = $876 and Castellan, with no fuel surcharge, charges 60 + 800 = $860; Varga Freight is too slow and Delmar Express costs $1,200, so Castellan is used: No. With a Tuesday pickup Varga Freight would take 7 days to Zone B, still more than the 5 allowed for Consignment 2, so Castellan would still be used: No. For Consignment 3, Varga Freight takes 9 days, within the limit of 10, and charges 200 + 1,500 × 1.80 × 1.05 = $3,035; the next lowest is Northline at 120 + 1,500 × 2.16 × 1.05 = $3,522, which is $487 more: Yes."},{"sec":"D","kind":"Multi-Source Reasoning","topic":"Multi-Source Reasoning","stim":"DHS1","id":"DH15","type":"ta","sub":"What-if analysis","b":1.9,"labels":["Yes","No"],"stem":"For each of the following statements, select <i>Yes</i> if the statement can be inferred from the information in the three sources. Otherwise, select <i>No</i>.","stmts":["If the declared value of Consignment 2 were $35,000 instead of $60,000, that consignment would be transported by Northline.","If Castellan added the same 5 percent fuel surcharge that the other three carriers add, Consignment 1 would still be transported by Castellan.","If Consignment 1 and Consignment 2 each had to arrive within 2 days after pickup, the combined total charge for those two consignments would be more than $500 greater than it will be under the current limits."],"ans":[0,1,0],"expl":"Without insurance, Northline would charge 120 + 2,268 = $2,388 for Consignment 2 and Castellan 60 + 2,340 = $2,400, so Northline would be used: Yes. With a surcharge, Castellan would charge 60 + 800 × 1.05 = $900 for Consignment 1, more than Northline at $876, so the consignment would move to Northline: No. With a 2-day limit, Consignment 1 would go to Northline at $876 in place of Castellan at $860, and Consignment 2 could go only to Delmar Express, at $3,165 in place of $2,640; the combined increase is 16 + 525 = $541: Yes."}],"passages":{"P1":"<p>Standard accounts of competition in platform markets hold that network effects produce winner-take-all outcomes: because each additional user raises the value of a platform to every other user, an early lead compounds until rivals are starved of participants. On this view, a dominant ride-hailing or food-delivery platform should be nearly unassailable, and regulators should worry chiefly about entrenchment.</p>\n<p>Recent empirical work complicates this picture. Economists studying delivery platforms in several large cities found that market shares fluctuated substantially from year to year and that entrants routinely reached scale despite incumbents' size advantage. The researchers attribute this instability to multihoming, the practice of participating on several platforms at once. When drivers keep two apps open and customers compare prices across services, a platform's installed base is not really captive; the network benefits created by one firm's users are, in effect, available to its rivals. Network effects remain strong at the level of the market, but they do not attach to any particular firm.</p>\n<p>This finding does not imply that such markets are benign. Platforms respond to multihoming with devices designed to discourage it, such as loyalty tiers that reward drivers for a minimum number of weekly trips or subscriptions that waive delivery fees for customers who order exclusively through one service. These devices can restore the captivity that multihoming erodes, and, unlike superior matching technology, they do so without making the service itself better. The researchers therefore suggest that regulators attend less to a platform's size than to the contractual terms by which it binds participants, since it is these terms, rather than scale as such, that determine whether a lead can be contested.</p>","P2":"<p>The idea that forest trees exchange resources through common mycorrhizal networks, webs of fungal filaments linking the roots of neighboring plants, has moved quickly from research journals into popular culture. In its strongest form, the claim is that mature trees channel carbon through these networks to shaded seedlings, including their own offspring, and that forests are therefore better understood as cooperative communities than as arenas of competition.</p>\n<p>A recent reassessment of the field evidence urges caution. Its authors do not dispute that fungi physically connect the roots of different trees or that labeled carbon supplied to one tree can later be detected in another. Their concern is with what such detection shows. In most field experiments, the quantity of carbon recovered in receiver seedlings was small relative to the seedlings' own photosynthetic output, and few studies excluded alternative pathways, such as movement through soil water, by which carbon might travel without any network. Moreover, where seedlings connected to a network grew better than isolated ones, the experimental barriers used to isolate seedlings also altered soil moisture and root competition, so that the benefit could not be assigned to the network itself.</p>\n<p>The reassessment also documents a pattern in how the evidence has been reported. Papers citing the early field studies increasingly described their results as demonstrating benefits to seedlings, although the original authors had often characterized the same results as inconclusive. The authors of the reassessment note that an appealing hypothesis can thus acquire the appearance of an established finding without any accumulation of supporting data. They conclude not that resource sharing among trees is implausible but that the experiments required to establish it, ones that manipulate network connections while holding other soil conditions constant, have for the most part yet to be performed.</p>","P3":"<p>Historians seeking to measure literacy in early modern Europe have long relied on signatures. Because parish registers, wills, and court depositions required individuals either to sign their names or to make a mark, the proportion of signers offers a rare quantitative index reaching back before any systematic survey of education. The method rests on the observation that, in the schools of the period, reading was taught first and writing only afterward, often for an additional fee. A person able to sign had therefore, it was assumed, almost certainly learned to read, while the number of readers who never learned to write was thought to be roughly offset by signers who could write little beyond their names.</p>\n<p>Critics have challenged the second half of this assumption. Since instruction in reading was cheaper and shorter than instruction in writing, and since many girls in particular were withdrawn from school before the writing stage, the population of readers who could not sign may have been very large. Evidence from Sweden, where the church examined households annually on their ability to read scripture, supports this suspicion: in parishes where fewer than one in five adults could sign, examiners recorded that a large majority read competently. If comparable conditions held elsewhere, signature counts understate reading ability, and they do so unevenly, obscuring the literacy of women and of the rural poor more than that of urban men.</p>\n<p>Defenders of the method reply that its value never lay in the absolute levels it reports. Whatever the gap between signing and reading, they argue, it was probably stable enough within a given region that changes in signature rates over time still track real changes in literacy. This defense is weaker than it appears, however, for the very factors that produced the gap, the cost and sequence of schooling, were themselves changing over the period in question.</p>","P4":"<p>Automatic enrollment in employer retirement plans is among the most frequently cited successes of behavioral economics. When employees must opt out of a plan rather than opt in, participation rises sharply, often from below half of eligible workers to above ninety percent, and the effect is largest among younger and lower-paid employees, the groups least likely to enroll on their own.</p>\n<p>Participation, however, is only a proxy for the outcome that policy makers care about, namely household wealth at retirement. Studies that follow automatically enrolled workers for a decade or more report considerably smaller effects on that outcome than the participation figures suggest. One reason is that default contribution rates are typically set low, and many employees who would otherwise have chosen a higher rate remain at the default. Another is that a substantial share of workers withdraw their balances when they change jobs. A third is that some employees offset their new contributions by taking on additional debt, so that their net worth rises by less than their account balances.</p>\n<p>None of this shows that automatic enrollment is ineffective. It shows that a policy can succeed dramatically by the measure that is easiest to observe while achieving much less by the measure that matters, and that the size of the discrepancy depends on design choices, such as the default rate and the treatment of balances at job change, that the original experiments were not designed to evaluate.</p>","RCP1":"<p>Retailers have long regarded lenient return policies as a cost of doing business: every returned item must be inspected, repackaged, and often resold at a discount. For this reason, many managers assume that the surest way to protect profits is to tighten the terms of returns, for example by shortening the period within which a purchase may be sent back or by charging a restocking fee.</p>\n<p>A study of a large mail-order clothing retailer suggests that this assumption is mistaken, at least for some firms. The retailer extended its return period from 30 days to 90 days for a randomly selected group of customers. As expected, these customers returned more items than did customers under the old policy. However, they also placed larger and more frequent orders, and the profit from the additional purchases was more than twice the added cost of handling returns. Surveys indicated why: customers who knew they could return an item easily were more willing to order products they could not examine in advance, such as a garment in an unfamiliar size or style.</p>\n<p>The researchers caution that the result may not hold everywhere. A lenient policy is most valuable where buyers face real uncertainty about a product before purchase. Where goods are standardized, or where customers can inspect them in a store, a generous policy removes little uncertainty and may simply invite abuse, such as buying an item for a single occasion and then returning it.</p>","RCP2":"<p>Biologists have proposed several explanations for the black and white stripes of zebras. One long-standing hypothesis holds that stripes serve as camouflage, breaking up the animal's outline and so concealing it from predators. A second proposes that stripes cool the animal: black stripes absorb more heat than white ones, and the resulting temperature differences were thought to generate small air currents across the skin. A third holds that stripes deter biting flies, which transmit several diseases to horses and their relatives in Africa.</p>\n<p>Recent evidence favors the third hypothesis. A comparison across the ranges of zebras and related species found that the intensity of striping was closely associated with the regions and seasons in which biting flies are most active, but showed no consistent association with the presence of large predators or with maximum temperatures. In field trials, researcher
