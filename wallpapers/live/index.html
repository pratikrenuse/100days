<style>
:root{--paper:#F2EEE6}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:var(--paper);overflow:hidden}
body{display:flex;align-items:center;justify-content:center;cursor:none}
body.embed{cursor:default}
.stage{position:relative;width:min(100vw,calc(100vh * 3024 / 1964));aspect-ratio:3024/1964;transition:opacity .7s ease}
.stage.out{opacity:0}
.layer{position:absolute;inset:0}
.layer img{display:block;width:100%;height:100%}
.diagram{clip-path:inset(0 0 calc(100% - var(--split)) 0);
  -webkit-mask-image:linear-gradient(90deg,#000 40%,transparent 60%);mask-image:linear-gradient(90deg,#000 40%,transparent 60%);
  -webkit-mask-size:300% 100%;mask-size:300% 100%;-webkit-mask-position:100% 0;mask-position:100% 0}
.quote{clip-path:inset(var(--split) 0 0 0);opacity:0;transform:translateY(1.2%)}
.play .diagram{animation:draw 2.8s cubic-bezier(.45,.05,.3,1) forwards}
.play .quote{animation:rise 1.4s ease-out 2.1s forwards}
@keyframes draw{to{-webkit-mask-position:0 0;mask-position:0 0}}
@keyframes rise{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.play .diagram{animation-duration:.01s}.play .quote{animation-duration:.6s;animation-delay:0s}}
</style>

var q=new URLSearchParams(location.search);
var every=q.has('every')?parseFloat(q.get('every')):30;
if(q.get('embed')==='1')document.body.classList.add('embed');
var stage=document.getElementById('stage'),A=document.getElementById('a'),B=document.getElementById('b');
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){return null;}}
var bag=[];try{bag=JSON.parse(store('wp-bag')||'[]')||[];}catch(e){bag=[];}
function pick(){
  if(!bag.length){bag=LIST.map(function(_,i){return i;});for(var i=bag.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=bag[i];bag[i]=bag[j];bag[j]=t;}}
  var i=bag.pop();store('wp-bag',JSON.stringify(bag));return i;
}
var busy=false;
function show(i){
  if(busy)return;busy=true;
  var item=LIST[i],src='../'+item[0],img=new Image();
  img.onload=img.onerror=function(){
    stage.classList.add('out');
    setTimeout(function(){
      stage.classList.remove('play');
      stage.style.setProperty('--split',(item[1]*100).toFixed(1)+'%');
      A.src=src;B.src=src;
      void stage.offsetWidth;
      stage.classList.remove('out');stage.classList.add('play');
      busy=false;
      try{gtag('event','live_wallpaper_shown',{wallpaper:item[0]});}catch(e){}
    },stage.classList.contains('out')&&!A.src?0:700);
  };
  img.src=src;
}
function next(){show(pick());}
var n=parseInt(q.get('n'),10);
if(n>=1&&n<=LIST.length){show(n-1);}else{next();}
// new wallpaper after the Mac wakes (timer gap) or the page becomes visible again
var last=Date.now(),shownAt=Date.now();
setInterval(function(){
  var now=Date.now();
  if(now-last>60000){next();shownAt=now;}
  else if(every>0&&now-shownAt>every*60000){next();shownAt=now;}
  last=now;
},5000);
document.addEventListener('visibilitychange',function(){if(!document.hidden&&Date.now()-shownAt>60000){next();shownAt=Date.now();}});
window.addEventListener('message',function(e){if(e.data==='next'){next();shownAt=Date.now();}});
